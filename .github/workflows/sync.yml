# Reprend automatiquement les évolutions du site de Benjamin (github.com/Bensarfat/hebreu)
# dans le site de Maayane : toutes les heures, et à la demande (onglet Actions > « Synchroniser » > Run workflow).
# Seules les fonctions et le design sont repris ; les contenus des élèves restent ceux de Maayane.
#
# Sécurité : la construction (qui lit le site de Benjamin) tourne SANS droit d'écriture ;
# seule l'étape « Publier » peut écrire, et elle ne fait que déposer les fichiers produits (index.html, assets/).
name: Synchroniser avec le site de Benjamin

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.fetch.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Récupérer le site de Benjamin
        id: fetch
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Bensarfat/hebreu/main/index.html" -o /tmp/benjamin.html
          test -s /tmp/benjamin.html
          if cmp -s /tmp/benjamin.html source/src/original.html; then
            echo "Aucun changement sur le site de Benjamin."
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            cp /tmp/benjamin.html source/src/original.html
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruire le site de Maayane
        if: steps.fetch.outputs.changed == '1'
        working-directory: source
        run: |
          node src/build_templates.js
          node build.js

      - name: Transmettre le résultat
        if: steps.fetch.outputs.changed == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: |
            index.html
            version.json
            assets/
            source/src/original.html
          retention-days: 3

  publish:
    needs: build
    if: needs.build.outputs.changed == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: /tmp/site

      - name: Publier
        run: |
          cp /tmp/site/index.html index.html
          cp /tmp/site/version.json version.json
          rm -rf assets && cp -r /tmp/site/assets assets
          cp /tmp/site/source/src/original.html source/src/original.html
          git config user.name "Benjamin Sarfati"
          git config user.email "contact@docteursarfati.com"
          git add -A index.html version.json assets source/src/original.html
          git diff --cached --quiet && exit 0
          git commit -m "Synchronisation automatique avec le site de Benjamin"
          git push
