d('cours-views').scrollIntoView({ behavior: 'smooth', block: 'start' });\n  });\n\n  var viewsBar = document.getElementById('cours-views');\n  if (viewsBar) {\n    viewsBar.addEventListener('click', function (e) {\n      var b = e.target.closest('.view-btn');\n      if (!b || b.dataset.view === view) return;\n      view = b.dataset.view;\n      viewsBar.querySelectorAll('.view-btn').forEach(function (x) {\n        x.classList.toggle('on', x === b);\n      });\n      render();\n    });\n  }\n\n  window.renderCours = render;\n\n  search.addEventListener('input', render);\n  document.getElementById('cours-open').addEventListener('click', function () {\n    list.querySelectorAll('details').forEach(function (d) { d.open = true; });\n  });\n  document.getElementById('cours-close').addEventListener('click', function () {\n    list.querySelectorAll('details').forEach(function (d) { d.open = false; });\n  });\n  render();\n})();\n\n\n/* ============================================\n   FLASHCARDS — revision par section du lexique\n   Compteur separe : storage.flash, jamais melange\n   avec storage.wordStats (quiz a choix multiples).\n   ============================================ */\n(function () {\n  var ov = document.getElementById('flash-ov');\n  if (!ov) return;\n  var body = document.getElementById('flash-body');\n  var titleEl = document.getElementById('flash-title');\n  var progEl = document.getElementById('flash-progress');\n  var barEl = document.getElementById('flash-bar-i');\n  var dirsEl = document.getElementById('flash-dirs');\n\n  if (!storage.flash || typeof storage.flash !== 'object') storage.flash = {};\n  var dir = storage.preferences.flashDir || 'fr';\n\n  var title = '', deck = [], pos = 0, flipped = false, sess = null, again = [], soft = [];\n\n  function esc(s) {\n    return String(s).replace(/[&\u003c>\"]/g, function (c) {\n      return { '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;' }[c];\n    });\n  }\n  function shuffle(a) {\n    a = a.slice();\n    for (var i = a.length - 1; i > 0; i--) {\n      var j = Math.floor(Math.random() * (i + 1));\n      var t = a[i]; a[i] = a[j]; a[j] = t;\n    }\n    return a;\n  }\n  /* verdict : 'known' (A), 'again' (P, a revoir), 'soft' (O, rate mais non essentiel) */\n  function record(e, verdict) {\n    var __hpWas = window.HPG ? HPG.before(e) : false;\n    var store, k;\n    if (e && e.conj) {\n      if (!storage.conj || typeof storage.conj !== 'object') storage.conj = {};\n      store = storage.conj; k = e.inf;\n    } else {\n      store = storage.flash; k = e[0] + '|' + e[1];\n    }\n    var s = store[k];\n    if (!s) { s = store[k] = { seen: 0, known: 0, again: 0, soft: 0 }; }\n    if (typeof s.soft !== 'number') s.soft = 0;\n    s.seen++;\n    if (verdict === 'known') s.known++;\n    else if (verdict === 'soft') s.soft++;\n    else s.again++;\n    if (window.HPG) HPG.onFlash(e, verdict, __hpWas);\n    saveData();\n  }\n\n  /* face avant : 'fr' (par defaut), 'he', ou tirage par carte en mode 'mix' */\n  function faceOf(i) {\n    if (dir === 'mix') return (deck[i].__f || 'fr');\n    return dir;\n  }\n  function prepare(rows) {\n    deck = shuffle(rows).map(function (e) {\n      var c;\n      if (e && e.conj) { c = {}; for (var p in e) c[p] = e[p]; }\n      else c = e.slice();\n      c.__f = Math.random() \u003c 0.5 ? 'fr' : 'he';\n      return c;\n    });\n    pos = 0; flipped = false; again = []; soft = [];\n    sess = { known: 0, again: 0, soft: 0, total: deck.length };\n  }\n\n  function conjHtml(e, face, showBack) {\n    var ask = face === 'fr'\n      ? 'Pr&eacute;sent, pass&eacute; et futur en h&eacute;breu&nbsp;?'\n      : 'Pass&eacute; et futur&nbsp;?';\n    var front = face === 'fr'\n      ? '\u003cdiv class=\"flash-face-fr\">' + esc(e.pronFr) + ' &mdash; ' + esc(e.fr) + '\u003c/div>'\n      : '\u003cdiv class=\"conj-line\">\u003cspan class=\"conj-form\">' + esc(e.pron + ' ' + e.pres) + '\u003c/span>\u003c/div>';\n    var line = function (lbl, form) {\n      return '\u003cdiv class=\"conj-line\">\u003cspan class=\"conj-tense\">' + lbl +\n             '\u003c/span>\u003cspan class=\"conj-form\">' + esc(e.pron + ' ' + form) + '\u003c/span>\u003c/div>';\n    };\n    var back = (face === 'fr' ? line('pr&eacute;sent', e.pres) : '') +\n               line('pass&eacute;', e.past) + line('futur', e.fut) +\n               '\u003cdiv class=\"conj-inf\">\u003cspan class=\"he\">' + esc(e.inf) + '\u003c/span>\u003cspan>' + esc(e.fr) + '\u003c/span>\u003c/div>';\n    return '\u003cdiv class=\"flash-card' + (showBack ? '' : ' solo') + '\" id=\"flash-card\">' + front +\n      (showBack ? '\u003cdiv class=\"flash-sep\">\u003c/div>' + back : '\u003cdiv class=\"conj-ask\">' + ask + '\u003c/div>') +\n      '\u003c/div>' +\n      (showBack\n        ? '\u003cdiv class=\"flash-acts\">' +\n            '\u003cbutton class=\"btn primary\" data-ans=\"known\">Je savais \u003cspan class=\"flash-key\">A\u003c/span>\u003c/button>' +\n            '\u003cbutton class=\"btn\" data-ans=\"soft\">Non essentiel \u003cspan class=\"flash-key\">O\u003c/span>\u003c/button>' +\n            '\u003cbutton class=\"btn\" data-ans=\"again\">&Agrave; revoir \u003cspan class=\"flash-key\">P\u003c/span>\u003c/button>' +\n          '\u003c/div>'\n        : '\u003cdiv class=\"flash-acts\">\u003cbutton class=\"btn primary\" data-flip=\"1\">Retourner\u003c/button>\u003c/div>');\n  }\n\n  function cardHtml(e, face, showBack) {\n    if (e && e.conj) return conjHtml(e, face, showBack);\n    var he = esc(e[2] || e[0]);\n    var pr = (typeof VERB_PRESENT !== 'undefined') && (VERB_PRESENT[e[2]] || VERB_PRESENT[e[0]]);\n    var heBlock = '\u003cdiv class=\"flash-face-he\">' + he +\n      (pr && showBack ? '\u003cdiv class=\"flash-pres\">אֲנִי ' + esc(pr) + '\u003c/div>' : '') + '\u003c/div>';\n    var frBlock = '\u003cdiv class=\"flash-face-fr\">' + esc(e[1]) + '\u003c/div>';\n    var front = face === 'fr' ? frBlock : heBlock;\n    var back = face === 'fr' ? heBlock : frBlo ist.toggle('on', x === d);\n      });\n      draw();\n    }\n  });\n\n  document.addEventListener('keydown', function (e) {\n    if (!ov.classList.contains('on')) return;\n    if (e.key === 'Escape') { e.preventDefault(); return close(); }\n    if (pos >= deck.length) return;\n    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipped = !flipped; return draw(); }\n    if (!flipped) return;\n    if (e.ctrlKey || e.metaKey || e.altKey) return;\n    var k = (e.key || '').toLowerCase();\n    if (k === 'a' || e.key === 'ArrowLeft') { e.preventDefault(); return answer('known'); }\n    if (k === 'p' || e.key === 'ArrowRight') { e.preventDefault(); return answer('again'); }\n    if (k === 'o' || e.key === 'ArrowDown') { e.preventDefault(); return answer('soft'); }\n  });\n\n  /* etat initial du selecteur de sens */\n  dirsEl.querySelectorAll('.flash-dir').forEach(function (x) {\n    x.classList.toggle('on', x.dataset.dir === dir);\n  });\n\n  /* --- stats flashcards (onglet Mes stats) --- */\n  window.refreshFlashStats = function () {\n    var seen = 0, known = 0, ag = 0, so = 0, worst = [], softs = [];\n    for (var k in storage.flash) {\n      var s = storage.flash[k];\n      if (typeof s.soft !== 'number') s.soft = 0;\n      seen += s.seen; known += s.known; ag += s.again; so += s.soft;\n      if (s.again > 0) worst.push({ k: k, s: s });\n      else if (s.soft > 0) softs.push({ k: k, s: s });\n    }\n    var set = function (id, v) {\n      var el = document.getElementById(id);\n      if (el) el.textContent = v;\n    };\n    set('fs-seen', seen); set('fs-known', known); set('fs-again', ag); set('fs-soft', so);\n    set('fs-rate', seen ? Math.round(100 * known / seen) + '%' : '—');\n    var ul = document.getElementById('flash-list');\n    var intro = document.getElementById('flash-intro');\n    var bt = document.getElementById('flash-toggle');\n    var br = document.getElementById('flash-redo');\n    if (!ul) return;\n    worst.sort(function (a, b) { return n  var fr_ = document.getElementById('flash-redo');\n  if (fr_) fr_.addEventListener('click', function () {\n    window.openFlashKeys(flashWorstKeys, 'Cartes à revoir');\n  });\n  window.refreshFlashStats();\n\n  window.refreshConjStats = function () {\n    if (!storage.conj || typeof storage.conj !== 'object') storage.conj = {};\n    var seen = 0, known = 0, ag = 0, so = 0, worst = [];\n    for (var k in storage.conj) {\n      var s = storage.conj[k];\n      seen += s.seen; known += s.known; ag += s.again; so += (s.soft || 0);\n      if (s.again > 0) worst.push({ k: k, s: s });\n    }\n    var set = function (id, v) { var el = document.getElementById(id); if (el) el.textContent = v; };\n    set('cj-seen', seen); set('cj-known', known); set('cj-again', ag); set('cj-soft', so);\n    set('cj-rate', seen ? Math.round(100 * known / seen) + '%' : '—');\n    worst.sort(function (a, b) { return (b.s.again - b.s.known) - (a.s.again - a.s.known) || b.s.again - a.s.again; });\n    conjWorst = worst.map(function (w) { return w.k; });\n    var intro = document.getElementById('cj-intro');\n    var ul = document.getElementById('cj-list');\n    var redo = document.getElementById('cj-redo');\n    if (intro) intro.textContent = seen\n      ? (worst.length ? worst.length + ' verbe' + (worst.length > 1 ? 's' : '') + ' à revoir sur les ' +\n          Object.keys(storage.conj).length + ' déjà travaillés.'\n                      : 'Aucun verbe raté pour le moment.')\n      : 'Une carte donne un verbe au présent : à toi de dire le passé et le futur. 82 verbes du vocabulaire.';\n    if (redo) redo.style.display = worst.length ? 'inline-block' : 'none';\n    if (!ul) return;\n    ul.innerHTML = worst.slice(0, 15).map(function (w) {\n      var v = null;\n      for (var n = 0; n \u003c CONJ.length; n++) if (CONJ[n].i === w.k) { v = CONJ[n]; break; }\n      return '\u003cli>\u003cspan class=\"word-he\">' + esc(w.k) + '\u003c/span>' +\n             '\u003cspan class=\"word-fr\">' + esc(v ? v.f : '') + '\u003c/span>' +\n             '\u003cspan class=\"word-stat\">' + w.s.again + ' ratée' + (w.s.again > 1 ? 's' : '') +\n             ' / ' + w.s.seen + '\u003c/span>\u003c/li>';\n    }).join('');\n    ul.style.display = worst.length ? 'block' : 'none';\n  };\n  var conjWorst = [];\n  window.refreshConjStats();\n\n  var cjS = document.getElementById('cj-start');\n  if (cjS) cjS.addEventListener('click', function () { window.openConj(); });\n  var cjR = document.getElementById('cj-redo');\n  if (cjR) cjR.addEventListener('click', function () {\n    var sel = CONJ.filter(function (v) { return conjWorst.indexOf(v.i) !== -1; });\n    window.openConj(sel, 'Verbes à revoir');\n  });\n\n  var rf = document.getElementById('reset-flash');\n  if (rf) rf.addEventListener('click', function () {\n    if (confirm('Effacer uniquement les statistiques de flashcards ? Les stats du quiz ne sont pas touchées.')) {\n      storage.flash = {};\n      saveData();\n      window.refreshFlashStats();\n    }\n  });\n})();\n\n\n/* ============================================\n   LONGUEUR DE SERIE / FIN DE SERIE / MOTS RATES\n   ============================================ */\n\n/* --- choix de la longueur --- */\ndocument.querySelectorAll('.len-btn').forEach(b => {\n  if (Number(b.dataset.len) === state.seriesLength) b.classList.add('active');\n  b.addEventListener('click', () => {\n    document.querySelectorAll('.len-btn').forEach(x => x.classList.remove('active'));\n    b.classList.add('active');\n    state.seriesLength = Number(b.dataset.len);\n    storage.preferences.seriesLength = state.seriesLength;\n    saveData();\n    updateStartBtn();\n  });\n});\n\n/* --- rendu d'une liste de mots rates --- */\nfunction renderMissedList(el, words, emptyMsg) {\n  if (!words.length) {\n    el.innerHTML = '\u003cli class=\"missed-empty\">' + emptyMsg + '\u003c/li>';\n    return;\n  }\n  el.innerHTML = words.map(w => {\n    const he = w.heVoc || w.he;\n    const extra = w.stat ? (w.stat.wrong + ' faux / ' + w.stat.seen + ' vus') : '';\n    return '\u003cli>\u003cspan class=\"word-he\" dir=\"rtl\">' + he + '\u003c/span>' +\n           '\u003cspan class=\"word-fr\">' + w.fr + '\u003c/span>' +\n           '\u003cspan class=\"word-stat\">' + extra + '\u003c/span>\u003c/li>';\n  }).join('');\n}\n\n/* --- tous les mots rates, tous themes confondus --- */\nfunction allMissedWords() {\n  const out = [];\n  for (const theme in VOCAB) {\n    VOCAB[theme].forEach(entry => {\n      const he = entry[0], fr = entry[1], heVoc = entry[2] || null;\n      const stat = storage.wordStats[he + '|' + fr];\n      if (isMissed(stat) && !isExcludedKey(he + '|' + fr)) out.push({ he, fr, heVoc, theme, stat });\n    });\n  }\n  out.sort((a, b) => b.stat.wrong - a.stat.wrong);\n  return out;\n}\n\n/* --- ecran de fin de serie --- */\nfunction endSeries() {\n  document.getElementById('quiz-view').style.display = 'none';\n  document.getElementById('series-end').style.display = 'block';\n\n  const done = state.total;\n  document.getElementById('series-score').textContent = state.correct + ' / ' + done;\n\n  const pct = done ? Math.round(state.correct / done * 100) : 0;\n  let msg;\n  if (done === 0) msg = 'Aucune réponse enregistrée.';\n  else if (pct >= 90) msg = 'מְצוּיָּן ! Excellent — ' + pct + '% de réussite.';\n  else if (pct >= 70) msg = 'כָּל הַכָּבוֹד ! Très bien — ' + pct + '% de réussite.';\n  else if (pct >= 50) msg = 'Pas mal — ' + pct + '% de réussite. Continue.';\n  else msg = pct + '% de réussite. Ces mots méritent un second tour.';\n  document.getElementById('series-msg').textContent = msg;\n\n  const wrap = document.getElementById('series-missed-wrap');\n  const list = document.getElementById('series-missed-list');\n  const btnReview = document.getElementById('series-review');\n  const toggle = document.getElementById('series-missed-toggle');\n\n  if (state.missed.length) {\n    wrap.style.display = 'block';\n    btnReview.style.display = 'inline-block';\n    btnReview.textContent = 'Rejouer les ' + state.missed.length + ' ratés';\n    const withStats = state.missed.map(w =>\n      Object.assign({}, w, { stat: storage.wordStats[w.he + '|' + w.fr] }));\n    renderMissedList(list, withStats, '');\n    list.style.display = 'none';\n    toggle.textContent = 'Voir les ' + state.missed.length + ' mots ratés ▾';\n  } else {\n    wrap.style.display = 'none';\n    btnReview.style.display = 'none';\n  }\n  refreshGlobalStatsDisplay();\n}\n\ndocument.getElementById('series-missed-toggle').addEventListener('click', () => {\n  const list = document.getElementById('series-missed-list');\n  const open = list.style.display !== 'none';\n  list.style.display = open ? 'none' : 'block';\n  document.getElementById('series-missed-toggle').textContent =\n    (open ? 'Voir les ' : 'Masquer les ') + state.missed.length + ' mots ratés ' + (open ? '▾' : '▴');\n});\n\ndocument.getElementById('series-again').addEventListener('click', () => {\n  document.getElementById('start-btn').click();\n});\n\ndocument.getElementById('series-back').addEventListener('click', () => {\n  document.getElementById('series-end').style.display = 'none';\n  document.getElementById('setup-view').style.display = 'block';\n  updateStartBtn();\n});\n\n/* Rejouer uniquement les mots rates de la serie qui vient de finir */\ndocument.getElementById('series-review').addEventListener('click', () => {\n  const again = state.missed.slice();\n  state.correct = 0; state.wrong = 0; state.total = 0; state.questionNum = 0;\n  state.missed = [];\n  state.pool = again;\n  state.seriesTotal = again.length;\n  updateScore();\n  document.getElementById('series-end').style.display = 'none';\n  document.getElementById('setup-view').style.display = 'none';\n  document.getElementById('quiz-view').style.display = 'block';\n  nextQuestion();\n});\n\n/* --- carte \"Mes mots rates\" dans l'onglet Stats --- */\nfunction refreshMissedCard() {\n  const words = allMissedWords();\n  const intro = document.getElementById('missed-intro');\n  const btnT = document.getElementById('missed-toggle');\n  const btnQ = document.getElementById('missed-quiz');\n  const list = document.getElementById('missed-list');\n\n  if (!words.length) {\n    intro.textContent = \"Tu n'as encore raté aucun mot — lance un quiz !\";\n    btnT.style.display = 'none';\n    btnQ.style.display = 'none';\n    var bf0 = document.getElementById('missed-flash');\n    if (bf0) bf0.style.display = 'none';\n    list.style.display = 'none';\n    return;\n  }\n  intro.textContent = words.length + ' mot' + (words.length > 1 ? 's' : '') +\n    ' raté' + (words.length > 1 ? 's' : '') + ' au moins une fois, toutes catégories confondues.';\n  btnT.style.display = 'inline-block';\n  var bf1 = document.getElementById('missed-flash');\n  if (bf1) bf1.style.display = 'inline-block';\n  btnQ.style.display = 'inline-block';\n  btnQ.textContent = 'Quiz sur ces ' + words.length + ' mots';\n  if (list.style.display !== 'none') renderMissedList(list, words, '');\n}\n\ndocument.getElementById('missed-toggle').addEventListener('click', () => {\n  const list = document.getElementById('missed-list');\n  const btn = document.getElementById('missed-toggle');\n  if (list.style.display === 'none') {\n    renderMissedList(list, allMissedWords(), '');\n    list.style.display = 'block';\n    btn.textContent = 'Masquer la liste';\n  } else {\n    list.style.display = 'none';\n    btn.textContent = 'Voir la liste';\n  }\n});\n\n/* Quiz portant uniquement sur les mots rates, tous themes confondus */\nconst missedFlashBtn = document.getElementById('missed-flash');\nif (missedFlashBtn) missedFlashBtn.addEventListener('click', () => {\n  const keys = allMissedWords().map(w => w.he + '|' + w.fr);\n  if (typeof window.openFlashKeys === 'function') window.openFlashKeys(keys, 'Mots ratés au quiz');\n});\n\ndocument.getElementById('missed-quiz').addEventListener('click', () => {\n  const words = allMissedWords();\n  if (!words.length) return;\n  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));\n  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));\n  document.querySelector('.tab[data-tab=\"quiz\"]').classList.add('active');\n  document.getElementById('panel-quiz').classList.add('active');\n\n  state.correct = 0; state.wrong = 0; state.total = 0; state.questionNum = 0;\n  state.missed = [];\n  const n = state.seriesLength === 0 ? words.length : Math.min(state.seriesLength, words.length);\n  state.pool = words.sort(() => Math.random() - 0.5).slice(0, n);\n  state.seriesTotal = state.pool.length;\n  updateScore();\n  document.getElementById('series-end').style.display = 'none';\n  document.getElementById('setup-view').style.display = 'none';\n  document.getElementById('quiz-view').style.display = 'block';\n  nextQuestion();\n});\n\nrefreshMissedCard();\n\n\n/* ============================================\n   MOTS MIS DE COTE\n   ============================================ */\n\n/* La croix retire le mot des series a venir et des listes de rates,\n   puis enchaine sur la question suivante. Les statistiques sont\n   conservees : le mot peut etre remis en jeu depuis l'onglet Stats. */\ndocument.getElementById('exclude-btn').addEventListener('click', e => {\n  e.stopPropagation();\n  if (!state.current) return;\n  const k = wordKey(state.current);\n  excludeWord(state.current);\n  state.missed = state.missed.filter(w => wordKey(w) !== k);\n  state.pool = state.pool.filter(w => wordKey(w) !== k);\n  updateScore();\n  refreshExcludedCard();\n  nextQuestion();\n});\n\nfunction allExcludedWords() {\n  const out = [];\n  for (const theme in VOCAB) {\n    VOCAB[theme].forEach(entry => {\n      const he = entry[0], fr = entry[1], heVoc = entry[2] || null;\n      if (isExcludedKey(he + '|' + fr)) out.push({ he, fr, heVoc, theme });\n    });\n  }\n  return out;\n}\n\nfunction renderExcludedList() {\n  const el = document.getElementById('excluded-list');\n  const words = allExcludedWords();\n  el.innerHTML = words.map(w =>\n    '\u003cli>\u003cspan class=\"word-he\" dir=\"rtl\">' + (w.heVoc || w.he) + '\u003c/span>' +\n    '\u003cspan class=\"word-fr\">' + w.fr + '\u003c/span>' +\n    '\u003cbutton class=\"restore-btn\" data-key=\"' + w.he + '|' + w.fr + '\">Remettre\u003c/button>\u003c/li>'\n  ).join('');\n  el.querySelectorAll('.restore-btn').forEach(btn => {\n    btn.addEventListener('click', () => {\n      unexcludeWord(btn.dataset.key);\n      renderExcludedList();\n      refreshExcludedCard();\n      refreshGlobalStatsDisplay();\n      updateStartBtn();\n    });\n  });\n}\n\nfunction refreshExcludedCard() {\n  const n = storage.excluded.length;\n  const card = document.getElementById('excluded-card');\n  if (!n) { card.style.display = 'none'; return; }\n  card.style.display = 'block';\n  document.getElementById('excluded-intro').textContent =\n    n + ' mot' + (n > 1 ? 's' : '') + ' mis de côté : ' +\n    (n > 1 ? 'ils n\\'apparaîtront plus' : 'il n\\'apparaîtra plus') +\n    ' dans les quiz ni dans la liste des ratés.';\n  if (document.getElementById('excluded-list').style.display !== 'none') renderExcludedList();\n}\n\ndocument.getElementById('excluded-toggle').addEventListener('click', () => {\n  const list = document.getElementById('excluded-list');\n  const btn = document.getElementById('excluded-toggle');\n  if (list.style.display === 'none') {\n    renderExcludedList();\n    list.style.display = 'block';\n    btn.textContent = 'Masquer la liste';\n  } else {\n    list.style.display = 'none';\n    btn.textContent = 'Voir la liste';\n  }\n});\n\nrefreshExcludedCard();\n\n\n/* ============================================\n   COURS PASSE / FUTUR — script d'origine.\n   Enferme dans une IIFE : il declarait QA, QB, QC, strip, render,\n   grade... en global, or le site a deja un render et un strip.\n   Les selecteurs .tabs et details sont limites au panneau, sinon ils\n   captaient la barre d'onglets du site et les sections du lexique.\n   ============================================ */\n(function () {\n\n/* ---------------- onglets ---------------- */\ndocument.querySelectorAll('#panel-tenses .tabs').forEach(function(group){\n  group.addEventListener('click', function(e){\n    var b = e.target.closest('button'); if(!b) return;\n    group.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });\n    b.classList.add('on');\n    var id = b.dataset.t;\n    var pane = document.getElementById(id);\n    var parent = pane.parentNode;\n    parent.querySelectorAll(':scope > .tabpane').forEach(function(p){ p.classList.remove('on'); });\n    pane.classList.add('on');\n  });\n});\n\n/* tout déplier à l'impression */\nwindow.addEventListener('beforeprint', function(){\n  document.querySelectorAll('#panel-tenses details').forEach(function(d){ d.open = true; });\n});\n\n})();\n\n\u003c/script>\n\u003cscript>\n/* =====================================================================\n   HP — noyau de progression partagé (espace élève, back-office, site perso)\n   XP, niveaux, séries de jours, badges, résumé pour la prof, graphiques.\n   Aucune dépendance. Les couleurs viennent des jetons de la charte.\n   ===================================================================== */\nvar HP = (function () {\n  'use strict';\n\n  /* ---------- barème XP ---------- */\n  var XP = {\n    quizOk: 10, quizKo: 3,\n    flashKnown: 8, flashAgain: 3, flashSoft: 2,\n    conjKnown: 12, conjAgain: 4, conjSoft: 2,\n    mastered: 15,      // chaque nouveau mot maîtrisé\n    goal: 25,          // objectif du jour atteint\n    combo: 20          // toutes les 10 bonnes réponses d'affilée\n  };\n\n  /* ---------- niveaux : une lettre de l'alphabet par niveau ---------- */\n  var LETTERS = 'אבגדהוזחטיכלמנסעפצקרשת';\n  var TIERS = [\n    { from: 1,  fr: 'Débutant',    he: 'מַתְחִיל' },\n    { from: 4,  fr: 'Apprenti',    he: 'תַּלְמִיד' },\n    { from: 7,  fr: 'Explorateur', he: 'חוֹקֵר' },\n    { from: 10, fr: 'Confirmé',    he: 'מְנֻסֶּה' },\n    { from: 13, fr: 'Avancé',      he: 'מִתְקַדֵּם' },\n    { from: 16, fr: 'Expert',      he: 'מֻמְחֶה' },\n    { from: 19, fr: 'Maître',      he: 'רַב' },\n    { from: 22, fr: 'Sage',        he: 'חָכָם' }\n  ];\n  function stepFor(level) { return 150 + 100 * (level - 1); }\n  function levelInfo(xp) {\n    xp = Math.max(0, xp || 0);\n    var level = 1, floor = 0;\n    while (xp >= floor + stepFor(level)) { floor += stepFor(level); level++; }\n    var step = stepFor(level), tier = TIERS[0];\n    TIERS.forEach(function (t) { if (level >= t.from) tier = t; });\n    return {\n      level: level,\n      letter: LETTERS.charAt(Math.min(level, LETTERS.length) - 1),\n      title: tier.fr, titleHe: tier.he,\n      into: xp - floor, step: step, toNext: floor + step - xp,\n      pct: Math.round(100 * (xp - floor) / step)\n    };\n  }\n\n  /* ---------- dates ---------- */\n  function pad(n) { return (n \u003c 10 ? '0' : '') + n; }\n  function dayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }\n  function parseDay(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }\n  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }\n  function shortDate(d) { return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); }\n\n  function emptyDay() {\n    return { xp: 0, qOk: 0, qKo: 0, fK: 0, fA: 0, fS: 0, cK: 0, cA: 0, cS: 0, goal: 0 };\n  }\n  function dayGood(d) { return (d.qOk || 0) + (d.fK || 0) + (d.cK || 0); }\n  function dayBad(d) { return (d.qKo || 0) + (d.fA || 0) + (d.fS || 0) + (d.cA || 0) + (d.cS || 0); }\n  function dayActive(d) { return d && dayGood(d) + dayBad(d) > 0; }\n\n  function streaks(days) {\n    var today = new Date(), cur = 0, best = 0, run = 0;\n    var d = new Date(today);\n    if (!dayActive(days[dayKey(d)])) d = addDays(d, -1);   // aujourd'hui pas encore joué : la série tient\n    while (dayActive(days[dayKey(d)])) { cur++; d = addDays(d, -1); }\n    var keys = Object.keys(days).filter(function (k) { return dayActive(days[k]); }).sort();\n    var prev = null;\n    keys.forEach(function (k) {\n      var dt = parseDay(k);\n      run = (prev && Math.round((dt - prev) / 864e5) === 1) ? run + 1 : 1;\n      if (run > best) best = run;\n      prev = dt;\n    });\n    return { cur: cur, best: Math.max(best, cur) };\n  }\n\n  /* ---------- maîtrise (quiz OU flashcards) ---------- */\n  function quizMastered(s) {\n    if (!s) return false;\n    if (s.correct >= 3 && s.wrong === 0) return true;\n    return s.seen >= 4 && s.correct / s.seen >= 0.8;\n  }\n  function flashMastered(s) {\n    if (!s) return false;\n    if (s.known >= 2 && !s.again && !s.soft) return true;\n    return s.seen >= 4 && s.known / s.seen >= 0.8;\n  }\n  function wordMastered(storage, k) {\n    return quizMastered(storage.wordStats && storage.wordStats[k]) ||\n           flashMastered(storage.flash && storage.flash[k]);\n  }\n\n  function totalsFrom(storage, VOCAB) {\n    var t = { qOk: 0, qKo: 0, fK: 0, fA: 0, fS: 0, cK: 0, cA: 0, cS: 0, mastered: 0 };\n    var k, s;\n    for (k in (storage.wordStats || {})) { s = storage.wordStats[k]; t.qOk += s.correct || 0; t.qKo += s.wrong || 0; }\n    for (k in (storage.flash || {})) { s = storage.flash[k]; t.fK += s.known || 0; t.fA += s.again || 0; t.fS += s.soft || 0; }\n    for (k in (storage.conj || {})) { s = storage.conj[k]; t.cK += s.known || 0; t.cA += s.again || 0; t.cS += s.soft || 0; }\n    var seen = {};\n    Object.keys(VOCAB || {}).forEach(function (th) {\n      VOCAB[th].forEach(function (e) {\n        var key = e[0] + '|' + e[1];\n        if (seen[key]) return; seen[key] = 1;\n        if (wordMastered(storage, key)) t.mastered++;\n      });\n    });\n    return t;\n  }\n\n  function themeMastery(storage, VOCAB) {\n    return Object.keys(VOCAB || {}).map(function (th) {\n      var n = 0, m = 0, seen = 0, vu = {};\n      VOCAB[th].forEach(function (e) {\n        var key = e[0] + '|' + e[1];\n        if (vu[key]) return; vu[key] = 1; n++;\n        var q = storage.wordStats && storage.wordStats[key], f = storage.flash && storage.flash[key];\n        if ((q && q.seen) || (f && f.seen)) seen++;\n        if (wordMastered(storage, key)) m++;\n      });\n      return { theme: th, n: n, m: m, seen: seen, pct: n ? Math.round(100 * m / n) : 0 };\n    });\n  }\n\n  function weakWords(storage, max) {\n    var map = {};\n    function add(k, bad, seen) {\n      var p = k.split('|');\n      var o = map[k] || (map[k] = { he: p[0], fr: p[1] || '', bad: 0, seen: 0 });\n      o.bad += bad; o.seen += seen;\n    }\n    var k, s;\n    for (k in (storage.wordStats || {})) { s = storage.wordStats[k]; if (s.wrong) add(k, s.wrong, s.seen || 0); }\n    for (k in (storage.flash || {})) { s = storage.flash[k]; if (s.again) add(k, s.again, s.seen || 0); }\n    return Object.keys(map).map(function (x) { return map[x]; })\n      .sort(function (a, b) { return b.bad - a.bad || (b.bad / (b.seen || 1)) - (a.bad / (a.seen || 1)); })\n      .slice(0, max || 15);\n  }\n\n  /* ---------- badges ---------- */\n  var BADGES = [\n    { id: 'first',   icon: '🌱', name: 'Premier pas',         desc: 'Répondre à sa première carte',             test: function (c) { return c.answers >= 1; } },\n    { id: 'streak3', icon: '🔥', name: 'Ça chauffe',          desc: '3 jours de révision d\\'affilée',            test: function (c) { return c.best >= 3; } },\n    { id: 'streak7', icon: '🔥', name: 'Une semaine pile',    desc: '7 jours d\\'affilée',                        test: function (c) { return c.best >= 7; } },\n    { id: 'streak30',icon: '🌋', name: 'Inarrêtable',         desc: '30 jours d\\'affilée',                       test: function (c) { return c.best >= 30; } },\n    { id: 'goal7',   icon: '🎯', name: 'Régulier',            desc: 'Objectif du jour atteint 7 fois',           test: function (c) { return c.goalDays >= 7; } },\n    { id: 'day200',  icon: '💪', name: 'Grosse journée',      desc: '200 XP en une journée',                     test: function (c) { return c.maxDay >= 200; } },\n    { id: 'xp1000',  icon: '⭐', name: '1 000 XP',            desc: 'Cumuler 1 000 XP',                          test: function (c) { return c.xp >= 1000; } },\n    { id: 'xp5000',  icon: '🌟', name: '5 000 XP',            desc: 'Cumuler 5 000 XP',                          test: function (c) { return c.xp >= 5000; } },\n    { id: 'cards100',icon: '🃏', name: 'Cent cartes',         desc: '100 flashcards retournées',                 test: function (c) { return c.cards >= 100; } },\n    { id: 'cards1k', icon: '🗂️', name: 'Mille cartes',        desc: '1 000 flashcards retournées',               test: function (c) { return c.cards >= 1000; } },\n    { id: 'mast50',  icon: '📗', name: '50 mots acquis',      desc: '50 mots maîtrisés',                         test: function (c) { return c.mastered >= 50; } },\n    { id: 'mast200', icon: '📚', name: '200 mots acquis',     desc: '200 mots maîtrisés',                        test: function (c) { return c.mastered >= 200; } },\n    { id: 'theme',   icon: '🏆', name: 'Thème bouclé',        desc: 'Maîtriser tous les mots d\\'un thème',      test: function (c) { return c.themesDone >= 1; } },\n    { id: 'conj50',  icon: '🧩', name: 'Conjugueur',          desc: '50 conjugaisons réussies',                  test: function (c) { return c.conj >= 50; } },\n    { id: 'combo20', icon: '⚡', name: 'Sans faute',          desc: '20 bonnes réponses d\\'affilée',             test: function (c) { return c.combo >= 20; } },\n    { id: 'early',   icon: '🌅', name: 'Lève-tôt',            desc: 'Réviser avant 8 h',                         test: function (c) { return c.early; } },\n    { id: 'night',   icon: '🌙', name: 'Oiseau de nuit',      desc: 'Réviser après 22 h',                        test: function (c) { return c.night; } }\n  ];\n\n  function badgeContext(P, totals, themes) {\n    var st = streaks(P.days || {}), goal own + t.cA * X.conjAgain + t.cS * X.conjSoft +\n              t.mastered * X.mastered;\n      P.backfilled = HP.dayKey();\n    }\n    return P;\n  }\n\n  function today() {\n    var k = HP.dayKey();\n    return P.days[k] || (P.days[k] = HP.emptyDay());\n  }\n\n  /* ---------- toasts & célébrations ---------- */\n  function toastBox() {\n    var b = document.getElementById('hp-toasts');\n    if (!b) { b = document.createElement('div'); b.id = 'hp-toasts'; document.body.appendChild(b); }\n    return b;\n  }\n  function toast(html, kind) {\n    var el = document.createElement('div');\n    el.className = 'hp-toast ' + (kind || '');\n    el.innerHTML = html;\n    toastBox().appendChild(el);\n    setTimeout(function () { el.classList.add('out'); }, kind === 'xp' ? 900 : 2600);\n    setTimeout(function () { el.remove(); }, kind === 'xp' ? 1300 : 3000);\n  }\n  function celebrate(title, sub, big) {\n    var ov = document.createElement('div');\n    ov.className = 'hp-cele';\n    ov.innerHTML = '\u003cdiv class=\"hp-cele-card\">\u003cdiv class=\"hp-cele-big\">' + big + '\u003c/div>\u003ch3>' + title + '\u003c/h3>\u003cp>' + sub +\n      '\u003c/p>\u003cbutton type=\"button\" class=\"btn primary\">Continuer\u003c/button>\u003c/div>';\n    ov.addEventListener('click', function (e) { if (e.target === ov || e.target.tagName === 'BUTTON') ov.remove(); });\n    document.body.appendChild(ov);\n    var conf = '';\n    for (var i = 0; i \u003c 28; i++) {\n      conf += '\u003ci style=\"left:' + (Math.random() * 100).toFixed(1) + '%;animation-delay:' + (Math.random() * .5).toFixed(2) +\n        's;background:var(' + ['--accent', '--accent-2', '--olive', '--gold', '--rose', '--sky'][i % 6] + ')\">\u003c/i>';\n    }\n    ov.insertAdjacentHTML('beforeend', '\u003cdiv class=\"hp-confetti\">' + conf + '\u003c/div>');\n  }\n\n  /* ---------- gain d'XP ---------- */\n  function gain(n, fields) {\n    prog();\n    var d = today(), before = d.xp >= P.goal;\n    for (var f in fields) d[f] = (d[f] || 0) + fields[f];\n    d.xp += n; P.xp += n;\n    var h = new Date().getHours();\n    if (h \u003c 8) P.early = true;\n    if (h >= 22) P.night = true;\n    if (!before && d.xp >= P.goal) {\n      d.goal = 1; d.xp += HP.XP.goal; P.xp += HP.XP.goal;\n      toast('🎯 \u003cb>Objectif du jour atteint\u003c/b> · +' + HP.XP.goal + ' XP bonus', 'goal');\n    }\n    toast('+' + n + ' XP', 'xp');\n    var L = HP.levelInfo(P.xp);\n    if (L.level > lastLevel) {\n      celebrate('Niveau ' + L.level + ' !', L.title + ' · \u003cspan class=\"hp-he\">' + L.titleHe + '\u003c/span> — continue comme ça.',\n        '\u003cspan class=\"hp-he\">' + L.letter + '\u003c/span>');\n    }\n    lastLevel = L.level;\n    checkBadges();\n    hud();\n  }\n\n  function onAnswer(ok) {\n    if (ok) {\n      combo++;\n      if (combo > P.bestCombo) P.bestCombo = combo;\n      if (combo % 10 === 0) {\n        P.xp += HP.XP.combo; today().xp += HP.XP.combo;\n        toast('⚡ \u003cb>' + combo + ' bonnes réponses d\\'affilée\u003c/b> · +' + HP.XP.combo + ' XP', 'goal');\n      }\n    } else combo = 0;\n  }\n\n  function masteredNow(k) {\n    var q = storage.wordStats && storage.wordStats[k], f = storage.flash && storage.flash[k];\n    var qm = q && ((q.correct >= 3 && q.wrong === 0) || (q.seen >= 4 && q.correct / q.seen >= 0.8));\n    var fm = f && ((f.known >= 2 && !f.again && !f.soft) || (f.seen >= 4 && f.known / f.seen >= 0.8));\n    return !!(qm || fm);\n  }\n\n  function checkBadges() {\n    var totals = HP.totalsFrom(storage, VOCAB), themes = HP.themeMastery(storage, VOCAB);\n    var c = HP.badgeContext(P, totals, themes);\n    HP.BADGES.forEach(function (b) {\n      if (!P.badges[b.id] && b.test(c)) {\n        P.badges[b.id] = HP.dayKey();\n        toast('\u003cspan style=\"font-size:22px\">' + b.icon + '\u003c/span> \u003cspan>\u003cb>Badge débloqué\u003c/b>\u003cbr>' + HP.esc(b.name) + '\u003c/span>', 'badge');\n      }\n    });\n  }\n\n  /* ---------- crochets appelés par le site ---------- */\n  function before(e) {\n    if (!e || e.conj) return false;\n    return masteredNow(e[0] + '|' + e[1]);\n  }\n  function onFlash(e, verdict, wasMastered) {\n    prog();\n    var conj = e && e.conj, X = HP.XP, n, f = {};\n    if (conj) {\n      n = verdict === 'known' ? X.conjKnown : verdict === 'soft' ? X.conjSoft : X.conjAgain;\n      f[verdict === 'known' ? 'cK' : verdict === 'soft' ? 'cS' : 'cA'] = 1;\n    } else {\n      n = verdict === 'known' ? X.flashKnown : verdict === 'soft' ? X.flashSoft : X.flashAgain;\n      f[verdict === 'known' ? 'fK' : verdict === 'soft' ? 'fS' : 'fA'] = 1;\n      if (!wasMastered && masteredNow(e[0] + '|' + e[1])) { n += X.mastered; toast('📗 Mot maîtrisé : \u003cspan class=\"hp-he\">' + HP.esc(e[0]) + '\u003c/span>', 'goal'); }\n    }\n    onAnswer(verdict === 'known');\n    gain(n, f);\n  }\n  function onQuiz(item, result, wasMastered) {\n    prog();\n    var ok = result === 'correct', n = ok ? HP.XP.quizOk : HP.XP.quizKo;\n    if (ok && !wasMastered && masteredNow(item.he + '|' + item.fr)) { n += HP.XP.mastered; toast('📗 Mot maîtrisé : \u003cspan class=\"hp-he\">' + HP.esc(item.he) + '\u003c/span>', 'goal'); }\n    onAnswer(ok);\n    gain(n, ok ? { qOk: 1 } : { qKo: 1 });\n  }\n\n  /* ---------- synchronisation vers l'espace de la prof ---------- */\n  function sync() {\n    clearTimeout(syncTimer);\n    syncTimer = setTimeout(function () {\n      try {\n        if (window.parent && window.parent !== window && window.parent.HPB && window.__HP_STUDENT__) {\n          window.parent.HPB.pushProgress(window.__HP_STUDENT__, HP.summarize(storage, prog(), VOCAB), JSON.parse(JSON.stringify(storage)));\n        }\n      } catch (e) { /* hors espace élève */ }\n    }, 1200);\n  }\n\n  /* ---------- bandeau en-tête ---------- */\n  function hud() {\n    var el = document.getElementById('hp-hud');\n    if (!el) return;\n    var L = HP.levelInfo(P.xp), st = HP.streaks(P.days), d = P.days[HP.dayKey()] || HP.emptyDay();\n    el.innerHTML =\n      '\u003cbutton type=\"button\" class=\"hp-hud-lv\" data-go=\"stats\" title=\"Voir ma progression\">\u003cspan class=\"hp-he\">' + L.letter + '\u003c/span>Niv. ' + L.level +\n        '\u003ci>\u003cb style=\"width:' + L.pct + '%\">\u003c/b>\u003c/i>\u003c/button>' +\n      '\u003cspan class=\"hp-hud-pill\" title=\"XP total\">⭐ \u003cb>' + HP.fmt(P.xp) + '\u003c/b> XP\u003c/span>' +\n      '\u003cspan class=\"hp-hud-pill\" title=\"Jours de révision d\\'affilée\">' + (st.cur ? '🔥' : '·') + ' \u003cb>' + st.cur + '\u003c/b> j\u003c/span>' +\n      '\u003cspan class=\"hp-hud-pill' + (d.xp >= P.goal ? ' done' : '') + '\" title=\"Objectif du jour\">🎯 \u003cb>' + Math.min(d.xp, P.goal) + '\u003c/b>/' + P.goal + '\u003c/span>';\n  }\n\n  /* ---------- onglet Mes stats ---------- */\n  function kpi(cls, val, lbl) { return '\u003cdiv class=\"hp-kpi ' + cls + '\">\u003cb>' + val + '\u003c/b>\u003cspan>' + lbl + '\u003c/span>\u003c/div>'; }\n  function delta(a, b) {\n    if (a == null || b == null) return '';\n    var d = a - b; if (!d) return ' \u003csmall class=\"hp-delta\">=\u003c/small>';\n    return ' \u003csmall class=\"hp-delta ' + (d > 0 ? 'up' : 'down') + '\">' + (d > 0 ? '▲' : '▼') + Math.abs(d) + '\u003c/small>';\n  }\n  function renderStats() {\n    var root = document.getElementById('hp-progress');\n    if (!root) return;\n    prog();\n    var now = new Date(), totals = HP.totalsFrom(storage, VOCAB), themes = HP.themeMastery(storage, VOCAB);\n    var w0 = HP.rangeSum(P.days, HP.addDays(now, -6), 7), w1 = HP.rangeSum(P.days, HP.addDays(now, -13), 7);\n    var r0 = HP.rate(w0), r1 = HP.rate(w1), active30 = 0;\n    for (var i = 0; i \u003c 30; i++) if (HP.dayActive(P.days[HP.dayKey(HP.addDays(now, -i))])) active30++;\n    var nWords = themes.reduce(function (s, t) { return s + t.n; }, 0);\n    var answers = totals.qOk + totals.qKo + totals.fK + totals.fA + totals.fS + totals.cK + totals.cA + totals.cS;\n    var nb = Object.keys(P.badges).length;\n    root.innerHTML =\n      '\u003cdiv class=\"stats-card\">' + HP.levelCard(P, { goalPicker: true }) + '\u003c/div>' +\n      '\u003cdiv class=\"stats-card\">\u003ch3>Ces 7 derniers jours\u003c/h3>\u003cdiv class=\"hp-kpis\">' +\n        kpi('', HP.fmt(w0.xp) + delta(w0.xp, w1.xp), 'XP gagnés') +\n        kpi('sky', HP.fmt(HP.dayGood(w0) + HP.dayBad(w0)), 'réponses') +\n        kpi('green', (r0 == null ? '—' : r0 + '%') + delta(r0, r1), 'de réussite') +\n        kpi('gold', active30 + '/30', 'jours actifs (30 j)') +\n        kpi('green', HP.fmt(totals.mastered) + '\u003csmall class=\"hp-of\">/' + HP.fmt(nWords) + '\u003c/small>', 'mots maîtrisés') +\n        kpi('rose', HP.fmt(answers), 'réponses au total') +\n      '\u003c/div>\u003cp class=\"hp-note\">Flèches : comparaison avec les 7 jours précédents. Un mot compte comme maîtrisé s\\'il l\\'est au quiz \u003cem>ou\u003c/em> en flashcards.\u003c/p>\u003c/div>' +\n      '\u003cdiv class=\"stats-card\">\u003ch3>Régularité\u003c/h3>' + HP.heatmap(P.days, 17) + '\u003c/div>' +\n      '\u003cdiv class=\"stats-card\">\u003ch3>XP par jour — 30 derniers jours\u003c/h3>' + HP.xpBars(P.days, 30, P.goal) + '\u003c/div>' +\n      '\u003cdiv class=\"stats-card\">\u003ch3>Taux de réussite par semaine\u003c/h3>' + HP.rateLine(P.days, 8) +\n        '\u003cp class=\"hp-note\">Toutes réponses confondues : quiz, flashcards et conjugaison.\u003c/p>\u003c/div>' +\n      '\u003cdiv class=\"stats-card\">\u003ch3>Maîtrise par thème\u003c/h3>' + HP.themeBars(themes) + '\u003c/div>' +\n      '\u003cdiv class=\"stats-card\">\u003ch3>Badges \u003csmall class=\"hp-of\">' + nb + ' / ' + HP.BADGES.length + '\u003c/small>\u003c/h3>' + HP.badgesGrid(P.badges) + '\u003c/div>' +\n      '\u003cdiv class=\"stats-card hp-rules\">\u003ch3>Comment gagner des XP\u003c/h3>\u003cul>' +\n        '\u003cli>Quiz : \u003cb>+' + HP.XP.quizOk + '\u003c/b> bonne réponse, \u003cb>+' + HP.XP.quizKo + '\u003c/b> erreur (l\\'effort compte)\u003c/li>' +\n        '\u003cli>Flashcard : \u003cb>+' + HP.XP.flashKnown + '\u003c/b> « je sais », \u003cb>+' + HP.XP.flashAgain + '\u003c/b> « à revoir »\u003c/li>' +\n        '\u003cli>Conjugaison : \u003cb>+' + HP.XP.conjKnown + '\u003c/b> réussie, \u003cb>+' + HP.XP.conjAgain + '\u003c/b> à revoir\u003c/li>' +\n        '\u003cli>Nouveau mot maîtrisé : \u003cb>+' + HP.XP.mastered + '\u003c/b> · Objectif du jour : \u003cb>+' + HP.XP.goal + '\u003c/b> · 10 bonnes réponses d\\'affilée : \u003cb>+' + HP.XP.combo + '\u003c/b>\u003c/li>' +\n      '\u003c/ul>\u003c/div>';\n    root.querySelectorAll('[data-goal]').forEach(function (b) {\n      b.addEventListener('click', function () { P.goal = +b.dataset.goal; saveData(); renderStats(); hud(); });\n    });\n  }\n\n  var CSS = '' +\n    '#hp-hud{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:-6px auto 18px}' +\n    '.hp-hud-pill,.hp-hud-lv{display:inline-flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink-soft);backdrop-filter:blur(8px)}' +\n    '.hp-hud-pill b{color:var(--accent);font-weight:800}.hp-hud-pill.done{background:var(--mint);border-color:transparent}.hp-hud-pill.done b{color:var(--olive)}' +\n    '.hp-hud-lv{cursor:pointer;font:800 13px var(--font-ui);color:var(--ink)}.hp-hud-lv .hp-he{display:grid;place-items:center;width:22px;height:22px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);font-size:13px}' +\n    '.hp-hud-lv i{display:block;width:56px;height:6px;border-radius:9px;background:var(--accent-tint);overflow:hidden}.hp-hud-lv i b{display:block;height:100%;background:var(--accent);border-radius:9px}' +\n    '#hp-toasts{position:fixed;right:16px;bottom:16px;z-index:9999;display:grid;gap:8px;justify-items:end;pointer-events:none}' +\n    '.hp-toast{display:flex;gap:10px;align-items:center;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow-pop);font-size:13.5px;animation:hpIn .25s ease-out;transition:opacity .35s,transform .35s}' +\n    '.hp-toast.xp{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);font:900 15px var(--font-display);border:0;padding:7px 14px}' +\n    '.hp-toast.goal{background:var(--mint);border-color:transparent}.hp-toast.badge{background:var(--peach);border-color:transparent}' +\n    '.hp-toast.out{opacity:0;transform:translateY(8px)}@keyframes hpIn{from{opacity:0;transform:translateY(10px) scale(.96)}}' +\n    '.hp-cele{position:fixed;inset:0;z-index:10000;background:var(--overlay);display:grid;place-items:center;padding:16px;overflow:hidden}' +\n    '.hp-cele-card{position:relative;z-index:1;background:var(--paper);border-radius:28px;padding:30px 34px;text-align:center;max-width:360px;box-shadow:var(--shadow-pop);animation:hpPop .4s cubic-bezier(.2,1.4,.4,1)}' +\n    '.hp-cele-big{width:96px;height:96px;margin:0 auto 14px;border-radius:30px;display:grid;place-items:center;font:700 52px var(--font-he);color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent-2));transform:rotate(-6deg)}' +\n    '.hp-cele-card h3{font:900 28px var(--font-display);margin-bottom:6px}.hp-cele-card p{color:var(--ink-soft);margin-bottom:18px}' +\n    '@keyframes hpPop{from{transform:scale(.7);opacity:0}}' +\n    '.hp-confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:3px;animation:hpFall 1.8s ease-in forwards}' +\n    '@keyframes hpFall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}' +\n    '#hp-progress{display:grid;gap:18px;margin-bottom:18px}#hp-progress .stats-card{margin:0}' +\n    '.hp-note{font-size:12px;color:var(--muted);font-style:italic;margin-top:12px}.hp-of{font-size:.55em;color:var(--muted);font-weight:700}' +\n    '.hp-delta{font:800 11px var(--font-ui);vertical-align:middle}.hp-delta.up{color:var(--olive)}.hp-delta.down{color:var(--rose)}' +\n    '.hp-rules ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px;color:var(--ink-soft)}.hp-rules b{color:var(--accent)}' +\n    '.hp-sep{font:800 13px var(--font-ui);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center;margin:8px 0 14px}' +\n    '@media (prefers-reduced-motion:reduce){.hp-toast,.hp-cele-card,.hp-confetti i{animation:none}}';\n\n  function install() {\n    HP.injectCss();\n    var s = document.createElement('style'); s.textContent = CSS; document.head.appendChild(s);\n    prog();\n    lastLevel = HP.levelInfo(P.xp).level;\n    checkBadges();\n\n    /* bandeau sous les compteurs */\n    var gs = document.getElementById('global-stats');\n    if (gs) {\n      var h = document.createElement('div'); h.id = 'hp-hud';\n      gs.parentNode.insertBefore(h, gs.nextSibling);\n      h.addEventListener('click', function (e) {\n        if (e.target.closest('[data-go]')) { var t = document.querySelector('.tab[data-tab=\"stats\"]'); if (t) t.click(); }\n      });\n    }\n    /* onglet stats : la progression passe en tête */\n    var panel = document.getElementById('panel-stats');\n    if (panel) {\n      var root = document.createElement('div'); root.id = 'hp-progress';\n      panel.insertBefore(root, panel.firstChild);\n      var sep = document.createElement('div'); sep.className = 'hp-sep'; sep.textContent = 'Détail par activité';\n      panel.insertBefore(sep, root.nextSibling);\n    }\n    var t = document.querySelector('.tab[data-tab=\"stats\"]');\n    if (t) {\n      t.textContent = 'Ma progression';\n      t.addEventListener('click', renderStats);\n    }\n\n    /* crochet quiz : updateWordStat est une fonction globale, on l'enveloppe */\n    var orig = window.updateWordStat;\n    if (typeof orig === 'function') {\n      updateWordStat = function (item, result) {\n        var was = masteredNow(item.he + '|' + item.fr);\n        orig(item, result);\n        onQuiz(item, result, was);\n        saveData();\n      };\n    }\n    /* crochet sauvegarde : synchronise le résumé vers l'espace de la prof */\n    var origSave = window.saveData;\n    if (typeof origSave === 'function') {\n      saveData = function () { origSave(); sync(); };\n    }\n    saveData();\n    hud();\n    renderStats();\n  }\n\n  return { install: install, before: before, onFlash: onFlash, renderStats: renderStats, hud: hud };\n})();\n\ntry { HPG.install(); } catch (e) { console.error(\"HPG\", e); }\n\u003c/script>\n\u003c/body>\u003c/html>";
var TENSES = "\u003cheader class=\"top\">\n  \u003cdiv class=\"topinner\">\n    \u003cdiv class=\"brand\">עָבָר &amp; עָתִיד · \u003cspan>le verbe hébreu\u003c/span>\u003c/div>\n    \u003cnav>\n      \u003ca href=\"#intro\">Principes\u003c/a>\n      \u003ca href=\"#passe\">Passé\u003c/a>\n      \u003ca href=\"#futur\">Futur\u003c/a>\n      \u003ca href=\"#gzarot\">Verbes faibles\u003c/a>\n      \u003ca href=\"#irreg\">Irréguliers\u003c/a>\n      \u003ca href=\"#emplois\">Emplois\u003c/a>\n      \u003ca href=\"#pieges\">Pièges\u003c/a>\n      \u003ca href=\"#recap\">Antisèche\u003c/a>\n    \u003c/nav>\n  \u003c/div>\n\u003c/header>\n\n\u003cmain>\n\n\u003cdiv class=\"hero\">\n  \u003cdiv class=\"kicker\">Cours complet · niveau débutant → avancé\u003c/div>\n  \u003ch1>Construire le passé et le futur en hébreu\u003c/h1>\n  \u003cp>Les sept \u003cem>binyanim\u003c/em>, les verbes forts et toutes les \u003cem>gzarot\u003c/em> (verbes faibles), avec vocalisation, translittération et emplois syntaxiques.\u003c/p>\n  \u003cp style=\"font-size:.9rem\">Cliquez sur les onglets et les sections dépliables. La page s'imprime en entier (tout se déplie automatiquement à l'impression).\u003c/p>\n\u003c/div>\n\n\u003csection id=\"intro\">\n\u003ch2>\u003cspan class=\"num\">1.\u003c/span> Le principe général\u003c/h2>\n\n\u003cp>Le verbe hébreu ne se construit pas comme le verbe français. Il n'y a pas de « radical + terminaison » au sens latin&nbsp;: il y a une \u003cstrong>racine\u003c/strong> (שׁוֹרֶשׁ, généralement trois consonnes) coulée dans un \u003cstrong>moule\u003c/strong> (בִּנְיָן) fait de voyelles, de préfixes et de redoublements.\u003c/p>\n\n\u003cdiv class=\"formula\">\n\u003cspan class=\"he he-lg\">כ · ת · ב\u003c/span> &nbsp;+&nbsp; moule \u003cb>פָּעַל\u003c/b> &nbsp;→&nbsp; \u003cspan class=\"he\">כָּתַב\u003c/span> «&nbsp;il a écrit&nbsp;»\u003cbr>\n\u003cspan class=\"he he-lg\">כ · ת · ב\u003c/span> &nbsp;+&nbsp; moule \u003cb>הִפְעִיל\u003c/b> &nbsp;→&nbsp; \u003cspan class=\"he\">הִכְתִּיב\u003c/span> «&nbsp;il a dicté&nbsp;»\n\u003c/div>\n\n\u003ch3>Les deux mécanismes à retenir\u003c/h3>\n\u003cp>Toute la conjugaison hébraïque tient dans une opposition simple, et c'est la clé du cours&nbsp;:\u003c/p>\n\n\u003cdiv class=\"grid2\">\n  \u003cdiv class=\"card\" style=\"border-top:3px solid var(--past)\">\n    \u003cspan class=\"pill past\">עָבָר · passé\u003c/span>\n    \u003ch4 style=\"margin-top:10px\">Conjugaison par SUFFIXES\u003c/h4>\n    \u003cp style=\"margin:0\">La personne est marquée \u003cstrong>après\u003c/strong> le verbe. C'est le système \u003cem>suffixal\u003c/em> (dit « parfait »).\u003c/p>\n    \u003cp class=\"he\" style=\"margin:8px 0 0\">כָּתַב\u003cspan class=\"sfx\">ְתִּי\u003c/span> — כָּתַב\u003cspan class=\"sfx\">ְנוּ\u003c/span>\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"card\" style=\"border-top:3px solid var(--fut)\">\n    \u003cspan class=\"pill fut\">עָתִיד · futur\u003c/span>\n    \u003ch4 style=\"margin-top:10px\">Conjugaison par PRÉFIXES\u003c/h4>\n    \u003cp style=\"margin:0\">La personne est marquée \u003cstrong>avant\u003c/strong> le verbe (+ parfois un suffixe). C'est le système \u003cem>préfixal\u003c/em> (dit « imparfait »).\u003c/p>\n    \u003cp class=\"he\" style=\"margin:8px 0 0\">\u003cspan class=\"pfx\">אֶ\u003c/span>כְתּוֹב — \u003cspan class=\"pfx\">נִ\u003c/span>כְתּוֹב\u003c/p>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"note tip\">\n\u003cb>La bonne nouvelle\u003c/b>\nLes suffixes du passé sont \u003cstrong>rigoureusement identiques dans les sept binyanim\u003c/strong>, et les préfixes du futur aussi. Ce qui change d'un binyan à l'autre, c'est uniquement le \u003cem>thème\u003c/em> (la base vocalisée) auquel on les colle. Apprenez une fois les affixes, puis sept thèmes.\n\u003c/div>\n\n\u003ch3>Les sept binyanim en un coup d'œil\u003c/h3>\n\u003cdiv class=\"tbl-wrap\">\n\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Binyan\u003c/th>\u003cth>Sens typique\u003c/th>\u003cth>Passé (il)\u003c/th>\u003cth>Futur (il)\u003c/th>\u003cth>Exemple\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003cb style=\"color:var(--paal)\">פָּעַל\u003c/b> (קַל)\u003c/td>\u003ctd>actif simple, le socle\u003c/td>\u003ctd class=\"hcell he\">כָּתַב\u003c/td>\u003ctd class=\"hcell he\">יִכְתּוֹב\u003c/td>\u003ctd>écrire\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb style=\"color:var(--nifal)\">נִפְעַל\u003c/b>\u003c/td>\u003ctd>passif / réfléchi de פעל\u003c/td>\u003ctd class=\"hcell he\">נִכְתַּב\u003c/td>\u003ctd class=\"hcell he\">יִכָּתֵב\u003c/td>\u003ctd>être écrit\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb style=\"color:var(--piel)\">פִּיעֵל\u003c/b>\u003c/td>\u003ctd>actif intensif, factitif\u003c/td>\u003ctd class=\"hcell he\">דִּבֵּר\u003c/td>\u003ctd class=\"hcell he\">יְדַבֵּר\u003c/td>\u003ctd>parler\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb style=\"color:var(--pual)\">פּוּעַל\u003c/b>\u003c/td>\u003ctd>passif de פיעל\u003c/td>\u003ctd class=\"hcell he\">דֻּבַּר\u003c/td>\u003ctd class=\"hcell he\">יְדֻבַּר\u003c/td>\u003ctd>être dit\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb style=\"color:var(--hifil)\">הִפְעִיל\u003c/b>\u003c/td>\u003ctd>causatif\u003c/td>\u003ctd class=\"hcell he\">הִכְתִּיב\u003c/td>\u003ctd class=\"hcell he\">יַכְתִּיב\u003c/td>\u003ctd>faire écrire, dicter\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb style=\"color:var(--hufal)\">הוּפְעַל\u003c/b>\u003c/td>\u003ctd>passif de הפעיל\u003c/td>\u003ctd class=\"hcell he\">הֻכְתַּב\u003c/td>\u003ctd class=\"hcell he\">יֻכְתַּב\u003c/td>\u003ctd>être dicté\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb style=\"color:var(--hitpael)\">הִתְפַּעֵל\u003c/b>\u003c/td>\u003ctd>réfléchi, réciproque\u003c/td>\u003ctd class=\"hcell he\">הִתְלַבֵּשׁ\u003c/td>\u003ctd class=\"hcell he\">יִתְלַבֵּשׁ\u003c/td>\u003ctd>s'habiller\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\n\u003cdiv class=\"note\">\n\u003cb>Repère de lecture\u003c/b>\nDans tout le cours&nbsp;: le \u003cspan class=\"pfx\">préfixe\u003c/span> est en violet, le \u003cspan class=\"stem\">thème\u003c/span> en brun, le \u003cspan class=\"sfx\">suffixe\u003c/span> en bleu. Les formes sont données en \u003cem>ktiv malé menuqad\u003c/em> — orthographe pleine \u003cstrong>et\u003c/strong> nikoud —, la norme de l'hébreu moderne&nbsp;; la colonne «&nbsp;ktiv malé&nbsp;» donne la même forme telle qu'on l'écrit au quotidien, sans les points.\n\u003c/div>\n\n\u003cdiv class=\"note tip\">\n\u003cb>Convention orthographique&nbsp;: le \u003cspan class=\"he\">ו\u003c/span> du \u003cem>holam\u003c/em>\u003c/b>\nCe cours écrit systématiquement le \u003cem>holam\u003c/em> avec un \u003cspan class=\"he\">ו\u003c/span>, comme le fait l'hébreu moderne&nbsp;:\u003cbr>\n\u003cspan class=\"he he-lg\">יִכְתּוֹב · יִשְׁמוֹר · אֶפּוֹל · יָכוֹלְתִּי\u003c/span> &nbsp;plutôt que les graphies défectives \u003cspan class=\"he\">יִכְתֹּב · יִשְׁמֹר · אֶפֹּל · יָכֹלְתִּי\u003c/span> des grammaires classiques.\u003cbr>\nDeux exceptions que l'usage impose&nbsp;: \u003cspan class=\"he\">לֹא\u003c/span> (jamais ✗\u003cspan class=\"he\">לוא\u003c/span>) et les formes de futur suivies d'un \u003cspan class=\"he\">א\u003c/span> — \u003cspan class=\"he\">תֹּאמַר, יֹאכַל, נֹאמַר\u003c/span> — où le \u003cspan class=\"he\">ו\u003c/span> ne s'écrit pas. La 1\u003csup>re\u003c/sup> personne, elle, le prend&nbsp;: \u003cspan class=\"he\">אוֹמַר, אוֹכַל\u003c/span>.\n\u003c/div>\n\u003c/section>\n\n\u003chr>\n\n\u003csection id=\"passe\">\n\u003ch2>\u003cspan class=\"num\">2.\u003c/span> Le passé — עָבָר\u003c/h2>\n\n\u003ch3>2.1 · Les neuf suffixes personnels\u003c/h3>\n\u003cp>Ce tableau est \u003cstrong>le\u003c/strong> tableau à mémoriser. Il vaut pour les sept binyanim, sans exception, pour les verbes forts comme pour les verbes faibles.\u003c/p>\n\n\u003cdiv class=\"tbl-wrap\">\n\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Personne\u003c/th>\u003cth>Pronom\u003c/th>\u003cth>Suffixe\u003c/th>\u003cth>Prononciation\u003c/th>\u003cth>Exemple \u003cspan class=\"he\">כתב\u003c/span>\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>1\u003csup>re\u003c/sup> sing.\u003c/td>\u003ctd class=\"hcell he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he sfx\">־ְתִּי\u003c/td>\u003ctd class=\"tr\">-ti\u003c/td>\u003ctd class=\"hcell he\">כָּתַבְתִּי\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003csup>e\u003c/sup> masc. sing.\u003c/td>\u003ctd class=\"hcell he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he sfx\">־ְתָּ\u003c/td>\u003ctd class=\"tr\">-ta\u003c/td>\u003ctd class=\"hcell he\">כָּתַבְתָּ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003csup>e\u003c/sup> fém. sing.\u003c/td>\u003ctd class=\"hcell he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he sfx\">־ְתְּ\u003c/td>\u003ctd class=\"tr\">-t\u003c/td>\u003ctd class=\"hcell he\">כָּתַבְתְּ\u003c/td>\u003c/tr>\n\u003ctr class=\"hl\">\u003ctd>3\u003csup>e\u003c/sup> masc. sing.\u003c/td>\u003ctd class=\"hcell he\">הוּא\u003c/td>\u003ctd class=\"hcell\">\u003cb>∅\u003c/b> (rien)\u003c/td>\u003ctd class=\"tr\">—\u003c/td>\u003ctd class=\"hcell he\">כָּתַב\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003csup>e\u003c/sup> fém. sing.\u003c/td>\u003ctd class=\"hcell he\">הִיא\u003c/td>\u003ctd class=\"hcell he sfx\">־ָה\u003c/td>\u003ctd class=\"tr\">-a\u003c/td>\u003ctd class=\"hcell he\">כָּתְבָה\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003csup>re\u003c/sup> plur.\u003c/td>\u003ctd class=\"hcell he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he sfx\">־ְנוּ\u003c/td>\u003ctd class=\"tr\">-nou\u003c/td>\u003ctd class=\"hcell he\">כָּתַבְנוּ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003csup>e\u003c/sup> masc. plur.\u003c/td>\u003ctd class=\"hcell he\">אַתֶּם\u003c/td>\u003ctd class=\"hcell he sfx\">־ְתֶּם\u003c/td>\u003ctd class=\"tr\">-tem\u003c/td>\u003ctd class=\"hcell he\">כְּתַבְתֶּם\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003csup>e\u003c/sup> fém. plur.\u003c/td>\u003ctd class=\"hcell he\">אַתֶּן\u003c/td>\u003ctd class=\"hcell he sfx\">־ְתֶּן\u003c/td>\u003ctd class=\"tr\">-ten\u003c/td>\u003ctd class=\"hcell he\">כְּתַבְתֶּן\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003csup>e\u003c/sup> plur. (m/f)\u003c/td>\u003ctd class=\"hcell he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he sfx\">־וּ\u003c/td>\u003ctd class=\"tr\">-ou\u003c/td>\u003ctd class=\"hcell he\">כָּתְבוּ\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\n\u003cdiv class=\"note tip\">\n\u003cb>Structure cachée\u003c/b>\nLes suffixes se répartissent en deux familles qui expliquent \u003cem>toutes\u003c/em> les alternances vocaliques que vous verrez plus bas&nbsp;:\u003cbr>\n① Les suffixes \u003cstrong>consonantiques\u003c/strong> (־תי, ־ת, ־ת, ־נו, ־תם, ־תן) — 1\u003csup>re\u003c/sup> et 2\u003csup>e\u003c/sup> personnes. Ils \u003cstrong>ferment\u003c/strong> la syllabe et raccourcissent la voyelle du thème.\u003cbr>\n② Les suffixes \u003cstrong>vocaliques\u003c/strong> (־ָה, ־וּ) et le zéro de \u003cspan class=\"he\">הוּא\u003c/span> — 3\u003csup>e\u003c/sup> personnes. Ils \u003cstrong>préservent\u003c/strong> la voyelle longue du thème.\u003cbr>\nRetenez ce clivage 1-2 / 3&nbsp;: c'est lui qui gouverne הפעיל, les verbes creux, les ל״ה…\n\u003c/div>\n\n\u003cdiv class=\"note warn\">\n\u003cb>Deux formes qui s'écrivent pareil sans nikoud\u003c/b>\n\u003cspan class=\"he\">כָּתַבְתָּ\u003c/span> (tu, masc.) et \u003cspan class=\"he\">כָּתַבְתְּ\u003c/span> (tu, fém.) s'écrivent toutes deux \u003cspan class=\"he\">כתבת\u003c/span>. Seule la prononciation les distingue (\u003cspan class=\"tr\">katávta\u003c/span> / \u003cspan class=\"tr\">katávt\u003c/span>). En hébreu moderne parlé, la forme féminine perd souvent son \u003cem>-t\u003c/em> final audible, et c'est le contexte qui tranche.\n\u003c/div>\n\n\u003ch4>Accent tonique\u003c/h4>\n\u003cul>\n\u003cli>3\u003csup>e\u003c/sup> personnes et 2\u003csup>e\u003c/sup> pluriel&nbsp;: accent \u003cstrong>final\u003c/strong> (מִלְּרַע) — \u003cspan class=\"he\">כָּתַ\u003cb>ב\u003c/b>\u003c/span>, \u003cspan class=\"he\">כָּתְ\u003cb>בָה\u003c/b>\u003c/span>, \u003cspan class=\"he\">כָּתְ\u003cb>בוּ\u003c/b>\u003c/span>, \u003cspan class=\"he\">כְּתַבְ\u003cb>תֶּם\u003c/b>\u003c/span>.\u003c/li>\n\u003cli>1\u003csup>re\u003c/sup> et 2\u003csup>e\u003c/sup> personnes du singulier + 1\u003csup>re\u003c/sup> pluriel&nbsp;: accent sur l'\u003cstrong>avant-dernière\u003c/strong> syllabe (מִלְּעֵיל) — \u003cspan class=\"he\">כָּ\u003cb>תַבְ\u003c/b>תִּי\u003c/span>, \u003cspan class=\"he\">כָּ\u003cb>תַבְ\u003c/b>נוּ\u003c/span>.\u003c/li>\n\u003c/ul>\n\u003cp>Conséquence pratique&nbsp;: \u003cspan class=\"he\">כָּתְבָה\u003c/span> (\u003cspan class=\"tr\">katvá\u003c/span>, « elle a écrit ») ≠ \u003cspan class=\"he\">כּוֹתֶבֶת\u003c/span> au présent. Ne déplacez pas l'accent, sinon vous changez de mot.\u003c/p>\n\n\u003ch3>2.2 · Les sept binyanim au passé\u003c/h3>\n\u003cp>Chaque onglet donne la conjugaison complète, la formule du thème et les remarques propres au binyan. Verbe modèle&nbsp;: racine forte (שְׁלֵמִים).\u003c/p>\n\n\u003cdiv class=\"tabs\" data-group=\"past\">\n  \u003cbutton class=\"on\" data-t=\"p-paal\">פָּעַל\u003c/button>\n  \u003cbutton data-t=\"p-nifal\">נִפְעַל\u003c/button>\n  \u003cbutton data-t=\"p-piel\">פִּיעֵל\u003c/button>\n  \u003cbutton data-t=\"p-pual\">פּוּעַל\u003c/button>\n  \u003cbutton data-t=\"p-hifil\">הִפְעִיל\u003c/button>\n  \u003cbutton data-t=\"p-hufal\">הוּפְעַל\u003c/button>\n  \u003cbutton data-t=\"p-hitpael\">הִתְפַּעֵל\u003c/button>\n\u003c/div>\n\n\u003cdiv class=\"tabpane on\" id=\"p-paal\">\n  \u003cdiv class=\"card\" style=\"border-top:3px solid var(--paal)\">\n  \u003ch3 style=\"margin-top:0;color:var(--paal)\">פָּעַל / קַל — l'actif simple\u003c/h3>\n  \u003cp>\u003cb>Racine modèle&nbsp;:\u003c/b> \u003cspan class=\"he\">כ־ת־ב\u003c/span> «&nbsp;écrire&nbsp;» · \u003cb>Thème&nbsp;:\u003c/b> \u003cspan class=\"he\">כָּתַב\u003c/span> (qamats – patah) · \u003cb>Sans préfixe.\u003c/b>\u003c/p>\n  \u003cdiv class=\"tbl-wrap\">\u003ctable>\n  \u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Forme vocalisée\u003c/th>\u003cth>Ktiv malé\u003c/th>\u003cth>Prononciation\u003c/th>\u003cth>Traduction\u003c/th>\u003c/tr>\u003c/thead>\n  \u003ctbody>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">כָּתַבְתִּי\u003c/td>\u003ctd class=\"hcell he\">כתבתי\u003c/td>\u003ctd class=\"tr\">katávti\u003c/td>\u003ctd>j'ai écrit\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">כָּתַבְתָּ\u003c/td>\u003ctd class=\"hcell he\">כתבת\u003c/td>\u003ctd class=\"tr\">katávta\u003c/td>\u003ctd>tu as écrit (m.)\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">כָּתַבְתְּ\u003c/td>\u003ctd class=\"hcell he\">כתבת\u003c/td>\u003ctd class=\"tr\">katávt\u003c/td>\u003ctd>tu as écrit (f.)\u003c/td>\u003c/tr>\n  \u003ctr class=\"hl\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">כָּתַב\u003c/td>\u003ctd class=\"hcell he\">כתב\u003c/td>\u003ctd class=\"tr\">katáv\u003c/td>\u003ctd>il a écrit\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">כָּתְבָה\u003c/td>\u003ctd class=\"hcell he\">כתבה\u003c/td>\u003ctd class=\"tr\">katvá\u003c/td>\u003ctd>elle a écrit\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">כָּתַבְנוּ\u003c/td>\u003ctd class=\"hcell he\">כתבנו\u003c/td>\u003ctd class=\"tr\">katávnou\u003c/td>\u003ctd>nous avons écrit\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּם\u003c/td>\u003ctd class=\"hcell he\">כְּתַבְתֶּם\u003c/td>\u003ctd class=\"hcell he\">כתבתם\u003c/td>\u003ctd class=\"tr\">ktavtém\u003c/td>\u003ctd>vous avez écrit (m.)\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּן\u003c/td>\u003ctd class=\"hcell he\">כְּתַבְתֶּן\u003c/td>\u003ctd class=\"hcell he\">כתבתן\u003c/td>\u003ctd class=\"tr\">ktavtén\u003c/td>\u003ctd>vous avez écrit (f.)\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">כָּתְבוּ\u003c/td>\u003ctd class=\"hcell he\">כתבו\u003c/td>\u003ctd class=\"tr\">katvóu\u003c/td>\u003ctd>ils/elles ont écrit\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n\n  \u003cdiv class=\"note warn\">\u003cb>Le piège de אַתֶּם / אַתֶּן\u003c/b>\n  La forme normative est \u003cspan class=\"he\">כְּתַבְתֶּם\u003c/span> (shva initial, accent final). En hébreu \u003cstrong>parlé\u003c/strong>, presque tout le monde dit \u003cspan class=\"he\">כָּתַבְתֶּם\u003c/span> \u003cspan class=\"tr\">katávtem\u003c/span>, par analogie avec les autres personnes. Les deux se rencontrent&nbsp;; à l'écrit soutenu, préférez la forme normative.\u003c/div>\n\n  \u003ch4>Les trois sous-types de פעל\u003c/h4>\n  \u003cp>Au passé, tous convergent vers un \u003cem>patah\u003c/em> devant les suffixes consonantiques, mais la 3\u003csup>e\u003c/sup> personne masculine diffère&nbsp;:\u003c/p>\n  \u003cdiv class=\"tbl-wrap\">\u003ctable>\n  \u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>הוא\u003c/th>\u003cth>היא\u003c/th>\u003cth>אני\u003c/th>\u003cth>Verbes concernés\u003c/th>\u003c/tr>\u003c/thead>\n  \u003ctbody>\n  \u003ctr>\u003ctd>\u003cb>פָּעַל\u003c/b> (action)\u003c/td>\u003ctd class=\"hcell he\">כָּתַב\u003c/td>\u003ctd class=\"hcell he\">כָּתְבָה\u003c/td>\u003ctd class=\"hcell he\">כָּתַבְתִּי\u003c/td>\u003ctd>la grande majorité&nbsp;: \u003cspan class=\"he\">שָׁמַר, לָמַד, סָגַר\u003c/span>\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>\u003cb>פָּעֵל\u003c/b> (état)\u003c/td>\u003ctd class=\"hcell he\">יָשֵׁן\u003c/td>\u003ctd class=\"hcell he\">יָשְׁנָה\u003c/td>\u003ctd class=\"hcell he\">יָשַׁנְתִּי\u003c/td>\u003ctd>verbes d'état&nbsp;: \u003cspan class=\"he\">יָשֵׁן, זָקֵן, שָׂמֵחַ, כָּבֵד\u003c/span>\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>\u003cb>פָּעוֹל\u003c/b> (état)\u003c/td>\u003ctd class=\"hcell he\">יָכוֹל\u003c/td>\u003ctd class=\"hcell he\">יָכְלָה\u003c/td>\u003ctd class=\"hcell he\">יָכוֹלְתִּי\u003c/td>\u003ctd>rare&nbsp;: \u003cspan class=\"he\">יָכוֹל, קָטוֹן\u003c/span>\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n  \u003cp style=\"font-size:.93rem;color:var(--ink-soft)\">Autrement dit&nbsp;: \u003cspan class=\"he\">שָׂמֵחַ\u003c/span> «&nbsp;il s'est réjoui&nbsp;» mais \u003cspan class=\"he\">שָׂמַחְתִּי\u003c/span> «&nbsp;je me suis réjoui&nbsp;» — le \u003cem>tsere\u003c/em> ne survit pas devant un suffixe consonantique.\u003c/p>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"tabpane\" id=\"p-nifal\">\n  \u003cdiv class=\"card\" style=\"border-top:3px solid var(--nifal)\">\n  \u003ch3 style=\"margin-top:0;color:var(--nifal)\">נִפְעַל — passif / réfléchi / réciproque\u003c/h3>\n  \u003cp>\u003cb>Racine modèle&nbsp;:\u003c/b> \u003cspan class=\"he\">כ־ת־ב\u003c/span> · \u003cb>Thème&nbsp;:\u003c/b> \u003cspan class=\"he\">\u003cspan class=\"pfx\">נִ\u003c/span>כְתַּב\u003c/span> · \u003cb>Marque&nbsp;:\u003c/b> préfixe \u003cspan class=\"he pfx\">נִ־\u003c/span>.\u003c/p>\n  \u003cdiv class=\"tbl-wrap\">\u003ctable>\n  \u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Forme vocalisée\u003c/th>\u003cth>Ktiv malé\u003c/th>\u003cth>Prononciation\u003c/th>\u003cth>Traduction\u003c/th>\u003c/tr>\u003c/thead>\n  \u003ctbody>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">נִכְתַּבְתִּי\u003c/td>\u003ctd class=\"hcell he\">נכתבתי\u003c/td>\u003ctd class=\"tr\">nikhtávti\u003c/td>\u003ctd>j'ai été écrit\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">נִכְתַּבְתָּ\u003c/td>\u003ctd class=\"hcell he\">נכתבת\u003c/td>\u003ctd class=\"tr\">nikhtávta\u003c/td>\u003ctd>tu as été écrit\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">נִכְתַּבְתְּ\u003c/td>\u003ctd class=\"hcell he\">נכתבת\u003c/td>\u003ctd class=\"tr\">nikhtávt\u003c/td>\u003ctd>tu as été écrite\u003c/td>\u003c/tr>\n  \u003ctr class=\"hl\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">נִכְתַּב\u003c/td>\u003ctd class=\"hcell he\">נכתב\u003c/td>\u003ctd class=\"tr\">nikhtáv\u003c/td>\u003ctd>il a été écrit\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">נִכְתְּבָה\u003c/td>\u003ctd class=\"hcell he\">נכתבה\u003c/td>\u003ctd class=\"tr\">nikhtevá\u003c/td>\u003ctd>elle a été écrite\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">נִכְתַּבְנוּ\u003c/td>\u003ctd class=\"hcell he\">נכתבנו\u003c/td>\u003ctd class=\"tr\">nikhtávnou\u003c/td>\u003ctd>nous avons été écrits\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּם\u003c/td>\u003ctd class=\"hcell he\">נִכְתַּבְתֶּם\u003c/td>\u003ctd class=\"hcell he\">נכתבתם\u003c/td>\u003ctd class=\"tr\">nikhtavtém\u003c/td>\u003ctd>vous avez été écrits\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּן\u003c/td>\u003ctd class=\"hcell he\">נִכְתַּבְתֶּן\u003c/td>\u003ctd class=\"hcell he\">נכתבתן\u003c/td>\u003ctd class=\"tr\">nikhtavtén\u003c/td>\u003ctd>vous avez été écrites\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">נִכְתְּבוּ\u003c/td>\u003ctd class=\"hcell he\">נכתבו\u003c/td>\u003ctd class=\"tr\">nikhtevóu\u003c/td>\u003ctd>ils ont été écrits\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n\n  \u003cdiv class=\"note warn\">\u003cb>Le piège majeur du נפעל\u003c/b>\n  Au passé \u003cem>et\u003c/em> au présent, נפעל porte le préfixe \u003cspan class=\"he\">נ־\u003c/span>. Sans nikoud, \u003cspan class=\"he\">נכנס\u003c/span> peut donc être&nbsp;:\u003cbr>\n  · \u003cspan class=\"he\">נִכְנַס\u003c/span> (\u003cspan class=\"tr\">nikhnás\u003c/span>) = «&nbsp;il est entré&nbsp;» — \u003cb>passé\u003c/b>\u003cbr>\n  · \u003cspan class=\"he\">נִכְנָס\u003c/span> (\u003cspan class=\"tr\">nikhnás\u003c/span>) = «&nbsp;il entre&nbsp;» — \u003cb>présent\u003c/b>\u003cbr>\n  À l'oral, la différence est presque nulle. C'est le \u003cstrong>contexte\u003c/strong> (adverbe de temps, enchaînement du récit) qui tranche. Aucun autre binyan n'a cette ambiguïté.\u003c/div>\n\n  \u003cdiv class=\"note\">\u003cb>Le נ disparaît ailleurs\u003c/b>\n  Le \u003cspan class=\"he\">נ־\u003c/span> n'existe qu'au passé et au présent. À l'infinitif, au futur et à l'impératif, il est remplacé par \u003cspan class=\"he\">הִ־\u003c/span> puis assimilé&nbsp;: \u003cspan class=\"he\">לְהִיכָּתֵב · יִיכָּתֵב · הִיכָּתֵב!\u003c/span>\u003c/div>\n\n  \u003cp>\u003cb>Valeurs du נפעל&nbsp;:\u003c/b> passif (\u003cspan class=\"he\">נִשְׁבַּר\u003c/span> il a été cassé), réfléchi/moyen (\u003cspan class=\"he\">נִזְהַר\u003c/span> il a fait attention), réciproque (\u003cspan class=\"he\">נִפְגַּשְׁנוּ\u003c/span> nous nous sommes rencontrés), ou simplement intransitif sans valeur passive (\u003cspan class=\"he\">נִכְנַס\u003c/span> entrer, \u003cspan class=\"he\">נִשְׁאַר\u003c/span> rester).\u003c/p>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"tabpane\" id=\"p-piel\">\n  \u003cdiv class=\"card\" style=\"border-top:3px solid var(--piel)\">\n  \u003ch3 style=\"margin-top:0;color:var(--piel)\">פִּיעֵל — actif intensif / factitif\u003c/h3>\n  \u003cp>\u003cb>Racine modèle&nbsp;:\u003c/b> \u003cspan class=\"he\">ד־ב־ר\u003c/span> «&nbsp;parler&nbsp;» · \u003cb>Thème&nbsp;:\u003c/b> \u003cspan class=\"he\">דִּבֵּר\u003c/span> · \u003cb>Marque&nbsp;:\u003c/b> \u003cem>daguesh\u003c/em> dans la 2\u003csup>e\u003c/sup> radicale (redoublement), pas de préfixe.\u003c/p>\n  \u003cdiv class=\"tbl-wrap\">\u003ctable>\n  \u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Forme vocalisée\u003c/th>\u003cth>Ktiv malé\u003c/th>\u003cth>Prononciation\u003c/th>\u003cth>Traduction\u003c/th>\u003c/tr>\u003c/thead>\n  \u003ctbody>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">דִּבַּרְתִּי\u003c/td>\u003ctd class=\"hcell he\">דיברתי\u003c/td>\u003ctd class=\"tr\">dibárti\u003c/td>\u003ctd>j'ai parlé\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">דִּבַּרְתָּ\u003c/td>\u003ctd class=\"hcell he\">דיברת\u003c/td>\u003ctd class=\"tr\">dibárta\u003c/td>\u003ctd>tu as parlé (m.)\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">דִּבַּרְתְּ\u003c/td>\u003ctd class=\"hcell he\">דיברת\u003c/td>\u003ctd class=\"tr\">dibárt\u003c/td>\u003ctd>tu as parlé (f.)\u003c/td>\u003c/tr>\n  \u003ctr class=\"hl\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">דִּבֵּר\u003c/td>\u003ctd class=\"hcell he\">דיבר\u003c/td>\u003ctd class=\"tr\">dibér\u003c/td>\u003ctd>il a parlé\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">דִּבְּרָה\u003c/td>\u003ctd class=\"hcell he\">דיברה\u003c/td>\u003ctd class=\"tr\">dibrá\u003c/td>\u003ctd>elle a parlé\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">דִּבַּרְנוּ\u003c/td>\u003ctd class=\"hcell he\">דיברנו\u003c/td>\u003ctd class=\"tr\">dibárnou\u003c/td>\u003ctd>nous avons parlé\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּם\u003c/td>\u003ctd class=\"hcell he\">דִּבַּרְתֶּם\u003c/td>\u003ctd class=\"hcell he\">דיברתם\u003c/td>\u003ctd class=\"tr\">dibartém\u003c/td>\u003ctd>vous avez parlé (m.)\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּן\u003c/td>\u003ctd class=\"hcell he\">דִּבַּרְתֶּן\u003c/td>\u003ctd class=\"hcell he\">דיברתן\u003c/td>\u003ctd class=\"tr\">dibartén\u003c/td>\u003ctd>vous avez parlé (f.)\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">דִּבְּרוּ\u003c/td>\u003ctd class=\"hcell he\">דיברו\u003c/td>\u003ctd class=\"tr\">dibróu\u003c/td>\u003ctd>ils/elles ont parlé\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n\n  \u003cdiv class=\"note tip\">\u003cb>Règle en une ligne\u003c/b>\n  \u003cem>Tsere\u003c/em> (ֵ) à la 3\u003csup>e\u003c/sup> masc. sing. seulement&nbsp;: \u003cspan class=\"he\">דִּבֵּר\u003c/span>. Partout ailleurs devant suffixe consonantique&nbsp;: \u003cem>patah\u003c/em> (ַ) — \u003cspan class=\"he\">דִּבַּרְתִּי, דִּבַּרְנוּ\u003c/span>. Devant suffixe vocalique&nbsp;: la voyelle tombe — \u003cspan class=\"he\">דִּבְּרָה, דִּבְּרוּ\u003c/span>.\u003c/div>\n\n  \u003cdiv class=\"note\">\u003cb>Orthographe sans nikoud\u003c/b>\n  On écrit un \u003cspan class=\"he\">י\u003c/span> pour noter le \u003cem>hiriq\u003c/em> du פיעל&nbsp;: \u003cspan class=\"he\">דיברתי, סיפרתי, לימדתי, טיילנו\u003c/span>. Ce \u003cspan class=\"he\">י\u003c/span> n'appartient pas à la racine — ne vous laissez pas piéger en cherchant la racine \u003cspan class=\"he\">ד־י־ב־ר\u003c/span>&nbsp;! La racine est \u003cspan class=\"he\">ד־ב־ר\u003c/span>.\u003c/div>\n\n  \u003cdiv class=\"note warn\">\u003cb>Radicales qui refusent le daguesh\u003c/b>\n  Les gutturales \u003cspan class=\"he\">א ה ח ע ר\u003c/span> ne peuvent pas être redoublées. Deux stratégies&nbsp;:\u003cbr>\n  · \u003cstrong>allongement compensatoire\u003c/strong>&nbsp;: \u003cspan class=\"he\">בֵּרַךְ\u003c/span> (racine ב־ר־ך, « bénir ») — le \u003cem>hiriq\u003c/em> devient \u003cem>tsere\u003c/em>&nbsp;; \u003cspan class=\"he\">תֵּאֵר\u003c/span>, \u003cspan class=\"he\">מֵאֵן\u003c/span>.\u003cbr>\n  · \u003cstrong>maintien du hiriq\u003c/strong> avec ח et ע souvent&nbsp;: \u003cspan class=\"he\">מִהֵר\u003c/span> (se dépêcher), \u003cspan class=\"he\">נִחֵם\u003c/span>, \u003cspan class=\"he\">שִׂחֵק\u003c/span>.\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"tabpane\" id=\"p-pual\">\n  \u003cdiv class=\"card\" style=\"border-top:3px solid var(--pual)\">\n  \u003ch3 style=\"margin-top:0;color:var(--pual)\">פּוּעַל — le passif de פיעל\u003c/h3>\n  \u003cp>\u003cb>Racine modèle&nbsp;:\u003c/b> \u003cspan class=\"he\">ד־ב־ר\u003c/span> · \u003cb>Thème&nbsp;:\u003c/b> \u003cspan class=\"he\">דֻּבַּר\u003c/span> (\u003cem>qoubouts\u003c/em> + daguesh) · \u003cb>Sans préfixe.\u003c/b> En ktiv malé&nbsp;: \u003cspan class=\"he\">דובר\u003c/span>.\u003c/p>\n  \u003cdiv class=\"tbl-wrap\">\u003ctable>\n  \u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Forme vocalisée\u003c/th>\u003cth>Ktiv malé\u003c/th>\u003cth>Prononciation\u003c/th>\u003cth>Traduction\u003c/th>\u003c/tr>\u003c/thead>\n  \u003ctbody>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">דֻּבַּרְתִּי\u003c/td>\u003ctd class=\"hcell he\">דוברתי\u003c/td>\u003ctd class=\"tr\">doubárti\u003c/td>\u003ctd>on a parlé de moi\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">דֻּבַּרְתָּ\u003c/td>\u003ctd class=\"hcell he\">דוברת\u003c/td>\u003ctd class=\"tr\">doubárta\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">דֻּבַּרְתְּ\u003c/td>\u003ctd class=\"hcell he\">דוברת\u003c/td>\u003ctd class=\"tr\">doubárt\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n  \u003ctr class=\"hl\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">דֻּבַּר\u003c/td>\u003ctd class=\"hcell he\">דובר\u003c/td>\u003ctd class=\"tr\">doubár\u003c/td>\u003ctd>cela a été dit\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">דֻּבְּרָה\u003c/td>\u003ctd class=\"hcell he\">דוברה\u003c/td>\u003ctd class=\"tr\">doubrá\u003c/td>\u003ctd>elle a été dite\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">דֻּבַּרְנוּ\u003c/td>\u003ctd class=\"hcell he\">דוברנו\u003c/td>\u003ctd class=\
