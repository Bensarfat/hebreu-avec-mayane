i>\n          \u003c/ul>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֲנִי מַאֲמִינָה בְּךָ\u003c/span> → Je crois en toi.\u003cbr>\n            \u003cspan class=\"he-inline\">הוּא נִזְכַּר בָּנוּ\u003c/span> → Il s'est souvenu de nous.\u003cbr>\n            \u003cspan class=\"he-inline\">בְּחַרְתִּי בָּהּ\u003c/span> → Je l'ai choisie.\n          \u003c/div>\n        "},{"title":"Déclinaison de la préposition מ","he":"נטיית מילת היחס מ","body":"\n          \u003cp>La préposition \u003cspan class=\"he-inline\">מִ‑ / מֵ‑\u003c/span> (« de / depuis / à partir de ») se conjugue elle aussi avec les pronoms suffixes.\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Forme\u003c/th>\u003cth>Sens\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>אני\u003c/td>\u003ctd class=\"he-cell\">מִמֶּנִּי\u003c/td>\u003ctd>de moi\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אתה\u003c/td>\u003ctd class=\"he-cell\">מִמְּךָ\u003c/td>\u003ctd>de toi (m.)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>את\u003c/td>\u003ctd class=\"he-cell\">מִמֵּךְ\u003c/td>\u003ctd>de toi (f.)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>הוא\u003c/td>\u003ctd class=\"he-cell\">מִמֶּנּוּ\u003c/td>\u003ctd>de lui\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>היא\u003c/td>\u003ctd class=\"he-cell\">מִמֶּנָּה\u003c/td>\u003ctd>d'elle\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אנחנו\u003c/td>\u003ctd class=\"he-cell\">מֵאִיתָּנוּ\u003c/td>\u003ctd>de nous\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אתם\u003c/td>\u003ctd class=\"he-cell\">מִכֶּם\u003c/td>\u003ctd>de vous (m.)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אתן\u003c/td>\u003ctd class=\"he-cell\">מִכֶּן\u003c/td>\u003ctd>de vous (f.)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>הם\u003c/td>\u003ctd class=\"he-cell\">מֵהֶם\u003c/td>\u003ctd>d'eux\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>הן\u003c/td>\u003ctd class=\"he-cell\">מֵהֶן\u003c/td>\u003ctd>d'elles\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cp>\u003cstrong>⚠️ Attention\u003c/strong> : \u003cspan class=\"he-inline\">מִמֶּנּוּ\u003c/span> signifie « de lui », pas « de nous ». Pour « de nous » on dit \u003cspan class=\"he-inline\">מֵאִיתָּנוּ\u003c/span> (construit sur \u003cspan class=\"he-inline\">אִית‑\u003c/span> comme \u003cspan class=\"he-inline\">אִיתָּנוּ\u003c/span> « avec nous »).\u003c/p>\n          \u003cp>\u003cstrong>Verbes qui se construisent avec מ‑\u003c/strong> :\u003c/p>\n          \u003cul>\n            \u003cli>\u003cspan class=\"he-inline\">לְפַחֵד מִ\u003c/span> → avoir peur de\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְבַקֵּשׁ מִ\u003c/span> → demander à\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לִדְרוֹשׁ מִ\u003c/span> → exiger de\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְהִיפָּרֵד מִ\u003c/span> → se séparer de / dire au revoir à\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְהִתְרַחֵק מִ\u003c/span> → s'éloigner de\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לִלְמוֹד מִ\u003c/span> → apprendre de\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לִמְנוֹעַ מִ\u003c/span> → empêcher de\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְקַבֵּל מִ\u003c/span> → recevoir de\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לִשְׁמוֹעַ מִ\u003c/span> → entendre de / apprendre par\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לִסְבּוֹל מִ\u003c/span> → souffrir de\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">מִמִּי אַתָּה פּוֹחֵד?\u003c/span> → De qui as-tu peur ?\u003cbr>\n            \u003cspan class=\"he-inline\">אֲנִי פּוֹחֶדֶת מֵאֲרָיוֹת, אֲנִי פּוֹחֶדֶת מֵהֶם!\u003c/span> → J'ai peur des lions, j'ai peur d'eux !\u003cbr>\n            \u003cspan class=\"he-inline\">לָמַדְתִּי הַרְבֵּה מִמֶּנּוּ\u003c/span> → J'ai beaucoup appris de lui.\u003cbr>\n            \u003cspan class=\"he-inline\">קִיבַּלְתִּי מִמֵּךְ מַתָּנָה יָפָה\u003c/span> → J'ai reçu de toi un beau cadeau.\u003cbr>\n            \u003cspan class=\"he-inline\">הוּא הִתְרַחֵק מֵאִיתָּנוּ\u003c/span> → Il s'est éloigné de nous.\n          \u003c/div>\n          \u003cp>\u003cstrong>Astuce\u003c/strong> : \u003cspan class=\"he-inline\">מִמִּי?\u003c/span> = « de qui ? » et \u003cspan class=\"he-inline\">מִמָּה?\u003c/span> = « de quoi ? ». Utile pour poser la question qui va avec ces verbes.\u003c/p>\n        "},{"title":"כל + nom","he":"כל","body":"\n          \u003cp>\u003cspan class=\"he-inline\">כָּל\u003c/span> + \u003cstrong>nom singulier défini\u003c/strong> = « tout le / toute la… »\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">כָּל הַיּוֹם\u003c/span> → toute la journée\u003cbr>\n            \u003cspan class=\"he-inline\">כָּל הַמִּשְׁפָּחָה\u003c/span> → toute la famille\u003cbr>\n            \u003cspan class=\"he-inline\">כָּל הָעוֹלָם\u003c/span> → le monde entier\n          \u003c/div>\n          \u003cp>\u003cspan class=\"he-inline\">כָּל\u003c/span> + \u003cstrong>nom singulier indéfini\u003c/strong> = « chaque » :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">כָּל יוֹם\u003c/span> → chaque jour\u003cbr>\n            \u003cspan class=\"he-inline\">כָּל אֶחָד\u003c/span> / \u003cspan class=\"he-inline\">כָּל אַחַת\u003c/span> → chacun / chacune\n          \u003c/div>\n          \u003cp>\u003cspan class=\"he-inline\">כָּל\u003c/span> + \u003cstrong>nom pluriel défini\u003c/strong> = « tous les… » :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">כָּל הַיְלָדִים\u003c/span> → tous les enfants\u003cbr>\n            \u003cspan class=\"he-inline\">כָּל הַחֲנֻיּוֹת\u003c/span> → tous les magasins\n          \u003c/div>\n        "}]},{"name":"Verbes & conjugaison","items":[{"title":"Verbes au présent : 4 formes","he":"הווה","body":"\n          \u003cp>Tous les verbes hébreux au présent ont \u003cstrong>4 formes\u003c/strong> selon le genre et le nombre :\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Sg. m.\u003c/th>\u003cth>Sg. f.\u003c/th>\u003cth>Pl. m.\u003c/th>\u003cth>Pl. f.\u003c/th>\u003cth>Infinitif\u003c/th>\u003cth>Sens\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לוֹמֵד\u003c/td>\u003ctd class=\"he-cell\">לוֹמֶדֶת\u003c/td>\u003ctd class=\"he-cell\">לוֹמְדִים\u003c/td>\u003ctd class=\"he-cell\">לוֹמְדוֹת\u003c/td>\u003ctd class=\"he-cell\">לִלְמוֹד\u003c/td>\u003ctd>apprendre\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">כּוֹתֵב\u003c/td>\u003ctd class=\"he-cell\">כּוֹתֶבֶת\u003c/td>\u003ctd class=\"he-cell\">כּוֹתְבִים\u003c/td>\u003ctd class=\"he-cell\">כּוֹתְבוֹת\u003c/td>\u003ctd class=\"he-cell\">לִכְתּוֹב\u003c/td>\u003ctd>écrire\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">מְדַבֵּר\u003c/td>\u003ctd class=\"he-cell\">מְדַבֶּרֶת\u003c/td>\u003ctd class=\"he-cell\">מְדַבְּרִים\u003c/td>\u003ctd class=\"he-cell\">מְדַבְּרוֹת\u003c/td>\u003ctd class=\"he-cell\">לְדַבֵּר\u003c/td>\u003ctd>parler\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">גָּר\u003c/td>\u003ctd class=\"he-cell\">גָּרָה\u003c/td>\u003ctd class=\"he-cell\">גָּרִים\u003c/td>\u003ctd class=\"he-cell\">גָּרוֹת\u003c/td>\u003ctd class=\"he-cell\">לָגוּר\u003c/td>\u003ctd>habiter\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cp>Notez le verbe à 2 lettres (creux) \u003cspan class=\"he-inline\">גָּר\u003c/span> : il a une forme plus courte (pas de ת au féminin singulier).\u003c/p>\n        "},{"title":"Le passé : suffixes","he":"עבר","body":"\n          \u003cp>Au passé, tous les verbes prennent les \u003cstrong>mêmes suffixes\u003c/strong> de personne (le radical X varie selon le groupe) :\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Suffixe\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>אני\u003c/td>\u003ctd class=\"he-cell\">Xתי\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אתה\u003c/td>\u003ctd class=\"he-cell\">Xתָ\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>את\u003c/td>\u003ctd class=\"he-cell\">Xתְ\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>הוא\u003c/td>\u003ctd class=\"he-cell\">X\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>היא\u003c/td>\u003ctd class=\"he-cell\">Xה\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אנחנו\u003c/td>\u003ctd class=\"he-cell\">Xנו\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אתם\u003c/td>\u003ctd class=\"he-cell\">Xתֶּם\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אתן\u003c/td>\u003ctd class=\"he-cell\">Xתֶּן\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>הם / הן\u003c/td>\u003ctd class=\"he-cell\">Xוּ\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cp>Exemple avec \u003cspan class=\"he-inline\">להיות\u003c/span> (être) :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">הָיִיתִי\u003c/span> → j'étais\u003cbr>\n            \u003cspan class=\"he-inline\">הָיִיתָ\u003c/span> → tu étais (m.)\u003cbr>\n            \u003cspan class=\"he-inline\">הָיִית\u003c/span> → tu étais (f.)\u003cbr>\n            \u003cspan class=\"he-inline\">הָיָה\u003c/span> → il était\u003cbr>\n            \u003cspan class=\"he-inline\">הָיְתָה\u003c/span> → elle était\u003cbr>\n            \u003cspan class=\"he-inline\">הָיִינוּ\u003c/span> → nous étions\u003cbr>\n            \u003cspan class=\"he-inline\">הֱיִיתֶם\u003c/span> → vous étiez (m.)\u003cbr>\n            \u003cspan class=\"he-inline\">הֱיִיתֶן\u003c/span> → vous étiez (f.)\u003cbr>\n            \u003cspan class=\"he-inline\">הָיוּ\u003c/span> → ils / elles étaient\n          \u003c/div>\n        "},{"title":"Verbes ע\"ו / ע\"י (creux)","he":"גזרת ע\"ו","body":"\n          \u003cp>Ces verbes ont un infinitif en \u003cspan class=\"he-inline\">לX‑וX\u003c/span> ou \u003cspan class=\"he-inline\">לX‑יX\u003c/span>, et au présent une seule consonne radicale visible.\u003c/p>\n          \u003cul>\n            \u003cli>\u003cspan class=\"he-inline\">בָּא — לָבוֹא\u003c/span> → venir\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">גָּר — לָגוּר\u003c/span> → habiter\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">טָס — לָטוּס\u003c/span> → prendre l'avion\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">רָץ — לָרוּץ\u003c/span> → courir\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">קָם — לָקוּם\u003c/span> → se lever\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">נָח — לָנוּחַ\u003c/span> → se reposer\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">זָז — לָזוּז\u003c/span> → bouger\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">שָׁר — לָשִׁיר\u003c/span> → chanter\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">שָׂם — לָשִׂים\u003c/span> → mettre\u003c/li>\n          \u003c/ul>\n          \u003cp>Nom d'action : forme \u003cspan class=\"he-inline\">XיXה\u003c/span>, p.ex. \u003cspan class=\"he-inline\">שִׁירָה\u003c/span> (chant), \u003cspan class=\"he-inline\">רִיצָה\u003c/span> (course).\u003c/p>\n        "},{"title":"Verbe + infinitif (שם פועל)","he":"פעל + שם פועל","body":"\n          \u003cp>Certains verbes se construisent toujours avec un \u003cstrong>infinitif\u003c/strong> — comme en français.\u003c/p>\n          \u003cp>Les principaux : \u003cspan class=\"he-inline\">רוֹצֶה\u003c/span> (vouloir), \u003cspan class=\"he-inline\">יָכוֹל\u003c/span> (pouvoir), \u003cspan class=\"he-inline\">צָרִיךְ\u003c/span> (avoir besoin de / falloir), \u003cspan class=\"he-inline\">אוֹהֵב\u003c/span> (aimer), \u003cspan class=\"he-inline\">מַעֲדִיף\u003c/span> (préférer), \u003cspan class=\"he-inline\">יוֹדֵעַ\u003c/span> (savoir faire).\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֲנִי רוֹצָה לִלְמוֹד עִבְרִית\u003c/span> → Je veux apprendre l'hébreu.\u003cbr>\n            \u003cspan class=\"he-inline\">הוּא לֹא יָכוֹל לָבוֹא\u003c/span> → Il ne peut pas venir.\u003cbr>\n            \u003cspan class=\"he-inline\">אַתָּה צָרִיךְ לָנוּחַ\u003c/span> → Tu as besoin de te reposer.\n          \u003c/div>\n        "},{"title":"Savoir vs Connaître : לדעת / להכיר","he":"לדעת / להכיר","body":"\n          \u003cp>Deux verbes français, deux verbes hébreux — attention à ne pas les confondre !\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Usage\u003c/th>\u003cth>Verbe hébreu\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>Connaître \u003cstrong>une personne, un lieu, une chose\u003c/strong>\u003c/td>\u003ctd class=\"he-cell\">להכיר + את\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Savoir \u003cstrong>une information\u003c/strong>\u003c/td>\u003ctd class=\"he-cell\">לדעת + את\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Savoir \u003cstrong>faire\u003c/strong> (+ infinitif)\u003c/td>\u003ctd class=\"he-cell\">לדעת + שם פועל\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Savoir \u003cstrong>+ mot interrogatif\u003c/strong> (question indirecte)\u003c/td>\u003ctd class=\"he-cell\">לדעת + מילת שאלה\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cdiv class=\"example\">\n            ✅ \u003cspan class=\"he-inline\">אֲנִי מַכִּיר אֶת דָּוִד\u003c/span> → Je connais David.\u003cbr>\n            ✅ \u003cspan class=\"he-inline\">אֲנִי יוֹדֵעַ אֶת הַתְּשׁוּבָה\u003c/span> → Je sais la réponse.\u003cbr>\n            ✅ \u003cspan class=\"he-inline\">אֲנִי יוֹדֵעַ לִקְרוֹא\u003c/span> → Je sais lire.\u003cbr>\n            ✅ \u003cspan class=\"he-inline\">אַתָּה יוֹדֵעַ מָה הַשָּׁעָה?\u003c/span> → Tu sais quelle heure il est ?\u003cbr>\n            ❌ \u003cspan class=\"he-inline\">אֲנִי מַכִּיר לִקְרוֹא\u003c/span> → litt. « je connais lire » — incorrect.\n          \u003c/div>\n        "},{"title":"Passé simple vs passé habituel","he":"עבר רגיל לעומת עבר רגיל ומתמשך","body":"\n          \u003cp>Le français distingue parfois \u003cem>imparfait\u003c/em> (habitude, durée) et \u003cem>passé composé\u003c/em> (ponctuel). L'hébreu joue plutôt sur le \u003cstrong>contexte\u003c/strong>.\u003c/p>\n          \u003cp>\u003cstrong>Passé habituel\u003c/strong> (action qui se répétait) :\u003c/p>\n          \u003cdiv class=\"example\">\n            « Quand j'étais petit, tous les jours je mangeais chez ma grand-mère. »\u003cbr>\n            « Chaque année, Yarden allait en Grèce. »\u003cbr>\n            « Nous jouions au football tous les jours. »\n          \u003c/div>\n          \u003cp>\u003cstrong>Passé simple / ponctuel\u003c/strong> :\u003c/p>\n          \u003cdiv class=\"example\">\n            « Hier, j'ai mangé chez ma grand-mère. »\u003cbr>\n            « L'année dernière, Yarden est allé en Grèce. »\u003cbr>\n            « La semaine dernière, nous avons joué au football. »\n          \u003c/div>\n          \u003cp>En hébreu, les deux peuvent utiliser le \u003cstrong>même temps\u003c/strong> (passé conjugué) ; ce sont les \u003cem>compléments de temps\u003c/em> (« quand j'étais petit », « chaque année ») qui indiquent l'habitude.\u003c/p>\n        "},{"title":"Binyan Nif'al","he":"בניין נפעל","body":"\n          \u003cp>Le binyan \u003cstrong>Nif'al\u003c/strong> a souvent un sens passif ou réfléchi. Il se reconnaît au préfixe \u003cspan class=\"he-inline\">נ‑\u003c/span> au passé et au participe présent, et à l'infinitif en \u003cspan class=\"he-inline\">לְהִ‑\u003c/span>.\u003c/p>\n          \u003cp>À l'origine, il exprimait une action réflexive ; avec le temps, il a aussi pris la fonction de passif de Pa'al.\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">נִכְתַּב\u003c/span> → a été écrit\u003cbr>\n            \u003cspan class=\"he-inline\">נִשְׁבַּר\u003c/span> → a été cassé\u003cbr>\n            \u003cspan class=\"he-inline\">נִגְנַב\u003c/span> → a été volé\n          \u003c/div>\n          \u003cp>Quelques verbes utiles :\u003c/p>\n          \u003cul>\n            \u003cli>\u003cspan class=\"he-inline\">לְהִיכָּנֵס\u003c/span> → entrer\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְהִישָּׁאֵר\u003c/span> → rester\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְהִיפָּגֵשׁ\u003c/span> → se rencontrer\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְהִיזָּכֵר\u003c/span> → se souvenir\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְהִירָדֵם\u003c/span> → s'endormir\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְהִימָּצֵא\u003c/span> → se trouver, être situé\u003c/li>\n          \u003c/ul>\n        "},{"title":"Binyan Hif'il : la causation","he":"בניין הפעיל","body":"\n          \u003cp>Le binyan \u003cstrong>Hif'il\u003c/strong> exprime l'idée de \u003cstrong>causation\u003c/strong> : le sujet fait faire une action à quelqu'un d'autre, ou provoque un changement d'état.\u003c/p>\n          \u003cp>L'action ne se produit pas d'elle-même — elle résulte d'une intervention extérieure.\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">לְהוֹרִיד לַחַץ דָּם\u003c/span> → faire baisser la tension artérielle.\u003cbr>\n            \u003cspan class=\"he-inline\">לְהַזְמִין\u003c/span> → inviter / commander / réserver.\u003cbr>\n            \u003cspan class=\"he-inline\">לְהַגִּיעַ\u003c/span> → arriver (faire venir soi-même).\n          \u003c/div>\n        "},{"title":"Binyan Hitpa'el (présent & passé)","he":"בניין התפעל","body":"\n          \u003cp>Le binyan \u003cstrong>Hitpa'el\u003c/strong> est souvent réfléchi / réciproque. À l'infinitif il commence par \u003cspan class=\"he-inline\">לְהִתְ‑\u003c/span>, au présent par \u003cspan class=\"he-inline\">מִתְ‑\u003c/span>, au passé par \u003cspan class=\"he-inline\">הִתְ‑\u003c/span>.\u003c/p>\n          \u003cp>\u003cstrong>Conjugaison au passé\u003c/strong> (exemple : s'habiller, \u003cspan class=\"he-inline\">להתלבש\u003c/span>) :\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Forme\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>אני\u003c/td>\u003ctd class=\"he-cell\">הִתְלַבַּשְׁתִּי\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אתה\u003c/td>\u003ctd class=\"he-cell\">הִתְלַבַּשְׁתָּ\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>את\u003c/td>\u003ctd class=\"he-cell\">הִתְלַבַּשְׁתְּ\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>הוא\u003c/td>\u003ctd class=\"he-cell\">הִתְלַבֵּשׁ\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>היא\u003c/td>\u003ctd class=\"he-cell\">הִתְלַבְּשָׁה\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אנחנו\u003c/td>\u003ctd class=\"he-cell\">הִתְלַבַּשְׁנוּ\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אתם / אתן\u003c/td>\u003ctd class=\"he-cell\">הִתְלַבַּשְׁתֶּם / הִתְלַבַּשְׁתֶּן\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>הם / הן\u003c/td>\u003ctd class=\"he-cell\">הִתְלַבְּשׁוּ\u003c/td>\u003c/tr>\n          \u003c/table>\n        "},{"title":"Hitpa'el & consonnes sifflantes","he":"ס / שׁ / צ","body":"\n          \u003cp>Quand la racine d'un verbe Hitpa'el commence par une \u003cstrong>consonne sifflante\u003c/strong> (\u003cspan class=\"he-inline\">ס / שׁ / צ\u003c/span>), le \u003cspan class=\"he-inline\">ת\u003c/span> du préfixe \u003cstrong>change de place\u003c/strong> avec la première consonne :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">מִתְשַׁמֵּשׁ\u003c/span> → \u003cspan class=\"he-inline\">מִשְׁתַּמֵּשׁ\u003c/span> (mitshamesh → mishtamesh)\n          \u003c/div>\n          \u003cp>Pourquoi ? Essaie de dire « mitshamesh » à voix haute — c'est inconfortable. D'où l'inversion 😊\u003c/p>\n          \u003cp>Quelques verbes affectés :\u003c/p>\n          \u003cul>\n            \u003cli>\u003cspan class=\"he-inline\">לְהִשְׁתַּפֵּר\u003c/span> → s'améliorer\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְהִשְׁתַּתֵּף\u003c/span> → participer\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְהִסְתַּפֵּר\u003c/span> → se faire couper les cheveux\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְהִסְתַּכֵּל\u003c/span> → regarder\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְהִסְתַּדֵּר\u003c/span> → s'arranger / s'en sortir\u003c/li>\n          \u003c/ul>\n        "},{"title":"Le futur — généralités","he":"עתיד","body":"\n          \u003cp>Les verbes au futur se conjuguent en ajoutant des \u003cstrong>préfixes ET suffixes\u003c/strong> à la \u003cem>base du futur\u003c/em>. Ces affixes sont les mêmes pour tous les verbes (seule la base change selon le groupe).\u003c/p>\n          \u003cp>\u003cstrong>La base du futur\u003c/strong> se trouve à partir de l'infinitif : on supprime le \u003cspan class=\"he-inline\">לְ‑\u003c/span> (et parfois d'autres préfixes selon le binyan).\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">לִגְמוֹר\u003c/span> → base : \u003cspan class=\"he-inline\">גְּמוֹר\u003c/span>\u003cbr>\n            \u003cspan class=\"he-inline\">לִכְתּוֹב\u003c/span> → base : \u003cspan class=\"he-inline\">כְּתוֹב\u003c/span>\u003cbr>\n            \u003cspan class=\"he-inline\">לָגוּר\u003c/span> → base : \u003cspan class=\"he-inline\">גּוּר\u003c/span>\u003cbr>\n            \u003cspan class=\"he-inline\">לָבוֹא\u003c/span> → base : \u003cspan class=\"he-inline\">בוֹא\u003c/span>\n          \u003c/div>\n          \u003cp>\u003cstrong>Affixes du futur\u003c/strong> (la base est représentée par X) :\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Préfixe\u003c/th>\u003cth>Suffixe\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>אני\u003c/td>\u003ctd class=\"he-cell\">אֶ‑\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אתה\u003c/td>\u003ctd class=\"he-cell\">תִּ‑\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>את\u003c/td>\u003ctd class=\"he-cell\">תִּ‑\u003c/td>\u003ctd class=\"he-cell\">‑י\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>הוא\u003c/td>\u003ctd class=\"he-cell\">יִ‑\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>היא\u003c/td>\u003ctd class=\"he-cell\">תִּ‑\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אנחנו\u003c/td>\u003ctd class=\"he-cell\">נִ‑\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אתם / אתן\u003c/td>\u003ctd class=\"he-cell\">תִּ‑\u003c/td>\u003ctd class=\"he-cell\">‑וּ\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>הם / הן\u003c/td>\u003ctd class=\"he-cell\">יִ‑\u003c/td>\u003ctd class=\"he-cell\">‑וּ\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֶכְתּוֹב\u003c/span> → j'écrirai\u003cbr>\n            \u003cspan class=\"he-inline\">תִּכְתְּבִי\u003c/span> → tu écriras (f.)\u003cbr>\n            \u003cspan class=\"he-inline\">יִכְתְּבוּ\u003c/span> → ils/elles écriront\n          \u003c/div>\n        "},{"title":"Verbes creux au futur","he":"עתיד גזרת ע\"ו","body":"\n          \u003cp>Pour les verbes creux (ע\"ו / ע\"י) comme \u003cspan class=\"he-inline\">לָגוּר, לָבוֹא, לָקוּם, לָשִׁיר, לָשִׂים, לָרוּץ, לָנוּחַ, לָדוּן, לָמוּת, לָצוּם, לָשׁוּב\u003c/span>, la base au futur conserve la voyelle longue (וּ, וֹ ou ִי) :\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Infinitif\u003c/th>\u003cth>Base futur\u003c/th>\u003cth>הוא\u003c/th>\u003cth>אני\u003c/th>\u003cth>Sens\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לָגוּר\u003c/td>\u003ctd class=\"he-cell\">גּוּר\u003c/td>\u003ctd class=\"he-cell\">יָגוּר\u003c/td>\u003ctd class=\"he-cell\">אָגוּר\u003c/td>\u003ctd>habiter\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לָבוֹא\u003c/td>\u003ctd class=\"he-cell\">בוֹא\u003c/td>\u003ctd class=\"he-cell\">יָבוֹא\u003c/td>\u003ctd class=\"he-cell\">אָבוֹא\u003c/td>\u003ctd>venir\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לָקוּם\u003c/td>\u003ctd class=\"he-cell\">קוּם\u003c/td>\u003ctd class=\"he-cell\">יָקוּם\u003c/td>\u003ctd class=\"he-cell\">אָקוּם\u003c/td>\u003ctd>se lever\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לָשִׁיר\u003c/td>\u003ctd class=\"he-cell\">שִׁיר\u003c/td>\u003ctd class=\"he-cell\">יָשִׁיר\u003c/td>\u003ctd class=\"he-cell\">אָשִׁיר\u003c/td>\u003ctd>chanter\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לָשִׂים\u003c/td>\u003ctd class=\"he-cell\">שִׂים\u003c/td>\u003ctd class=\"he-cell\">יָשִׂים\u003c/td>\u003ctd class=\"he-cell\">אָשִׂים\u003c/td>\u003ctd>mettre\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לָנוּחַ\u003c/td>\u003ctd class=\"he-cell\">נוּחַ\u003c/td>\u003ctd class=\"he-cell\">יָנוּחַ\u003c/td>\u003ctd class=\"he-cell\">אָנוּחַ\u003c/td>\u003ctd>se reposer\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לָרִיב\u003c/td>\u003ctd class=\"he-cell\">רִיב\u003c/td>\u003ctd class=\"he-cell\">יָרִיב\u003c/td>\u003ctd class=\"he-cell\">אָרִיב\u003c/td>\u003ctd>se disputer\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cp>\u003cstrong>À noter\u003c/strong> : pour ces verbes, le préfixe a la voyelle « a » (qamatz), pas « i ».\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֲנִי אָגוּר בְּתֵל אָבִיב\u003c/span> → J'habiterai à Tel-Aviv.\u003cbr>\n            \u003cspan class=\"he-inline\">מָתַי תָּבוֹאִי?\u003c/span> → Quand viendras-tu (f.) ?\u003cbr>\n            \u003cspan class=\"he-inline\">הֵם יָשִׁירוּ בַּמְּסִיבָּה\u003c/span> → Ils chanteront à la fête.\n          \u003c/div>\n        "},{"title":"Futur du Pa'al — 1er groupe (אפעול)","he":"עתיד פעל — אפעול","body":"\n          \u003cp>Au binyan \u003cstrong>Pa'al\u003c/strong>, le futur a \u003cstrong>deux groupes\u003c/strong> : \u003cspan class=\"he-inline\">אֶפְעוֹל\u003c/span> et \u003cspan class=\"he-inline\">אֶפְעַל\u003c/span>. Le 1er groupe est le plus courant — il garde la voyelle \u003cstrong>וֹ\u003c/strong> dans la base.\u003c/p>\n          \u003cp>Conjugaison de \u003cspan class=\"he-inline\">לִכְתּוֹב\u003c/span> (écrire) — modèle du groupe אפעול :\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Forme\u003c/th>\u003cth>Sens\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>אני\u003c/td>\u003ctd class=\"he-cell\">אֶכְתּוֹב\u003c/td>\u003ctd>j'écrirai\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אתה\u003c/td>\u003ctd class=\"he-cell\">תִּכְתּוֹב\u003c/td>\u003ctd>tu écriras (m.)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>את\u003c/td>\u003ctd class=\"he-cell\">תִּכְתְּבִי\u003c/td>\u003ctd>tu écriras (f.)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>הוא\u003c/td>\u003ctd class=\"he-cell\">יִכְתּוֹב\u003c/td>\u003ctd>il écrira\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>היא\u003c/td>\u003ctd class=\"he-cell\">תִּכְתּוֹב\u003c/td>\u003ctd>elle écrira\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אנחנו\u003c/td>\u003ctd class=\"he-cell\">נִכְתּוֹב\u003c/td>\u003ctd>nous écrirons\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אתם / אתן\u003c/td>\u003ctd class=\"he-cell\">תִּכְתְּבוּ\u003c/td>\u003ctd>vous écrirez\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>הם / הן\u003c/td>\u003ctd class=\"he-cell\">יִכְתְּבוּ\u003c/td>\u003ctd>ils / elles écriront\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cp>\u003cstrong>⚠️ Règle importante\u003c/strong> : quand un \u003cstrong>suffixe\u003c/strong> est ajouté à la base (les formes \u003cspan class=\"he-inline\">את, אתם/אתן, הם/הן\u003c/span>), la voyelle \u003cstrong>וֹ disparaît\u003c/strong>. On garde seulement \u003cspan class=\"he-inline\">תִּכְתְּבִי, תִּכְתְּבוּ, יִכְתְּבוּ\u003c/span> au lieu de *תכתובי / *תכתובו / *יכתובו.\u003c/p>\n          \u003cp>\u003cstrong>Verbes typiques du groupe אפעול\u003c/strong> (futur en יִXְXוֹX) :\u003c/p>\n          \u003cul>\n            \u003cli>\u003cspan class=\"he-inline\">לִכְתּוֹב\u003c/span> → écrire (יִכְתּוֹב)\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לִסְגּוֹר\u003c/span> → fermer (יִסְגּוֹר)\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לִמְסוֹר\u003c/span> → transmettre / livrer (יִמְסוֹר)\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לִפְגּוֹשׁ\u003c/span> → rencontrer (יִפְגּוֹשׁ)\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לַעֲבוֹד\u003c/span> → travailler (יַעֲבוֹד)\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לִגְנוֹב\u003c/span> → voler (יִגְנוֹב)\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לִזְכּוֹר\u003c/span> → se souvenir (יִזְכּוֹר)\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לַחְסוֹךְ\u003c/span> → économiser (יַחְסוֹךְ)\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לִמְכּוֹר\u003c/span> → vendre (יִמְכּוֹר)\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לִשְׁמוֹר\u003c/span> → garder (יִשְׁמוֹר)\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לִבְדּוֹק\u003c/span> → vérifier (יִבְדּוֹק)\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֲנִי אֶכְתּוֹב לְךָ מָחָר\u003c/span> → Je t'écrirai demain.\u003cbr>\n            \u003cspan class=\"he-inline\">הִיא תִּסְגּוֹר אֶת הַחֲנוּת בְּשֵׁשׁ\u003c/span> → Elle fermera le magasin à six heures.\u003cbr>\n            \u003cspan class=\"he-inline\">הֵם יִזְכְּרוּ אוֹתָנוּ\u003c/span> → Ils se souviendront de nous.\u003cbr>\n            \u003cspan class=\"he-inline\">אַל תִּשְׁכַּח לִסְגּוֹר אֶת הַדֶּלֶת\u003c/span> → N'oublie pas de fermer la porte.\n          \u003c/div>\n        "},{"title":"Futur du Pa'al — 2e groupe (אפעל)","he":"עתיד פעל — אפעל","body":"\n          \u003cp>Le \u003cstrong>2e groupe\u003c/strong> du futur Pa'al — \u003cspan class=\"he-inline\">אֶפְעַל\u003c/span> — n'a \u003cstrong>pas de וֹ\u003c/strong> dans la base. La voyelle est un « a » (patah).\u003c/p>\n          \u003cp>Ce groupe concerne deux types de verbes :\u003c/p>\n          \u003col style=\"margin-left:22px;\">\n            \u003cli>Les verbes dont la \u003cstrong>2e ou 3e radicale est une gutturale\u003c/strong> (\u003cspan class=\"he-inline\">א / ה / ח / ע\u003c/span>)\u003c/li>\n            \u003cli>Certains verbes \u003cstrong>sans gutturale\u003c/strong> qu'il faut apprendre par cœur\u003c/li>\n          \u003c/ol>\n\n          \u003cp>\u003cstrong>① Avec gutturale :\u003c/strong>\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Infinitif\u003c/th>\u003cth>Sens\u003c/th>\u003cth>הוא\u003c/th>\u003cth>אני\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לִשְׁמוֹעַ\u003c/td>\u003ctd>entendre\u003c/td>\u003ctd class=\"he-cell\">יִשְׁמַע\u003c/td>\u003ctd class=\"he-cell\">אֶשְׁמַע\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לִנְהוֹג\u003c/td>\u003ctd>conduire\u003c/td>\u003ctd class=\"he-cell\">יִנְהַג\u003c/td>\u003ctd class=\"he-cell\">אֶנְהַג\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לִפְתּוֹחַ\u003c/td>\u003ctd>ouvrir\u003c/td>\u003ctd class=\"he-cell\">יִפְתַּח\u003c/td>\u003ctd class=\"he-cell\">אֶפְתַּח\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לִקְרוֹא\u003c/td>\u003ctd>lire / appeler\u003c/td>\u003ctd class=\"he-cell\">יִקְרָא\u003c/td>\u003ctd class=\"he-cell\">אֶקְרָא\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לִשְׁכּוֹחַ\u003c/td>\u003ctd>oublier\u003c/td>\u003ctd class=\"he-cell\">יִשְׁכַּח\u003c/td>\u003ctd class=\"he-cell\">אֶשְׁכַּח\u003c/td>\u003c/tr>\n          \u003c/table>\n\n          \u003cp>\u003cstrong>② Sans gutturale\u003c/strong> (à apprendre par cœur) :\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Infinitif\u003c/th>\u003cth>Sens\u003c/th>\u003cth>הוא\u003c/th>\u003cth>אני\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לִלְבּוֹשׁ\u003c/td>\u003ctd>porter (vêtement)\u003c/td>\u003ctd class=\"he-cell\">יִלְבַּשׁ\u003c/td>\u003ctd class=\"he-cell\">אֶלְבַּשׁ\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לִלְמוֹד\u003c/td>\u003ctd>apprendre\u003c/td>\u003ctd class=\"he-cell\">יִלְמַד\u003c/td>\u003ctd class=\"he-cell\">אֶלְמַד\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לִגְדּוֹל\u003c/td>\u003ctd>grandir\u003c/td>\u003ctd class=\"he-cell\">יִגְדַּל\u003c/td>\u003ctd class=\"he-cell\">אֶגְדַּל\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לִשְׁכַּב\u003c/td>\u003ctd>se coucher\u003c/td>\u003ctd class=\"he-cell\">יִשְׁכַּב\u003c/td>\u003ctd class=\"he-cell\">אֶשְׁכַּב\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לִרְכּוֹב\u003c/td>\u003ctd>monter (vélo / cheval)\u003c/td>\u003ctd class=\"he-cell\">יִרְכַּב\u003c/td>\u003ctd class=\"he-cell\">אֶרְכַּב\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לִפְחוֹד\u003c/td>\u003ctd>avoir peur\u003c/td>\u003ctd class=\"he-cell\">יִפְחַד\u003c/td>\u003ctd class=\"he-cell\">אֶפְחַד\u003c/td>\u003c/tr>\n          \u003c/table>\n\n          \u003cp>Conjugaison complète de \u003cspan class=\"he-inline\">לִשְׁמוֹעַ\u003c/span> (entendre) — modèle du groupe אפעל :\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Forme\u003c/th>\u003cth>Sens\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>אני\u003c/td>\u003ctd class=\"he-cell\">אֶשְׁמַע\u003c/td>\u003ctd>j'entendrai\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אתה\u003c/td>\u003ctd class=\"he-cell\">תִּשְׁמַע\u003c/td>\u003ctd>tu entendras (m.)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>את\u003c/td>\u003ctd class=\"he-cell\">תִּשְׁמְעִי\u003c/td>\u003ctd>tu entendras (f.)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>הוא\u003c/td>\u003ctd class=\"he-cell\">יִשְׁמַע\u003c/td>\u003ctd>il entendra\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>היא\u003c/td>\u003ctd class=\"he-cell\">תִּשְׁמַע\u003c/td>\u003ctd>elle entendra\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אנחנו\u003c/td>\u003ctd class=\"he-cell\">נִשְׁמַע\u003c/td>\u003ctd>nous entendrons\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אתם / אתן\u003c/td>\u003ctd class=\"he-cell\">תִּשְׁמְעוּ\u003c/td>\u003ctd>vous entendrez\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>הם / הן\u003c/td>\u003ctd class=\"he-cell\">יִשְׁמְעוּ\u003c/td>\u003ctd>ils / elles entendront\u003c/td>\u003c/tr>\n          \u003c/table>\n\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֶשְׁמַע מוּזִיקָה בָּעֶרֶב\u003c/span> → J'écouterai de la musique ce soir.\u003cbr>\n            \u003cspan class=\"he-inline\">הַיֶּלֶד יִגְדַּל מַהֵר\u003c/span> → L'enfant grandira vite.\u003cbr>\n            \u003cspan class=\"he-inline\">מָה תִּלְבְּשִׁי לַחֲתֻנָּה?\u003c/span> → Qu'est-ce que tu porteras au mariage ?\u003cbr>\n            \u003cspan class=\"he-inline\">אַל תִּפְחֲדוּ!\u003c/span> → N'ayez pas peur !\n          \u003c/div>\n\n          \u003cp>\u003cstrong>Astuce mémoire\u003c/strong> : si le verbe a une gutturale (א / ה / ח / ע) en 2e ou 3e position, c'est presque toujours אפעל. Sinon, il faut vérifier — la majorité des verbes restent dans אפעול.\u003c/p>\n        "},{"title":"Emploi du futur","he":"שימוש בעתיד","body":"\n          \u003cp>Le futur hébreu sert dans \u003cstrong>trois cas principaux\u003c/strong> :\u003c/p>\n          \u003cp>\u003cstrong>① Action future\u003c/strong> — comme en français.\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">מָחָר אֲנִי אֵלֵךְ לְבֵית הַסֵּפֶר\u003c/span> → Demain j'irai à l'école.\n          \u003c/div>\n          \u003cp>\u003cstrong>② Équivalent du subjonctif français\u003c/strong> — après \u003cspan class=\"he-inline\">שֶׁ‑\u003c/span> (que), \u003cspan class=\"he-inline\">רוֹצֶה שֶׁ\u003c/span> (vouloir que), etc.\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֲנִי רוֹצָה שֶׁתָּבוֹא\u003c/span> → Je veux que tu viennes.\u003cbr>\n            \u003cspan class=\"he-inline\">חָשׁוּב שֶׁתִּלְמְדִי\u003c/span> → Il est important que tu étudies.\u003cbr>\n            \u003cspan class=\"he-inline\">הוּא מְבַקֵּשׁ שֶׁנִּשְׁתּוֹק\u003c/span> → Il demande que nous nous taisions.\n          \u003c/div>\n          \u003cp>\u003cstrong>③ Impératif négatif\u003c/strong> — avec \u003cspan class=\"he-inline\">אַל\u003c/span> (« ne… pas » à l'impératif) + futur 2e personne.\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אַל תָּבוֹא!\u003c/span> → Ne viens pas !\u003cbr>\n            \u003cspan class=\"he-inline\">אַל תְּדַבֵּר!\u003c/span> → Ne parle pas !\u003cbr>\n            \u003cspan class=\"he-inline\">אַל תֵּלְכִי לְבַד\u003c/span> → Ne va pas seule.\n          \u003c/div>\n          \u003cp>\u003cstrong>+ Bonus\u003c/strong> : en hébreu parlé, on utilise souvent le futur 2e personne \u003cem>à la place\u003c/em> de l'impératif (plus poli) :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">תִּתְקַלֵּחַ!\u003c/span> → Douche-toi ! (au lieu de \u003cspan class=\"he-inline\">הִתְקַלֵּחַ\u003c/span>)\u003cbr>\n            \u003cspan class=\"he-inline\">תִּיכָּנֵס!\u003c/span> → Entre !\u003cbr>\n            \u003cspan class=\"he-inline\">תֹּאכְלִי!\u003c/span> → Mange (f.) !\n          \u003c/div>\n        "},{"title":"Impératif (ציווי)","he":"ציווי","body":"\n          \u003cp>L'impératif n'existe qu'aux \u003cstrong>2es personnes\u003c/strong> : \u003cspan class=\"he-inline\">אתה / את / אתם / אתן\u003c/span>.\u003c/p>\n          \u003cp>Il se forme à partir du \u003cstrong>futur, en enlevant le préfixe\u003c/strong> \u003cspan class=\"he-inline\">תּ‑\u003c/span>.\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Futur (אתה)\u003c/th>\u003cth>→ Impératif\u003c/th>\u003cth>Sens\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">תָּקוּם\u003c/td>\u003ctd class=\"he-cell\">קוּם!\u003c/td>\u003ctd>Lève-toi !\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">תָּקוּמִי\u003c/td>\u003ctd class=\"he-cell\">קוּמִי!\u003c/td>\u003ctd>Lève-toi (f.) !\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">תָּקוּמוּ\u003c/td>\u003ctd class=\"he-cell\">קוּמוּ!\u003c/td>\u003ctd>Levez-vous !\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">תָּבוֹא\u003c/td>\u003ctd class=\"he-cell\">בּוֹא!\u003c/td>\u003ctd>Viens !\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">תָּשִׂים\u003c/td>\u003ctd class=\"he-cell\">שִׂים!\u003c/td>\u003ctd>Mets !\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cp>Récap des formes selon la voyelle du futur :\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Voyelle\u003c/th>\u003cth>אתה\u003c/th>\u003cth>את\u003c/th>\u003cth>אתם/אתן\u003c/th>\u003cth>Sens\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>OU (וּ)\u003c/td>\u003ctd class=\"he-cell\">קוּם\u003c/td>\u003ctd class=\"he-cell\">קוּמִי\u003c/td>\u003ctd class=\"he-cell\">קוּמוּ\u003c/td>\u003ctd>lève-toi !\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>O (וֹ)\u003c/td>\u003ctd class=\"he-cell\">בּוֹא\u003c/td>\u003ctd class=\"he-cell\">בּוֹאִי\u003c/td>\u003ctd class=\"he-cell\">בּוֹאוּ\u003c/td>\u003ctd>viens !\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>I (יִ)\u003c/td>\u003ctd class=\"he-cell\">שִׂים\u003c/td>\u003ctd class=\"he-cell\">שִׂימִי\u003c/td>\u003ctd class=\"he-cell\">שִׂימוּ\u003c/td>\u003ctd>mets !\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cp>L'impératif est \u003cstrong>plus direct\u003c/strong> en hébreu moderne ; pour une demande polie, on préfère souvent le futur 2e personne ou \u003cspan class=\"he-inline\">בְּבַקָּשָׁה\u003c/span> + infinitif.\u003c/p>\n        "},{"title":"Impératif négatif (אל)","he":"ציווי בשלילה","body":"\n          \u003cp>Pour dire « \u003cstrong>ne… pas\u003c/strong> » à l'impératif, on n'utilise \u003cstrong>pas\u003c/strong> \u003cspan class=\"he-inline\">לֹא\u003c/span> mais \u003cspan class=\"he-inline\">אַל\u003c/span>, suivi du \u003cstrong>futur à la 2e personne\u003c/strong>.\u003c/p>\n          \u003cp>Structure : \u003cspan class=\"he-inline\">אַל\u003c/span> + verbe au futur (אתה / את / אתם / אתן)\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>אתה\u003c/th>\u003cth>את\u003c/th>\u003cth>אתם / אתן\u003c/th>\u003cth>Sens\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">אַל תָּקוּם!\u003c/td>\u003ctd class=\"he-cell\">אַל תָּקוּמִי!\u003c/td>\u003ctd class=\"he-cell\">אַל תָּקוּמוּ!\u003c/td>\u003ctd>Ne te lève pas !\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">אַל תָּבוֹא!\u003c/td>\u003ctd class=\"he-cell\">אַל תָּבוֹאִי!\u003c/td>\u003ctd class=\"he-cell\">אַל תָּבוֹאוּ!\u003c/td>\u003ctd>Ne viens pas !\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">אַל תָּשִׂים!\u003c/td>\u003ctd class=\"he-cell\">אַל תָּשִׂימִי!\u003c/td>\u003ctd class=\"he-cell\">אַל תָּשִׂימוּ!\u003c/td>\u003ctd>Ne mets pas !\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">אַל תְּדַבֵּר!\u003c/td>\u003ctd class=\"he-cell\">אַל תְּדַבְּרִי!\u003c/td>\u003ctd class=\"he-cell\">אַל תְּדַבְּרוּ!\u003c/td>\u003ctd>Ne parle pas !\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אַל תֵּלְכִי לְבַד\u003c/span> → Ne va pas seule.\u003cbr>\n            \u003cspan class=\"he-inline\">אַל תִּשְׁכַּח אֶת הַמַּפְתְּחוֹת!\u003c/span> → N'oublie pas les clés !\u003cbr>\n            \u003cspan class=\"he-inline\">אַל תָּרוּצוּ בַּכִּתָּה!\u003c/span> → Ne courez pas dans la classe !\n          \u003c/div>\n          \u003cp>\u003cstrong>Important\u003c/strong> : on n'utilise jamais \u003cspan class=\"he-inline\">לֹא\u003c/span> avec l'impératif. \u003cspan class=\"he-inline\">לֹא תָּבוֹא\u003c/span> serait incorrect au sens impératif (cela voudrait dire « tu ne viendras pas » au sens descriptif).\u003c/p>\n          \u003cp>\u003cstrong>Astuce mémoire\u003c/strong> : \u003cspan class=\"he-inline\">אַל\u003c/span> = interdiction directe ; \u003cspan class=\"he-inline\">לֹא\u003c/span> = négation factuelle.\u003c/p>\n        "},{"title":"Participe passif (בינוני פעול)","he":"בינוני פעול","body":"\n          \u003cp>Le \u003cstrong>בינוני פעול\u003c/strong> (participe passif) est une \u003cstrong>forme adjectivale dérivée du verbe\u003c/strong>. Il décrit un état résultant d'une action — souvent traduisible par un participe passé français (« écrit », « cassé », « fermé »).\u003c/p>\n          \u003cp>Forme de base au binyan Pa'al : \u003cspan class=\"he-inline\">XָXוּX\u003c/span>. Il s'accorde en genre et en nombre comme un adjectif normal :\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>m. sg.\u003c/th>\u003cth>f. sg.\u003c/th>\u003cth>m. pl.\u003c/th>\u003cth>f. pl.\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">כָּתוּב\u003c/td>\u003ctd class=\"he-cell\">כְּתוּבָה\u003c/td>\u003ctd class=\"he-cell\">כְּתוּבִים\u003c/td>\u003ctd class=\"he-cell\">כְּתוּבוֹת\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">שָׁבוּר\u003c/td>\u003ctd class=\"he-cell\">שְׁבוּרָה\u003c/td>\u003ctd class=\"he-cell\">שְׁבוּרִים\u003c/td>\u003ctd class=\"he-cell\">שְׁבוּרוֹת\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">סָגוּר\u003c/td>\u003ctd class=\"he-cell\">סְגוּרָה\u003c/td>\u003ctd class=\"he-cell\">סְגוּרִים\u003c/td>\u003ctd class=\"he-cell\">סְגוּרוֹת\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">פָּתוּחַ\u003c/td>\u003ctd class=\"he-cell\">פְּתוּחָה\u003c/td>\u003ctd class=\"he-cell\">פְּתוּחִים\u003c/td>\u003ctd class=\"he-cell\">פְּתוּחוֹת\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cp>Le sens du participe passif correspond généralement à celui du verbe :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">כּוֹתֵב\u003c/span> (écrit, verbe) → \u003cspan class=\"he-inline\">כָּתוּב\u003c/span> (écrit, état)\u003cbr>\n            \u003cspan class=\"he-inline\">שׁוֹבֵר\u003c/span> (casse) → \u003cspan class=\"he-inline\">שָׁבוּר\u003c/span> (cassé)\u003cbr>\n            \u003cspan class=\"he-inline\">סוֹגֵר\u003c/span> (ferme) → \u003cspan class=\"he-inline\">סָגוּר\u003c/span> (fermé)\n          \u003c/div>\n          \u003cp>\u003cstrong>Attention\u003c/strong> : pour certains participes, le sens s'est \u003cstrong>éloigné\u003c/strong> du verbe d'origine et il faut les apprendre comme des adjectifs à part entière :\u003c/p>\n          \u003cul>\n            \u003cli>\u003cspan class=\"he-inline\">חָשׁוּב\u003c/span> → important (pas seulement « pensé »)\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">עָסוּק\u003c/span> → occupé\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">בָּרוּר\u003c/span> → clair, évident\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">בָּטוּחַ\u003c/span> → sûr, certain\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">קָשׁוּר\u003c/span> → lié\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">הַחַלּוֹן שָׁבוּר\u003c/span> → La fenêtre est cassée.\u003cbr>\n            \u003cspan class=\"he-inline\">הַחֲנוּת סְגוּרָה הַיּוֹם\u003c/span> → Le magasin est fermé aujourd'hui.\u003cbr>\n            \u003cspan class=\"he-inline\">אֲנִי עָסוּקָה כָּל הַשָּׁבוּעַ\u003c/span> → Je suis occupée toute la semaine.\u003cbr>\n            \u003cspan class=\"he-inline\">זֶה חָשׁוּב לִי\u003c/span> → C'est important pour moi.\n          \u003c/div>\n        "},{"title":"נמצא — se trouver / être situé","he":"נמצא","body":"\n          \u003cp>Le verbe \u003cspan class=\"he-inline\">נִמְצָא\u003c/span> (binyan Nif'al) sert à \u003cstrong>localiser\u003c/strong> quelque chose ou quelqu'un dans l'espace.\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Genre / nombre\u003c/th>\u003cth>Forme\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>m. sg.\u003c/td>\u003ctd class=\"he-cell\">נִמְצָא\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>f. sg.\u003c/td>\u003ctd class=\"he-cell\">נִמְצֵאת\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>m. pl.\u003c/td>\u003ctd class=\"he-cell\">נִמְצָאִים\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>f. pl.\u003c/td>\u003ctd class=\"he-cell\">נִמְצָאוֹת\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֵיפֹה נִמְצֵאת הָעִיר צְפַת?\u003c/span> → Où se trouve la ville de Tsfat ?\u003cbr>\n            \u003cspan class=\"he-inline\">הָעִיר אֵילַת נִמְצֵאת בַּדָּרוֹם\u003c/span> → La ville d'Eilat se trouve dans le sud.\u003cbr>\n            \u003cspan class=\"he-inline\">רְחוֹב בֶּן יְהוּדָה נִמְצָא בְּתֵל אָבִיב\u003c/span> → La rue Ben Yehuda se trouve à Tel-Aviv.\u003cbr>\n            \u003cspan class=\"he-inline\">הַסְּפָרִים נִמְצָאִים עַל הַשֻּׁלְחָן\u003c/span> → Les livres se trouvent sur la table.\n          \u003c/div>\n          \u003cp>\u003cstrong>Différence avec יש\u003c/strong> : \u003cspan class=\"he-inline\">יֵשׁ\u003c/span> = « il y a » (existence), \u003cspan class=\"he-inline\">נִמְצָא\u003c/span> = « se trouve à » (localisation précise).\u003c/p>\n        "}]},{"name":"Comparaison & quantité","items":[{"title":"Comparatif & superlatif","he":"יותר / הכי","body":"\n          \u003cp>\u003cstrong>Comparatif\u003c/strong> : \u003cspan class=\"he-inline\">יוֹתֵר\u003c/span> (plus) / \u003cspan class=\"he-inline\">פָּחוֹת\u003c/span> (moins).\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">הוּא יוֹתֵר גָּבוֹהַּ מִמֶּנִּי\u003c/span> → Il est plus grand que moi.\u003cbr>\n            \u003cspan class=\"he-inline\">זֶה פָּחוֹת יָקָר\u003c/span> → C'est moins cher.\n          \u003c/div>\n          \u003cp>\u003cstrong>Superlatif\u003c/strong> : \u003cspan class=\"he-inline\">הֲכִי\u003c/span> + adjectif = « le plus… ». Très courant en hébreu parlé.\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">הוּא הֲכִי חָכָם בַּכִּתָּה\u003c/span> → Il est le plus intelligent de la classe.\u003cbr>\n            \u003cspan class=\"he-inline\">זֹאת הַמִּסְעָדָה הֲכִי יְקָרָה בָּעִיר\u003c/span> → C'est le restaurant le plus cher de la ville.\n          \u003c/div>\n        "},{"title":"כזה / כזאת / כאלה — comme celui-ci","he":"כזה / כזאת / כאלה","body":"\n          \u003cp>Ces 3 mots remplacent la construction \u003cspan class=\"he-inline\">כְּמוֹ\u003c/span> + démonstratif. Ils signifient « \u003cstrong>comme celui-ci / comme ça\u003c/strong> » et s'accordent en genre et en nombre.\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Forme\u003c/th>\u003cth>Équivaut à\u003c/th>\u003cth>Sens\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">כָּזֶה\u003c/td>\u003ctd class=\"he-cell\">כְּמוֹ זֶה\u003c/td>\u003ctd>comme celui-ci / comme ça (m.sg)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">כָּזֹאת\u003c/td>\u003ctd class=\"he-cell\">כְּמוֹ זֹאת\u003c/td>\u003ctd>comme celle-ci / comme ça (f.sg)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">כָּאֵלֶּה\u003c/td>\u003ctd class=\"he-cell\">כְּמוֹ אֵלֶּה\u003c/td>\u003ctd>comme ceux-ci / celles-ci (pl.)\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cp>L'accord se fait avec le \u003cstrong>nom auquel se rapporte la comparaison\u003c/strong> :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">לֹא רָאִיתִי סֵפֶר כָּזֶה מֵעוֹלָם\u003c/span> → Je n'ai jamais vu un livre comme ça. (\u003cspan class=\"he-inline\">ספר\u003c/span> est m.sg → כזה)\u003cbr>\n            \u003cspan class=\"he-inline\">אֲנִי רוֹצָה שִׂמְלָה כָּזֹאת\u003c/span> → Je veux une robe comme celle-ci. (\u003cspan class=\"he-inline\">שמלה\u003c/span> est f.sg → כזאת)\u003cbr>\n            \u003cspan class=\"he-inline\">יֵשׁ לִי חֲבֵרִים כָּאֵלֶּה\u003c/span> → J'ai des amis comme ça. (\u003cspan class=\"he-inline\">חברים\u003c/span> est pl. → כאלה)\u003cbr>\n            \u003cspan class=\"he-inline\">לָמָּה אַתָּה אוֹמֵר דְּבָרִים כָּאֵלֶּה?\u003c/span> → Pourquoi tu dis des choses pareilles ?\n          \u003c/div>\n          \u003cp>\u003cstrong>Astuce\u003c/strong> : la forme est plus courte et plus naturelle à l'oral que \u003cspan class=\"he-inline\">כְּמוֹ\u003c/span> + démonstratif, mais les deux sont corrects.\u003c/p>\n        "},{"title":"Les chiffres et l'accord","he":"מספרים","body":"\n          \u003cp>En hébreu, les chiffres s'accordent en genre avec le nom qu'ils comptent.\u003c/p>\n          \u003cp>\u003cstrong>« Un »\u003c/strong> se place \u003cstrong>après\u003c/strong> le nom ; les autres chiffres se placent \u003cstrong>avant\u003c/strong>.\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Nombre\u003c/th>\u003cth>Masculin\u003c/th>\u003cth>Féminin\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>1\u003c/td>\u003ctd class=\"he-cell\">אֶחָד\u003c/td>\u003ctd class=\"he-cell\">אַחַת\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>2\u003c/td>\u003ctd class=\"he-cell\">שְׁנַיִם / שְׁנֵי\u003c/td>\u003ctd class=\"he-cell\">שְׁתַּיִם / שְׁתֵּי\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>3\u003c/td>\u003ctd class=\"he-cell\">שְׁלוֹשָׁה\u003c/td>\u003ctd class=\"he-cell\">שָׁלוֹשׁ\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>4\u003c/td>\u003ctd class=\"he-cell\">אַרְבָּעָה\u003c/td>\u003ctd class=\"he-cell\">אַרְבַּע\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>5\u003c/td>\u003ctd class=\"he-cell\">חֲמִשָּׁה\u003c/td>\u003ctd class=\"he-cell\">חָמֵשׁ\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>6\u003c/td>\u003ctd class=\"he-cell\">שִׁשָּׁה\u003c/td>\u003ctd class=\"he-cell\">שֵׁשׁ\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>7\u003c/td>\u003ctd class=\"he-cell\">שִׁבְעָה\u003c/td>\u003ctd class=\"he-cell\">שֶׁבַע\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>8\u003c/td>\u003ctd class=\"he-cell\">שְׁמוֹנָה\u003c/td>\u003ctd class=\"he-cell\">שְׁמוֹנֶה\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>9\u003c/td>\u003ctd class=\"he-cell\">תִּשְׁעָה\u003c/td>\u003ctd class=\"he-cell\">תֵּשַׁע\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>10\u003c/td>\u003ctd class=\"he-cell\">עֲשָׂרָה\u003c/td>\u003ctd class=\"he-cell\">עֶשֶׂר\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">בַּיִת אֶחָד\u003c/span> → une maison (m.)\u003cbr>\n            \u003cspan class=\"he-inline\">שָׁלוֹשׁ תְּמוּנוֹת\u003c/span> → trois tableaux (f.)\u003cbr>\n            \u003cspan class=\"he-inline\">חֲמִשָּׁה שִׁירִים\u003c/span> → cinq chansons (m.)\n          \u003c/div>\n          \u003cp>\u003cstrong>Particularité\u003c/strong> : \u003cspan class=\"he-inline\">שְׁתַּיִם\u003c/span> devient \u003cspan class=\"he-inline\">שְׁתֵּי\u003c/span> quand suivi d'un nom (état construit).\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">שְׁתֵּי שְׂמָלוֹת\u003c/span> → deux robes\n          \u003c/div>\n        "},{"title":"Les nombres jusqu'au million","he":"מספרים עד מיליון","body":"\n          \u003cp>\u003cstrong>Masculin ou féminin&nbsp;?\u003c/strong>\u003c/p>\n          \u003cul>\n            \u003cli>\u003cstrong>Féminin\u003c/strong>&nbsp;: quand on compte, pour l'âge, au téléphone, pour l'heure et l'année, et avec un nom féminin — \u003cspan class=\"he-inline\">שָׁלוֹשׁ בָּנוֹת\u003c/span>.\u003c/li>\n            \u003cli>\u003cstrong>Masculin\u003c/strong>&nbsp;: seulement avec un nom masculin — \u003cspan class=\"he-inline\">שְׁלוֹשָׁה שְׁקָלִים\u003c/span>. Au masculin, le nombre se termine en \u003cspan class=\"he-inline\">ה‑\u003c/span>&nbsp;: l'inverse des noms&nbsp;!\u003c/li>\n          \u003c/ul>\n          \u003cp>\u003cstrong>Les dizaines\u003c/strong> n'ont qu'une forme pour les deux genres&nbsp;; seule l'unité s'accorde.\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>20\u003c/th>\u003cth>30\u003c/th>\u003cth>40\u003c/th>\u003cth>50\u003c/th>\u003cth>60\u003c/th>\u003cth>70\u003c/th>\u003cth>80\u003c/th>\u003cth>90\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">עֶשְׂרִים\u003c/td>\u003ctd class=\"he-cell\">שְׁלוֹשִׁים\u003c/td>\u003ctd class=\"he-cell\">אַרְבָּעִים\u003c/td>\u003ctd class=\"he-cell\">חֲמִשִּׁים\u003c/td>\u003ctd class=\"he-cell\">שִׁשִּׁים\u003c/td>\u003ctd class=\"he-cell\">שִׁבְעִים\u003c/td>\u003ctd class=\"he-cell\">שְׁמוֹנִים\u003c/td>\u003ctd class=\"he-cell\">תִּשְׁעִים\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cdiv class=\"example\">\n            25, féminin → \u003cspan class=\"he-inline\">עֶשְׂרִים וְחָמֵשׁ\u003c/span>\u003cbr>\n            25, masculin → \u003cspan class=\"he-inline\">עֶשְׂרִים וַחֲמִשָּׁה\u003c/span>\n          \u003c/div>\n          \u003cp>\u003cstrong>Les centaines\u003c/strong>&nbsp;: \u003cspan class=\"he-inline\">מֵאָה\u003c/span> est \u003cstrong>féminin\u003c/strong>, on compte donc au féminin.\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Nombre\u003c/th>\u003cth>Hébreu\u003c/th>\u003cth>Nombre\u003c/th>\u003cth>Hébreu\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>100\u003c/td>\u003ctd class=\"he-cell\">מֵאָה\u003c/td>\u003ctd>600\u003c/td>\u003ctd class=\"he-cell\">שֵׁשׁ מֵאוֹת\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>200\u003c/td>\u003ctd class=\"he-cell\">מָאתַיִם\u003c/td>\u003ctd>700\u003c/td>\u003ctd class=\"he-cell\">שְׁבַע מֵאוֹת\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>300\u003c/td>\u003ctd class=\"he-cell\">שְׁלוֹשׁ מֵאוֹת\u003c/td>\u003ctd>800\u003c/td>\u003ctd class=\"he-cell\">שְׁמוֹנֶה מֵאוֹת\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>400\u003c/td>\u003ctd class=\"he-cell\">אַרְבַּע מֵאוֹת\u003c/td>\u003ctd>900\u003c/td>\u003ctd class=\"he-cell\">תְּשַׁע מֵאוֹת\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>500\u003c/td>\u003ctd class=\"he-cell\">חֲמֵשׁ מֵאוֹת\u003c/td>\u003ctd>1000\u003c/td>\u003ctd class=\"he-cell\">אֶלֶף\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cp>\u003cstrong>Les milliers\u003c/strong>&nbsp;: \u003cspan class=\"he-inline\">אֶלֶף\u003c/span> est \u003cstrong>masculin\u003c/strong>, on prend la forme construite du masculin.\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Nombre\u003c/th>\u003cth>Hébreu\u003c/th>\u003cth>Nombre\u003c/th>\u003cth>Hébreu\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>1000\u003c/td>\u003ctd class=\"he-cell\">אֶלֶף\u003c/td>\u003ctd>6000\u003c/td>\u003ctd class=\"he-cell\">שֵׁשֶׁת אֲלָפִים\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>2000\u003c/td>\u003ctd class=\"he-cell\">אַלְפַּיִם\u003c/td>\u003ctd>7000\u003c/td>\u003ctd class=\"he-cell\">שִׁבְעַת אֲלָפִים\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>3000\u003c/td>\u003ctd class=\"he-cell\">שְׁלוֹשֶׁת אֲלָפִים\u003c/td>\u003ctd>8000\u003c/td>\u003ctd class=\"he-cell\">שְׁמוֹנַת אֲלָפִים\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>4000\u003c/td>\u003ctd class=\"he-cell\">אַרְבַּעַת אֲלָפִים\u003c/td>\u003ctd>9000\u003c/td>\u003ctd class=\"he-cell\">תִּשְׁעַת אֲלָפִים\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>5000\u003c/td>\u003ctd class=\"he-cell\">חֲמֵשֶׁת אֲלָפִים\u003c/td>\u003ctd>10&nbsp;000\u003c/td>\u003ctd class=\"he-cell\">עֲשֶׂרֶת אֲלָפִים\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cp>\u003cstrong>Jusqu'au million\u003c/strong>\u003c/p>\n          \u003cdiv class=\"example\">\n            11&nbsp;000 → \u003cspan class=\"he-inline\">אַחַד עָשָׂר אֶלֶף\u003c/span>\u003cbr>\n            100&nbsp;000 → \u003cspan class=\"he-inline\">מֵאָה אֶלֶף\u003c/span>\u003cbr>\n            1&nbsp;000&nbsp;000 → \u003cspan class=\"he-inline\">מִילְיוֹן\u003c/span>\u003cbr>\n            1985 (année) → \u003cspan class=\"he-inline\">אֶלֶף תְּשַׁע מֵאוֹת שְׁמוֹנִים וְחָמֵשׁ\u003c/span>\u003cbr>\n            2026 (année) → \u003cspan class=\"he-inline\">אַלְפַּיִם עֶשְׂרִים וְשֵׁשׁ\u003c/span>\u003cbr>\n            125 ₪ → \u003cspan class=\"he-inline\">מֵאָה עֶשְׂרִים וַחֲמִשָּׁה שְׁקָלִים\u003c/span> · à l'oral&nbsp;: \u003cspan class=\"he-inline\">מֵאָה עֶשְׂרִים וְחָמֵשׁ שֶׁקֶל\u003c/span>\n          \u003c/div>\n        "},{"title":"Nombres ordinaux","he":"מספרים סודרים","body":"\n          \u003cp>Les ordinaux ont des formes au masculin et au féminin, et s'accordent comme un adjectif (avec le ה défini si besoin).\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Rang\u003c/th>\u003cth>Masculin\u003c/th>\u003cth>Féminin\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>1er\u003c/td>\u003ctd class=\"he-cell\">רִאשׁוֹן\u003c/td>\u003ctd class=\"he-cell\">רִאשׁוֹנָה\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>2e\u003c/td>\u003ctd class=\"he-cell\">שֵׁנִי\u003c/td>\u003ctd class=\"he-cell\">שְׁנִיָּה\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>3e\u003c/td>\u003ctd class=\"he-cell\">שְׁלִישִׁי\u003c/td>\u003ctd class=\"he-cell\">שְׁלִישִׁית\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>4e\u003c/td>\u003ctd class=\"he-cell\">רְבִיעִי\u003c/td>\u003ctd class=\"he-cell\">רְבִיעִית\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>5e\u003c/td>\u003ctd class=\"he-cell\">חֲמִישִׁי\u003c/td>\u003ctd class=\"he-cell\">חֲמִישִׁית\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>6e\u003c/td>\u003ctd class=\"he-cell\">שִׁשִּׁי\u003c/td>\u003ctd class=\"he-cell\">שִׁשִּׁית\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>7e\u003c/td>\u003ctd class=\"he-cell\">שְׁבִיעִי\u003c/td>\u003ctd class=\"he-cell\">שְׁבִיעִית\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>8e\u003c/td>\u003ctd class=\"he-cell\">שְׁמִינִי\u003c/td>\u003ctd class=\"he-cell\">שְׁמִינִית\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>9e\u003c/td>\u003ctd class=\"he-cell\">תְּשִׁיעִי\u003c/td>\u003ctd class=\"he-cell\">תְּשִׁיעִית\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>10e\u003c/td>\u003ctd class=\"he-cell\">עֲשִׂירִי\u003c/td>\u003ctd class=\"he-cell\">עֲשִׂירִית\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">הַשִּׁעוּר הָרִאשׁוֹן\u003c/span> → la première leçon (m.)\u003cbr>\n            \u003cspan class=\"he-inline\">הַחֻלְצָה הַשְּׁלִישִׁית\u003c/span> → la troisième chemise (f.)\n          \u003c/div>\n        "},{"title":"Âge : בן / בת","he":"בן כמה אתה?","body":"\n          \u003cp>Pour exprimer l'âge, on n'utilise pas le verbe « avoir » mais les noms \u003cspan class=\"he-inline\">בֵּן\u003c/span> (fils, m.) ou \u003cspan class=\"he-inline\">בַּת\u003c/span> (fille, f.).\u003c/p>\n          \u003cp>\u003cstrong>Demander l'âge :\u003c/strong>\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">בֶּן כַּמָּה אַתָּה?\u003c/span> → Quel âge as-tu ? (à un homme)\u003cbr>\n            \u003cspan class=\"he-inline\">בַּת כַּמָּה אַתְּ?\u003c/span> → Quel âge as-tu ? (à une femme)\u003cbr>\n            \u003cspan class=\"he-inline\">בְּנֵי כַּמָּה הֵם?\u003c/span> → Quel âge ont-ils ?\u003cbr>\n            \u003cspan class=\"he-inline\">בְּנוֹת כַּמָּה הֵן?\u003c/span> → Quel âge ont-elles ?\n          \u003c/div>\n          \u003cp>\u003cstrong>Répondre :\u003c/strong>\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֲנִי בֶּן חֲמִישִּׁים וְחָמֵשׁ\u003c/span> → J'ai 55 ans (m.)\u003cbr>\n            \u003cspan class=\"he-inline\">אֲנִי בַּת שְׁלוֹשִׁים וְאַרְבַּע\u003c/span> → J'ai 34 ans (f.)\n          \u003c/div>\n        "}]},{"name":"Négation & condition","items":[{"title":"Négation : personne / jamais / rien","he":"אף אחד / אף פעם / כלום","body":"\n          \u003cp>En hébreu, la négation utilise \u003cstrong>deux mots\u003c/strong> (un peu comme « ne... rien » en français).\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Français\u003c/th>\u003cth>Hébreu\u003c/th>\u003cth>Structure\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>personne ne…\u003c/td>\u003ctd class=\"he-cell\">אף אחד … לא\u003c/td>\u003ctd>אף אחד + לא + verbe (m.sg.)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>ne… jamais\u003c/td>\u003ctd class=\"he-cell\">אף פעם … לא\u003c/td>\u003ctd>אף פעם + לא + verbe\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>ne… rien\u003c/td>\u003ctd class=\"he-cell\">שום דבר / כלום\u003c/td>\u003ctd>לא + verbe + כלום\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>pas encore\u003c/td>\u003ctd class=\"he-cell\">עדיין לא\u003c/td>\u003ctd>עדיין + לא + verbe\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אַף אֶחָד לֹא בָּא\u003c/span> → Personne ne vient.\u003cbr>\n            \u003cspan class=\"he-inline\">אֲנִי לֹא רוֹצָה כְּלוּם\u003c/span> → Je ne veux rien.\u003cbr>\n            \u003cspan class=\"he-inline\">הִיא אַף פַּעַם לֹא הָיְתָה בְּצָרְפַת\u003c/span> → Elle n'est jamais allée en France.\n          \u003c/div>\n        "},{"title":"Toujours : תמיד","he":"תמיד","body":"\n          \u003cp>\u003cspan class=\"he-inline\">תָּמִיד\u003c/span> exprime une habitude, quelque chose de constant. Il se met \u003cstrong>généralement au présent\u003c/strong>.\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">הִיא תָּמִיד מַגִּיעָה מֻקְדָּם\u003c/span> → Elle arrive toujours en avance.\u003cbr>\n            \u003cspan class=\"he-inline\">אַתָּה תָּמִיד שׁוֹכֵחַ אֶת הַמַּפְתְּחוֹת\u003c/span> → Tu oublies toujours tes clés.\n          \u003c/div>\n        "},{"title":"Condition réelle : אם","he":"תנאי קיים","body":"\n          \u003cp>Pour une condition qu'on considère \u003cstrong>possible\u003c/strong>, on utilise \u003cspan class=\"he-inline\">אִם\u003c/span> (= « si »).\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אִם יִהְיֶה גֶּשֶׁם, אֲנִי אֶשָּׁאֵר בַּבַּיִת\u003c/span>\u003cbr>\n            → S'il pleut, je resterai à la maison.\u003cbr>\n            \u003cspan class=\"he-inline\">אִם אַתָּה רוֹצֶה, אַתָּה יָכוֹל לָבוֹא\u003c/span>\u003cbr>\n            → Si tu veux, tu peux venir.\n          \u003c/div>\n        "},{"title":"Condition irréelle : אילו / לו","he":"תנאי בטל","body":"\n          \u003cp>La condition \u003cstrong>irréelle\u003c/strong> sert à parler d'une situation qui ne s'est pas produite ou qui est purement hypothétique.\u003c/p>\n          \u003cp>Mots utilisés : \u003cspan class=\"he-inline\">אִילּוּ\u003c/span> ou \u003cspan class=\"he-inline\">לוּ\u003c/span> (= « si »).\u003c/p>\n          \u003cp>\u003cstrong>En hébreu soutenu\u003c/strong> : \u003cspan class=\"he-inline\">אילו\u003c/span> + verbe au passé, ou un verbe composé (être au passé + participe présent).\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אִילּוּ הָיִיתִי לוֹמֵד לַמִּבְחָן, הָיִיתִי מַצְלִיחַ\u003c/span>\u003cbr>\n            → Si j'avais étudié pour l'examen, j'aurais réussi.\n          \u003c/div>\n          \u003cp>\u003cstrong>En hébreu parlé\u003c/strong>, on utilise plutôt \u003cspan class=\"he-inline\">אם\u003c/span> + verbe composé dans les deux propositions :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אִם הָיִיתִי לוֹמֵד לַמִּבְחָן, הָיִיתִי מַצְלִיחַ\u003c/span>\u003cbr>\n            → Si j'avais étudié pour l'examen, j'aurais réussi. (même sens, registre courant)\n          \u003c/div>\n          \u003cp>\u003cstrong>Quand l'utiliser ?\u003c/strong>\u003c/p>\n          \u003cul>\n            \u003cli>Le passé est révolu et on ne peut plus revenir en arrière : « Si j'avais étudié, j'aurais réussi » (mais je n'ai pas étudié, donc je n'ai pas réussi).\u003c/li>\n            \u003cli>Situation hypothétique non réelle : « Si j'étais un oiseau, je pourrais voler » (mais je ne suis pas un oiseau).\u003c/li>\n          \u003c/ul>\n        "}]},{"name":"Directions & mouvements","items":[{"title":"Points cardinaux & directions","he":"כיוונים","body":"\n          \u003cp>L'hébreu a plusieurs formes selon le sens utilisé. Le suffixe \u003cspan class=\"he-inline\">ה‑\u003c/span> ajouté à un nom indique le mouvement vers (équivalent de « vers le… »).\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Point\u003c/th>\u003cth>Nord\u003c/th>\u003cth>Sud\u003c/th>\u003cth>Est\u003c/th>\u003cth>Ouest\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>« le »\u003c/td>\u003ctd class=\"he-cell\">צפון\u003c/td>\u003ctd class=\"he-cell\">דרום\u003c/td>\u003ctd class=\"he-cell\">מזרח\u003c/td>\u003ctd class=\"he-cell\">מערב\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>« vers »\u003c/td>\u003ctd class=\"he-cell\">צפונה\u003c/td>\u003ctd class=\"he-cell\">דרומה\u003c/td>\u003ctd class=\"he-cell\">מזרחה\u003c/td>\u003ctd class=\"he-cell\">מערבה\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>« à / au »\u003c/td>\u003ctd class=\"he-cell\">לצפון\u003c/td>\u003ctd class=\"he-cell\">לדרום\u003c/td>\u003ctd class=\"he-cell\">למזרח\u003c/td>\u003ctd class=\"he-cell\">למערב\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>« dans »\u003c/td>\u003ctd class=\"he-cell\">בצפון\u003c/td>\u003ctd class=\"he-cell\">בדרום\u003c/td>\u003ctd class=\"he-cell\">במזרח\u003c/td>\u003ctd class=\"he-cell\">במערב\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cp>Le suffixe \u003cspan class=\"he-inline\">ה‑\u003c/span> de direction s'applique aussi à d'autres mots :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">יָמִינָה\u003c/span> → à droite, \u003cspan class=\"he-inline\">שְׂמֹאלָה\u003c/span> → à gauche\u003cbr>\n            \u003cspan class=\"he-inline\">לְמַעְלָה / לְמַטָּה\u003c/span> → en haut / en bas\u003cbr>\n            \u003cspan class=\"he-inline\">הַבַּיְתָה\u003c/span> → à la maison (vers la maison)\n          \u003c/div>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֲנִי בַּדָּרוֹם, אֲבָל אֲנִי נוֹסֵעַ צָפוֹנָה\u003c/span>\u003cbr>\n            → Je suis dans le sud, mais je voyage vers le nord.\n          \u003c/div>\n        "},{"title":"Mots interrogatifs de lieu","he":"איפה / לאן / מאיפה","body":"\n          \u003cp>Trois mots interrogatifs distincts selon le mouvement :\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Mot\u003c/th>\u003cth>Sens\u003c/th>\u003cth>Préposition\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">אֵיפֹה?\u003c/td>\u003ctd>Où ? (statique)\u003c/td>\u003ctd class=\"he-cell\">בְּ‑\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לְאָן?\u003c/td>\u003ctd>Vers où ? (mouvement)\u003c/td>\u003ctd class=\"he-cell\">לְ‑\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">מֵאַיִן? / מֵאֵיפֹה?\u003c/td>\u003ctd>D'où ? (origine)\u003c/td>\u003ctd class=\"he-cell\">מִ‑\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֵיפֹה אַתָּה גָּר?\u003c/span> → Où habites-tu ?\u003cbr>\n            \u003cspan class=\"he-inline\">לְאָן אַתְּ נוֹסַעַת?\u003c/span> → Où vas-tu ?\u003cbr>\n            \u003cspan class=\"he-inline\">מֵאַיִן אַתָּה?\u003c/span> → D'où viens-tu ?\n          \u003c/div>\n        "}]},{"name":"Liaisons & connecteurs","items":[{"title":"Connecteurs de temps : avant / après / pendant","he":"אחרי / לפני / בזמן","body":"\n          \u003cp>Les connecteurs \u003cspan class=\"he-inline\">אַחֲרֵי\u003c/span>, \u003cspan class=\"he-inline\">לִפְנֵי\u003c/span>, \u003cspan class=\"he-inline\">בִּזְמַן\u003c/span> ont \u003cstrong>deux constructions\u003c/strong> selon ce qui les suit :\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Sens\u003c/th>\u003cth>+ nom\u003c/th>\u003cth>+ ש + phrase\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>après\u003c/td>\u003ctd class=\"he-cell\">אחרי\u003c/td>\u003ctd class=\"he-cell\">אחרי ש\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>avant\u003c/td>\u003ctd class=\"he-cell\">לפני\u003c/td>\u003ctd class=\"he-cell\">לפני ש\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>pendant\u003c/td>\u003ctd class=\"he-cell\">בזמן\u003c/td>\u003ctd class=\"he-cell\">בזמן ש\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>au moment où\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"he-cell\">ברגע ש\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>quand / lorsque\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"he-cell\">כש / כאשר\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>durant (durée)\u003c/td>\u003ctd class=\"he-cell\">במשך\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cp>\u003cstrong>+ nom\u003c/strong> (sans ש) :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אַחֲרֵי הָעֲבוֹדָה\u003c/span> → après le travail\u003cbr>\n            \u003cspan class=\"he-inline\">לִפְנֵי הַשִּׁעוּר\u003c/span> → avant le cours\u003cbr>\n            \u003cspan class=\"he-inline\">בִּזְמַן הָאֲרוּחָה\u003c/span> → pendant le repas\u003cbr>\n            \u003cspan class=\"he-inline\">בְּמֶשֶׁךְ הַיּוֹם\u003c/span> → tout au long de la journée\n          \u003c/div>\n          \u003cp>\u003cstrong>+ ש + phrase complète\u003c/strong> (avec verbe conjugué) :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אַחֲרֵי שֶׁגָּמַרְתִּי לַעֲבוֹד, הָלַכְתִּי הַבַּיְתָה\u003c/span>\u003cbr>\n            → Après que j'ai fini de travailler, je suis rentré à la maison.\u003cbr>\n            \u003cspan class=\"he-inline\">לִפְנֵי שֶׁהִתְחִיל הַשִּׁעוּר, שָׁתִיתִי קָפֶה\u003c/span>\u003cbr>\n            → Avant que le cours commence, j'ai bu un café.\u003cbr>\n            \u003cspan class=\"he-inline\">בָּרֶגַע שֶׁמִּישֶׁהוּ מַעֲצְבֵּן אוֹתִי, אֲנִי יוֹצֵא\u003c/span>\u003cbr>\n            → Dès que quelqu'un m'agace, je sors.\u003cbr>\n            \u003cspan class=\"he-inline\">כְּשֶׁחַם בַּחוּץ, אֲנִי שׁוֹתֶה הַרְבֵּה מַיִם\u003c/span>\u003cbr>\n            → Quand il fait chaud dehors, je bois beaucoup d'eau.\n          \u003c/div>\n        "},{"title":"Enchaîner : d'abord / ensuite","he":"קודם / אחר כך","body":"\n          \u003cp>Pour relier \u003cstrong>deux phrases dans l'ordre chronologique\u003c/strong>, on peut utiliser plusieurs connecteurs.\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Mot\u003c/th>\u003cth>Sens\u003c/th>\u003cth>Place\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">קוֹדֶם...\u003c/td>\u003ctd>d'abord, en premier\u003c/td>\u003ctd>début de la 1ère phrase\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">אַחַר כָּךְ...\u003c/td>\u003ctd>ensuite, après cela\u003c/td>\u003ctd>début de la 2e phrase\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לִפְנֵי כֵן\u003c/td>\u003ctd>auparavant, avant cela\u003c/td>\u003ctd>2e phrase (référence en arrière)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">וְאָז\u003c/td>\u003ctd>et alors, et ensuite\u003c/td>\u003ctd>liaison directe\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">קוֹדֶם שָׁתִיתִי קָפֶה, אַחַר כָּךְ אָכַלְתִּי חוּמוּס\u003c/span>\u003cbr>\n            → D'abord j'ai bu un café, ensuite j'ai mangé du houmous.\u003cbr>\n            \u003cspan class=\"he-inline\">אָכַלְתִּי חוּמוּס. לִפְנֵי כֵן, שָׁתִיתִי קָפֶה\u003c/span>\u003cbr>\n            → J'ai mangé du houmous. Avant cela, j'ai bu un café.\u003cbr>\n            \u003cspan class=\"he-inline\">שָׁתִיתִי קָפֶה וְאָז אָכַלְתִּי חוּמוּס\u003c/span>\u003cbr>\n            → J'ai bu un café et ensuite j'ai mangé du houmous.\n          \u003c/div>\n        "},{"title":"אבל vs אלא — « mais »","he":"אבל / אלא","body":"\n          \u003cp>Le français « mais » se traduit par \u003cstrong>deux mots différents\u003c/strong> en hébreu selon le contexte.\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Contexte\u003c/th>\u003cth>Mot\u003c/th>\u003cth>Exemple\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>Phrase affirmative avant\u003c/td>\u003ctd class=\"he-cell\">אֲבָל\u003c/td>\u003ctd>café mais sans lait\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Négation avant (לא / אין / אי אפשר)\u003c/td>\u003ctd class=\"he-cell\">אֶלָּא\u003c/td>\u003ctd>pas X mais Y\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cp>\u003cstrong>אֲבָל\u003c/strong> — pour opposer ou nuancer une affirmation :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֲנִי שׁוֹתָה קָפֶה אֲבָל בְּלִי חָלָב\u003c/span>\u003cbr>\n            → Je bois du café mais sans lait.\n          \u003c/div>\n          \u003cp>\u003cstrong>אֶלָּא\u003c/strong> — uniquement après une négation, pour \u003cstrong>remplacer\u003c/strong> ce qui a été nié par autre chose :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֲנִי לֹא שׁוֹתָה קָפֶה אֶלָּא תֵּה\u003c/span>\u003cbr>\n            → Je ne bois pas de café mais du thé.\u003cbr>\n            \u003cspan class=\"he-inline\">הוּא לֹא גָּר בִּירוּשָׁלַיִם, אֶלָּא בְּחֵיפָה\u003c/span>\u003cbr>\n            → Il n'habite pas à Jérusalem, mais à Haïfa.\u003cbr>\n            \u003cspan class=\"he-inline\">אֵין לִי חֲבֵרוֹת אֶלָּא חֲבֵרִים\u003c/span>\u003cbr>\n            → Je n'ai pas d'amies mais des amis.\u003cbr>\n            \u003cspan class=\"he-inline\">אִי אֶפְשָׁר לְדַבֵּר בְּקוֹל אֶלָּא בְּשֶׁקֶט\u003c/span>\u003cbr>\n            → On ne peut pas parler fort, seulement en silence.\n          \u003c/div>\n          \u003cp>\u003cstrong>Astuce\u003c/strong> : \u003cspan class=\"he-inline\">אֶלָּא\u003c/span> = « (pas X) mais plutôt Y ». Si tu peux dire « mais plutôt » en français, c'est \u003cspan class=\"he-inline\">אֶלָּא\u003c/span> en hébreu.\u003c/p>\n        "},{"title":"לא רק... אלא גם...","he":"לא רק... אלא גם...","body":"\n          \u003cp>La structure \u003cstrong>« non seulement… mais aussi… »\u003c/strong> se construit en hébreu avec \u003cspan class=\"he-inline\">לֹא רַק... אֶלָּא גַּם...\u003c/span>\u003c/p>\n          \u003cp>On l'utilise pour \u003cstrong>ajouter\u003c/strong> un deuxième élément à un premier, en insistant sur les deux.\u003c/p>\n          \u003cp>Structure : \u003cspan class=\"he-inline\">לֹא רַק\u003c/span> + élément 1, \u003cspan class=\"he-inline\">אֶלָּא גַּם\u003c/span> + élément 2\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">בַּנֶּגֶב חַיִּים לֹא רַק יְהוּדִים, אֶלָּא גַּם בֶּדּוּוִים\u003c/span>\u003cbr>\n            → Dans le Néguev vivent non seulement des juifs, mais aussi des bédouins.\u003cbr>\u003cbr>\n            \u003cspan class=\"he-inline\">הַזּוּג הַצָּעִיר הֶחְלִיט לֹא רַק לִבְנוֹת בַּיִת בַּגָּלִיל, אֶלָּא גַּם לִפְתּוֹחַ שָׁם בֵּית מָלוֹן\u003c/span>\u003cbr>\n            → Le jeune couple a décidé non seulement de construire une maison en Galilée, mais aussi d'y ouvrir un hôtel.\u003cbr>\u003cbr>\n            \u003cspan class=\"he-inline\">אֶת הַנּוֹף הַמְּיוּחָד שֶׁל הַמִּדְבָּר רוֹאִים לֹא רַק מֵהַטַּיֶּלֶת, אֶלָּא גַּם מֵחַלּוֹנוֹת הַבָּתִּים\u003c/span>\u003cbr>\n            → On voit le paysage unique du désert non seulement depuis la promenade, mais aussi depuis les fenêtres des maisons.\n          \u003c/div>\n          \u003cp>\u003cstrong>À noter\u003c/strong> : c'est un cas particulier de l'usage de \u003cspan class=\"he-inline\">אֶלָּא\u003c/span>, où la 1ère partie est implicitement négative (\u003cspan class=\"he-inline\">לֹא רַק\u003c/span> = pas seulement).\u003c/p>\n        "}]}]};
</script>
<script>
/* =====================================================================
   HP — noyau de progression partagé (espace élève, back-office, site perso)
   XP, niveaux, séries de jours, badges, résumé pour la prof, graphiques.
   Aucune dépendance. Les couleurs viennent des jetons de la charte.
   ===================================================================== */
var HP = (function () {
  'use strict';

  /* ---------- barème XP ---------- */
  var XP = {
    quizOk: 10, quizKo: 3,
    flashKnown: 8, flashAgain: 3, flashSoft: 2,
    conjKnown: 12, conjAgain: 4, conjSoft: 2,
    mastered: 15,      // chaque nouveau mot maîtrisé
    goal: 25,          // objectif du jour atteint
    combo: 20          // toutes les 10 bonnes réponses d'affilée
  };

  /* ---------- niveaux : une lettre de l'alphabet par niveau ---------- */
  var LETTERS = 'אבגדהוזחטיכלמנסעפצקרשת';
  var TIERS = [
    { from: 1,  fr: 'Débutant',    he: 'מַתְחִיל' },
    { from: 4,  fr: 'Apprenti',    he: 'תַּלְמִיד' },
    { from: 7,  fr: 'Explorateur', he: 'חוֹקֵר' },
    { from: 10, fr: 'Confirmé',    he: 'מְנֻסֶּה' },
    { from: 13, fr: 'Avancé',      he: 'מִתְקַדֵּם' },
