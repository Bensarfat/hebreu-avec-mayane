=\"hcell he\">הֵבִיא\u003c/td>\u003ctd class=\"hcell he\">הֵבִיא\u003c/td>\u003ctd class=\"hcell he\">הֵבֵאתִי\u003c/td>\u003ctd class=\"hcell he\">יָבִיא\u003c/td>\u003ctd>apporter\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>הִפְעִיל\u003c/td>\u003ctd class=\"hcell he\">הֵבִין\u003c/td>\u003ctd class=\"hcell he\">הֵבִין\u003c/td>\u003ctd class=\"hcell he\">הֵבַנְתִּי\u003c/td>\u003ctd class=\"hcell he\">יָבִין\u003c/td>\u003ctd>comprendre\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>הוּפְעַל\u003c/td>\u003ctd class=\"hcell he\">הוּכַן\u003c/td>\u003ctd class=\"hcell he\">הוּכַן\u003c/td>\u003ctd class=\"hcell he\">הוּכַנְתִּי\u003c/td>\u003ctd class=\"hcell he\">יוּכַן\u003c/td>\u003ctd>être préparé\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>נִפְעַל\u003c/td>\u003ctd class=\"hcell he\">נָדוֹן\u003c/td>\u003ctd class=\"hcell he\">נָדוֹן\u003c/td>\u003ctd class=\"tr\">rare / littéraire\u003c/td>\u003ctd class=\"hcell he\">יִידּוֹן\u003c/td>\u003ctd>être jugé, discuté\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>פּוֹלֵל \u003cspan class=\"tr\">(= פיעל)\u003c/span>\u003c/td>\u003ctd class=\"hcell he\">עוֹרֵר\u003c/td>\u003ctd class=\"hcell he\">עוֹרֵר\u003c/td>\u003ctd class=\"hcell he\">עוֹרַרְתִּי\u003c/td>\u003ctd class=\"hcell he\">יְעוֹרֵר\u003c/td>\u003ctd>éveiller, susciter\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>הִתְפּוֹלֵל \u003cspan class=\"tr\">(= התפעל)\u003c/span>\u003c/td>\u003ctd class=\"hcell he\">הִתְעוֹרֵר\u003c/td>\u003ctd class=\"hcell he\">הִתְעוֹרֵר\u003c/td>\u003ctd class=\"hcell he\">הִתְעוֹרַרְתִּי\u003c/td>\u003ctd class=\"hcell he\">יִתְעוֹרֵר\u003c/td>\u003ctd>se réveiller\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003cdiv class=\"note tip\">\u003cb>Le הפעיל des creux&nbsp;: même logique qu'ailleurs\u003c/b>\nLe \u003cspan class=\"he\">י\u003c/span> ne survit qu'à la 3\u003csup>e\u003c/sup> personne&nbsp;: \u003cspan class=\"he\">הֵכִין / הֵכִינָה / הֵכִינוּ\u003c/span> mais \u003cspan class=\"he\">הֵכַנְתִּי / הֵכַנְתָּ / הֵכַנּוּ\u003c/span>. Erreur classique&nbsp;: ✗\u003cspan class=\"he\">הבינתי\u003c/span> → ✓\u003cspan class=\"he\">הֵבַנְתִּי\u003c/span>&nbsp;; ✗\u003cspan class=\"he\">הכינתי\u003c/span> → ✓\u003cspan class=\"he\">הֵכַנְתִּי\u003c/span>.\u003c/div>\n\n\u003cdiv class=\"note warn\">\u003cb>Les creux n'ont pas de פיעל / פועל / התפעל ordinaires\u003c/b>\nImpossible de redoubler une 2\u003csup>e\u003c/sup> radicale qui n'existe pas. L'hébreu redouble alors la \u003cstrong>3\u003csup>e\u003c/sup>\u003c/strong> radicale et crée les schèmes \u003cspan class=\"he\">פּוֹלֵל\u003c/span> / \u003cspan class=\"he\">פּוֹלַל\u003c/span> / \u003cspan class=\"he\">הִתְפּוֹלֵל\u003c/span>&nbsp;: \u003cspan class=\"he\">קוֹמֵם\u003c/span> (ériger), \u003cspan class=\"he\">עוֹרֵר\u003c/span>, \u003cspan class=\"he\">הִתְגּוֹרֵר\u003c/span> (résider), \u003cspan class=\"he\">הִתְכּוֹנֵן\u003c/span> (se préparer).\u003c/div>\n\u003c/div>\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>פ״נ — 1\u003csup>re\u003c/sup> radicale \u003cspan class=\"he\">נ\u003c/span> \u003cspan class=\"gz-tag\">piège au futur seulement\u003c/span>\u003c/summary>\n\u003cdiv class=\"detbody\">\n\u003cdiv class=\"note tip\">\u003cb>Bonne nouvelle&nbsp;: au passé, פ״נ est parfaitement régulier\u003c/b>\n\u003cspan class=\"he\">נָפַלְתִּי, נָפַל, נָפְלָה, נָפְלוּ\u003c/span> · \u003cspan class=\"he\">נָסַעְתִּי, נָסַע\u003c/span> · \u003cspan class=\"he\">נָגַעְתִּי, נָגַע\u003c/span>. Rien à apprendre.\u003cbr>\nToute la difficulté est au \u003cstrong>futur\u003c/strong> (et à l'infinitif), où le \u003cspan class=\"he\">נ\u003c/span> s'assimile à la consonne suivante et la redouble.\u003c/div>\n\n\u003cdiv class=\"tbl-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth class=\"hcell he\">נָפַל passé\u003c/th>\u003cth class=\"hcell he\">נָפַל futur\u003c/th>\u003cth class=\"hcell he\">נָסַע passé\u003c/th>\u003cth class=\"hcell he\">נָסַע futur\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">נָפַלְתִּי\u003c/td>\u003ctd class=\"hcell he\">אֶפּוֹל\u003c/td>\u003ctd class=\"hcell he\">נָסַעְתִּי\u003c/td>\u003ctd class=\"hcell he\">אֶסַּע\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">נָפַלְתָּ\u003c/td>\u003ctd class=\"hcell he\">תִּפּוֹל\u003c/td>\u003ctd class=\"hcell he\">נָסַעְתָּ\u003c/td>\u003ctd class=\"hcell he\">תִּסַּע\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">נָפַלְתְּ\u003c/td>\u003ctd class=\"hcell he\">תִּפְּלִי\u003c/td>\u003ctd class=\"hcell he\">נָסַעַתְּ\u003c/td>\u003ctd class=\"hcell he\">תִּסְּעִי\u003c/td>\u003c/tr>\n\u003ctr class=\"hl\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">נָפַל\u003c/td>\u003ctd class=\"hcell he\">יִפּוֹל\u003c/td>\u003ctd class=\"hcell he\">נָסַע\u003c/td>\u003ctd class=\"hcell he\">יִסַּע\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">נָפְלָה\u003c/td>\u003ctd class=\"hcell he\">תִּפּוֹל\u003c/td>\u003ctd class=\"hcell he\">נָסְעָה\u003c/td>\u003ctd class=\"hcell he\">תִּסַּע\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">נָפַלְנוּ\u003c/td>\u003ctd class=\"hcell he\">נִפּוֹל\u003c/td>\u003ctd class=\"hcell he\">נָסַעְנוּ\u003c/td>\u003ctd class=\"hcell he\">נִסַּע\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתֶּם\u003c/td>\u003ctd class=\"hcell he\">נְפַלְתֶּם\u003c/td>\u003ctd class=\"hcell he\">תִּפְּלוּ\u003c/td>\u003ctd class=\"hcell he\">נְסַעְתֶּם\u003c/td>\u003ctd class=\"hcell he\">תִּסְּעוּ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">נָפְלוּ\u003c/td>\u003ctd class=\"hcell he\">יִפְּלוּ\u003c/td>\u003ctd class=\"hcell he\">נָסְעוּ\u003c/td>\u003ctd class=\"hcell he\">יִסְּעוּ\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003ch4>Deux verbes qui imitent les פ״נ sans en être\u003c/h4>\n\u003cdiv class=\"tbl-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Verbe\u003c/th>\u003cth>Passé\u003c/th>\u003cth>Futur\u003c/th>\u003cth>Remarque\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"hcell he\">לָקַח \u003cspan class=\"tr\">prendre\u003c/span>\u003c/td>\u003ctd class=\"hcell he\">לָקַחְתִּי · לָקַח · לָקְחוּ\u003c/td>\u003ctd class=\"hcell he\">אֶקַּח · יִקַּח · יִקְּחוּ\u003c/td>\u003ctd>le \u003cspan class=\"he\">ל\u003c/span> s'assimile comme un \u003cspan class=\"he\">נ\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"hcell he\">נָתַן \u003cspan class=\"tr\">donner\u003c/span>\u003c/td>\u003ctd class=\"hcell he\">נָתַתִּי · נָתַן · נָתְנוּ\u003c/td>\u003ctd class=\"hcell he\">אֶתֵּן · יִתֵּן · יִתְּנוּ\u003c/td>\u003ctd>double assimilation, voir ci-dessous\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003cdiv class=\"note warn\">\u003cb>\u003cspan class=\"he\">נָתַן\u003c/span> assimile aussi au passé\u003c/b>\nC'est le seul verbe où un \u003cspan class=\"he\">נ\u003c/span> disparaît au \u003cem>passé\u003c/em>&nbsp;: la 3\u003csup>e\u003c/sup> radicale \u003cspan class=\"he\">נ\u003c/span> fusionne avec le \u003cspan class=\"he\">ת\u003c/span> du suffixe.\u003cbr>\n\u003cspan class=\"he he-lg\">נָתַתִּי · נָתַתָּ · נָתַתְּ · נָתַן · נָתְנָה · נָתַנּוּ · נְתַתֶּם · נָתְנוּ\u003c/span>\u003cbr>\nNotez \u003cspan class=\"he\">נָתַתִּי\u003c/span> (\u003cspan class=\"tr\">natáti\u003c/span>) et non ✗\u003cspan class=\"he\">נתנתי\u003c/span>, mais \u003cspan class=\"he\">נָתַנּוּ\u003c/span> (\u003cspan class=\"tr\">natánou\u003c/span>) avec daguesh.\u003c/div>\n\n\u003cdiv class=\"note\">\u003cb>Les פ״נ en הפעיל\u003c/b>\nLe \u003cspan class=\"he\">נ\u003c/span> s'assimile partout, y compris au passé&nbsp;: \u003cspan class=\"he\">הִגִּיעַ\u003c/span> (arriver) → \u003cspan class=\"he\">הִגַּעְתִּי\u003c/span>, futur \u003cspan class=\"he\">אַגִּיעַ / יַגִּיעַ\u003c/span>&nbsp;; \u003cspan class=\"he\">הִצִּיעַ\u003c/span> (proposer) → \u003cspan class=\"he\">הִצַּעְתִּי\u003c/span>, \u003cspan class=\"he\">יַצִּיעַ\u003c/span>&nbsp;; \u003cspan class=\"he\">הִכִּיר\u003c/span> (connaître) → \u003cspan class=\"he\">הִכַּרְתִּי\u003c/span>, \u003cspan class=\"he\">יַכִּיר\u003c/span>&nbsp;; \u003cspan class=\"he\">הִפִּיל\u003c/span>, \u003cspan class=\"he\">הִסִּיעַ\u003c/span>, \u003cspan class=\"he\">הִזִּיק\u003c/span>.\u003c/div>\n\n\u003cdiv class=\"note\">\u003cb>Quelques פ״נ gardent leur nun au futur\u003c/b>\n\u003cspan class=\"he\">נָהַג → יִנְהַג\u003c/span> (conduire), \u003cspan class=\"he\">נָשַׁם → יִנְשׁוֹם\u003c/span> (respirer), \u003cspan class=\"he\">נָצַר → יִנְצוֹר\u003c/span>. Il n'y a pas de règle mécanique&nbsp;: cela s'apprend verbe par verbe. Les plus fréquents (נפל, נסע, נגע, נתן, נשא, נגש) assimilent.\u003c/div>\n\u003c/div>\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>פ״י / פ״ו — 1\u003csup>re\u003c/sup> radicale \u003cspan class=\"he\">י\u003c/span> \u003cspan class=\"gz-tag\">piège au futur seulement\u003c/span>\u003c/summary>\n\u003cdiv class=\"detbody\">\n\u003cp>\u003cb>Verbes concernés&nbsp;:\u003c/b> \u003cspan class=\"he\">יָשַׁב, יָרַד, יָצָא, יָדַע, יָלַד, יָכוֹל, יָרַשׁ\u003c/span>. Et par analogie&nbsp;: \u003cspan class=\"he\">הָלַךְ\u003c/span>.\u003c/p>\n\n\u003cdiv class=\"note tip\">\u003cb>Au passé&nbsp;: régulier\u003c/b>\n\u003cspan class=\"he\">יָשַׁבְתִּי, יָשַׁב, יָשְׁבָה, יָשַׁבְנוּ, יָשְׁבוּ\u003c/span> — un פעל fort ordinaire.\u003cbr>\nAu \u003cstrong>futur\u003c/strong>, en revanche, le \u003cspan class=\"he\">י\u003c/span> se fond dans le préfixe qui devient \u003cem>tsere\u003c/em>&nbsp;: \u003cspan class=\"he\">אֵשֵׁב, תֵּשֵׁב, יֵשֵׁב, נֵשֵׁב\u003c/span>. Le son \u003cspan class=\"tr\">é\u003c/span> long au préfixe est la signature de la gzira.\u003c/div>\n\n\u003cdiv class=\"tbl-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth class=\"hcell he\">יָשַׁב passé\u003c/th>\u003cth class=\"hcell he\">יָשַׁב futur\u003c/th>\u003cth class=\"hcell he\">יָדַע futur\u003c/th>\u003cth class=\"hcell he\">יָצָא futur\u003c/th>\u003cth class=\"hcell he\">הָלַךְ futur\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">יָשַׁבְתִּי\u003c/td>\u003ctd class=\"hcell he\">אֵשֵׁב\u003c/td>\u003ctd class=\"hcell he\">אֵדַע\u003c/td>\u003ctd class=\"hcell he\">אֵצֵא\u003c/td>\u003ctd class=\"hcell he\">אֵלֵךְ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">יָשַׁבְתָּ\u003c/td>\u003ctd class=\"hcell he\">תֵּשֵׁב\u003c/td>\u003ctd class=\"hcell he\">תֵּדַע\u003c/td>\u003ctd class=\"hcell he\">תֵּצֵא\u003c/td>\u003ctd class=\"hcell he\">תֵּלֵךְ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">יָשַׁבְתְּ\u003c/td>\u003ctd class=\"hcell he\">תֵּשְׁבִי\u003c/td>\u003ctd class=\"hcell he\">תֵּדְעִי\u003c/td>\u003ctd class=\"hcell he\">תֵּצְאִי\u003c/td>\u003ctd class=\"hcell he\">תֵּלְכִי\u003c/td>\u003c/tr>\n\u003ctr class=\"hl\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">יָשַׁב\u003c/td>\u003ctd class=\"hcell he\">יֵשֵׁב\u003c/td>\u003ctd class=\"hcell he\">יֵדַע\u003c/td>\u003ctd class=\"hcell he\">יֵצֵא\u003c/td>\u003ctd class=\"hcell he\">יֵלֵךְ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">יָשְׁבָה\u003c/td>\u003ctd class=\"hcell he\">תֵּשֵׁב\u003c/td>\u003ctd class=\"hcell he\">תֵּדַע\u003c/td>\u003ctd class=\"hcell he\">תֵּצֵא\u003c/td>\u003ctd class=\"hcell he\">תֵּלֵךְ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">יָשַׁבְנוּ\u003c/td>\u003ctd class=\"hcell he\">נֵשֵׁב\u003c/td>\u003ctd class=\"hcell he\">נֵדַע\u003c/td>\u003ctd class=\"hcell he\">נֵצֵא\u003c/td>\u003ctd class=\"hcell he\">נֵלֵךְ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתֶּם\u003c/td>\u003ctd class=\"hcell he\">יְשַׁבְתֶּם\u003c/td>\u003ctd class=\"hcell he\">תֵּשְׁבוּ\u003c/td>\u003ctd class=\"hcell he\">תֵּדְעוּ\u003c/td>\u003ctd class=\"hcell he\">תֵּצְאוּ\u003c/td>\u003ctd class=\"hcell he\">תֵּלְכוּ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">יָשְׁבוּ\u003c/td>\u003ctd class=\"hcell he\">יֵשְׁבוּ\u003c/td>\u003ctd class=\"hcell he\">יֵדְעוּ\u003c/td>\u003ctd class=\"hcell he\">יֵצְאוּ\u003c/td>\u003ctd class=\"hcell he\">יֵלְכוּ\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003cdiv class=\"note\">\u003cb>פ״י dans les autres binyanim&nbsp;: le \u003cspan class=\"he\">י\u003c/span> devient \u003cspan class=\"he\">ו\u003c/span>\u003c/b>\n\u003cdiv class=\"tbl-wrap\" style=\"margin-top:8px\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Binyan\u003c/th>\u003cth>Passé — הוא\u003c/th>\u003cth>Passé — אני\u003c/th>\u003cth>Futur — הוא\u003c/th>\u003cth>Sens\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>נִפְעַל\u003c/td>\u003ctd class=\"hcell he\">נוֹלַד\u003c/td>\u003ctd class=\"hcell he\">נוֹלַדְתִּי\u003c/td>\u003ctd class=\"hcell he\">יִיוָּלֵד\u003c/td>\u003ctd>naître\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>הִפְעִיל\u003c/td>\u003ctd class=\"hcell he\">הוֹרִיד\u003c/td>\u003ctd class=\"hcell he\">הוֹרַדְתִּי\u003c/td>\u003ctd class=\"hcell he\">יוֹרִיד\u003c/td>\u003ctd>faire descendre\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>הִפְעִיל\u003c/td>\u003ctd class=\"hcell he\">הוֹשִׁיב\u003c/td>\u003ctd class=\"hcell he\">הוֹשַׁבְתִּי\u003c/td>\u003ctd class=\"hcell he\">יוֹשִׁיב\u003c/td>\u003ctd>faire asseoir\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>הִפְעִיל\u003c/td>\u003ctd class=\"hcell he\">הוֹדִיעַ\u003c/td>\u003ctd class=\"hcell he\">הוֹדַעְתִּי\u003c/td>\u003ctd class=\"hcell he\">יוֹדִיעַ\u003c/td>\u003ctd>informer\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>הוּפְעַל\u003c/td>\u003ctd class=\"hcell he\">הוּרַד\u003c/td>\u003ctd class=\"hcell he\">הוּרַדְתִּי\u003c/td>\u003ctd class=\"hcell he\">יוּרַד\u003c/td>\u003ctd>être descendu\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"note warn\">\u003cb>Les פ״י qui restent réguliers\u003c/b>\nQuelques verbes conservent le \u003cspan class=\"he\">י\u003c/span> au futur, avec un préfixe en \u003cem>hiriq\u003c/em> écrit \u003cspan class=\"he\">יי\u003c/span>&nbsp;: \u003cspan class=\"he\">יָשַׁן → יִישַׁן\u003c/span> (dormir), \u003cspan class=\"he\">יָבֵשׁ → יִיבַשׁ\u003c/span> (sécher), \u003cspan class=\"he\">יָרַשׁ → יִירַשׁ\u003c/span> (hériter).\u003cbr>\nEt \u003cspan class=\"he\">יָכוֹל\u003c/span> est à part&nbsp;: futur \u003cspan class=\"he\">אוּכַל, תּוּכַל, יוּכַל, נוּכַל, יוּכְלוּ\u003c/span>.\u003c/div>\n\u003c/div>\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ל״א — 3\u003csup>e\u003c/sup> radicale \u003cspan class=\"he\">א\u003c/span>\u003c/summary>\n\u003cdiv class=\"detbody\">\n\u003cp>\u003cb>Verbes concernés&nbsp;:\u003c/b> \u003cspan class=\"he\">מָצָא, קָרָא, בָּרָא, יָצָא, קָרָה\u003c/span> (attention&nbsp;: \u003cspan class=\"he\">קרא\u003c/span> lire ≠ \u003cspan class=\"he\">קרה\u003c/span> arriver), \u003cspan class=\"he\">מִלֵּא, נִמְצָא, הִמְצִיא\u003c/span>.\u003c/p>\n\n\u003cdiv class=\"note warn\">\u003cb>Le principe\u003c/b>\nLe \u003cspan class=\"he\">א\u003c/span> final devient \u003cstrong>muet\u003c/strong>. Conséquences&nbsp;:\u003cbr>\n· la voyelle qui le précède \u003cstrong>s'allonge\u003c/strong> en \u003cem>qamats\u003c/em> ou \u003cem>tsere\u003c/em>&nbsp;: \u003cspan class=\"he\">מָצָ\u003cb>א\u003c/b>תִי\u003c/span> (\u003cspan class=\"tr\">matsáti\u003c/span>) et non ✗\u003cspan class=\"he\">מָצַאְתִּי\u003c/span>&nbsp;;\u003cbr>\n· le \u003cspan class=\"he\">ת\u003c/span> du suffixe perd son daguesh&nbsp;: on entend \u003cspan class=\"tr\">-ti\u003c/span> mais la structure est allégée&nbsp;;\u003cbr>\n· au futur, la finale est en \u003cem>qamats\u003c/em>&nbsp;: \u003cspan class=\"he\">יִמְצָא\u003c/span> (jamais ✗\u003cspan class=\"he\">יִמְצוֹא\u003c/span>).\u003c/div>\n\n\u003cdiv class=\"tbl-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth class=\"hcell he\">מָצָא passé\u003c/th>\u003cth class=\"hcell he\">מָצָא futur\u003c/th>\u003cth class=\"hcell he\">קָרָא passé\u003c/th>\u003cth class=\"hcell he\">קָרָא futur\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">מָצָאתִי\u003c/td>\u003ctd class=\"hcell he\">אֶמְצָא\u003c/td>\u003ctd class=\"hcell he\">קָרָאתִי\u003c/td>\u003ctd class=\"hcell he\">אֶקְרָא\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">מָצָאתָ\u003c/td>\u003ctd class=\"hcell he\">תִּמְצָא\u003c/td>\u003ctd class=\"hcell he\">קָרָאתָ\u003c/td>\u003ctd class=\"hcell he\">תִּקְרָא\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">מָצָאת\u003c/td>\u003ctd class=\"hcell he\">תִּמְצְאִי\u003c/td>\u003ctd class=\"hcell he\">קָרָאת\u003c/td>\u003ctd class=\"hcell he\">תִּקְרְאִי\u003c/td>\u003c/tr>\n\u003ctr class=\"hl\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">מָצָא\u003c/td>\u003ctd class=\"hcell he\">יִמְצָא\u003c/td>\u003ctd class=\"hcell he\">קָרָא\u003c/td>\u003ctd class=\"hcell he\">יִקְרָא\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">מָצְאָה\u003c/td>\u003ctd class=\"hcell he\">תִּמְצָא\u003c/td>\u003ctd class=\"hcell he\">קָרְאָה\u003c/td>\u003ctd class=\"hcell he\">תִּקְרָא\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">מָצָאנוּ\u003c/td>\u003ctd class=\"hcell he\">נִמְצָא\u003c/td>\u003ctd class=\"hcell he\">קָרָאנוּ\u003c/td>\u003ctd class=\"hcell he\">נִקְרָא\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתֶּם\u003c/td>\u003ctd class=\"hcell he\">מְצָאתֶם\u003c/td>\u003ctd class=\"hcell he\">תִּמְצְאוּ\u003c/td>\u003ctd class=\"hcell he\">קְרָאתֶם\u003c/td>\u003ctd class=\"hcell he\">תִּקְרְאוּ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">מָצְאוּ\u003c/td>\u003ctd class=\"hcell he\">יִמְצְאוּ\u003c/td>\u003ctd class=\"hcell he\">קָרְאוּ\u003c/td>\u003ctd class=\"hcell he\">יִקְרְאוּ\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003cdiv class=\"tbl-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Binyan\u003c/th>\u003cth>Passé — הוא\u003c/th>\u003cth>Passé — אני\u003c/th>\u003cth>Futur — הוא\u003c/th>\u003cth>Sens\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>נִפְעַל\u003c/td>\u003ctd class=\"hcell he\">נִמְצָא\u003c/td>\u003ctd class=\"hcell he\">נִמְצֵאתִי\u003c/td>\u003ctd class=\"hcell he\">יִימָּצֵא\u003c/td>\u003ctd>se trouver\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>פִּיעֵל\u003c/td>\u003ctd class=\"hcell he\">מִילֵּא\u003c/td>\u003ctd class=\"hcell he\">מִילֵּאתִי\u003c/td>\u003ctd class=\"hcell he\">יְמַלֵּא\u003c/td>\u003ctd>remplir\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>הִפְעִיל\u003c/td>\u003ctd class=\"hcell he\">הִמְצִיא\u003c/td>\u003ctd class=\"hcell he\">הִמְצֵאתִי\u003c/td>\u003ctd class=\"hcell he\">יַמְצִיא\u003c/td>\u003ctd>inventer\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>הִתְפַּעֵל\u003c/td>\u003ctd class=\"hcell he\">הִתְמַלֵּא\u003c/td>\u003ctd class=\"hcell he\">הִתְמַלֵּאתִי\u003c/td>\u003ctd class=\"hcell he\">יִתְמַלֵּא\u003c/td>\u003ctd>se remplir\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003cdiv class=\"note tip\">\u003cb>ל״א vs ל״ה — ne pas confondre\u003c/b>\n\u003cspan class=\"he\">מָצָאתִי\u003c/span> (ל״א, on garde le \u003cspan class=\"he\">א\u003c/span>) &nbsp;≠&nbsp; \u003cspan class=\"he\">קָנִיתִי\u003c/span> (ל״ה, le \u003cspan class=\"he\">ה\u003c/span> devient \u003cspan class=\"he\">י\u003c/span>).\u003cbr>\nLe couple le plus traître&nbsp;: \u003cspan class=\"he\">קָרָאתִי\u003c/span> «&nbsp;j'ai lu / appelé&nbsp;» (קרא) vs \u003cspan class=\"he\">קָרִיתִי\u003c/span>… qui n'existe pas — «&nbsp;c'est arrivé&nbsp;» se dit \u003cspan class=\"he\">קָרָה\u003c/span> et se conjugue \u003cspan class=\"he\">זֶה קָרָה\u003c/span>.\u003c/div>\n\u003c/div>\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>פ״א — 1\u003csup>re\u003c/sup> radicale \u003cspan class=\"he\">א\u003c/span>\u003c/summary>\n\u003cdiv class=\"detbody\">\n\u003cdiv class=\"note tip\">\u003cb>Au passé&nbsp;: totalement régulier\u003c/b>\n\u003cspan class=\"he\">אָמַרְתִּי, אָמַר, אָמְרָה, אָמְרוּ\u003c/span> · \u003cspan class=\"he\">אָכַלְתִּי, אָכַל\u003c/span> · \u003cspan class=\"he\">אָהַבְתִּי, אָהַב\u003c/span>.\u003c/div>\n\n\u003cp>Au futur, \u003cstrong>cinq verbes\u003c/strong> ont un traitement spécial (le \u003cspan class=\"he\">א\u003c/span> devient muet et le préfixe prend un \u003cem>holam\u003c/em>)&nbsp;: \u003cspan class=\"he\">אָמַר, אָכַל, אָבַד, אָבָה, אָפָה\u003c/span>.\u003c/p>\n\n\u003cdiv class=\"tbl-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth class=\"hcell he\">אָמַר futur\u003c/th>\u003cth class=\"hcell he\">אָכַל futur\u003c/th>\u003cth>Ktiv malé\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">אוֹמַר\u003c/td>\u003ctd class=\"hcell he\">אוֹכַל\u003c/td>\u003ctd class=\"hcell he\">אומר / אוכל\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">תֹּאמַר\u003c/td>\u003ctd class=\"hcell he\">תֹּאכַל\u003c/td>\u003ctd class=\"hcell he\">תאמר / תאכל\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">תֹּאמְרִי\u003c/td>\u003ctd class=\"hcell he\">תֹּאכְלִי\u003c/td>\u003ctd class=\"hcell he\">תאמרי / תאכלי\u003c/td>\u003c/tr>\n\u003ctr class=\"hl\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">יֹאמַר\u003c/td>\u003ctd class=\"hcell he\">יֹאכַל\u003c/td>\u003ctd class=\"hcell he\">יאמר / יאכל\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">נֹאמַר\u003c/td>\u003ctd class=\"hcell he\">נֹאכַל\u003c/td>\u003ctd class=\"hcell he\">נאמר / נאכל\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">יֹאמְרוּ\u003c/td>\u003ctd class=\"hcell he\">יֹאכְלוּ\u003c/td>\u003ctd class=\"hcell he\">יאמרו / יאכלו\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003cdiv class=\"note warn\">\u003cb>La 1\u003csup>re\u003c/sup> personne n'a qu'un seul \u003cspan class=\"he\">א\u003c/span>\u003c/b>\nOn écrit \u003cspan class=\"he\">אוֹמַר\u003c/span> / \u003cspan class=\"he\">אוֹמַר\u003c/span>, jamais ✗\u003cspan class=\"he\">אאמר\u003c/span>. L'hébreu refuse la séquence de deux \u003cspan class=\"he\">א\u003c/span>.\u003c/div>\n\n\u003cp>Les \u003cstrong>autres\u003c/strong> verbes פ״א suivent le schéma des gutturales ordinaires&nbsp;: \u003cspan class=\"he\">אָסַף → יֶאֱסוֹף\u003c/span>, \u003cspan class=\"he\">אָהַב → יֶאֱהַב\u003c/span>, \u003cspan class=\"he\">אָרַז → יֶאֱרוֹז\u003c/span>, \u003cspan class=\"he\">אָחַז → יֹאחַז\u003c/span> (celui-ci hésite).\u003c/p>\n\u003c/div>\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ע״ע — radicales redoublées (כְּפוּלִים) \u003cspan class=\"gz-tag\">plutôt littéraire\u003c/span>\u003c/summary>\n\u003cdiv class=\"detbody\">\n\u003cp>Racines dont les 2\u003csup>e\u003c/sup> et 3\u003csup>e\u003c/sup> radicales sont identiques&nbsp;: \u003cspan class=\"he\">ס־ב־ב, ג־ל־ל, ת־מ־ם, ק־ל־ל, ר־ע־ע, ח־ג־ג\u003c/span>.\u003c/p>\n\n\u003cdiv class=\"note\">\u003cb>En hébreu moderne, cette gzira est en voie de disparition\u003c/b>\nLa langue courante \u003cstrong>régularise\u003c/strong>&nbsp;: on dit \u003cspan class=\"he\">סָבַבְתִּי\u003c/span> plutôt que le classique \u003cspan class=\"he\">סַבּוֹתִי\u003c/span>, \u003cspan class=\"he\">חָגַגְנוּ\u003c/span> plutôt que \u003cspan class=\"he\">חַגּוֹנוּ\u003c/span>. Les formes classiques subsistent surtout en הפעיל et dans les textes soutenus.\u003c/div>\n\n\u003cdiv class=\"tbl-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth class=\"hcell he\">הֵקֵל הפעיל passé\u003c/th>\u003cth class=\"hcell he\">הֵקֵל futur\u003c/th>\u003cth class=\"hcell he\">חָגַג פעל passé\u003c/th>\u003cth class=\"hcell he\">חָגַג futur\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">הֵקַלְתִּי\u003c/td>\u003ctd class=\"hcell he\">אָקֵל\u003c/td>\u003ctd class=\"hcell he\">חָגַגְתִּי\u003c/td>\u003ctd class=\"hcell he\">אָחוֹג\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">הֵקַלְתָּ\u003c/td>\u003ctd class=\"hcell he\">תָּקֵל\u003c/td>\u003ctd class=\"hcell he\">חָגַגְתָּ\u003c/td>\u003ctd class=\"hcell he\">תָּחוֹג\u003c/td>\u003c/tr>\n\u003ctr class=\"hl\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">הֵקֵל\u003c/td>\u003ctd class=\"hcell he\">יָקֵל\u003c/td>\u003ctd class=\"hcell he\">חָגַג\u003c/td>\u003ctd class=\"hcell he\">יָחוֹג\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">הֵקֵלָּה\u003c/td>\u003ctd class=\"hcell he\">תָּקֵל\u003c/td>\u003ctd class=\"hcell he\">חָגְגָה\u003c/td>\u003ctd class=\"hcell he\">תָּחוֹג\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">הֵקַלְנוּ\u003c/td>\u003ctd class=\"hcell he\">נָקֵל\u003c/td>\u003ctd class=\"hcell he\">חָגַגְנוּ\u003c/td>\u003ctd class=\"hcell he\">נָחוֹג\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">הֵקֵלּוּ\u003c/td>\u003ctd class=\"hcell he\">יָקֵלּוּ\u003c/td>\u003ctd class=\"hcell he\">חָגְגוּ\u003c/td>\u003ctd class=\"hcell he\">יָחוֹגּוּ\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Autres הפעיל courants de cette famille&nbsp;: \u003cspan class=\"he\">הֵגֵן\u003c/span> (protéger) → \u003cspan class=\"he\">הֵגַנְתִּי, יָגֵן\u003c/span>&nbsp;; \u003cspan class=\"he\">הֵסֵב\u003c/span> (détourner) → \u003cspan class=\"he\">הֵסַבְתִּי, יָסֵב\u003c/span>&nbsp;; \u003cspan class=\"he\">הֵחֵל\u003c/span> (commencer, littéraire) → \u003cspan class=\"he\">הֵחַלְתִּי, יָחֵל\u003c/span>.\u003c/p>\n\u003c/div>\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>מְרוּבָּעִים — racines à quatre lettres\u003c/summary>\n\u003cdiv class=\"detbody\">\n\u003cp>Racines à quatre consonnes, souvent formées sur des emprunts ou par redoublement&nbsp;: \u003cspan class=\"he\">ט־ל־פ־ן, ת־ר־ג־ם, א־ר־ג־ן, ש־כ־נ־ע, פ־ר־ס־ם, ג־ל־ג־ל, ס־מ־ס\u003c/span>.\u003c/p>\n\n\u003cdiv class=\"note tip\">\u003cb>Aucune règle nouvelle à apprendre\u003c/b>\nElles se coulent dans le moule du \u003cstrong>פיעל\u003c/strong> (actif), du \u003cstrong>פועל\u003c/strong> (passif) ou du \u003cstrong>התפעל\u003c/strong> (réfléchi), avec exactement les mêmes affixes.\u003c/div>\n\n\u003cdiv class=\"tbl-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth class=\"hcell he\">טִלְפֵּן passé\u003c/th>\u003cth class=\"hcell he\">טִלְפֵּן futur\u003c/th>\u003cth class=\"hcell he\">הִתְאַרְגֵּן passé\u003c/th>\u003cth class=\"hcell he\">הִתְאַרְגֵּן futur\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">טִלְפַּנְתִּי\u003c/td>\u003ctd class=\"hcell he\">אֲטַלְפֵּן\u003c/td>\u003ctd class=\"hcell he\">הִתְאַרְגַּנְתִּי\u003c/td>\u003ctd class=\"hcell he\">אֶתְאַרְגֵּן\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">טִלְפַּנְתָּ\u003c/td>\u003ctd class=\"hcell he\">תְּטַלְפֵּן\u003c/td>\u003ctd class=\"hcell he\">הִתְאַרְגַּנְתָּ\u003c/td>\u003ctd class=\"hcell he\">תִּתְאַרְגֵּן\u003c/td>\u003c/tr>\n\u003ctr class=\"hl\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">טִלְפֵּן\u003c/td>\u003ctd class=\"hcell he\">יְטַלְפֵּן\u003c/td>\u003ctd class=\"hcell he\">הִתְאַרְגֵּן\u003c/td>\u003ctd class=\"hcell he\">יִתְאַרְגֵּן\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">טִלְפְּנָה\u003c/td>\u003ctd class=\"hcell he\">תְּטַלְפֵּן\u003c/td>\u003ctd class=\"hcell he\">הִתְאַרְגְּנָה\u003c/td>\u003ctd class=\"hcell he\">תִּתְאַרְגֵּן\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">טִלְפַּנּוּ\u003c/td>\u003ctd class=\"hcell he\">נְטַלְפֵּן\u003c/td>\u003ctd class=\"hcell he\">הִתְאַרְגַּנּוּ\u003c/td>\u003ctd class=\"hcell he\">נִתְאַרְגֵּן\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">טִלְפְּנוּ\u003c/td>\u003ctd class=\"hcell he\">יְטַלְפְּנוּ\u003c/td>\u003ctd class=\"hcell he\">הִתְאַרְגְּנוּ\u003c/td>\u003ctd class=\"hcell he\">יִתְאַרְגְּנוּ\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp style=\"font-size:.92rem\">Passif&nbsp;: \u003cspan class=\"he\">תּוּרְגַּם\u003c/span> (il a été traduit) → \u003cspan class=\"he\">יְתוּרְגַּם\u003c/span>&nbsp;; \u003cspan class=\"he\">פּוּרְסַם\u003c/span> (il a été publié) → \u003cspan class=\"he\">יְפוּרְסַם\u003c/span>.\u003c/p>\n\u003c/div>\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>Verbes gutturaux — \u003cspan class=\"he\">א ה ח ע ר\u003c/span> dans la racine\u003c/summary>\n\u003cdiv class=\"detbody\">\n\u003cp>Ce n'est pas une gzira à part entière mais un jeu de contraintes phonétiques transversal. Trois règles couvrent presque tout&nbsp;:\u003c/p>\n\u003col>\n\u003cli>\u003cb>Les gutturales refusent le shva simple\u003c/b> → il devient \u003cem>hataf\u003c/em> (\u003cspan class=\"he\">ֲ ֱ ֳ\u003c/span>)&nbsp;: \u003cspan class=\"he\">יַעֲמוֹד\u003c/span>, \u003cspan class=\"he\">יֶאֱסוֹף\u003c/span>, \u003cspan class=\"he\">הֶעֱבִיר\u003c/span>.\u003c/li>\n\u003cli>\u003cb>Les gutturales refusent le daguesh\u003c/b> → allongement compensatoire de la voyelle précédente&nbsp;: פיעל \u003cspan class=\"he\">בֵּרֵךְ\u003c/span> au lieu de ✗\u003cspan class=\"he\">בִּרֵּךְ\u003c/span>&nbsp;; נפעל \u003cspan class=\"he\">יֵעָשֶׂה\u003c/span> au lieu de ✗\u003cspan class=\"he\">יֵעָּשֶׂה\u003c/span>.\u003c/li>\n\u003cli>\u003cb>Une gutturale finale (\u003cspan class=\"he\">ח ע ה\u003c/span>) attire un \u003cem>patah furtif\u003c/em>\u003c/b>&nbsp;: \u003cspan class=\"he\">שָׁמֵחַ\u003c/span>, \u003cspan class=\"he\">הִגִּיעַ\u003c/span>, \u003cspan class=\"he\">יִשְׁלַח\u003c/span>, \u003cspan class=\"he\">יוֹדִיעַ\u003c/span> — on prononce un bref \u003cspan class=\"tr\">a\u003c/span> avant la consonne.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"tbl-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Position\u003c/th>\u003cth>Verbe\u003c/th>\u003cth>Passé — אני\u003c/th>\u003cth>Futur — הוא\u003c/th>\u003cth>Remarque\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>פ gutturale\u003c/td>\u003ctd class=\"hcell he\">עָמַד\u003c/td>\u003ctd class=\"hcell he\">עָמַדְתִּי\u003c/td>\u003ctd class=\"hcell he\">יַעֲמוֹד\u003c/td>\u003ctd>préfixe en patah + hataf\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>פ gutturale\u003c/td>\u003ctd class=\"hcell he\">חָשַׁב\u003c/td>\u003ctd class=\"hcell he\">חָשַׁבְתִּי\u003c/td>\u003ctd class=\"hcell he\">יַחְשׁוֹב\u003c/td>\u003ctd>\u003cspan class=\"he\">ח\u003c/span> tolère le shva\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ע gutturale\u003c/td>\u003ctd class=\"hcell he\">שָׁאַל\u003c/td>\u003ctd class=\"hcell he\">שָׁאַלְתִּי\u003c/td>\u003ctd class=\"hcell he\">יִשְׁאַל\u003c/td>\u003ctd>futur en patah obligatoire\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ל gutturale\u003c/td>\u003ctd class=\"hcell he\">שָׁמַע\u003c/td>\u003ctd class=\"hcell he\">שָׁמַעְתִּי\u003c/td>\u003ctd class=\"hcell he\">יִשְׁמַע\u003c/td>\u003ctd>futur en patah obligatoire\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>פ gutturale, הפעיל\u003c/td>\u003ctd class=\"hcell he\">הֶחְלִיט\u003c/td>\u003ctd class=\"hcell he\">הֶחְלַטְתִּי\u003c/td>\u003ctd class=\"hcell he\">יַחְלִיט\u003c/td>\u003ctd>segol au passé, patah au futur\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003c/section>\n\n\u003chr>\n\n\u003csection id=\"irreg\">\n\u003ch2>\u003cspan class=\"num\">5.\u003c/span> Les huit verbes vraiment irréguliers\u003c/h2>\n\u003cp>Ceux-là ne se déduisent d'aucune règle. Ce sont aussi les plus fréquents de la langue&nbsp;: apprenez-les par cœur, le retour sur investissement est maximal.\u003c/p>\n\n\u003cdiv class=\"tbl-wrap\">\n\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Verbe\u003c/th>\u003cth>Passé complet\u003c/th>\u003cth>Futur complet\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cb class=\"he\">הָיָה\u003c/b>\u003cbr>\u003cspan class=\"tr\">être\u003c/span>\u003c/td>\n\u003ctd class=\"hcell he\">הָיִיתִי · הָיִיתָ · הָיִית · הָיָה · הָיְתָה · הָיִינוּ · הֱיִיתֶם · הָיוּ\u003c/td>\n\u003ctd class=\"hcell he\">אֶהְיֶה · תִּהְיֶה · תִּהְיִי · יִהְיֶה · תִּהְיֶה · נִהְיֶה · תִּהְיוּ · יִהְיוּ\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cb class=\"he\">הָלַךְ\u003c/b>\u003cbr>\u003cspan class=\"tr\">aller\u003c/span>\u003c/td>\n\u003ctd class=\"hcell he\">הָלַכְתִּי · הָלַכְתָּ · הָלַכְתְּ · הָלַךְ · הָלְכָה · הָלַכְנוּ · הֲלַכְתֶּם · הָלְכוּ\u003c/td>\n\u003ctd class=\"hcell he\">אֵלֵךְ · תֵּלֵךְ · תֵּלְכִי · יֵלֵךְ · תֵּלֵךְ · נֵלֵךְ · תֵּלְכוּ · יֵלְכוּ\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cb class=\"he\">נָתַן\u003c/b>\u003cbr>\u003cspan class=\"tr\">donner\u003c/span>\u003c/td>\n\u003ctd class=\"hcell he\">נָתַתִּי · נָתַתָּ · נָתַתְּ · נָתַן · נָתְנָה · נָתַנּוּ · נְתַתֶּם · נָתְנוּ\u003c/td>\n\u003ctd class=\"hcell he\">אֶתֵּן · תִּתֵּן · תִּתְּנִי · יִתֵּן · תִּתֵּן · נִתֵּן · תִּתְּנוּ · יִתְּנוּ\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cb class=\"he\">לָקַח\u003c/b>\u003cbr>\u003cspan class=\"tr\">prendre\u003c/span>\u003c/td>\n\u003ctd class=\"hcell he\">לָקַחְתִּי · לָקַחְתָּ · לָקַחַתְּ · לָקַח · לָקְחָה · לָקַחְנוּ · לְקַחְתֶּם · לָקְחוּ\u003c/td>\n\u003ctd class=\"hcell he\">אֶקַּח · תִּקַּח · תִּקְּחִי · יִקַּח · תִּקַּח · נִקַּח · תִּקְּחוּ · יִקְּחוּ\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cb class=\"he\">יָכוֹל\u003c/b>\u003cbr>\u003cspan class=\"tr\">pouvoir\u003c/span>\u003c/td>\n\u003ctd class=\"hcell he\">יָכוֹלְתִּי · יָכוֹלְתָּ · יָכוֹלְתְּ · יָכוֹל · יָכְלָה · יָכוֹלְנוּ · יְכָלְתֶּם · יָכְלוּ\u003c/td>\n\u003ctd class=\"hcell he\">אוּכַל · תּוּכַל · תּוּכְלִי · יוּכַל · תּוּכַל · נוּכַל · תּוּכְלוּ · יוּכְלוּ\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cb class=\"he\">בָּא\u003c/b>\u003cbr>\u003cspan class=\"tr\">venir\u003c/span>\u003c/td>\n\u003ctd class=\"hcell he\">בָּאתִי · בָּאתָ · בָּאת · בָּא · בָּאָה · בָּאנוּ · בָּאתֶם · בָּאוּ\u003c/td>\n\u003ctd class=\"hcell he\">אָבוֹא · תָּבוֹא · תָּבוֹאִי · יָבוֹא · תָּבוֹא · נָבוֹא · תָּבוֹאוּ · יָבוֹאוּ\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cb class=\"he\">נִגַּשׁ\u003c/b>\u003cbr>\u003cspan class=\"tr\">s'approcher\u003c/span>\u003c/td>\n\u003ctd class=\"hcell he\">נִיגַּשְׁתִּי · נִיגַּשְׁתָּ · נִיגַּשְׁתְּ · נִיגַּשׁ · נִיגְּשָׁה · נִיגַּשְׁנוּ · נִיגַּשְׁתֶּם · נִיגְּשׁוּ\u003c/td>\n\u003ctd class=\"hcell he\">אֶגַּשׁ · תִּגַּשׁ · תִּגְּשִׁי · יִגַּשׁ · תִּגַּשׁ · נִיגַּשׁ · תִּגְּשׁוּ · יִגְּשׁוּ\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cb class=\"he\">עָשָׂה\u003c/b>\u003cbr>\u003cspan class=\"tr\">faire\u003c/span>\u003c/td>\n\u003ctd class=\"hcell he\">עָשִׂיתִי · עָשִׂיתָ · עָשִׂית · עָשָׂה · עָשְׂתָה · עָשִׂינוּ · עֲשִׂיתֶם · עָשׂוּ\u003c/td>\n\u003ctd class=\"hcell he\">אֶעֱשֶׂה · תַּעֲשֶׂה · תַּעֲשִׂי · יַעֲשֶׂה · תַּעֲשֶׂה · נַעֲשֶׂה · תַּעֲשׂוּ · יַעֲשׂוּ\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\n\u003cdiv class=\"note warn\">\n\u003cb>Le cas particulier de \u003cspan class=\"he\">הָיָה\u003c/span>\u003c/b>\nL'hébreu n'a \u003cstrong>pas\u003c/strong> de verbe « être » au présent&nbsp;: on dit \u003cspan class=\"he\">אֲנִי רוֹפֵא\u003c/span> «&nbsp;je suis médecin&nbsp;», sans copule. Mais au passé et au futur, \u003cspan class=\"he\">הָיָה\u003c/span> devient obligatoire&nbsp;:\u003cbr>\n\u003cspan class=\"he\">הָיִיתִי רוֹפֵא\u003c/span> «&nbsp;j'étais médecin&nbsp;» · \u003cspan class=\"he\">אֶהְיֶה רוֹפֵא\u003c/span> «&nbsp;je serai médecin&nbsp;».\u003cbr>\nC'est l'une des différences les plus déroutantes pour un francophone&nbsp;: le verbe « apparaît » quand on quitte le présent.\n\u003c/div>\n\u003c/section>\n\n\u003chr>\n\n\u003csection id=\"emplois\">\n\u003ch2>\u003cspan class=\"num\">6.\u003c/span> Emplois et syntaxe\u003c/h2>\n\n\u003ch3>6.1 · Ce que recouvre le passé hébreu\u003c/h3>\n\u003cp>L'hébreu n'a \u003cstrong>qu'un seul\u003c/strong> temps du passé. Il absorbe à lui seul quatre temps français&nbsp;:\u003c/p>\n\u003cdiv class=\"tbl-wrap\">\n\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Hébreu\u003c/th>\u003cth>Français possible\u003c/th>\u003cth>Exemple\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd rowspan=\"4\" class=\"hcell he\" style=\"font-size:1.5em;vertical-align:middle\">כָּתַבְתִּי\u003c/td>\u003ctd>passé composé\u003c/td>\u003ctd>j'ai écrit\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>passé simple\u003c/td>\u003ctd>j'écrivis\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>imparfait (ponctuel)\u003c/td>\u003ctd>j'écrivais\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>plus-que-parfait\u003c/td>\u003ctd>j'avais écrit\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003cp>La distinction aspectuelle se fait par des \u003cstrong>adverbes\u003c/strong> et par le contexte, pas par la morphologie&nbsp;: \u003cspan class=\"he\">כְּבָר\u003c/span> (déjà), \u003cspan class=\"he\">עֲדַיִין לֹא\u003c/span> (pas encore), \u003cspan class=\"he\">אָז\u003c/span> (alors), \u003cspan class=\"he\">פִּתְאוֹם\u003c/span> (soudain), \u003cspan class=\"he\">בְּדִיּוּק\u003c/span> (juste).\u003c/p>\n\n\u003ch3>6.2 · \u003cspan class=\"he\">הָיָה\u003c/span> + participe = l'imparfait d'habitude et le conditionnel\u003c/h3>\n\u003cp>Pour exprimer une action \u003cstrong>répétée\u003c/strong> dans le passé, ou un \u003cstrong>conditionnel\u003c/strong>, l'hébreu combine \u003cspan class=\"he\">הָיָה\u003c/span> conjugué au passé avec le participe présent (בֵּינוֹנִי).\u003c/p>\n\u003cdiv class=\"formula\">\u003cspan class=\"he he-lg\">הָיָה\u003c/span> (passé, accordé) &nbsp;+&nbsp; \u003cspan class=\"he he-lg\">בֵּינוֹנִי\u003c/span> (participe présent)\u003c/div>\n\u003cdiv class=\"tbl-wrap\">\n\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Hébreu\u003c/th>\u003cth>Valeur\u003c/th>\u003cth>Français\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"hcell he\">כָּל יוֹם הָיִיתִי הוֹלֵךְ לַיָּם\u003c/td>\u003ctd>habitude\u003c/td>\u003ctd>Chaque jour j'allais à la mer\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"hcell he\">הִיא הָיְתָה קוֹרֵאת הַרְבֵּה\u003c/td>\u003ctd>habitude\u003c/td>\u003ctd>Elle lisait beaucoup\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"hcell he\">הָיִיתִי שָׂמֵחַ לַעֲזוֹר\u003c/td>\u003ctd>conditionnel poli\u003c/td>\u003ctd>Je serais heureux d'aider\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"hcell he\">אִם הָיָה לִי זְמַן, הָיִיתִי בָּא\u003c/td>\u003ctd>irréel\u003c/td>\u003ctd>Si j'avais du temps, je viendrais\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\n\u003ch3>6.3 · L'existence et la possession au passé et au futur\u003c/h3>\n\u003cdiv class=\"tbl-wrap\">\n\u003ctable>\n\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Présent\u003c/th>\u003cth>Passé\u003c/th>\u003cth>Futur\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>Il y a\u003c/td>\u003ctd class=\"hcell he\">יֵשׁ\u003c/td>\u003ctd class=\"hcell he\">הָיָה / הָיְתָה / הָיוּ\u003c/td>\u003ctd class=\"hcell he\">יִהְיֶה / תִּהְיֶה / יִהְיוּ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Il n'y a pas\u003c/td>\u003ctd class=\"hcell he\">אֵין\u003c/td>\u003ctd class=\"hcell he\">לֹא הָיָה\u003c/td>\u003ctd class=\"hcell he\">לֹא יִהְיֶה\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>J'ai\u003c/td>\u003ctd class=\"hcell he\">יֵשׁ לִי\u003c/td>\u003ctd class=\"hcell he\">הָיָה לִי\u003c/td>\u003ctd class=\"hcell he\">יִהְיֶה לִי\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Je n'ai pas\u003c/td>\u003ctd class=\"hcell he\">אֵין לִי\u003c/td>\u003ctd class=\"hcell he\">לֹא הָיָה לִי\u003c/td>\u003ctd class=\"hcell he\">לֹא יִהְיֶה לִי\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003cdiv class=\"note warn\">\n\u003cb>L'accord se fait avec l'objet possédé, pas avec le possesseur\u003c/b>\n\u003cspan class=\"he\">הָיְתָה לִי מְכוֹנִית\u003c/span> «&nbsp;j'avais une voiture&nbsp;» — \u003cspan class=\"he\">הָיְתָה\u003c/span> est au féminin parce que \u003cspan class=\"he\">מְכוֹנִית\u003c/span> l'est.\u003cbr>\n\u003cspan class=\"he\">הָיוּ לָנוּ הַרְבֵּה חֲבֵרִים\u003c/span> «&nbsp;nous avions beaucoup d'amis&nbsp;» — pluriel.\u003cbr>\n\u003cspan class=\"he\">יִהְיוּ לְךָ בְּעָיוֹת\u003c/span> «&nbsp;tu auras des problèmes&nbsp;».\u003cbr>\nC'est l'inverse du réflexe français.\n\u003c/div>\n\n\u003ch3>6.4 · Les modaux au passé et au futur\u003c/h3>\n\u003cp>Les mots \u003cspan class=\"he\">צָרִיךְ, יָכוֹל, רוֹצֶה, כְּדַאי, אֶפְשָׁר, מֻתָּר, אָסוּר\u003c/span> ne sont pas tous des verbes. Les non-verbes se mettent au passé avec \u003cspan class=\"he\">הָיָה\u003c/span>&nbsp;:\u003c/p>\n\u003cdiv class=\"tbl-wrap\">\n\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Présent\u003c/th>\u003cth>Passé\u003c/th>\u003cth>Futur\u003c/th>\u003cth>Sens\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"hcell he\">אֲנִי צָרִיךְ\u003c/td>\u003ctd class=\"hcell he\">הָיִיתִי צָרִיךְ\u003c/td>\u003ctd class=\"hcell he\">אֶהְיֶה צָרִיךְ\u003c/td>\u003ctd>je dois / je devais\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"hcell he\">אֲנִי רוֹצֶה\u003c/td>\u003ctd class=\"hcell he\">רָצִיתִי\u003c/td>\u003ctd class=\"hcell he\">אֶרְצֶה\u003c/td>\u003ctd>vrai verbe (ל״ה)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"hcell he\">אֲנִי יָכוֹל\u003c/td>\u003ctd class=\"hcell he\">יָכוֹלְתִּי\u003c/td>\u003ctd class=\"hcell he\">אוּכַל\u003c/td>\u003ctd>vrai verbe\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"hcell he\">אֶפְשָׁר\u003c/td>\u003ctd class=\"hcell he\">הָיָה אֶפְשָׁר\u003c/td>\u003ctd class=\"hcell he\">יִהְיֶה אֶפְשָׁר\u003c/td>\u003ctd>il est possible\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"hcell he\">כְּדַאי לִי\u003c/td>\u003ctd class=\"hcell he\">הָיָה כְּדַאי לִי\u003c/td>\u003ctd class=\"hcell he\">יִהְיֶה כְּדַאי לִי\u003c/td>\u003ctd>il vaut mieux que je…\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"hcell he\">אָסוּר\u003c/td>\u003ctd class=\"hcell he\">הָיָה אָסוּר\u003c/td>\u003ctd class=\"hcell he\">יִהְיֶה אָסוּר\u003c/td>\u003ctd>il est interdit\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\n\u003ch3>6.5 · Ce que recouvre le futur hébreu\u003c/h3>\n\u003cdiv class=\"tbl-wrap\">\n\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Valeur\u003c/th>\u003cth>Exemple\u003c/th>\u003cth>Français\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>Futur simple\u003c/td>\u003ctd class=\"hcell he\">מָחָר אֶסַּע לְחֵיפָה\u003c/td>\u003ctd>Demain j'irai à Haïfa\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Intention / volonté\u003c/td>\u003ctd class=\"hcell he\">אֲנִי אֲטַפֵּל בָּזֶה\u003c/td>\u003ctd>Je vais m'en occuper\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Impératif adouci\u003c/td>\u003ctd class=\"hcell he\">תַּגִּיד לִי, בְּבַקָּשָׁה\u003c/td>\u003ctd>Dis-moi, s'il te plaît\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Défense (avec \u003cspan class=\"he\">אַל\u003c/span>)\u003c/td>\u003ctd class=\"hcell he\">אַל תִּשְׁכַּח!\u003c/td>\u003ctd>N'oublie pas&nbsp;!\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Subjonctif après \u003cspan class=\"he\">שֶׁ־\u003c/span>\u003c/td>\u003ctd class=\"hcell he\">אֲנִי רוֹצֶה שֶׁתָּבוֹא\u003c/td>\u003ctd>Je veux que tu viennes\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>But (\u003cspan class=\"he\">כְּדֵי שֶׁ־\u003c/span>)\u003c/td>\u003ctd class=\"hcell he\">בָּאתִי כְּדֵי שֶׁנְּדַבֵּר\u003c/td>\u003ctd>Je suis venu pour qu'on parle\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Condition réelle\u003c/td>\u003ctd class=\"hcell he\">אִם תִּרְצֶה, נֵלֵךְ\u003c/td>\u003ctd>Si tu veux, on ira\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Éventualité\u003c/td>\u003ctd class=\"hcell he\">אוּלַי יַגִּיעַ מְאֻחָר\u003c/td>\u003ctd>Il arrivera peut-être tard\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\n\u003cdiv class=\"note tip\">\n\u003cb>Après \u003cspan class=\"he\">כְּשֶׁ־\u003c/span> et \u003cspan class=\"he\">אִם\u003c/span>, l'hébreu met le futur\u003c/b>\nComme en français, contrairement à l'anglais&nbsp;: \u003cspan class=\"he\">כְּשֶׁאַגִּיעַ, אֲטַלְפֵּן לְךָ\u003c/span> «&nbsp;quand j'arriverai, je t'appellerai&nbsp;». \u003cbr>\nMais attention à \u003cspan class=\"he\">אַחֲרֵי שֶׁ־\u003c/span> et \u003cspan class=\"he\">לִפְנֵי שֶׁ־\u003c/span>&nbsp;: le temps suit la logique du récit — \u003cspan class=\"he\">אַחֲרֵי שֶׁאָכַלְתִּי הָלַכְתִּי\u003c/span> (passé) / \u003cspan class=\"he\">אַחֲרֵי שֶׁאוֹכַל אֵלֵךְ\u003c/span> (futur).\n\u003c/div>\n\n\u003ch3>6.6 · Un mot sur le \u003cspan class=\"he\">וָי״ו הַהִיפּוּךְ\u003c/span> biblique\u003c/h3>\n\u003cp>Dans la Bible, un \u003cspan class=\"he\">וַ־\u003c/span> placé devant une forme de futur lui donne un sens de \u003cstrong>passé\u003c/strong>, et inversement. C'est le fameux \u003cem>vav conversif\u003c/em>&nbsp;:\u003c/p>\n\u003cdiv class=\"tbl-wrap\">\n\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Forme\u003c/th>\u003cth>Sens biblique\u003c/th>\u003cth>Sens en hébreu moderne\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"hcell he\">וַיֹּאמֶר\u003c/td>\u003ctd>et il dit (passé)\u003c/td>\u003ctd class=\"hcell he\">וְאָמַר / הוּא אָמַר\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"hcell he\">וַיְהִי\u003c/td>\u003ctd>et il advint (passé)\u003c/td>\u003ctd class=\"hcell he\">וְהָיָה\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"hcell he\">וְהָיָה\u003c/td>\u003ctd>et il adviendra (futur)\u003c/td>\u003ctd class=\"hcell he\">וְיִהְיֶה\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003cp>Vous ne l'emploierez jamais en hébreu moderne, mais vous le rencontrerez à chaque page de la Torah, dans la liturgie, et dans des expressions figées (\u003cspan class=\"he\">וַיְהִי הַיּוֹם\u003c/span>, \u003cspan class=\"he\">וַיְהִי אוֹר\u003c/span>).\u003c/p>\n\u003c/section>\n\n\u003chr>\n\n\u003csection id=\"pieges\">\n\u003ch2>\u003cspan class=\"num\">7.\u003c/span> Les dix erreurs les plus fréquentes\u003c/h2>\n\u003cdiv class=\"tbl-wrap\">\n\u003ctable>\n\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>✗ Incorrect\u003c/th>\u003cth>✓ Correct\u003c/th>\u003cth>Pourquoi\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd class=\"hcell he\" style=\"color:var(--warn)\">הִרְגִּישְׁתִּי\u003c/td>\u003ctd class=\"hcell he\" style=\"color:var(--ok)\">הִרְגַּשְׁתִּי\u003c/td>\u003ctd>Le \u003cspan class=\"he\">י\u003c/span> du הפעיל tombe aux 1\u003csup>re\u003c/sup>/2\u003csup>e\u003c/sup> personnes du passé\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd class=\"hcell he\" style=\"color:var(--warn)\">הֵבִינְתִּי\u003c/td>\u003ctd class=\"hcell he\" style=\"color:var(--ok)\">הֵבַנְתִּי\u003c/td>\u003ctd>Même règle, verbe creux en הפעיל\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd class=\"hcell he\" style=\"color:var(--warn)\">קָנֵיתִי\u003c/td>\u003ctd class=\"hcell he\" style=\"color:var(--ok)\">קָנִיתִי\u003c/td>\u003ctd>פעל ל״ה prend \u003cem>hiriq\u003c/em>&nbsp;; le \u003cem>tsere\u003c/em> est réservé aux autres binyanim\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd class=\"hcell he\" style=\"color:var(--warn)\">נָתַנְתִּי\u003c/td>\u003ctd class=\"hcell he\" style=\"color:var(--ok)\">נָתַתִּי\u003c/td>\u003ctd>Le \u003cspan class=\"he\">נ\u003c/span> final de \u003cspan class=\"he\">נתן\u003c/span> s'assimile au \u003cspan class=\"he\">ת\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5\u003c/td>\u003ctd class=\"hcell he\" style=\"color:var(--warn)\">אֲדִיבֵּר\u003c/td>\u003ctd class=\"hcell he\" style=\"color:var(--ok)\">אֲדַבֵּר\u003c/td>\u003ctd>Le \u003cspan class=\"he\">י\u003c/span> orthographique du פיעל n'existe qu'au passé\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>6\u003c/td>\u003ctd class=\"hcell he\" style=\"color:var(--warn)\">יִכְתּוֹבוּ\u003c/td>\u003ctd class=\"hcell he\" style=\"color:var(--ok)\">יִכְתְּבוּ\u003c/td>\u003ctd>La voyelle du thème tombe devant le suffixe \u003cspan class=\"he\">־וּ\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>7\u003c/td>\u003ctd class=\"hcell he\" style=\"color:var(--warn)\">לֹא תֵּלֵךְ! \u003cspan class=\"tr\">(ordre)\u003c/span>\u003c/td>\u003ctd class=\"hcell he\" style=\"color:var(--ok)\">אַל תֵּלֵךְ!\u003c/td>\u003ctd>La défense se construit avec \u003cspan class=\"he\">אַל\u003c/span>, jamais \u003cspan class=\"he\">לֹא\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>8\u003c/td>\u003ctd class=\"hcell he\" style=\"color:var(--warn)\">הָיָה לִי מְכוֹנִית\u003c/td>\u003ctd class=\"hcell he\" style=\"color:var(--ok)\">הָיְתָה לִי מְכוֹנִית\u003c/td>\u003ctd>Accord avec l'objet possédé, pas avec le possesseur\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>9\u003c/td>\u003ctd class=\"hcell he\" style=\"color:var(--warn)\">אֲנִי הָיִיתִי רוֹפֵא \u003cspan class=\"tr\">(= je suis)\u003c/span>\u003c/td>\u003ctd class=\"hcell he\" style=\"color:var(--ok)\">אֲנִי רוֹפֵא\u003c/td>\u003ctd>Pas de copule au présent&nbsp;; \u003cspan class=\"he\">היה\u003c/span> n'apparaît qu'au passé/futur\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>10\u003c/td>\u003ctd class=\"hcell he\" style=\"color:var(--warn)\">אֶעֱשֶׂהתִי\u003c/td>\u003ctd class=\"hcell he\" style=\"color:var(--ok)\">עָשִׂיתִי\u003c/td>\u003ctd>Ne jamais mélanger un préfixe de futur avec un suffixe de passé\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003c/section>\n\n\u003chr>\n\n\u003csection id=\"recap\">\n\u003ch2>\u003cspan class=\"num\">8.\u003c/span> Antisèche\u003c/h2>\n\n\u003cdiv class=\"grid2\">\n\u003cdiv class=\"card\" style=\"border-top:3px solid var(--past)\">\n\u003ch4 style=\"margin-top:0\">Passé — les 9 suffixes\u003c/h4>\n\u003cp class=\"he\" style=\"font-size:1.35em;line-height:2.2;margin:0\">\n־ְתִּי · ־ְתָּ · ־ְתְּ · ∅ · ־ָה\u003cbr>\n־ְנוּ · ־ְתֶּם · ־ְתֶּן · ־וּ\n\u003c/p>\n\u003cp style=\"font-size:.88rem;margin:10px 0 0;color:var(--ink-soft)\">Identiques dans les 7 binyanim et toutes les gzarot.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"card\" style=\"border-top:3px solid var(--fut)\">\n\u003ch4 style=\"margin-top:0\">Futur — les 4 préfixes\u003c/h4>\n\u003cp class=\"he\" style=\"font-size:1.35em;line-height:2.2;margin:0\">\nאֶ־ (moi) · תִּ־ (toi, elle, vous)\u003cbr>\nיִ־ (lui, eux) · נִ־ (nous)\n\u003c/p>\n\u003cp style=\"font-size:.88rem;margin:10px 0 0;color:var(--ink-soft)\">+ suffixe \u003cspan class=\"he\">־ִי\u003c/span> (tu f.) et \u003cspan class=\"he\">־וּ\u003c/span> (pluriel).\u003c/p>\n\u003c/div>\n\u003c/div>\n\n\u003ch4>Reconnaître un binyan en une seconde\u003c/h4>\n\u003cdiv class=\"tbl-wrap\">\n\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Binyan\u003c/th>\u003cth>Passé — indice\u003c/th>\u003cth>Futur — indice\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd style=\"color:var(--paal)\">\u003cb>פָּעַל\u003c/b>\u003c/td>\u003ctd>rien devant la racine\u003c/td>\u003ctd>préfixe \u003cspan class=\"tr\">yi-\u003c/span>, thème court\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"color:var(--nifal)\">\u003cb>נִפְעַל\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"he\">נ־\u003c/span> devant\u003c/td>\u003ctd>\u003cspan class=\"tr\">yi-\u003c/span> + double yod à l'écrit \u003cspan class=\"he\">יי\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"color:var(--piel)\">\u003cb>פִּיעֵל\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"he\">י\u003c/span> écrit après R1 \u003cspan class=\"he\">(דיבר)\u003c/span>\u003c/td>\u003ctd>préfixe \u003cspan class=\"tr\">ye-\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"color:var(--pual)\">\u003cb>פּוּעַל\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"he\">ו\u003c/span> écrit après R1 \u003cspan class=\"he\">(בוטל)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"tr\">ye-\u003c/span> + \u003cem>ou\u003c/em>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"color:var(--hifil)\">\u003cb>הִפְעִיל\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"he\">ה־\u003c/span> + \u003cspan class=\"he\">י\u003c/span> (3\u003csup>e\u003c/sup> pers. seulement)\u003c/td>\u003ctd>préfixe \u003cspan class=\"tr\">ya-\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"color:var(--hufal)\">\u003cb>הוּפְעַל\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"he\">הו־\u003c/span> devant\u003c/td>\u003ctd>préfixe \u003cspan class=\"tr\">you-\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"color:var(--hitpael)\">\u003cb>הִתְפַּעֵל\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"he\">הת־\u003c/span> devant\u003c/td>\u003ctd>préfixe \u003cspan class=\"tr\">yit-\u003c/span>\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\n\u003ch4>Les cinq réflexes qui évitent 80&nbsp;% des fautes\u003c/h4>\n\u003col>\n\u003cli>\u003cb>הפעיל au passé&nbsp;:\u003c/b> le \u003cspan class=\"he\">י\u003c/span> ne survit qu'à la 3\u003csup>e\u003c/sup> personne.\u003c/li>\n\u003cli>\u003cb>Suffixe vocalique = la voyelle du thème tombe&nbsp;:\u003c/b> \u003cspan class=\"he\">כָּתְבָה, יִכְתְּבוּ, דִּבְּרוּ\u003c/span>.\u003c/li>\n\u003cli>\u003cb>ל״ה&nbsp;:\u003c/b> passé en \u003cspan class=\"he\">־ִיתִי\u003c/span>, 3\u003csup>e\u003c/sup> pers. en \u003cspan class=\"he\">־ָה / ־ְתָה / ־וּ\u003c/span>&nbsp;; futur en \u003cspan class=\"he\">־ֶה\u003c/span>.\u003c/li>\n\u003cli>\u003cb>Verbes creux&nbsp;:\u003c/b> passé sans la voyelle longue, futur avec — et préfixe en \u003cem>qamats\u003c/em>.\u003c/li>\n\u003cli>\u003cb>פ״נ et פ״י&nbsp;:\u003c/b> réguliers au passé, déformés au futur seulement.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\n\u003cfooter>\nCours complet du passé et du futur en hébreu · sept binyanim, gzarot et syntaxe\u003cbr>\nFormes vocalisées selon la norme de l'Académie de la langue hébraïque&nbsp;; les usages parlés divergents sont signalés dans le texte.\n\u003c/footer>\n\n\u003c/main>";

s=\"he-inline\">הוּא רוֹפֵא\u003c/span> → Il est médecin.\n          \u003c/div>\n          \u003cp>Au passé et au futur en revanche, on utilise le verbe \u003cspan class=\"he-inline\">להיות\u003c/span> (être) conjugué.\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">הַקָּפֶה הָיָה קַר\u003c/span> → Le café était froid.\u003cbr>\n            \u003cspan class=\"he-inline\">הַשִּׂמְלָה הָיְתָה וְרוּדָה\u003c/span> → La robe était rose.\n          \u003c/div>\n        "},{"title":"Genre des noms","he":"מין השם","body":"\n          \u003cp>Comme en français, les noms ont un genre. En général :\u003c/p>\n          \u003cul>\n            \u003cli>\u003cstrong>Féminin\u003c/strong> : suffixe en \u003cspan class=\"he-inline\">ה‑\u003c/span> (voyelle A) ou \u003cspan class=\"he-inline\">ת‑\u003c/span>\u003c/li>\n            \u003cli>\u003cstrong>Masculin\u003c/strong> : pas de suffixe particulier\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">רוֹפֵא / רוֹפְאָה\u003c/span> → médecin (m./f.)\u003cbr>\n            \u003cspan class=\"he-inline\">דּוֹד / דּוֹדָה\u003c/span> → oncle / tante\u003cbr>\n            \u003cspan class=\"he-inline\">תַּלְמִיד / תַּלְמִידָה\u003c/span> → élève (m./f.)\n          \u003c/div>\n          \u003cp>\u003cstrong>Exceptions féminines\u003c/strong> sans terminaison apparente :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">עִיר\u003c/span> (ville), \u003cspan class=\"he-inline\">דֶּרֶךְ\u003c/span> (chemin), \u003cspan class=\"he-inline\">אֶרֶץ\u003c/span> (pays) → féminins.\u003cbr>\n            \u003cspan class=\"he-inline\">בַּיִת\u003c/span> (maison), \u003cspan class=\"he-inline\">זַיִת\u003c/span> (olive) → masculins.\n          \u003c/div>\n        "},{"title":"Pluriel des noms","he":"רבים","body":"\n          \u003cp>Le pluriel régulier se reconnaît aux suffixes :\u003c/p>\n          \u003cul>\n            \u003cli>\u003cstrong>Masculin\u003c/strong> : \u003cspan class=\"he-inline\">ים‑\u003c/span>\u003c/li>\n            \u003cli>\u003cstrong>Féminin\u003c/strong> : \u003cspan class=\"he-inline\">וֹת‑\u003c/span>\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">תַּלְמִיד → תַּלְמִידִים\u003c/span> (élèves m.)\u003cbr>\n            \u003cspan class=\"he-inline\">תַּלְמִידָה → תַּלְמִידוֹת\u003c/span> (élèves f.)\u003cbr>\n            \u003cspan class=\"he-inline\">דּוֹד → דּוֹדִים\u003c/span> / \u003cspan class=\"he-inline\">דּוֹדָה → דּוֹדוֹת\u003c/span>\n          \u003c/div>\n          \u003cp>\u003cstrong>Attention\u003c/strong> : certains noms masculins prennent un pluriel en \u003cspan class=\"he-inline\">וֹת‑\u003c/span> et inversement.\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">שֻׁלְחָן → שֻׁלְחָנוֹת\u003c/span> (table, m. avec pluriel en וֹת)\u003cbr>\n            \u003cspan class=\"he-inline\">שָׁנָה → שָׁנִים\u003c/span> (année, f. avec pluriel en ים)\n          \u003c/div>\n        "},{"title":"Accord de l'adjectif","he":"התאמת שם התואר","body":"\n          \u003cp>L'adjectif s'accorde en \u003cstrong>genre, nombre et défini\u003c/strong> avec le nom.\u003c/p>\n          \u003cp>Si le nom porte l'article défini \u003cspan class=\"he-inline\">הַ‑\u003c/span>, l'adjectif aussi.\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">בַּיִת גָּדוֹל\u003c/span> → une grande maison\u003cbr>\n            \u003cspan class=\"he-inline\">הַבַּיִת הַגָּדוֹל\u003c/span> → la grande maison\u003cbr>\n            \u003cspan class=\"he-inline\">הַחֻלְצוֹת הָאֲדֻמּוֹת\u003c/span> → les chemises rouges\n          \u003c/div>\n          \u003cp>Dans une phrase nominale (sans verbe), l'adjectif attribut est \u003cstrong>non défini\u003c/strong> :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">הַבַּיִת גָּדוֹל\u003c/span> → La maison est grande.\n          \u003c/div>\n        "},{"title":"Démonstratifs & il y a","he":"זה / יש","body":"\n          \u003cp>\u003cstrong>C'est / Ce sont\u003c/strong> : \u003cspan class=\"he-inline\">זֶה\u003c/span> (m.) / \u003cspan class=\"he-inline\">זֹאת\u003c/span> (f.) / \u003cspan class=\"he-inline\">אֵלֶּה\u003c/span> (pl.)\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">זֶה בַּיִת גָּדוֹל\u003c/span> → C'est une grande maison.\u003cbr>\n            \u003cspan class=\"he-inline\">אֵלֶּה סְפָרִים חֲדָשִׁים\u003c/span> → Ce sont des livres neufs.\n          \u003c/div>\n          \u003cp>\u003cstrong>Il y a / il n'y a pas\u003c/strong> : \u003cspan class=\"he-inline\">יֵשׁ\u003c/span> / \u003cspan class=\"he-inline\">אֵין\u003c/span>\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">יֵשׁ סֵפֶר עַל הַשֻּׁלְחָן\u003c/span> → Il y a un livre sur la table.\u003cbr>\n            \u003cspan class=\"he-inline\">אֵין מַחְשֵׁב בַּכִּתָּה\u003c/span> → Il n'y a pas d'ordinateur dans la classe.\n          \u003c/div>\n        "}]},{"name":"Possession & avoir","items":[{"title":"Avoir : יש ל / אין ל","he":"יש לי / אין לי","body":"\n          \u003cp>Il n'y a pas de verbe « avoir » en hébreu. On utilise \u003cspan class=\"he-inline\">יֵשׁ ל־\u003c/span> (« il y a à ») / \u003cspan class=\"he-inline\">אֵין ל־\u003c/span> (négation).\u003c/p>\n          \u003cp>Les pronoms suffixes : \u003cspan class=\"he-inline\">לִי, לְךָ, לָךְ, לוֹ, לָהּ, לָנוּ, לָכֶם, לָכֶן, לָהֶם, לָהֶן\u003c/span>\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">יֵשׁ לִי שְׁאֵלָה\u003c/span> → J'ai une question.\u003cbr>\n            \u003cspan class=\"he-inline\">אֵין לוֹ זְמַן\u003c/span> → Il n'a pas le temps.\n          \u003c/div>\n          \u003cp>\u003cstrong>Aux trois temps :\u003c/strong>\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Temps\u003c/th>\u003cth>Affirmation\u003c/th>\u003cth>Négation\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>Présent\u003c/td>\u003ctd>יש ל־\u003c/td>\u003ctd>אין ל־\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Passé (sg.m / sg.f / pl)\u003c/td>\u003ctd>היה / הייתה / היו ל־\u003c/td>\u003ctd>לא היה / לא הייתה / לא היו ל־\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Futur (sg.m / sg.f / pl)\u003c/td>\u003ctd>יהיה / תהיה / יהיו ל־\u003c/td>\u003ctd>לא יהיה / לא תהיה / לא יהיו ל־\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">הָיוּ לִי פְּגִישׁוֹת חֲשׁוּבוֹת\u003c/span> → J'avais des réunions importantes.\u003cbr>\n            \u003cspan class=\"he-inline\">יִהְיֶה לָהּ בַּיִת חָדָשׁ\u003c/span> → Elle aura une nouvelle maison.\n          \u003c/div>\n          \u003cp>\u003cstrong>Astuce\u003c/strong> : le verbe s'accorde avec le \u003cem>complément\u003c/em> (ce qui est possédé), pas avec le sujet ! \"J'avais des réunions\" → réunions = pluriel → \u003cspan class=\"he-inline\">היו\u003c/span>.\u003c/p>\n        "},{"title":"État construit (smikhout)","he":"סמיכות","body":"\n          \u003cp>La \u003cstrong>סמיכות\u003c/strong> exprime un lien étroit entre deux noms (souvent traduit par « de » en français). Les deux noms forment une seule unité.\u003c/p>\n          \u003cp>Le premier nom (\u003cspan class=\"he-inline\">נִסְמָךְ\u003c/span>) change souvent de forme — on l'appelle \u003cstrong>forme construite\u003c/strong>. Le second nom (\u003cspan class=\"he-inline\">סוֹמֵךְ\u003c/span>) ne change pas.\u003c/p>\n\n          \u003cp>\u003cstrong>Les 4 cas de transformation du premier nom\u003c/strong> :\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Genre / nombre\u003c/th>\u003cth>Forme libre\u003c/th>\u003cth>→ Forme construite\u003c/th>\u003cth>Règle\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>m. sg.\u003c/td>\u003ctd class=\"he-cell\">בַּיִת\u003c/td>\u003ctd class=\"he-cell\">בֵּית‑\u003c/td>\u003ctd>change parfois de voyelles\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>f. sg. en ‑ה\u003c/td>\u003ctd class=\"he-cell\">עוּגָה\u003c/td>\u003ctd class=\"he-cell\">עוּגַת‑\u003c/td>\u003ctd>\u003cstrong>ה ← ת\u003c/strong>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>m. pl. en ‑ים\u003c/td>\u003ctd class=\"he-cell\">בָּתִּים\u003c/td>\u003ctd class=\"he-cell\">בָּתֵּי‑\u003c/td>\u003ctd>\u003cstrong>ים ← י\u003c/strong>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>f. pl. en ‑ות\u003c/td>\u003ctd class=\"he-cell\">עוּגוֹת\u003c/td>\u003ctd class=\"he-cell\">עוּגוֹת‑\u003c/td>\u003ctd>inchangé\u003c/td>\u003c/tr>\n          \u003c/table>\n\n          \u003cp>\u003cstrong>① Masculin singulier\u003c/strong> — la forme peut rester identique ou changer de voyelles (cas irréguliers à apprendre).\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Forme libre\u003c/th>\u003cth>Construit\u003c/th>\u003cth>Exemple\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">בַּיִת\u003c/td>\u003ctd class=\"he-cell\">בֵּית‑\u003c/td>\u003ctd class=\"he-cell\">בֵּית סֵפֶר → école\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">בֶּן\u003c/td>\u003ctd class=\"he-cell\">בֶּן‑\u003c/td>\u003ctd class=\"he-cell\">בֶּן דּוֹד → cousin\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">שֵׁם\u003c/td>\u003ctd class=\"he-cell\">שֵׁם‑\u003c/td>\u003ctd class=\"he-cell\">שֵׁם מִשְׁפָּחָה → nom de famille\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לַחַץ\u003c/td>\u003ctd class=\"he-cell\">לַחַץ‑\u003c/td>\u003ctd class=\"he-cell\">לַחַץ דָּם → tension artérielle\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">חֶדֶר\u003c/td>\u003ctd class=\"he-cell\">חֲדַר‑\u003c/td>\u003ctd class=\"he-cell\">חֲדַר מִיּוּן → service des urgences\u003c/td>\u003c/tr>\n          \u003c/table>\n\n          \u003cp>\u003cstrong>② Féminin singulier\u003c/strong> — la terminaison \u003cspan class=\"he-inline\">ה‑\u003c/span> devient \u003cspan class=\"he-inline\">ת‑\u003c/span>. C'est la règle la plus visible et la plus régulière.\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Forme libre\u003c/th>\u003cth>Construit\u003c/th>\u003cth>Exemple\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">עוּגָה\u003c/td>\u003ctd class=\"he-cell\">עוּגַת‑\u003c/td>\u003ctd class=\"he-cell\">עוּגַת שׁוֹקוֹלָד → gâteau au chocolat\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">אֲרוּחָה\u003c/td>\u003ctd class=\"he-cell\">אֲרוּחַת‑\u003c/td>\u003ctd class=\"he-cell\">אֲרוּחַת בּוֹקֶר → petit-déjeuner\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">בְּדִיקָה\u003c/td>\u003ctd class=\"he-cell\">בְּדִיקַת‑\u003c/td>\u003ctd class=\"he-cell\">בְּדִיקַת דָּם → prise de sang\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">תְּעוּדָה\u003c/td>\u003ctd class=\"he-cell\">תְּעוּדַת‑\u003c/td>\u003ctd class=\"he-cell\">תְּעוּדַת זֶהוּת → carte d'identité\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">תַּחֲנָה\u003c/td>\u003ctd class=\"he-cell\">תַּחֲנַת‑\u003c/td>\u003ctd class=\"he-cell\">תַּחֲנַת אוֹטוֹבּוּס → arrêt de bus\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">קוּפָּה\u003c/td>\u003ctd class=\"he-cell\">קוּפַּת‑\u003c/td>\u003ctd class=\"he-cell\">קוּפַּת חוֹלִים → caisse maladie\u003c/td>\u003c/tr>\n          \u003c/table>\n\n          \u003cp>\u003cstrong>③ Masculin pluriel\u003c/strong> — la terminaison \u003cspan class=\"he-inline\">ים‑\u003c/span> devient \u003cspan class=\"he-inline\">י‑\u003c/span>. Le radical peut aussi changer de voyelles.\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Forme libre\u003c/th>\u003cth>Construit\u003c/th>\u003cth>Exemple\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">בָּתִּים\u003c/td>\u003ctd class=\"he-cell\">בָּתֵּי‑\u003c/td>\u003ctd class=\"he-cell\">בָּתֵּי חוֹלִים → hôpitaux\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">בְּנֵי‑\u003c/td>\u003ctd class=\"he-cell\">בְּנֵי‑\u003c/td>\u003ctd class=\"he-cell\">בְּנֵי דּוֹד → cousins\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">חַיִּים\u003c/td>\u003ctd class=\"he-cell\">חַיֵּי‑\u003c/td>\u003ctd class=\"he-cell\">חַיֵּי מִשְׁפָּחָה → vie de famille\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">מִשְׁקָפַיִם\u003c/td>\u003ctd class=\"he-cell\">מִשְׁקְפֵי‑\u003c/td>\u003ctd class=\"he-cell\">מִשְׁקְפֵי שֶׁמֶשׁ → lunettes de soleil\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">בְּגָדִים\u003c/td>\u003ctd class=\"he-cell\">בִּגְדֵי‑\u003c/td>\u003ctd class=\"he-cell\">בִּגְדֵי יָם → maillots de bain\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">קוֹרוֹת\u003c/td>\u003ctd class=\"he-cell\">קוֹרוֹת‑\u003c/td>\u003ctd class=\"he-cell\">קוֹרוֹת חַיִּים → CV (litt. : événements de la vie)\u003c/td>\u003c/tr>\n          \u003c/table>\n\n          \u003cp>\u003cstrong>④ Féminin pluriel\u003c/strong> — la terminaison \u003cspan class=\"he-inline\">ות‑\u003c/span> ne change pas. C'est le cas le plus simple !\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Forme libre\u003c/th>\u003cth>Construit\u003c/th>\u003cth>Exemple\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">עוּגוֹת\u003c/td>\u003ctd class=\"he-cell\">עוּגוֹת‑\u003c/td>\u003ctd class=\"he-cell\">עוּגוֹת שׁוֹקוֹלָד → gâteaux au chocolat\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">חֲנוּיוֹת\u003c/td>\u003ctd class=\"he-cell\">חֲנוּיוֹת‑\u003c/td>\u003ctd class=\"he-cell\">חֲנוּיוֹת בְּגָדִים → magasins de vêtements\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">תְּמוּנוֹת\u003c/td>\u003ctd class=\"he-cell\">תְּמוּנוֹת‑\u003c/td>\u003ctd class=\"he-cell\">תְּמוּנוֹת יְלָדִים → photos d'enfants\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">אֲרוּחוֹת\u003c/td>\u003ctd class=\"he-cell\">אֲרוּחוֹת‑\u003c/td>\u003ctd class=\"he-cell\">אֲרוּחוֹת בּוֹקֶר → petits-déjeuners\u003c/td>\u003c/tr>\n          \u003c/table>\n\n          \u003cp>\u003cstrong>L'article défini\u003c/strong> se place uniquement sur le \u003cstrong>second nom\u003c/strong>. Tout le smikhout devient alors défini.\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">בֵּית סֵפֶר\u003c/span> → une école\u003cbr>\n            \u003cspan class=\"he-inline\">בֵּית הַסֵּפֶר\u003c/span> → l'école (✅)\u003cbr>\n            \u003cspan class=\"he-inline\">הַבַּיִת הַסֵּפֶר\u003c/span> → incorrect ❌\n          \u003c/div>\n\n          \u003cp>\u003cstrong>L'accord des adjectifs\u003c/strong> se fait avec le \u003cstrong>premier nom\u003c/strong> (le nom principal). L'adjectif vient à la fin de tout le smikhout.\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">בֵּית הַסֵּפֶר הֶחָדָשׁ\u003c/span> → la nouvelle école\u003cbr>\n            (l'adjectif s'accorde avec \u003cspan class=\"he-inline\">בית\u003c/span> « maison » — masculin singulier — pas avec \u003cspan class=\"he-inline\">ספר\u003c/span> « livre »)\u003cbr>\u003cbr>\n            \u003cspan class=\"he-inline\">עוּגַת הַשּׁוֹקוֹלָד הַטְּעִימָה\u003c/span> → le délicieux gâteau au chocolat\u003cbr>\n            (féminin car \u003cspan class=\"he-inline\">עוגה\u003c/span> « gâteau » est féminin, même si \u003cspan class=\"he-inline\">שוקולד\u003c/span> « chocolat » est masculin)\n          \u003c/div>\n\n          \u003cp>\u003cstrong>Astuce\u003c/strong> : pour reconnaître un smikhout, cherche un \u003cspan class=\"he-inline\">ת‑\u003c/span> à la place d'un \u003cspan class=\"he-inline\">ה‑\u003c/span> attendu, ou un \u003cspan class=\"he-inline\">י‑\u003c/span> à la place d'un \u003cspan class=\"he-inline\">ים‑\u003c/span>. C'est presque toujours un état construit.\u003c/p>\n        "},{"title":"את + COD défini","he":"את","body":"\n          \u003cp>Quand le COD (complément d'objet direct) est \u003cstrong>défini\u003c/strong>, on doit le faire précéder de \u003cspan class=\"he-inline\">אֶת\u003c/span>. Si le COD est indéfini, pas de \u003cspan class=\"he-inline\">את\u003c/span>.\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֲנִי אוֹכֵל תַּפּוּחַ\u003c/span> → Je mange une pomme. (indéfini, pas de את)\u003cbr>\n            \u003cspan class=\"he-inline\">אֲנִי אוֹכֵל אֶת הַתַּפּוּחַ\u003c/span> → Je mange la pomme. (défini → את)\n          \u003c/div>\n          \u003cp>Les noms propres sont automatiquement définis :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֲנִי אוֹהֶבֶת אֶת יִשְׂרָאֵל\u003c/span> → J'aime Israël.\u003cbr>\n            \u003cspan class=\"he-inline\">רָאִיתִי אֶת דָּן\u003c/span> → J'ai vu Dan.\n          \u003c/div>\n          \u003cp>\u003cstrong>את se conjugue\u003c/strong> avec des pronoms suffixes pour donner « le, la, les » :\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Forme\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>me\u003c/td>\u003ctd class=\"he-cell\">אותי\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>te (m./f.)\u003c/td>\u003ctd class=\"he-cell\">אותך\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>le / la\u003c/td>\u003ctd class=\"he-cell\">אותו / אותה\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>nous\u003c/td>\u003ctd class=\"he-cell\">אותנו\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>vous (m./f.)\u003c/td>\u003ctd class=\"he-cell\">אתכם / אתכן\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>les (m./f.)\u003c/td>\u003ctd class=\"he-cell\">אותם / אותן\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">רָאִיתִי אֶת דָּן... רָאִיתִי אוֹתוֹ בְּבֵית קָפֶה\u003c/span>\u003cbr>\n            → J'ai vu Dan. Je l'ai vu au café.\n          \u003c/div>\n        "},{"title":"אותו / le même","he":"אותו","body":"\n          \u003cp>Au-delà de son usage pronominal, \u003cspan class=\"he-inline\">אותו\u003c/span> exprime aussi \u003cstrong>« le même »\u003c/strong>.\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Forme\u003c/th>\u003cth>Genre / nombre\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">אותו (ה)ספר\u003c/td>\u003ctd>le même livre (m.sg)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">אותה (ה)חולצה\u003c/td>\u003ctd>la même chemise (f.sg)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">אותם (ה)תלמידים\u003c/td>\u003ctd>les mêmes élèves (m.pl)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">אותן (ה)תלמידות\u003c/td>\u003ctd>les mêmes élèves (f.pl)\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">קָנִינוּ אוֹתָהּ שִׂמְלָה\u003c/span> → Nous avons acheté la même robe.\u003cbr>\n            \u003cspan class=\"he-inline\">תָּמִיד אוֹתָם תַּלְמִידִים מַפְרִיעִים\u003c/span> → Ce sont toujours les mêmes élèves qui dérangent.\u003cbr>\n            \u003cspan class=\"he-inline\">זֶה לֹא אוֹתוֹ הַדָּבָר\u003c/span> → Ce n'est pas la même chose.\n          \u003c/div>\n        "},{"title":"Prépositions ב / ל + article","he":"ב + ה / ל + ה","body":"\n          \u003cp>Quand on ajoute l'article défini \u003cspan class=\"he-inline\">הַ\u003c/span> après \u003cspan class=\"he-inline\">בְּ‑\u003c/span> ou \u003cspan class=\"he-inline\">לְ‑\u003c/span>, l'article fusionne :\u003c/p>\n          \u003cul>\n            \u003cli>\u003cspan class=\"he-inline\">בְּ + הַ\u003c/span> → \u003cspan class=\"he-inline\">בַּ\u003c/span> (« dans le / à la »)\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְ + הַ\u003c/span> → \u003cspan class=\"he-inline\">לַ\u003c/span> (« au / vers le »)\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֲנִי בְּבַיִת\u003c/span> → Je suis dans une maison (indéfini).\u003cbr>\n            \u003cspan class=\"he-inline\">אֲנִי בַּבַּיִת\u003c/span> → Je suis à la maison (défini).\n          \u003c/div>\n          \u003cp>\u003cstrong>Astuce\u003c/strong> : \u003cspan class=\"he-inline\">בְּ‑\u003c/span> avec les verbes statiques (être à, habiter à) ; \u003cspan class=\"he-inline\">לְ‑\u003c/span> avec les verbes de mouvement (aller à, partir vers).\u003c/p>\n        "},{"title":"Déclinaison de la préposition ב","he":"נטיית מילת היחס ב","body":"\n          \u003cp>Comme \u003cspan class=\"he-inline\">שֶׁל\u003c/span> et \u003cspan class=\"he-inline\">לְ‑\u003c/span>, la préposition \u003cspan class=\"he-inline\">בְּ‑\u003c/span> (« dans / à / en ») se conjugue avec les pronoms suffixes pour donner « en moi / en toi / en lui… ».\u003c/p>\n          \u003ctable>\n            \u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Forme\u003c/th>\u003cth>Sens\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>אני\u003c/td>\u003ctd class=\"he-cell\">בִּי\u003c/td>\u003ctd>en moi\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אתה\u003c/td>\u003ctd class=\"he-cell\">בְּךָ\u003c/td>\u003ctd>en toi (m.)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>את\u003c/td>\u003ctd class=\"he-cell\">בָּךְ\u003c/td>\u003ctd>en toi (f.)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>הוא\u003c/td>\u003ctd class=\"he-cell\">בּוֹ\u003c/td>\u003ctd>en lui\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>היא\u003c/td>\u003ctd class=\"he-cell\">בָּהּ\u003c/td>\u003ctd>en elle\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אנחנו\u003c/td>\u003ctd class=\"he-cell\">בָּנוּ\u003c/td>\u003ctd>en nous\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אתם\u003c/td>\u003ctd class=\"he-cell\">בָּכֶם\u003c/td>\u003ctd>en vous (m.)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>אתן\u003c/td>\u003ctd class=\"he-cell\">בָּכֶן\u003c/td>\u003ctd>en vous (f.)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>הם\u003c/td>\u003ctd class=\"he-cell\">בָּהֶם\u003c/td>\u003ctd>en eux\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>הן\u003c/td>\u003ctd class=\"he-cell\">בָּהֶן\u003c/td>\u003ctd>en elles\u003c/td>\u003c/tr>\n          \u003c/table>\n          \u003cp>\u003cstrong>Verbes qui se construisent avec בְּ‑\u003c/strong> et utilisent donc ces formes conjuguées :\u003c/p>\n          \u003cul>\n            \u003cli>\u003cspan class=\"he-inline\">לְהִשְׁתַּמֵּשׁ בְּ\u003c/span> → utiliser : \u003cspan class=\"he-inline\">הִשְׁתַּמַּשְׁתִּי בּוֹ\u003c/span> → je l'ai utilisé\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְהִתְאַהֵב בְּ\u003c/span> → tomber amoureux de : \u003cspan class=\"he-inline\">הִתְאַהַבְתִּי בָּהּ\u003c/span> → je suis tombé amoureux d'elle\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְטַפֵּל בְּ\u003c/span> → s'occuper de : \u003cspan class=\"he-inline\">אֲנִי מְטַפֵּל בָּהֶם\u003c/span> → je m'occupe d'eux\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לָדוּן בְּ\u003c/span> → discuter de\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְהַאֲמִין בְּ\u003c/span> → croire en\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְהִסְתַּכֵּל בְּ\u003c/span> → regarder\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְהִיזָּכֵר בְּ\u003c/span> → se souvenir de\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְנַגֵּן בְּ\u003c/span> → jouer d'un instrument\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לִבְחוֹר בְּ\u003c/span> → choisir\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">לְהִיכָּשֵׁל בְּ\u003c/span> → échouer à\u003c/l
