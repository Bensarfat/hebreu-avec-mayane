    { from: 16, fr: 'Expert',      he: 'מֻמְחֶה' },
    { from: 19, fr: 'Maître',      he: 'רַב' },
    { from: 22, fr: 'Sage',        he: 'חָכָם' }
  ];
  function stepFor(level) { return 150 + 100 * (level - 1); }
  function levelInfo(xp) {
    xp = Math.max(0, xp || 0);
    var level = 1, floor = 0;
    while (xp >= floor + stepFor(level)) { floor += stepFor(level); level++; }
    var step = stepFor(level), tier = TIERS[0];
    TIERS.forEach(function (t) { if (level >= t.from) tier = t; });
    return {
      level: level,
      letter: LETTERS.charAt(Math.min(level, LETTERS.length) - 1),
      title: tier.fr, titleHe: tier.he,
      into: xp - floor, step: step, toNext: floor + step - xp,
      pct: Math.round(100 * (xp - floor) / step)
    };
  }

  /* ---------- dates ---------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseDay(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function shortDate(d) { return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); }

  function emptyDay() {
    return { xp: 0, qOk: 0, qKo: 0, fK: 0, fA: 0, fS: 0, cK: 0, cA: 0, cS: 0, goal: 0 };
  }
  function dayGood(d) { return (d.qOk || 0) + (d.fK || 0) + (d.cK || 0); }
  function dayBad(d) { return (d.qKo || 0) + (d.fA || 0) + (d.fS || 0) + (d.cA || 0) + (d.cS || 0); }
  function dayActive(d) { return d && dayGood(d) + dayBad(d) > 0; }

  function streaks(days) {
    var today = new Date(), cur = 0, best = 0, run = 0;
    var d = new Date(today);
    if (!dayActive(days[dayKey(d)])) d = addDays(d, -1);   // aujourd'hui pas encore joué : la série tient
    while (dayActive(days[dayKey(d)])) { cur++; d = addDays(d, -1); }
    var keys = Object.keys(days).filter(function (k) { return dayActive(days[k]); }).sort();
    var prev = null;
    keys.forEach(function (k) {
      var dt = parseDay(k);
      run = (prev && Math.round((dt - prev) / 864e5) === 1) ? run + 1 : 1;
      if (run > best) best = run;
      prev = dt;
    });
    return { cur: cur, best: Math.max(best, cur) };
  }

  /* ---------- maîtrise (quiz OU flashcards) ---------- */
  function quizMastered(s) {
    if (!s) return false;
    if (s.correct >= 3 && s.wrong === 0) return true;
    return s.seen >= 4 && s.correct / s.seen >= 0.8;
  }
  function flashMastered(s) {
    if (!s) return false;
    if (s.known >= 2 && !s.again && !s.soft) return true;
    return s.seen >= 4 && s.known / s.seen >= 0.8;
  }
  function wordMastered(storage, k) {
    return quizMastered(storage.wordStats && storage.wordStats[k]) ||
           flashMastered(storage.flash && storage.flash[k]);
  }

  function totalsFrom(storage, VOCAB) {
    var t = { qOk: 0, qKo: 0, fK: 0, fA: 0, fS: 0, cK: 0, cA: 0, cS: 0, mastered: 0 };
    var k, s;
    for (k in (storage.wordStats || {})) { s = storage.wordStats[k]; t.qOk += s.correct || 0; t.qKo += s.wrong || 0; }
    for (k in (storage.flash || {})) { s = storage.flash[k]; t.fK += s.known || 0; t.fA += s.again || 0; t.fS += s.soft || 0; }
    for (k in (storage.conj || {})) { s = storage.conj[k]; t.cK += s.known || 0; t.cA += s.again || 0; t.cS += s.soft || 0; }
    var seen = {};
    Object.keys(VOCAB || {}).forEach(function (th) {
      VOCAB[th].forEach(function (e) {
        var key = e[0] + '|' + e[1];
        if (seen[key]) return; seen[key] = 1;
        if (wordMastered(storage, key)) t.mastered++;
      });
    });
    return t;
  }

  function themeMastery(storage, VOCAB) {
    return Object.keys(VOCAB || {}).map(function (th) {
      var n = 0, m = 0, seen = 0, vu = {};
      VOCAB[th].forEach(function (e) {
        var key = e[0] + '|' + e[1];
        if (vu[key]) return; vu[key] = 1; n++;
        var q = storage.wordStats && storage.wordStats[key], f = storage.flash && storage.flash[key];
        if ((q && q.seen) || (f && f.seen)) seen++;
        if (wordMastered(storage, key)) m++;
      });
      return { theme: th, n: n, m: m, seen: seen, pct: n ? Math.round(100 * m / n) : 0 };
    });
  }

  function weakWords(storage, max) {
    var map = {};
    function add(k, bad, seen) {
      var p = k.split('|');
      var o = map[k] || (map[k] = { he: p[0], fr: p[1] || '', bad: 0, seen: 0 });
      o.bad += bad; o.seen += seen;
    }
    var k, s;
    for (k in (storage.wordStats || {})) { s = storage.wordStats[k]; if (s.wrong) add(k, s.wrong, s.seen || 0); }
    for (k in (storage.flash || {})) { s = storage.flash[k]; if (s.again) add(k, s.again, s.seen || 0); }
    return Object.keys(map).map(function (x) { return map[x]; })
      .sort(function (a, b) { return b.bad - a.bad || (b.bad / (b.seen || 1)) - (a.bad / (a.seen || 1)); })
      .slice(0, max || 15);
  }

  /* ---------- badges ---------- */
  var BADGES = [
    { id: 'first',   icon: '🌱', name: 'Premier pas',         desc: 'Répondre à sa première carte',             test: function (c) { return c.answers >= 1; } },
    { id: 'streak3', icon: '🔥', name: 'Ça chauffe',          desc: '3 jours de révision d\'affilée',            test: function (c) { return c.best >= 3; } },
    { id: 'streak7', icon: '🔥', name: 'Une semaine pile',    desc: '7 jours d\'affilée',                        test: function (c) { return c.best >= 7; } },
    { id: 'streak30',icon: '🌋', name: 'Inarrêtable',         desc: '30 jours d\'affilée',                       test: function (c) { return c.best >= 30; } },
    { id: 'goal7',   icon: '🎯', name: 'Régulier',            desc: 'Objectif du jour atteint 7 fois',           test: function (c) { return c.goalDays >= 7; } },
    { id: 'day200',  icon: '💪', name: 'Grosse journée',      desc: '200 XP en une journée',                     test: function (c) { return c.maxDay >= 200; } },
    { id: 'xp1000',  icon: '⭐', name: '1 000 XP',            desc: 'Cumuler 1 000 XP',                          test: function (c) { return c.xp >= 1000; } },
    { id: 'xp5000',  icon: '🌟', name: '5 000 XP',            desc: 'Cumuler 5 000 XP',                          test: function (c) { return c.xp >= 5000; } },
    { id: 'cards100',icon: '🃏', name: 'Cent cartes',         desc: '100 flashcards retournées',                 test: function (c) { return c.cards >= 100; } },
    { id: 'cards1k', icon: '🗂️', name: 'Mille cartes',        desc: '1 000 flashcards retournées',               test: function (c) { return c.cards >= 1000; } },
    { id: 'mast50',  icon: '📗', name: '50 mots acquis',      desc: '50 mots maîtrisés',                         test: function (c) { return c.mastered >= 50; } },
    { id: 'mast200', icon: '📚', name: '200 mots acquis',     desc: '200 mots maîtrisés',                        test: function (c) { return c.mastered >= 200; } },
    { id: 'theme',   icon: '🏆', name: 'Thème bouclé',        desc: 'Maîtriser tous les mots d\'un thème',      test: function (c) { return c.themesDone >= 1; } },
    { id: 'conj50',  icon: '🧩', name: 'Conjugueur',          desc: '50 conjugaisons réussies',                  test: function (c) { return c.conj >= 50; } },
    { id: 'combo20', icon: '⚡', name: 'Sans faute',          desc: '20 bonnes réponses d\'affilée',             test: function (c) { return c.combo >= 20; } },
    { id: 'early',   icon: '🌅', name: 'Lève-tôt',            desc: 'Réviser avant 8 h',                         test: function (c) { return c.early; } },
    { id: 'night',   icon: '🌙', name: 'Oiseau de nuit',      desc: 'Réviser après 22 h',                        test: function (c) { return c.night; } }
  ];

  function badgeContext(P, totals, themes) {
    var st = streaks(P.days || {}), goalDays = 0, maxDay = 0;
    Object.keys(P.days || {}).forEach(function (k) {
      var d = P.days[k]; if (d.goal) goalDays++; if (d.xp > maxDay) maxDay = d.xp;
    });
    return {
      xp: P.xp || 0, best: st.best, cur: st.cur, goalDays: goalDays, maxDay: maxDay,
      answers: totals.qOk + totals.qKo + totals.fK + totals.fA + totals.fS + totals.cK + totals.cA + totals.cS,
      cards: totals.fK + totals.fA + totals.fS + totals.cK + totals.cA + totals.cS,
      mastered: totals.mastered, conj: totals.cK,
      themesDone: (themes || []).filter(function (t) { return t.n >= 5 && t.m === t.n; }).length,
      combo: P.bestCombo || 0, early: !!P.early, night: !!P.night
    };
  }

  /* ---------- résumé envoyé à la prof ---------- */
  function summarize(storage, P, VOCAB) {
    var totals = totalsFrom(storage, VOCAB), themes = themeMastery(storage, VOCAB);
    var st = streaks(P.days || {}), keep = {}, cut = dayKey(addDays(new Date(), -180));
    Object.keys(P.days || {}).forEach(function (k) { if (k >= cut) keep[k] = P.days[k]; });
    var last = Object.keys(keep).filter(function (k) { return dayActive(keep[k]); }).sort().pop() || null;
    return {
      updatedAt: new Date().toISOString(), xp: P.xp || 0, level: levelInfo(P.xp).level,
      streak: st.cur, best: st.best, lastActive: last, goal: P.goal || 60,
      days: keep, totals: totals, themes: themes, weak: weakWords(storage, 15),
      badges: P.badges || {}, bestCombo: P.bestCombo || 0
    };
  }

  /* ---------- agrégats ---------- */
  function rangeSum(days, from, n) {
    var s = emptyDay();
    for (var i = 0; i < n; i++) {
      var d = days[dayKey(addDays(from, i))];
      if (d) for (var k in s) s[k] += d[k] || 0;
    }
    return s;
  }
  function rate(d) { var g = dayGood(d), b = dayBad(d); return g + b ? Math.round(100 * g / (g + b)) : null; }
  function weekly(days, weeks) {
    var out = [], today = new Date();
    var monday = addDays(today, -((today.getDay() + 6) % 7));
    for (var w = weeks - 1; w >= 0; w--) {
      var start = addDays(monday, -7 * w), s = rangeSum(days, start, 7);
      out.push({ start: start, sum: s, rate: rate(s), xp: s.xp, answers: dayGood(s) + dayBad(s) });
    }
    return out;
  }

  /* ---------- rendu ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(n) { return (n || 0).toLocaleString('fr-FR'); }

  function levelCard(P, opts) {
    opts = opts || {};
    var L = levelInfo(P.xp), st = streaks(P.days || {}), today = (P.days || {})[dayKey()] || emptyDay();
    var goal = P.goal || 60, gp = Math.min(100, Math.round(100 * today.xp / goal));
    var R = 34, C = 2 * Math.PI * R;
    return '<div class="hp-level">' +
      '<div class="hp-medal" aria-hidden="true"><span>' + L.letter + '</span></div>' +
      '<div class="hp-level-main">' +
        '<div class="hp-level-top"><strong>Niveau ' + L.level + '</strong>' +
        '<span class="hp-tier">' + L.title + ' · <span class="hp-he">' + L.titleHe + '</span></span></div>' +
        '<div class="hp-xpbar"><i style="width:' + L.pct + '%"></i></div>' +
        '<div class="hp-level-sub">' + fmt(P.xp) + ' XP au total · encore <b>' + fmt(L.toNext) + ' XP</b> pour le niveau ' + (L.level + 1) + '</div>' +
      '</div>' +
      '<div class="hp-mini">' +
        '<div class="hp-ring" title="Objectif du jour">' +
          '<svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="' + R + '" class="hp-ring-bg"/>' +
          (gp ? '<circle cx="40" cy="40" r="' + R + '" class="hp-ring-fg" stroke-dasharray="' + (C * gp / 100).toFixed(1) + ' ' + C.toFixed(1) + '"/>' : '') + '</svg>' +
          '<div class="hp-ring-txt"><b>' + today.xp + '</b><span>/ ' + goal + ' XP</span></div>' +
        '</div>' +
        '<div class="hp-streak"><span class="hp-flame">' + (st.cur ? '🔥' : '·') + '</span><b>' + st.cur + '</b><span>jour' + (st.cur > 1 ? 's' : '') + ' d\'affilée</span><em>record ' + st.best + '</em></div>' +
      '</div>' +
      (opts.goalPicker ? '<div class="hp-goalpick">Objectif du jour : ' + [30, 60, 100, 150].map(function (g) {
        return '<button type="button" data-goal="' + g + '" class="' + (g === goal ? 'on' : '') + '">' + g + ' XP</button>';
      }).join('') + '</div>' : '') +
    '</div>';
  }

  function heatmap(days, weeks) {
    weeks = weeks || 17;
    var today = new Date();
    var end = addDays(today, 6 - ((today.getDay() + 6) % 7));        // dimanche de cette semaine
    var start = addDays(end, -(weeks * 7) + 1);
    var max = 1;
    Object.keys(days || {}).forEach(function (k) { if (days[k].xp > max) max = days[k].xp; });
    var cols = '', months = '', lastM = -1;
    for (var w = 0; w < weeks; w++) {
      var cells = '';
      var wkStart = addDays(start, w * 7);
      if (wkStart.getMonth() !== lastM) {
        months += '<span style="grid-column:' + (w + 1) + '">' + wkStart.toLocaleDateString('fr-FR', { month: 'short' }) + '</span>';
        lastM = wkStart.getMonth();
      }
      for (var i = 0; i < 7; i++) {
        var d = addDays(start, w * 7 + i), k = dayKey(d), v = days && days[k] ? days[k].xp : 0;
        var lvl = d > today ? 'f' : (v ? Math.min(4, 1 + Math.floor(3.999 * v / max)) : 0);
        cells += '<i class="h' + lvl + '" title="' + shortDate(d) + ' : ' + v + ' XP"></i>';
      }
      cols += '<div class="hp-hcol">' + cells + '</div>';
    }
    return '<div class="hp-heat"><div class="hp-heat-days"><span>L</span><span></span><span>M</span><span></span><span>V</span><span></span><span>D</span></div>' +
      '<div class="hp-heat-body"><div class="hp-heat-months" style="grid-template-columns:repeat(' + weeks + ',17px)">' + months + '</div>' +
      '<div class="hp-heat-grid">' + cols + '</div></div></div>' +
      '<div class="hp-legend">Moins <i class="h0"></i><i class="h1"></i><i class="h2"></i><i class="h3"></i><i class="h4"></i> Plus</div>';
  }

  function xpBars(days, n, goal) {
    n = n || 30;
    var W = 620, H = 170, padB = 22, padT = 10, today = new Date(), vals = [], max = goal || 10;
    for (var i = n - 1; i >= 0; i--) {
      var d = addDays(today, -i), v = days && days[dayKey(d)] ? days[dayKey(d)].xp : 0;
      vals.push({ d: d, v: v }); if (v > max) max = v;
    }
    var bw = W / n, svg = '';
    vals.forEach(function (o, i) {
      var h = Math.round((H - padB - padT) * o.v / max), x = i * bw + bw * 0.18, y = H - padB - h;
      svg += '<rect x="' + x.toFixed(1) + '" y="' + y + '" width="' + (bw * 0.64).toFixed(1) + '" height="' + Math.max(h, o.v ? 2 : 0) +
        '" rx="3" class="' + (goal && o.v >= goal ? 'hp-bar-hit' : 'hp-bar') + '"><title>' + shortDate(o.d) + ' : ' + o.v + ' XP</title></rect>';
      if (i % 7 === (n - 1) % 7) svg += '<text x="' + (i * bw + bw / 2).toFixed(1) + '" y="' + (H - 6) + '" class="hp-axis" text-anchor="middle">' + shortDate(o.d) + '</text>';
    });
    if (goal) {
      var gy = H - padB - Math.round((H - padB - padT) * goal / max);
      svg += '<line x1="0" x2="' + W + '" y1="' + gy + '" y2="' + gy + '" class="hp-goal-line"/>' +
             '<text x="' + (W - 4) + '" y="' + (gy - 4) + '" class="hp-axis" text-anchor="end">objectif ' + goal + ' XP</text>';
    }
    return '<svg class="hp-chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="XP par jour">' + svg + '</svg>';
  }

  function rateLine(days, weeks) {
    var data = weekly(days || {}, weeks || 8), W = 620, H = 170, padB = 22, padT = 14, padX = 24;
    var pts = [], svg = '';
    [50, 75, 100].forEach(function (g) {
      var y = H - padB - (H - padB - padT) * g / 100;
      svg += '<line x1="' + padX + '" x2="' + (W - padX) + '" y1="' + y + '" y2="' + y + '" class="hp-grid"/>' +
             '<text x="2" y="' + (y + 4) + '" class="hp-axis">' + g + '%</text>';
    });
    var step = (W - 2 * padX) / Math.max(1, data.length - 1);
    data.forEach(function (w, i) {
      var x = padX + i * step;
      svg += '<text x="' + x.toFixed(1) + '" y="' + (H - 6) + '" class="hp-axis" text-anchor="middle">' + shortDate(w.start) + '</text>';
      if (w.rate == null) return;
      var y = H - padB - (H - padB - padT) * w.rate / 100;
      pts.push([x, y, w]);
    });
    if (pts.length > 1) svg += '<polyline class="hp-line" points="' + pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '"/>';
    pts.forEach(function (p) {
      svg += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4.5" class="hp-dot"><title>Semaine du ' +
        shortDate(p[2].start) + ' : ' + p[2].rate + ' % de réussite sur ' + p[2].answers + ' réponses</title></circle>' +
        '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] - 9).toFixed(1) + '" class="hp-val" text-anchor="middle">' + p[2].rate + '%</text>';
    });
    if (!pts.length) svg += '<text x="' + W / 2 + '" y="' + H / 2 + '" class="hp-axis" text-anchor="middle">Pas encore de réponses enregistrées</text>';
    return '<svg class="hp-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Taux de réussite par semaine">' + svg + '</svg>';
  }

  function themeBars(themes, opts) {
    opts = opts || {};
    var list = (themes || []).slice().sort(function (a, b) { return b.pct - a.pct || b.seen - a.seen || a.theme.localeCompare(b.theme, 'fr'); });
    if (opts.limit) list = list.slice(0, opts.limit);
    if (!list.length) return '<p class="hp-empty">Aucun thème pour le moment.</p>';
    return '<div class="hp-themes">' + list.map(function (t) {
      var seenPct = t.n ? Math.round(100 * t.seen / t.n) : 0;
      return '<div class="hp-theme"><div class="hp-theme-name">' + esc(t.theme) + '</div>' +
        '<div class="hp-theme-bar" title="' + t.m + ' maîtrisés, ' + t.seen + ' vus sur ' + t.n + '"><i class="seen" style="width:' + seenPct + '%"></i><i class="m" style="width:' + t.pct + '%"></i></div>' +
        '<div class="hp-theme-num">' + t.m + '/' + t.n + '</div></div>';
    }).join('') + '</div><div class="hp-legend2"><i class="m"></i> maîtrisés <i class="seen"></i> déjà vus</div>';
  }

  function badgesGrid(earned) {
    earned = earned || {};
    return '<div class="hp-badges">' + BADGES.map(function (b) {
      var on = earned[b.id];
      return '<div class="hp-badge' + (on ? ' on' : '') + '" title="' + esc(b.desc) + (on ? ' — obtenu le ' + shortDate(parseDay(on)) : '') + '">' +
        '<span class="hp-badge-ic">' + b.icon + '</span><b>' + esc(b.name) + '</b><small>' + (on ? 'Obtenu le ' + shortDate(parseDay(on)) : esc(b.desc)) + '</small></div>';
    }).join('') + '</div>';
  }

  function sparkline(days, n) {
    n = n || 14;
    var vals = [], max = 1, today = new Date();
    for (var i = n - 1; i >= 0; i--) {
      var d = days && days[dayKey(addDays(today, -i))]; var v = d ? d.xp : 0; vals.push(v); if (v > max) max = v;
    }
    var W = 120, H = 30, bw = W / n;
    return '<svg class="hp-spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' + vals.map(function (v, i) {
      var h = Math.round((H - 2) * v / max);
      return '<rect x="' + (i * bw + 1).toFixed(1) + '" y="' + (H - Math.max(h, 1)) + '" width="' + (bw - 2).toFixed(1) + '" height="' + Math.max(h, 1) + '" rx="1.5" class="' + (v ? 'hp-bar' : 'hp-bar0') + '"/>';
    }).join('') + '</svg>';
  }

  var CSS = '' +
    '.hp-level{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}' +
    '.hp-medal{width:74px;height:74px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 14px 28px -14px var(--accent);transform:rotate(-6deg)}' +
    '.hp-medal span{font:700 38px/1 var(--font-he);color:var(--on-accent);transform:rotate(6deg)}' +
    '.hp-level-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:8px}' +
    '.hp-level-top strong{font:900 22px/1.1 var(--font-display);color:var(--ink)}' +
    '.hp-tier{font-weight:700;color:var(--accent);font-size:14px}.hp-he{font-family:var(--font-he)}' +
    '.hp-xpbar{height:12px;border-radius:99px;background:var(--accent-tint);overflow:hidden}' +
    '.hp-xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s}' +
    '.hp-level-sub{margin-top:7px;font-size:13px;color:var(--muted)}.hp-level-sub b{color:var(--ink-soft)}' +
    '.hp-mini{display:flex;gap:14px;align-items:center}' +
    '.hp-ring{position:relative;width:80px;height:80px}.hp-ring svg{width:80px;height:80px;transform:rotate(-90deg)}' +

/* =====================================================================
   HPB — stockage du site de Mayane.
   Version 1 (démo) : tout est conservé dans ce navigateur (IndexedDB).
   L'interface est volontairement réduite à ces fonctions pour pouvoir
   brancher ensuite un vrai serveur (comptes partagés entre appareils)
   sans toucher au reste du site.
   ===================================================================== */
var HPB = (function () {
  'use strict';
  var DBN = 'mayane-hebreu-v1', ST = 'kv', idb = null, mem = {};

  function open() {
    return new Promise(function (res) {
      try {
        var r = indexedDB.open(DBN, 1);
        r.onupgradeneeded = function () { r.result.createObjectStore(ST); };
        r.onsuccess = function () { idb = r.result; res(); };
        r.onerror = function () { res(); };
        r.onblocked = function () { res(); };
      } catch (e) { res(); }
    });
  }
  function get(k) {
    if (!idb) return Promise.resolve(mem[k]);
    return new Promise(function (res) {
      try {
        var q = idb.transaction(ST).objectStore(ST).get(k);
        q.onsuccess = function () { res(q.result); };
        q.onerror = function () { res(mem[k]); };
      } catch (e) { res(mem[k]); }
    });
  }
  function set(k, v) {
    mem[k] = v;
    if (!idb) return Promise.resolve();
    return new Promise(function (res) {
      try {
        var t = idb.transaction(ST, 'readwrite');
        t.objectStore(ST).put(v, k);
        t.oncomplete = function () { res(); };
        t.onerror = function () { res(); };
      } catch (e) { res(); }
    });
  }
  function del(k) {
    delete mem[k];
    if (!idb) return Promise.resolve();
    return new Promise(function (res) {
      try {
        var t = idb.transaction(ST, 'readwrite');
        t.objectStore(ST).delete(k);
        t.oncomplete = function () { res(); };
        t.onerror = function () { res(); };
      } catch (e) { res(); }
    });
  }
  function clearAll() {
    mem = {};
    if (!idb) return Promise.resolve();
    return new Promise(function (res) {
      try {
        var t = idb.transaction(ST, 'readwrite');
        t.objectStore(ST).clear();
        t.oncomplete = function () { res(); };
        t.onerror = function () { res(); };
      } catch (e) { res(); }
    });
  }

  /* ---------- mots de passe : vérifiés par empreinte (hash) ; celui des élèves est aussi gardé pour Mayane ---------- */
  function rnd(n) {
    var a = new Uint8Array(n);
    try { crypto.getRandomValues(a); } catch (e) { for (var i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256); }
    return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }
  function hash(pw, salt) {
    var txt = salt + '::' + pw;
    try {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)).then(function (buf) {
        return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      });
    } catch (e) {
      var h = 5381; for (var i = 0; i < txt.length; i++) h = ((h << 5) + h + txt.charCodeAt(i)) | 0;
      return Promise.resolve('x' + (h >>> 0).toString(16));
    }
  }
  function withPassword(rec, pw) {
    rec.salt = rnd(12);
    return hash(pw, rec.salt).then(function (h) { rec.hash = h; return rec; });
  }
  var WORDS = ['shalom', 'toda', 'boker', 'layla', 'shemesh', 'yam', 'sefer', 'mayim', 'tapuz', 'kelev', 'perah', 'hatul', 'kochav', 'bayit', 'lehem'];
  function genPassword() {
    var a = new Uint32Array(2);
    try { crypto.getRandomValues(a); } catch (e) { a[0] = Math.random() * 1e9; a[1] = Math.random() * 1e9; }
    return WORDS[a[0] % WORDS.length] + '-' + (1000 + a[1] % 9000);
  }

  /* ---------- API ---------- */
  var api = {
    ready: open,
    genPassword: genPassword,
    reset: clearAll,

    getTeacher: function () { return get('teacher'); },
    setTeacherPassword: function (login, pw) {
      return get('teacher').then(function (t) {
        t = t || { name: 'Mayane' };
        t.login = login;
        return withPassword(t, pw).then(function (r) { return set('teacher', r); });
      });
    },
    getSettings: function () { return get('settings').then(function (s) { return s || {}; }); },
    setSettings: function (s) { return set('settings', s); },

    listStudents: function () { return get('students').then(function (l) { return l || []; }); },
    getStudent: function (id) { return api.listStudents().then(function (l) { return l.filter(function (s) { return s.id === id; })[0] || null; }); },
    saveStudent: function (st, pw) {
      return api.listStudents().then(function (l) {
        /* la prof doit pouvoir retrouver le mot de passe de chaque élève : il est gardé avec le compte */
        if (pw) st.pw = pw;
        var p = pw ? withPassword(st, pw) : Promise.resolve(st);
        return p.then(function () {
          var i = l.findIndex(function (s) { return s.id === st.id; });
          if (i < 0) l.push(st); else l[i] = st;
          return set('students', l).then(function () { return st; });
        });
      });
    },
    deleteStudent: function (id) {
      return api.listStudents().then(function (l) {
        return set('students', l.filter(function (s) { return s.id !== id; }));
      }).then(function () {
        return Promise.all([del('content:' + id), del('summary:' + id), del('progress:' + id)]);
      }).then(function () {
        return api.listDocs().then(function (docs) {
          docs.forEach(function (d) { d.students = (d.students || []).filter(function (x) { return x !== id; }); });
          return set('docs', docs);
        });
      });
    },
    loginTaken: function (login, exceptId) {
      login = (login || '').trim().toLowerCase();
      return Promise.all([api.listStudents(), get('teacher')]).then(function (r) {
        if (r[1] && r[1].login === login) return true;
        return r[0].some(function (s) { return s.login === login && s.id !== exceptId; });
      });
    },
    /* connexion : renvoie {role, id} ou null */
    login: function (login, pw) {
      login = (login || '').trim().toLowerCase();
      return Promise.all([get('teacher'), api.listStudents()]).then(function (r) {
        var t = r[0];
        if (t && t.login === login) return hash(pw, t.salt).then(function (h) { return h === t.hash ? { role: 'teacher' } : null; });
        var s = r[1].filter(function (x) { return x.login === login; })[0];
        if (!s) return null;
        return hash(pw, s.salt).then(function (h) {
          if (h !== s.hash) return null;
          if (s.active === false) return { role: 'blocked' };
          return { role: 'student', id: s.id };
        });
      });
    },

    getContent: function (id) { return get('content:' + id).then(function (c) { return c || null; }); },
    setContent: function (id, c) { c.updatedAt = new Date().toISOString(); return set('content:' + id, c); },
    getSummary: function (id) { return get('summary:' + id).then(function (s) { return s || null; }); },
    getProgress: function (id) { return get('progress:' + id).then(function (p) { return p || null; }); },
    /* appelé par l'espace élève à chaque réponse (regroupé) */
    pushProgress: function (id, summary, storage) {
      if (!id) return Promise.resolve();
      return Promise.all([set('summary:' + id, summary), set('progress:' + id, storage)]).then(function () {
        try { window.dispatchEvent(new CustomEvent('hp-progress', { detail: id })); } catch (e) {}
      });
    },

    listDocs: function () { return get('docs').then(function (l) { return l || []; }); },
    addDoc: function (file, students) {
      var d = {
        id: 'd' + Date.now().toString(36) + rnd(3), name: file.name, type: file.type || '', size: file.size,
        addedAt: new Date().toISOString(), students: students.slice(), status: 'pending'
      };
      return set('blob:' + d.id, file).then(function () { return api.listDocs(); }).then(function (l) {
        l.unshift(d); return set('docs', l);
      }).then(function () { return d; });
    },
    updateDoc: function (d) {
      return api.listDocs().then(function (l) {
        var i = l.findIndex(function (x) { return x.id === d.id; });
        if (i >= 0) l[i] = d; return set('docs', l);
      });
    },
    deleteDoc: function (id) {
      return api.listDocs().then(function (l) { return set('docs', l.filter(function (x) { return x.id !== id; })); })
        .then(function () { return del('blob:' + id); });
    },
    getBlob: function (id) { return get('blob:' + id); },

    _set: set, _get: get, _withPassword: withPassword
  };
  return api;
})();

/* =====================================================================
   HPA — analyse des documents déposés par Mayane et mise à jour des
   espaces élèves. Lecture : PDF (pdf.js), Word .docx (mammoth), images,
   texte. L'analyse elle-même est faite par Claude ; rien n'est ajouté à
   un élève sans validation de Mayane.
   ===================================================================== */
var HPA = (function () {
  'use strict';
  var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  var PDFW = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var MAMMOTH = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
  var loaded = {};
  function script(src) {
    if (loaded[src]) return loaded[src];
    loaded[src] = new Promise(function (res, rej) {
      var s = document.createElement('script'); s.src = src; s.onload = res;
      s.onerror = function () { delete loaded[src]; rej(new Error('Impossible de charger ' + src)); };
      document.head.appendChild(s);
    });
    return loaded[src];
  }

  function kind(d) {
    var n = (d.name || '').toLowerCase(), t = d.type || '';
    if (t === 'application/pdf' || /\.pdf$/.test(n)) return 'pdf';
    if (/\.docx$/.test(n) || /wordprocessingml/.test(t)) return 'docx';
    if (/\.doc$/.test(n) || t === 'application/msword') return 'doc';
    if (/^image\//.test(t) || /\.(png|jpe?g|webp|gif|heic)$/.test(n)) return 'img';
    if (/^text\//.test(t) || /\.(txt|md|csv)$/.test(n)) return 'txt';
    return 'other';
  }

  /* ---------- extraction : {text, images[]} ---------- */
  function canvasBlob(c) { return new Promise(function (res) { c.toBlob(res, 'image/jpeg', 0.85); }); }
  function fromPdf(blob, onStep) {
    return script(PDFJS).then(function () {
      var lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = PDFW;
      return blob.arrayBuffer().then(function (buf) { return lib.getDocument({ data: buf }).promise; });
    }).then(function (pdf) {
      var n = pdf.numPages, out = [], i = 1;
      function next() {
        if (i > n) return Promise.resolve();
        onStep && onStep('Lecture de la page ' + i + ' / ' + n);
        return pdf.getPage(i).then(function (p) {
          return p.getTextContent().then(function (tc) {
            out.push({ page: i, text: tc.items.map(function (x) { return x.str + (x.hasEOL ? '\n' : ' '); }).join(''), p: p });
            i++; return next();
          });
        });
      }
      return next().then(function () {
        var text = out.map(function (o) { return '--- page ' + o.page + ' ---\n' + o.text.trim(); }).join('\n\n');
        var chars = out.reduce(function (s, o) { return s + o.text.trim().length; }, 0);
        if (chars > 80 * n) return { text: text, images: [], pages: n };
        /* PDF scanné (peu de texte) : on envoie les pages en image */
        var imgs = [], max = Math.min(n, 8), j = 0;
        function snap() {
          if (j >= max) return Promise.resolve();
          onStep && onStep('Préparation de la page ' + (j + 1) + ' (document scanné)');
          var pg = out[j].p, vp = pg.getViewport({ scale: 1.6 });
          var c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
          return pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise
            .then(function () { return canvasBlob(c); }).then(function (b) { imgs.push(b); j++; return snap(); });
        }
        return snap().then(function () { return { text: chars ? text : '', images: imgs, pages: n, scanned: true, cut: n > max }; });
      });
    });
  }
  function extract(doc, blob, onStep) {
    var k = kind(doc);
    if (k === 'pdf') return fromPdf(blob, onStep);
    if (k === 'docx') return script(MAMMOTH).then(function () {
      onStep && onStep('Lecture du document Word');
      return blob.arrayBuffer().then(function (buf) { return window.mammoth.extractRawText({ arrayBuffer: buf }); });
    }).then(function (r) { return { text: r.value || '', images: [] }; });
    if (k === 'img') return Promise.resolve({ text: '', images: [blob] });
    if (k === 'txt') return blob.text().then(function (t) { return { text: t, images: [] }; });
    if (k === 'doc') return Promise.reject(new Error('Les anciens fichiers Word (.doc) ne se lisent pas ici : enregistrez-le en .docx ou en PDF.'));
    return Promise.reject(new Error('Format non pris en charge.'));
  }

  /* ---------- consigne envoyée à Claude ---------- */
  var SCHEMA = '{\n' +
    '  "themes": [ { "name": "Nom du thème en français", "words": [ { "he": "mot sans nikoud", "he_nikud": "mot avec nikoud", "fr": "traduction française", "nature": "n" } ] } ],\n' +
    '  "grammar": [ { "category": "Catégorie", "title": "Titre de la fiche", "he": "titre en hébreu", "html": "<p>…</p>" } ],\n' +
    '  "summary": "une phrase qui résume le contenu du document"\n}';
  function instructions(existingThemes, docName) {
    return 'Tu prépares le contenu de révision d\'un élève de Mayane, professeure d\'hébreu, à partir d\'UN document de cours qu\'elle a déposé (« ' + docName + ' »).\n\n' +
      'RÈGLE ABSOLUE : n\'utilise QUE ce qui figure dans le document. N\'ajoute aucun mot, aucune règle, aucun exemple qui n\'y est pas. Si le document ne contient pas de vocabulaire ou de grammaire, renvoie des listes vides.\n\n' +
      'Vocabulaire : chaque mot hébreu du document avec sa traduction française. "he" = sans voyelles (nikoud), "he_nikud" = avec nikoud (si le document n\'en donne pas, vocalise toi-même selon la norme standard, c\'est le seul ajout autorisé). "fr" = la traduction donnée par le document, sinon la tienne, courte. "nature" = une lettre : v verbe (à l\'infinitif si le document le donne ainsi), n nom, a adjectif, d adverbe, o mot-outil (préposition, pronom, conjonction), c nombre, x expression.\n' +
      'Regroupe les mots en thèmes en français. Réutilise exactement un de ces thèmes existants s\'il convient : ' + (existingThemes.length ? existingThemes.join(' ; ') : '(aucun pour l\'instant)') + '.\n\n' +
      'Grammaire : une fiche par règle expliquée dans le document, en français, comme une fiche de révision claire : "html" n\'utilise que <p>, <ul>, <li>, <strong>, <em>, <br> et <div class="example"> pour les exemples, avec l\'hébreu dans <span class="he-inline">…</span>. Reprends les exemples du document.\n\n' +
      'Réponds UNIQUEMENT avec un objet JSON valide de cette forme :\n' + SCHEMA;
  }

  function sampleFn() {
    try { return (window.claude && window.claude.use) ? window.claude.use('sample') : Promise.resolve(null); }
    catch (e) { return Promise.resolve(null); }

  /* ---------- calculs par élève ---------- */

    var now = new Date(), d = sum.days || {}, t = sum.totals || {};

    var mix = [['Quiz', d30.qOk + d30.qKo, HP.rate({ qOk: d30.qOk, qKo: d30.qKo })], ['Flashcards', d30.fK + d30.fA + d30.fS, HP.rate({ fK: d30.fK, fA: d30.fA, fS: d30.fS })], ['Conjugaison', d30.cK + d30.cA + d30.cS, HP.rate({ cK: d30.cK, cA: d30.cA, cS: d30.cS })]];
    var mixMax = Math.max.apply(null, mix.map(function (r) { return r[1]; }).concat([1]));

      '<div class="hp-kpis">' +

        '<div class="hp-kpi green"><b>' + fmt(t.mastered) + '<small style="font-size:.55em;color:var(--muted)"> / ' + fmt(m.words) + '</small></b><span>mots maîtrisés</span></div>' +
        '<div class="hp-kpi rose"><b>' + (fl ? Math.round(100 * (t.fK || 0) / fl) + ' %' : '—') + '</b><span>flashcards sues (total)</span></div>' +
      '</div>' +

          '<div class="card"><h3>Activités <small>30 jours</small></h3>' + mix.map(function (r) {
            return '<div class="hp-theme" style="margin-bottom:8px"><div class="hp-theme-name">' + r[0] + '</div><div class="hp-theme-bar"><i class="seen" style="width:' + Math.round(100 * r[1] / mixMax) + '%"></i></div><div class="hp-theme-num">' + fmt(r[1]) + '</div></div>' +

            return '<li><span class="he">' + esc(w.he) + '</span><span>' + esc(w.fr) + '</span><small>' + w.bad + ' erreur' + (w.bad > 1 ? 's' : '') + ' / ' + w.seen + '</small></li>';

  /* ---------- modale de création ---------- */
  function modal(html) {

  function newStudent() {
    var m = modal('<h2>Créer un compte élève</h2><form id="nf">' + studentForm() +
      '<div id="nf-msg" style="margin-top:10px"></div><div class="row" style="margin-top:16px"><button class="btn primary" type="submit">Créer le compte</button></div></form>');
    var f = $('#nf', m), touched = false;
    f.login.addEventListener('input', function () { touched = true; });
    function sug() { if (!touched) f.login.value = slug(f.first.value + (f.last.value ? '.' + f.last.value : '')); }
    f.first.addEventListener('input', sug); f.last.addEventListener('input', sug);
    $('[data-gen]', m).onclick = function () { f.pw.value = HPB.genPassword(); };
    f.first.focus();
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var login = slug(f.login.value).replace(/\./g, '.') || '';
      if (!login) return;
      HPB.loginTaken(login).then(function (taken) {
        if (taken) { $('#nf-msg', m).innerHTML = '<div class="err">Cet identifiant est déjà utilisé.</div>'; return; }
        var s = { id: 's' + Date.now().toString(36), first: f.first.value.trim(), last: f.last.value.trim(), email: f.email.value.trim(), phone: f.phone.value.trim(), login: login, active: true, createdAt: new Date().toISOString() };
        var pw = f.pw.value.trim();
        HPB.saveStudent(s, pw).then(function () {
          cache.students.push(s);
          $('.card', m).innerHTML = '<button class="close" aria-label="Fermer">×</button><h2>Compte créé 🎉</h2><p class="muted">Transmettez ces accès à ' + esc(s.first) + '.</p>' + accessCard(s, pw) +
            '<div class="row" style="margin-top:16px"><a class="btn primary" href="#/eleve/' + s.id + '/documents">Déposer ses premiers cours →</a></div>';
          bindCopy(m);
          $('.btn.primary', m).addEventListener('click', function () { m.remove(); });
          if (/eleves|tableau/.test(location.hash) || !location.hash) renderTeacher();
        });
      });
    });
  }

    if (!targets.length) { toast('Choisissez d\'abord au moins un élève'); return; }
    /* un par un : chaque ajout relit la liste, des ajouts simultanés s'écraseraient */
    files.reduce(function (p, f) { return p.then(function () { return HPB.addDoc(f, targets); }); }, Promise.resolve()).then(function () {
      toast(files.length + ' document' + (files.length > 1 ? 's' : '') + ' déposé' + (files.length > 1 ? 's' : ''));
      return loadAll();
    }).then(renderTeacher);
  }

  function runAnalysis(docId) {
    var d = cache.docs.filter(function (x) { return x.id === docId; })[0];
    var slot = document.getElementById('rv-' + docId);
    if (!d || !slot) return;
    if (pending[docId]) return;
    var ctl = new AbortController(); pending[docId] = ctl;
    slot.innerHTML = '<div class="review"><b id="st-' + docId + '">Préparation…</b><div class="progress-line"><i></i></div><div class="row" style="margin-top:10px"><button class="btn small" data-stop>Arrêter</button></div></div>';
    $('[data-stop]', slot).onclick = function () { ctl.abort(); };
    var step = function (t) { var el = document.getElementById('st-' + docId); if (el) el.textContent = t; };
    var themes = {};
    (d.students || []).forEach(function (id) { var c = cache.contents[id]; if (c) Object.keys(c.VOCAB || {}).forEach(function (t) { themes[t] = 1; }); });
    HPB.getBlob(docId).then(function (blob) {
      if (!blob) throw new Error('Fichier introuvable.');
      return HPA.analyse(d, blob, Object.keys(themes), step, ctl.signal);
    }).then(function (res) {
      delete pending[docId];
      showReview(slot, d, res);
    }).catch(function (e) {
      delete pending[docId];
      if (e && e.code === 'cancelled') { slot.innerHTML = ''; return; }
      if (e && e.code === 'no_sample') return showManual(slot, d, e.extracted);
      var msg = e && e.code === 'rate_limited' ? 'Trop de demandes pour le moment : réessayez dans quelques minutes.'
        : e && e.code === 'invalid_json' ? 'La réponse de Claude n\'était pas exploitable. Réessayez.'
        : e && e.code === 'bad_code' ? 'Le code d\'analyse est incorrect : vérifiez-le dans Réglages.'
        : e && e.code === 'server_error' ? 'L\'analyse a échoué (' + e.message + '). Réessayez dans un instant.'
        : e && (e.code === 'not_granted' || e.code === 'sampling_disabled') ? 'L\'analyse par Claude n\'est pas autorisée pour ce site. Autorisez-la dans le menu Permissions de la page, ou utilisez l\'import manuel (onglet Contenu du site).'
        : (e && e.message) || 'Erreur inconnue.';
      slot.innerHTML = '<div class="review"><div class="err">' + esc(msg) + '</div></div>';
    });
  }

  function showManual(slot, d, ex) {
    var prompt = HPA.instructions([], d.name);
    slot.innerHTML = '<div class="review"><b>L\'analyse automatique n\'est pas encore activée sur ce site.</b>' +
      '<p class="small muted">Elle s\'active une fois pour toutes en ajoutant une clé Claude au site (voir le guide). En attendant : envoyez ce document à Claude dans une conversation avec la consigne ci-dessous, puis importez le fichier .json obtenu dans l\'onglet « Contenu du site » de l\'élève.</p>' +
      '<button class="btn small" data-copy="' + esc(prompt) + '">Copier la consigne pour Claude</button>' +
      (ex && ex.text ? '<details style="margin-top:10px"><summary class="small">Texte extrait du document (' + fmt(ex.text.length) + ' caractères)</summary><pre class="code">' + esc(ex.text.slice(0, 4000)) + (ex.text.length > 4000 ? '\n…' : '') + '</pre></details>' : '') + '</div>';
    bindCopy(slot);
  }

  function showReview(slot, d, res, targetIds) {
    var targets = targetIds || (d ? d.students : []) || [];
    var base = targets.length ? cache.contents[targets[0]] : null;
    HPA.markDuplicates(res, base);
    var nWords = res.themes.reduce(function (s, t) { return s + t.words.length; }, 0);
    var names = targets.map(function (id) { var s = cache.students.filter(function (x) { return x.id === id; })[0]; return s ? s.first : ''; }).filter(Boolean);
    function render() {
      var keep = res.themes.reduce(function (s, t) { return s + t.words.filter(function (w) { return w.keep; }).length; }, 0) + res.grammar.filter(function (g) { return g.keep; }).length;
      slot.innerHTML = '<div class="review"><b>Résultat de l\'analyse</b>' + (res.summary ? '<p class="small muted" style="margin:4px 0 0">' + esc(res.summary) + '</p>' : '') +
        '<p class="small">' + nWords + ' mot' + (nWords > 1 ? 's' : '') + ' dans ' + res.themes.length + ' thème' + (res.themes.length > 1 ? 's' : '') + ', ' + res.grammar.length + ' fiche' + (res.grammar.length > 1 ? 's' : '') + ' de grammaire. Décochez ce que vous ne voulez pas ajouter. Les mots déjà présents sont grisés.</p>' +
        res.themes.map(function (t, ti) {
          return '<h4>' + esc(t.name) + ' <span class="pill grey">' + t.words.length + '</span></h4><table class="rv-words">' + t.words.map(function (w, wi) {
            return '<tr class="' + (w.dup ? 'dup' : '') + '"><td style="width:28px"><input type="checkbox" data-w="' + ti + ':' + wi + '"' + (w.keep ? ' checked' : '') + (w.dup ? ' disabled' : '') + '></td>' +
              '<td class="he">' + esc(w.heVoc || w.he) + '</td><td>' + esc(w.fr) + '</td><td class="small muted">' + ({ v: 'verbe', n: 'nom', a: 'adjectif', d: 'adverbe', o: 'mot-outil', c: 'nombre', x: 'expression' }[w.nature] || '') + (w.dup ? ' · déjà présent' : '') + '</td></tr>';
          }).join('') + '</table>';
        }).join('') +
        (res.grammar.length ? '<h4>Grammaire</h4>' + res.grammar.map(function (g, gi) {
          return '<details class="rv-gram"><summary><input type="checkbox" data-g="' + gi + '"' + (g.keep ? ' checked' : '') + '> ' + esc(g.title) + (g.he ? ' <span class="he-inline">' + esc(g.he) + '</span>' : '') + ' <span class="pill grey">' + esc(g.category) + '</span></summary><div class="body">' + g.body + '</div></details>';
        }).join('') : '') +
        (!nWords && !res.grammar.length ? '<p class="hp-empty">Aucun vocabulaire ni grammaire trouvé dans ce document.</p>' : '') +
        '<div class="row" style="margin-top:16px"><button class="btn primary" data-apply' + (keep && names.length ? '' : ' disabled') + '>Ajouter ' + keep + ' élément' + (keep > 1 ? 's' : '') + ' à l\'espace de ' + esc(names.join(', ') || '…') + '</button>' +
        '<button class="btn" data-cancel>Annuler</button></div></div>';
      $$('[data-w]', slot).forEach(function (cb) { cb.onchange = function () { var p = cb.dataset.w.split(':'); res.themes[+p[0]].words[+p[1]].keep = cb.checked; render(); }; });
      $$('[data-g]', slot).forEach(function (cb) { cb.onclick = function (e) { e.stopPropagation(); }; cb.onchange = function () { res.grammar[+cb.dataset.g].keep = cb.checked; render(); }; });
      $('[data-cancel]', slot).onclick = function () { slot.innerHTML = ''; };
      $('[data-apply]', slot).onclick = function () {
        var name = d ? d.name : 'Import JSON', added = { words: 0, grammar: 0 };
        Promise.all(targets.map(function (id) {
          return HPB.getContent(id).then(function (c) {
            var r = HPA.merge(c, res, name);
            added.words = Math.max(added.words, r.words); added.grammar = Math.max(added.grammar, r.grammar);
            return HPB.setContent(id, r.content);
          });
        })).then(function () {
          if (d) { d.status = 'done'; d.integratedAt = new Date().toISOString(); d.result = added; d.summary = res.summary || d.summary; delete d.error; return HPB.updateDoc(d); }
        }).then(function () { toast('Espace mis à jour ✓'); return loadAll(); }).then(renderTeacher);
      };
    }
    render();
  }

  /* ---------- liaisons d'événements ---------- */
  function bind(page, h) {
    $$('[data-act="new"]').forEach(function (b) { b.onclick = newStudent; });
    $$('[data-act="upload"]').forEach(function (b) { b.onclick = function () { location.hash = '#/documents'; }; });
    $$('[data-open]').forEach(function (r) { r.onclick = function () { location.hash = '#/eleve/' + r.dataset.open + '/' + (r.dataset.tab || 'progression'); }; });
    $$('th[data-sort]').forEach(function (th) {
      th.onclick = function () { var k = th.dataset.sort; if (k === 'spark') return; if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = k === 'name' ? 1 : -1; } renderTeacher(); };
    });
    $$('[data-act="preview"]').forEach(function (b) { b.onclick = function () { openStudent(b.dataset.id, true); }; });
    $$('[data-delst]').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var st = cache.students.filter(function (x) { return x.id === b.dataset.delst; })[0];
        if (!st) return;
        var m = modal('<h2>Supprimer le compte de ' + esc(fullName(st)) + ' ?</h2>' +
          '<p class="muted">Son accès, ses contenus et toute sa progression seront effacés définitivement. Les documents déposés restent dans la page Documents.</p>' +
          '<p class="small muted">Pour bloquer l\'accès sans rien effacer, utilisez plutôt « Suspendre le compte » dans sa fiche.</p>' +
          '<div class="row" style="margin-top:16px"><button class="btn danger" data-yes>Supprimer définitivement</button><button class="btn" data-no>Annuler</button></div>');
        $('[data-no]', m).onclick = function () { m.remove(); };
        $('[data-yes]', m).onclick = function () {
          HPB.deleteStudent(st.id).then(function () { m.remove(); toast('Compte de ' + st.first + ' supprimé'); return loadAll(); }).then(renderTeacher);
        };
      };
    });
    bindCopy(document);

    /* dépôt */
    var drop = $('#drop');
    if (drop) {
      var input = $('#file'), targets = [];
      if (drop.dataset.target) targets = [drop.dataset.target];
      $$('#targets .chip').forEach(function (c) {
        c.onclick = function () {
          if (c.dataset.sid === '*') {
            var all = !$$('#targets .chip').filter(function (x) { return x.dataset.sid !== '*'; }).every(function (x) { return x.classList.contains('on'); });
            $$('#targets .chip').forEach(function (x) { x.classList.toggle('on', all); });
          } else c.classList.toggle('on');
          targets = $$('#targets .chip.on').map(function (x) { return x.dataset.sid; }).filter(function (x) { return x !== '*'; });
        };
      });
      drop.onclick = function () { input.click(); };
      drop.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } };
      input.onchange = function () { handleFiles(input.files, targets); input.value = ''; };
      ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
      ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
      drop.addEventListener('drop', function (e) { handleFiles(e.dataTransfer.files, targets); });
    }
    $$('[data-an]').forEach(function (b) { b.onclick = function () { runAnalysis(b.dataset.an); }; });
    $$('[data-dl]').forEach(function (b) {
      b.onclick = function () {
        HPB.getBlob(b.dataset.dl).then(function (blob) { if (!blob) return toast('Fichier introuvable'); var u = URL.createObjectURL(blob), w = null; try { w = window.open(u, '_blank'); } catch (e) {} if (!w) toast('Aperçu indisponible dans cette fenêtre'); setTimeout(function () { URL.revokeObjectURL(u); }, 60000); });
      };
    });
    $$('[data-rm]').forEach(function (b) {
      b.onclick = function () {
        if (b.dataset.armed) { HPB.deleteDoc(b.dataset.rm).then(loadAll).then(renderTeacher); return; }
        b.dataset.armed = 1; b.textContent = 'Confirmer ?'; b.classList.add('danger');
        setTimeout(function () { if (b.isConnected) { delete b.dataset.armed; b.textContent = '🗑'; b.classList.remove('danger'); } }, 3000);
      };
    });

    if (page === 'eleve') {
      var id = h[1], s = cache.students.filter(function (x) { return x.id === id; })[0];
      if (!s) return;
      var ef = $('#edit');
      if (ef) ef.addEventListener('submit', function (e) {
        e.preventDefault();
        var login = slug(ef.login.value);
        HPB.loginTaken(login, s.id).then(function (taken) {
          if (taken) { $('#edit-msg').innerHTML = '<span class="err">Identifiant déjà utilisé</span>'; return; }
          s.first = ef.first.value.trim(); s.last = ef.last.value.trim(); s.email = ef.email.value.trim(); s.phone = ef.phone.value.trim(); s.login = login;
          HPB.saveStudent(s).then(function () { toast('Enregistré'); renderTeacher(); });
        });
      });
      var pwf = $('#pwf');
      if (pwf) {
        $('[data-gen]', pwf).onclick = function () { pwf.pw.value = HPB.genPassword(); };
        pwf.addEventListener('submit', function (e) {
          e.preventDefault();
          var pw = pwf.pw.value.trim(); if (pw.length < 6) return;
          HPB.saveStudent(s, pw).then(function () { toast('Mot de passe changé — pensez à le transmettre'); renderTeacher(); });
        });
      }
      var sp = $('[data-act="suspend"]') || $('[data-act="activate"]');
      if (sp) sp.onclick = function () { s.active = s.active === false; HPB.saveStudent(s).then(renderTeacher); };
      var del = $('[data-act="delete"]');
      if (del) del.onclick = function () {
        var m = modal('<h2>Supprimer le compte de ' + esc(fullName(s)) + ' ?</h2>' +
          '<p class="muted">Son accès, ses contenus et toute sa progression seront effacés définitivement.</p>' +
          '<div class="row" style="margin-top:16px"><button class="btn danger" data-yes>Supprimer définitivement</button><button class="btn" data-no>Annuler</button></div>');
        $('[data-no]', m).onclick = function () { m.remove(); };
        $('[data-yes]', m).onclick = function () {
          HPB.deleteStudent(s.id).then(function () { m.remove(); toast('Compte de ' + s.first + ' supprimé'); location.hash = '#/eleves'; return loadAll(); }).then(renderTeacher);
        };
      };
      $$('[data-rmtheme]').forEach(function (b) {
        b.onclick = function () {
          if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = 'Retirer ?'; b.classList.add('danger'); return; }
          var c = cache.contents[s.id], t = b.dataset.rmtheme;
          delete c.VOCAB[t]; if (c.NATURE) delete c.NATURE[t];
          c.CORE_THEMES = (c.CORE_THEMES || []).filter(function (x) { return x !== t; });
          c.ADVANCED_THEMES = (c.ADVANCED_THEMES || []).filter(function (x) { return x !== t; });
          HPB.setContent(s.id, c).then(renderTeacher);
        };
      });
      var imp = $('#imp');
      if (imp) imp.onchange = function () {
        var f = imp.files[0]; if (!f) return;
        f.text().then(function (t) {
          var r; try { r = HPA.normalise(JSON.parse(t)); } catch (e) { $('#rv-import').innerHTML = '<div class="err" style="margin-top:10px">Fichier JSON illisible.</div>'; return; }
          showReview($('#rv-import'), null, r, [s.id]);
        });
      };
    }
    if (page === 'reglages') {
      var tf = $('#tpw');
      tf.addEventListener('submit', function (e) {
        e.preventDefault();
        var login = slug(tf.login.value);
        HPB.setTeacherPassword(login, tf.pw.value).then(function () { DEMO.teacher = [login, '••••']; $('#tpw-msg').innerHTML = '<span class="ok">Mot de passe changé</span>'; tf.pw.value = ''; });
      });
      $('#site').addEventListener('submit', function (e) {
        e.preventDefault(); cache.settings.siteUrl = e.target.url.value.trim(); cache.settings.analyseCode = e.target.code.value.trim();
        HPA.setCode(cache.settings.analyseCode); HPB.setSettings(cache.settings).then(function () { toast('Enregistré'); });
      });
      var rd = $('[data-act="resetdemo"]');
      rd.onclick = function () {
        if (!rd.dataset.armed) { rd.dataset.armed = 1; rd.textContent = 'Confirmer : tout effacer'; return; }
        HPB.reset().then(seedDemo).then(function () { sess(null); location.hash = '#/connexion'; renderLogin(); });
      };
    }
  }

  /* ================= DONNÉES DE DÉMONSTRATION ================= */
  function seedDemo() {
    var full = DEMO_DATA, now = new Date();
    var allThemes = Object.keys(full.VOCAB);
    function subset(themes, gramCats, conj) {
      var c = { VOCAB: {}, NATURE: {}, CONJ: conj ? full.CONJ.slice(0, conj) : [], VERB_PRESENT: full.VERB_PRESENT, GRAMMAR_CATEGORIES: full.GRAMMAR_CATEGORIES.slice(0, gramCats), ADVANCED_THEMES: [], sources: ['Démo — extrait du site de Benjamin'] };
      themes.forEach(function (t) { c.VOCAB[t] = full.VOCAB[t]; c.NATURE[t] = full.NATURE[t] || ''; });
      c.CORE_THEMES = themes.slice();
      return c;
    }
    var benContent = JSON.parse(JSON.stringify(full)); benContent.tensesHtml = TENSES; benContent.sources = ['Démo — contenu actuel du site de Benjamin'];
    var students = [
      { id: 'demo-ben', first: 'Benjamin', last: 'Sarfati', login: 'benjamin', pw: 'ivrit2026', email: '', phone: '', content: benContent },
      { id: 'demo-lea', first: 'Léa', last: '(démo)', login: 'lea', pw: 'lea2026', email: '', phone: '', content: subset(allThemes.slice(0, 9).concat(['Couleurs', 'Chiffres (1-10)']), 3, 30), sim: { days: 45, p0: 0.55, p1: 0.8, act: 0.8, vol: [12, 40], seed: 7, recent: 4 } },
      { id: 'demo-noam', first: 'Noam', last: '(démo)', login: 'noam', pw: 'noam2026', email: '', phone: '', content: subset(['Bases & pronoms', 'Famille', 'Nourriture & repas', 'Couleurs', 'Chiffres (1-10)'], 1, 0), sim: { days: 30, p0: 0.7, p1: 0.55, act: 0.55, vol: [10, 30], seed: 3, stopAt: 9 } }
    ];
    var chain = HPB.setTeacherPassword(DEMO.teacher[0], DEMO.teacher[1]);
    students.forEach(function (st) {
      chain = chain.then(function () {
        var rec = { id: st.id, first: st.first, last: st.last, login: st.login, email: st.email, phone: st.phone, active: true, createdAt: now.toISOString(), demo: true };
        return HPB.saveStudent(rec, st.pw);
      }).then(function () { return HPB.setContent(st.id, st.content); }).then(function () {
        if (!st.sim) return;
        var storage = simulate(st.content, st.sim);
        return HPB.pushProgress(st.id, HP.summarize(storage, storage.progress, st.content.VOCAB), storage);
      });
    });
    return chain;
  }

  /* activité fictive, pour montrer les graphiques de la démo */
  function simulate(content, o) {
    var seed = o.seed; function r() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
    var words = []; Object.keys(content.VOCAB).forEach(function (t) { content.VOCAB[t].forEach(function (e) { words.push(e[0] + '|' + e[1]); }); });
    var S = { wordStats: {}, flash: {}, conj: {}, excluded: [], preferences: {}, progress: { xp: 0, days: {}, badges: {}, goal: 60, bestCombo: 0, backfilled: HP.dayKey() } };
    var P = S.progress, X = HP.XP, fam = {}, combo = 0;
    for (var i = o.days; i >= 0; i--) {
      if (o.stopAt && i < o.stopAt) break;
      if (r() > o.act && !(o.recent && i <= o.recent)) continue;
      var day = HP.addDays(new Date(), -i), k = HP.dayKey(day), d = P.days[k] = HP.emptyDay();
      var prog = 1 - i / o.days, p = o.p0 + (o.p1 - o.p0) * prog, n = Math.round(o.vol[0] + r() * (o.vol[1] - o.vol[0]));
      for (var j = 0; j < n; j++) {
        var w = words[Math.floor(r() * Math.min(words.length, 40 + prog * words.length))], ok = r() < Math.min(0.9, p + Math.min(fam[w] || 0, 6) * 0.015);
        fam[w] = (fam[w] || 0) + 1;
        if (r() < 0.45) {
          var q = S.wordStats[w] || (S.wordStats[w] = { seen: 0, correct: 0, wrong: 0 });
          q.seen++; if (ok) { q.correct++; d.qOk++; d.xp += X.quizOk; } else { q.wrong++; d.qKo++; d.xp += X.quizKo; }
        } else {
          var f = S.flash[w] || (S.flash[w] = { seen: 0, known: 0, again: 0, soft: 0 });
          f.seen++; if (ok) { f.known++; d.fK++; d.xp += X.flashKnown; } else if (r() < 0.2) { f.soft++; d.fS++; d.xp += X.flashSoft; } else { f.again++; d.fA++; d.xp += X.flashAgain; }
        }
        combo = ok ? combo + 1 : 0; if (combo > P.bestCombo) P.bestCombo = combo;
      }
      if (d.xp >= P.goal) { d.goal = 1; d.xp += X.goal; }
      P.xp += d.xp;
      var ctx = HP.badgeContext(P, HP.totalsFrom(S, content.VOCAB), HP.themeMastery(S, content.VOCAB));
      HP.BADGES.forEach(function (b) { if (!P.badges[b.id] && b.test(ctx)) P.badges[b.id] = k; });
    }
    return S;
  }

  return { boot: boot, logout: logout, closePreview: closePreview };
})();
HPApp.boot();
