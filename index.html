  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-image:
      radial-gradient(1100px 620px at -5% -10%, var(--bg-1) 0%, transparent 62%),
      radial-gradient(900px 620px at 105% 0%, var(--bg-2) 0%, transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-3) 100%);
    background-attachment: fixed;
  }
  /* ---------- fond de page bleu (remplace le fond pêche / rose / lavande du site de Benjamin) ---------- */
  :root { --bg: #d9eaff; --bg-1: #a6d0ff; --bg-2: #b3c8ff; --bg-3: #bfdcff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b1730; --bg-1: #12305e; --bg-2: #172a5c; --bg-3: #0c2448; } }
  :root[data-theme="dark"] { --bg: #0b1730; --bg-1: #12305e; --bg-2: #172a5c; --bg-3: #0c2448; }
  /* le site reste clair : on refuse l'assombrissement automatique de certains téléphones (Chrome, Samsung Internet) */
  :root { color-scheme: only light; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; font-family: var(--font-ui); color: var(--ink); background-color: var(--bg); }
  body { -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.5; min-height: 100vh; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
  a { color: var(--accent); }
  .he { font-family: var(--font-he); }
  [hidden] { display: none !important; }

  /* ---------- boutons & champs (repris du site) ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer;
    border-radius: 999px; font-weight: 700; font-size: 14px; padding: 10px 18px;
    border: 1.5px solid var(--line-strong); background: var(--paper); color: var(--ink-soft); text-decoration: none; white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s;
  }
  .btn:hover { background: var(--hover); border-color: var(--accent-soft); color: var(--ink); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: var(--on-accent); box-shadow: 0 10px 22px -12px var(--accent); }
  .btn.primary:hover { filter: brightness(1.06); color: var(--on-accent); }
  .btn.small { padding: 6px 12px; font-size: 12.5px; }
  .btn.danger { color: var(--bad); border-color: var(--bad-tint); background: var(--bad-tint); }
  .btn.danger:hover { background: var(--bad); color: var(--paper); border-color: var(--bad); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn:disabled { opacity: .5; cursor: default; filter: none; }
  label.f { display: grid; gap: 5px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .in {
    width: 100%; border: 1.5px solid var(--line); background: var(--paper); border-radius: 14px;
    padding: 11px 14px; font-size: 15px; transition: border-color .15s, box-shadow .15s;
  }
  .in:focus { outline: 0; border-color: var(--accent-soft); box-shadow: 0 0 0 4px var(--accent-tint); }
  .in.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .02em; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; background: var(--accent-tint); color: var(--accent); white-space: nowrap; }
  .pill.green { background: var(--mint); color: var(--olive); }
  .pill.gold { background: var(--peach); color: var(--gold); }
  .pill.rose { background: var(--rose-tint); color: var(--rose); }
  .pill.grey { background: var(--zebra); color: var(--muted); border: 1px solid var(--line); }

  .card {
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-card); padding: 24px;
  }
  .card h2, .card h3 { font-family: var(--font-display); font-weight: 800; margin: 0 0 14px; color: var(--ink); }
  .card h2 { font-size: 20px; } .card h3 { font-size: 17px; }
  .card h3 small { font: 700 12px var(--font-ui); color: var(--muted); margin-left: 6px; }
  .stack { display: grid; gap: 18px; }

  /* ---------- connexion ---------- */
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
  .login { width: 100%; max-width: 440px; text-align: center; }
  .kicker { display: inline-block; font: 700 12px/1 var(--font-ui); color: var(--accent); background: var(--accent-tint); padding: 7px 14px; border-radius: 999px; margin-bottom: 14px; }
  .login h1, .page-title {
    font-family: var(--font-display); font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; margin: 0;
  }
  .login h1 { font-size: clamp(32px, 7vw, 44px); }
  .grad { font-family: var(--font-he); font-weight: 700; background: linear-gradient(120deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .login .sub { color: var(--muted); margin: 8px 0 26px; }
  .login form { text-align: left; display: grid; gap: 14px; }
  .login .btn.primary { padding: 15px; font-size: 16px; font-weight: 800; }
  .err { color: var(--t-warn-ink, var(--bad)); background: var(--bad-tint); border-radius: 12px; padding: 9px 12px; font-size: 13.5px; font-weight: 600; }
  .ok { color: var(--olive); background: var(--mint); border-radius: 12px; padding: 9px 12px; font-size: 13.5px; font-weight: 600; }
  .demo-box { margin-top: 18px; text-align: left; font-size: 13px; color: var(--ink-soft); background: var(--peach); border-radius: 18px; padding: 14px 16px; }
  .demo-box b { color: var(--ink); } .demo-box table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .demo-box td { padding: 3px 4px; } .demo-box td:first-child { color: var(--muted); }
  .demo-box button { all: unset; cursor: pointer; color: var(--accent); font-weight: 700; }

  /* ---------- back-office ---------- */
  .bo-top {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px max(16px, calc((100vw - 1180px) / 2)); background: var(--glass); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font: 900 18px var(--font-display); color: var(--ink); text-decoration: none; }
  .brand .logo { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); font: 700 20px var(--font-he); transform: rotate(-6deg); }
  .bo-nav { display: flex; gap: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 4px; margin-left: auto; flex-wrap: wrap; }
  .bo-nav a { text-decoration: none; padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--muted); }
  .bo-nav a:hover { color: var(--ink); background: var(--hover); }
  .bo-nav a.on { background: var(--ink); color: var(--paper); }
  .bo-nav .count { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--rose); color: var(--paper); font-size: 11px; margin-left: 4px; }
  .bo-main { max-width: 1180px; margin: 0 auto; padding: 26px 16px 70px; }
  .bo-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  .page-title { font-size: clamp(26px, 4vw, 34px); }
  .bo-head p { margin: 4px 0 0; color: var(--muted); }
  .demo-strip { background: var(--peach); color: var(--ink-soft); text-align: center; font-size: 12.5px; padding: 6px 16px; }
  .demo-strip b { color: var(--gold); }

  /* tableau élèves */
  .tbl-wrap { overflow-x: auto; margin: 0 -8px; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 860px; }
  .tbl th { text-align: left; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 800; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; }
  .tbl th.sorted { color: var(--accent); }
  .tbl td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--hover); }
  .tbl .num { font-variant-numeric: tabular-nums; font-weight: 700; }
  .who { display: flex; align-items: center; gap: 10px; }
  .av { width: 36px; height: 36px; flex: none; border-radius: 12px; display: grid; place-items: center; font: 800 14px var(--font-display); color: var(--on-accent); background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .av.lg { width: 64px; height: 64px; border-radius: 20px; font-size: 24px; }
  .av { overflow: hidden; } .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .av.emo span, .char .e { font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; line-height: 1; }
  .av.emo span { font-size: 27px; } .av.emo.lg span { font-size: 46px; }
  .char-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px; }
  .chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
  .char { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 8px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--paper); cursor: pointer; color: var(--ink-soft); }
  .char .e { font-size: 40px; } .char small { font-size: 11.5px; font-weight: 600; line-height: 1.2; text-align: center; overflow-wrap: anywhere; }
  .char:hover { background: var(--hover); border-color: var(--accent-soft); } .char.on { border-color: var(--accent); background: var(--accent-tint); color: var(--accent); }
  h4.char-h { margin: 18px 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; scroll-margin-top: 8px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .sw { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--paper); box-shadow: 0 0 0 1.5px var(--line-strong); cursor: pointer; padding: 0; }
  .sw.on { box-shadow: 0 0 0 2.5px var(--ink); }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.on:has(.dot)::before { display: none; }
  .who b { display: block; } .who small { color: var(--muted); }
  .lv { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; }
  .lv .he { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 8px; background: var(--accent-tint); color: var(--accent); }

  .alerts { display: grid; gap: 8px; }
  .alert { display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-radius: 16px; background: var(--zebra); font-size: 14px; cursor: pointer; border: 1px solid var(--line); }
  .alert:hover { border-color: var(--accent-soft); }

    max-width: calc(100vw - 32px); padding: 10px 12px 10px 18px; border-radius: 22px; background: var(--ink); color: var(--paper); box-shadow: var(--shadow-pop); font-weight: 700; font-size: 14px; }

var HP_HOME_HTML = "\u003c!-- Page d'accueil (design « voyage » préparé par Maayane). Les images : {{img:nom}} → assets/ du build. -->\n\u003cdiv class=\"lp mv\" style=\"font-family: Nunito, system-ui, sans-serif; color: #24323F; background: #FFFCF6; width: 100%\">\n\n\u003cheader style=\"background: #EAF6FB\">\n\u003cnav aria-label=\"Navigation principale\" style=\"max-width: 1120px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n\u003ca href=\"#accueil\" style=\"display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1F4E79\">\n\u003cspan style=\"width: 40px; height: 40px; border-radius: 50%; background: #F7C948; display: flex; align-items: center; justify-content: center; font-family: Rubik, sans-serif; font-size: 22px; color: #1F4E79\">א\u003c/span>\n\u003cspan style=\"font-family: Fraunces, Georgia, serif; font-size: 20px; font-weight: 600\">Hébreu avec Maayane\u003c/span>\n\u003c/a>\n\u003cdiv style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 22px; font-size: 16px; font-weight: 600\">\n\u003ca class=\"lp-nl\" href=\"#methode\" style=\"text-decoration: none\">La méthode\u003c/a>\n\u003ca class=\"lp-nl\" href=\"#parcours\" style=\"text-decoration: none\">Le parcours\u003c/a>\n\u003ca class=\"lp-nl\" href=\"#valise\" style=\"text-decoration: none\">Ta valise\u003c/a>\n\u003ca class=\"lp-nl\" href=\"#faq\" style=\"text-decoration: none\">Questions\u003c/a>\n\u003ca href=\"#embarquer\" style=\"text-decoration: none; background: #1F4E79; color: #FFFFFF; padding: 11px 20px; border-radius: 999px\">Embarquer\u003c/a>\n\u003cbutton type=\"button\" data-go=\"login\" style=\"font: inherit; cursor: pointer; background: #FFFFFF; color: #1F4E79; padding: 9px 18px; border-radius: 999px; border: 2px solid #1F4E79\">👤 Mon espace\u003c/button>\n\u003c/div>\n\u003c/nav>\n\n\u003cdiv id=\"accueil\" style=\"max-width: 1120px; margin: 0 auto; padding: 40px 24px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 40px; position: relative\">\n\u003cdiv style=\"flex: 1 1 460px; min-width: 0; position: relative; z-index: 1\">\n\u003cp style=\"margin: 0 0 12px; font-size: 15px; font-weight: 700; color: #1B7385; letter-spacing: 0.5px\">Destination : l'hébreu\u003c/p>\n\u003ch1 style=\"margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 54px; line-height: 1.1; color: #1F4E79\">Parle, travaille, aime, vis… \u003cspan style=\"background: linear-gradient(transparent 62%, #F7C948 62%)\">en hébreu\u003c/span>\u003c/h1>\n\u003cp dir=\"rtl\" lang=\"he\" style=\"margin: 18px 0 0; font-family: Rubik, sans-serif; font-size: 26px; color: #1B7385; text-align: left\">לְדַבֵּר, לַעֲבוֹד, לֶאֱהוֹב, לִחְיוֹת – בְּעִבְרִית\u003c/p>\n\u003cp style=\"margin: 20px 0 0; font-size: 19px; line-height: 1.6; max-width: 520px; color: #33475B\">Des cours en hébreu, avec un coup de pouce en français quand il le faut. À ton rythme, avec le sourire, et un espace de révision rien qu'à toi.\u003c/p>\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 14px; margin-top: 28px\">\n\u003ca href=\"#embarquer\" style=\"text-decoration: none; background: #F7C948; color: #1F4E79; font-weight: 700; font-size: 17px; padding: 15px 28px; border-radius: 999px\">Je réserve mon cours d'essai\u003c/a>\n\u003ca href=\"#/test\" style=\"text-decoration: none; color: #1F4E79; font-weight: 700; font-size: 17px; padding: 15px 22px; border-radius: 999px; border: 2px solid #1F4E79; background: #FFFFFF\">🎯 Teste ton niveau\u003c/a>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv style=\"flex: 1 1 380px; min-width: 0; max-width: 480px; margin: 0 auto\">\n\u003csvg viewBox=\"0 0 440 440\" width=\"100%\" role=\"img\" aria-label=\"Une flèche qui atteint le centre d'une cible où est écrit Ivrit, entourée des lettres de l'alphabet hébreu\" style=\"display: block; overflow: visible\">\n\u003ccircle cx=\"240\" cy=\"220\" r=\"192\" fill=\"#1F4E79\">\u003c/circle k, sans-serif\" font-size=\"22\" font-weight=\"500\" fill=\"#FFFFFF\" transform=\"rotate(245.5 85.4 290.6)\">ע\u003c/text>\n\u003ctext x=\"71.7\" y=\"244.2\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Rubik, sans-serif\" font-size=\"22\" font-weight=\"500\" fill=\"#FFFFFF\" transform=\"rotate(261.8 71.7 244.2)\">פ\u003c/text>\n\u003ctext x=\"71.7\" y=\"195.8\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Rubik, sans-serif\" font-size=\"22\" font-weight=\"500\" fill=\"#FFFFFF\" transform=\"rotate(278.2 71.7 195.8)\">צ\u003c/text>\n\u003ctext x=\"85.4\" y=\"149.4\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Rubik, sans-serif\" font-size=\"22\" font-weight=\"500\" fill=\"#FFFFFF\" transform=\"rotate(294.5 85.4 149.4)\">ק\u003c/text>\n\u003ctext x=\"111.5\" y=\"108.7\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Rubik, sans-serif\" font-size=\"22\" font-weight=\"500\" fill=\"#FFFFFF\" transform=\"rotate(310.9 111.5 108.7)\">ר\u003c/text>\n\u003ctext x=\"148.1\" y=\"77.0\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Rubik, sans-serif\" font-size=\"22\" font-weight=\"500\" fill=\"#FFFFFF\" transform=\"rotate(327.3 148.1 77.0)\">ש\u003c/text>\n\u003ctext x=\"192.1\" y=\"56.9\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Rubik, sans-serif\" font-size=\"22\" font-weight=\"500\" fill=\"#FFFFFF\" transform=\"rotate(343.6 192.1 56.9)\">ת\u003c/text>\n\u003ctext x=\"240\" y=\"220\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Rubik, sans-serif\" font-size=\"27\" font-weight=\"500\" fill=\"#1F4E79\">עִבְרִית\u003c/text>\n\u003cg class=\"arrow-wobble\">\u003cg class=\"arrow-fly\">\u003cg transform=\"translate(240 220) rotate(30)\">\n\u003cline x1=\"-250\" y1=\"0\" x2=\"-20\" y2=\"0\" stroke=\"#24323F\" stroke-width=\"6\" stroke-linecap=\"round\">\u003c/line>\n\u003cpath d=\"M -4 0 L -30 -11 L -24 0 L -30 11 Z\" fill=\"#24323F\">\u003c/path>\n\u003cpath d=\"M -250 0 L -222 -18 L -198 -18 L -222 0 Z\" fill=\"#E07A5F\">\u003c/path>\n\u003cpath d=\"M -250 0 L -222 18 L -198 18 L -222 0 Z\" fill=\"#D0603A\">\u003c/path>\n\u003c/g>\u003c/g>\u003c/g>\n\u003c/svg>\n\u003c/div>\n\u003c/div>\n\n\u003csvg viewBox=\"0 0 1440 120\" preserveAspectRatio=\"none\" width=\"100%\" height=\"110\" aria-hidden=\"true\" style=\"display: block; margin-top: -20px\">\n\u003cpath d=\"M0 50 C 180 20, 360 80, 540 50 S 900 20, 1080 50 S 1320 80, 1440 50 L1440 120 L0 120 Z\" fill=\"#9ED7E3\">\u003c/path>\n\u003cpath d=\"M0 72 C 200 48, 380 98, 560 72 S 920 46, 1100 72 S 1330 96, 1440 72 L1440 120 L0 120 Z\" fill=\"#2E9AAE\">\u003c/path>\n\u003cpath d=\"M0 98 C 220 84, 420 112, 640 98 S 1000 84, 1220 98 S 1380 110, 1440 98 L1440 120 L0 120 Z\" fill=\"#FFFCF6\">\u003c/path>\n\u003c/svg>\n\u003c/header>\n\n\u003cmain>\n\u003csection id=\"methode\" style=\"max-width: 1120px; margin: 0 auto; padding: 72px 24px 40px\">\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 40px; align-items: center\">\n\u003cdiv style=\"flex: 1 1 420px; min-width: 0\">\n\u003cp style=\"margin: 0 0 10px; font-size: 15px; font-weight: 700; color: #B5502F\">La méthode\u003c/p>\n\u003ch2 style=\"margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 42px; line-height: 1.15; color: #1F4E79\">L'hébreu, en VO\u003c/h2>\n\u003cp style=\"margin: 18px 0 0; font-size: 18px; line-height: 1.7; color: #33475B\">Comme un bon film, l'hébreu s'apprécie mieux sans doublage. Dès le premier cours, on parle hébreu. Ton cerveau apprend à penser dans la langue, pas à traduire dans ta tête.\u003c/p>\n\u003cp style=\"margin: 14px 0 0; font-size: 18px; line-height: 1.7; color: #33475B\">Et quand ça coince ? Un petit coup de pouce en français, et on repart.\u003c/p>\n\u003c/div>\n\u003cdiv style=\"flex: 1 1 360px; min-width: 0; background: #EAF6FB; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n\u003cp style=\"margin: 0; font-size: 15px; font-weight: 700; color: #1B7385\">Moins de traduction, plus de conversation\u003c/p>\n\u003cp dir=\"rtl\" lang=\"he\" style=\"margin: 0; font-family: Rubik, sans-serif; font-size: 30px; color: #1F4E79\">פָּחוֹת לְתַרְגֵּם, יוֹתֵר לְדַבֵּר\u003c/p>\n\u003cdiv style=\"height: 2px; background: repeating-linear-gradient(90deg, #1F4E79 0 8px, transparent 8px 16px)\">\u003c/div>\n\u003cdiv style=\"display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.5; color: #33475B\">\n\u003cp style=\"margin: 0\">✓ Des cours 100 % vivants, en hébreu\u003c/p>\n\u003cp style=\"margin: 0\">✓ Des situations de la vraie vie, pas des listes à apprendre par cœur\u003c/p>\n\u003cp style=\"margin: 0\">✓ Bienveillance et bonne humeur à chaque cours\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection aria-labelledby=\"piliers-titre\" style=\"max-width: 1120px; margin: 0 auto; padding: 40px 24px 80px\">\n\u003cp style=\"margin: 0 0 10px; font-size: 15px; font-weight: 700; color: #B5502F; text-align: center\">Quatre raisons de partir\u003c/p>\n\u003ch2 id=\"piliers-titre\" style=\"margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 38px; color: #1F4E79; text-align: center\">Un hébreu pour toute ta vie\u003c/h2>\n\u003cp style=\"margin: 14px auto 36px; max-width: 620px; font-size: 18px; line-height: 1.6; color: #33475B; text-align: center\">On n'apprend pas l'hébreu pour un examen. On l'apprend pour parler, travailler, aimer et vivre.\u003c/p>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 22px\">\n\n\u003cdiv style=\"background: #FFFFFF; border: 2px solid #1F4E79; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column\">\n\u003cimg src=\"{{img:lp-parle}}\" loading=\"lazy\" alt=\"Une famille réunie autour d'un repas de fête\" style=\"display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover\">\n\u003cdiv style=\"padding: 22px 24px 26px; display: flex; flex-direction: column; gap: 12px\">\n\u003cdiv style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap\">\n\u003ch3 style=\"margin: 0; font-family: Fraunces, Georgia, serif; font-size: 30px; font-weight: 600; color: #1F4E79\">Parle\u003c/h3>\n\u003cspan lang=\"he\" dir=\"rtl\" style=\"font-family: Rubik, sans-serif; font-size: 30px; font-weight: 500; color: #1F4E79\">לְדַבֵּר\u003c/span>\n\u003c/div>\n\u003cdiv style=\"height: 2px; background: repeating-linear-gradient(90deg, #1F4E79 0 8px, transparent 8px 16px)\">\u003c/div>\n\u003cp style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #33475B\">Prendre ta place dans la conversation, même quand tout le monde parle en même temps autour de la table.\u003c/p>\n\u003cdiv style=\"display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #33475B\">\n\u003cp style=\"margin: 0\">• Te présenter et raconter ta journée\u003c/p>\n\u003cp style=\"margin: 0\">• Suivre une discussion animée… et y participer\u003c/p>\n\u003cp style=\"margin: 0\">• Comprendre l'hébreu de tous les jours\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv style=\"background: #FFFFFF; border: 2px solid #1B7385; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column\">\n\u003cimg src=\"{{img:lp-travaille}}\" loading=\"lazy\" alt=\"Une réunion d'équipe dans un bureau lumineux face à la mer\" style=\"display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover\">\n\u003cdiv style=\"padding: 22px 24px 26px; display: flex; flex-direction: column; gap: 12px\">\n\u003cdiv style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap\">\n\u003ch3 style=\"margin: 0; font-family: Fraunces, Georgia, serif; font-size: 30px; font-weight: 600; color: #1B7385\">Travaille\u003c/h3>\n\u003cspan lang=\"he\" dir=\"rtl\" style=\"font-family: Rubik, sans-serif; font-size: 30px; font-weight: 500; color: #1B7385\">לַעֲבוֹד\u003c/span>\n\u003c/div>\n\u003cdiv style=\"height: 2px; background: repeating-linear-gradient(90deg, #1B7385 0 8px, transparent 8px 16px)\">\u003c/div>\n\u003cp style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #33475B\">Exprimer tes idées en réunion, avec aisance et assurance.\u003c/p>\n\u003cdiv style=\"display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #33475B\">\n\u003cp style=\"margin: 0\">• Réussir un entretien d'embauche\u003c/p>\n\u003cp style=\"margin: 0\">• Écrire un mail professionnel\u003c/p>\n\u003cp style=\"margin: 0\">• Présenter un projet devant ton équipe\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv style=\"background: #FFFFFF; border: 2px solid #D0603A; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column\">\n\u003cimg src=\"{{img:lp-aime}}\" loading=\"lazy\" alt=\"Une maman et son enfant dans une rue ensoleillée\" style=\"display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover\">\n\u003cdiv style=\"padding: 22px 24px 26px; display: flex; flex-direction: column; gap: 12px\">\n\u003cdiv style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap\">\n\u003ch3 style=\"margin: 0; font-family: Fraunces, Georgia, serif; font-size: 30px; font-weight: 600; color: #B5502F\">Aime\u003c/h3>\n\u003cspan lang=\"he\" dir=\"rtl\" style=\"font-family: Rubik, sans-serif; font-size: 30px; font-weight: 500; color: #B5502F\">לֶאֱהוֹב\u003c/span>\n\u003c/div>\n\u003cdiv style=\"height: 2px; background: repeating-linear-gradient(90deg, #D0603A 0 8px, transparent 8px 16px)\">\u003c/div>\n\u003cp style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #33475B\">Transmettre la langue à tes enfants, comprendre ta belle-famille, partager ce qui compte.\u003c/p>\n\u003cdiv style=\"display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #33475B\">\n\u003cp style=\"margin: 0\">• Parler hébreu avec tes enfants\u003c/p>\n\u003cp style=\"margin: 0\">• Lire des histoires, chanter des chansons\u003c/p>\n\u003cp style=\"margin: 0\">• Tomber amoureux·se de la langue\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv style=\"background: #FFFFFF; border: 2px solid #C08A12; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column\">\n\u003cimg src=\"{{img:lp-vis}}\" loading=\"lazy\" alt=\"Deux amies qui rient autour d'un café\" style=\"display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover\">\n\u003cdiv style=\"padding: 22px 24px 26px; display: flex; flex-direction: column; gap: 12px\">\n\u003cdiv style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap\">\n\u003ch3 style=\"margin: 0; font-family: Fraunces, Georgia, serif; font-size: 30px; font-weight: 600; color: #8A6510\">Vis\u003c/h3>\n\u003cspan lang=\"he\" dir=\"rtl\" style=\"font-family: Rubik, sans-serif; font-size: 30px; font-weight: 500; color: #8A6510\">לִחְיוֹת\u003c/span>\n\u003c/div>\n\u003cdiv style=\"height: 2px; background: repeating-linear-gradient(90deg, #C08A12 0 8px, transparent 8px 16px)\">\u003c/div>\n\u003cp style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #33475B\">Le café du matin, les amis, le quartier : te sentir chez toi en Israël.\u003c/p>\n\u003cdiv style=\"display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #33475B\">\n\u003cp style=\"margin: 0\">• Commander, papoter et rire avec tes amis\u003c/p>\n\u003cp style=\"margin: 0\">• Te débrouiller dans les démarches\u003c/p>\n\u003cp style=\"margin: 0\">• Te sentir enfin chez toi\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003c/div>\n\u003c/section>\n\n\u003csection aria-labelledby=\"pourqui-titre\" style=\"background: #FFF6E3; padding: 72px 24px\">\n\u003cdiv style=\"max-width: 1120px; margin: 0 auto\">\n\u003cp style=\"margin: 0 0 10px; font-size: 15px; font-weight: 700; color: #8A6510; text-align: center\">Les passagers\u003c/p>\n\u003ch2 id=\"pourqui-titre\" style=\"margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 38px; color: #1F4E79; text-align: center\">Ce voyage est fait pour toi si…\u003c/h2>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; margin-top: 34px\">\n\u003cdiv style=\"background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; gap: 14px; align-items: flex-start\">\n\u003csvg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1F4E79\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none\">\u003cpath d=\"M2 16l20-8-6 12-3-5z\">\u003c/path>\u003c/svg>\n\u003cp style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #33475B\">\u003cb style=\"color: #1F4E79\">Tu prépares ton alya\u003c/b> et tu veux arriver prêt·e.\u003c/p>\n\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; gap: 14px; align-items: flex-start\">\n\u003csvg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#B5502F\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none\">\u003cpath d=\"M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z\">\u003c/path>\u003c/svg>\n\u003cp style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #33475B\">\u003cb style=\"color: #1F4E79\">Ton cœur parle hébreu\u003c/b> : conjoint, belle-famille, amis.\u003c/p>\n\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; gap: 14px; align-items: flex-start\">\n\u003csvg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1B7385\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none\">\u003crect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"2\">\u003c/rect>\u003cpath d=\"M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\">\u003c/path>\u003c/svg>\n\u003cp style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #33475B\">\u003cb style=\"color: #1F4E79\">Tu travailles\u003c/b> en Israël ou avec des Israéliens.\u003c/p>\n\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; gap: 14px; align-items: flex-start\">\n\u003csvg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#8A6510\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none\">\u003ccircle cx=\"12\" cy=\"12\" r=\"4\">\u003c/circle>\u003cpath d=\"M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5\">\u003c/path>\u003c/svg>\n\u003cp style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #33475B\">\u003cb style=\"color: #1F4E79\">Tu as toujours rêvé\u003c/b> de parler hébreu, tout simplement.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"metier\" aria-labelledby=\"metier-titre\" style=\"max-width: 1120px; margin: 0 auto; padding: 72px 24px\">\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 36px; align-items: stretch\">\n\u003cdiv style=\"flex: 1 1 380px; min-width: 0\">\n\u003cp style=\"margin: 0 0 10px; font-size: 15px; font-weight: 700; color: #B5502F\">Sur mesure\u003c/p>\n\u003ch2 id=\"metier-titre\" style=\"margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 38px; line-height: 1.15; color: #1F4E79\">Des cours construits pour ton métier\u003c/h2>\n\u003cp style=\"margin: 18px 0 0; font-size: 17px; line-height: 1.7; color: #33475B\">Chaque cours est préparé pour toi : ton niveau, tes objectifs, et surtout \u003cb style=\"color: #1F4E79\">l'hébreu dont tu as besoin dans ton travail\u003c/b>. Le vocabulaire, les situations et les mises en pratique viennent de ton quotidien professionnel.\u003c/p>\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px\">\n\u003cspan style=\"background: #EAF6FB; color: #1F4E79; border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 700\">⚖️ Juristes\u003c/span>\n\u003cspan style=\"background: #EAF6FB; color: #1F4E79; border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 700\">💻 Tech\u003c/span>\n\u003cspan style=\"background: #EAF6FB; color: #1F4E79; border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 700\">🏫 Enseignants\u003c/span>\n\u003cspan style=\"background: #EAF6FB; color: #1F4E79; border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 700\">💼 Commerce\u003c/span>\n\u003cspan style=\"background: #EAF6FB; color: #1F4E79; border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 700\">… et ton métier\u003c/span>\n\u003c/div>\n\u003c/div>\n\u003ca href=\"#/sante\" class=\"lp-sante\" style=\"flex: 1 1 380px; min-width: 0; display: flex; text-decoration: none\">\n\u003cspan style=\"flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; background: linear-gradient(135deg, #EAF6FB, #D3ECF4); border: 2px solid #9ED7E3; color: #1F4E79; border-radius: 28px; padding: 34px 32px\">\n\u003cspan aria-hidden=\"true\" style=\"font-size: 40px; line-height: 1\">🩺\u003c/span>\n\u003cspan style=\"font-family: Fraunces, Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1.2\">Tu es médecin ? Dentiste ? Infirmier·ère ?\u003c/span>\n\u003cspan style=\"font-size: 16.5px; line-height: 1.6; color: #33475B\">Des cours d'hébreu médical, sur mesure pour ta spécialité.\u003c/span>\n\u003cspan style=\"align-self: flex-start; background: #1F4E79; color: #FFFFFF; font-weight: 800; font-size: 15px; padding: 12px 22px; border-radius: 999px; margin-top: 4px\">Découvrir →\u003c/span>\n\u003c/span>\n\u003c/a>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"parcours\" style=\"background: #EAF6FB; padding: 72px 24px\">\n\u003cdiv style=\"max-width: 1120px; margin: 0 auto\">\n\u003cp style=\"margin: 0 0 10px; font-size: 15px; font-weight: 700; color: #1B7385; text-align: center\">Le parcours\u003c/p>\n\u003ch2 style=\"margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 38px; color: #1F4E79; text-align: center\">Ton vol vers l'hébreu\u003c/h2>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 36px\">\n\u003cdiv style=\"background: #FFFFFF; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column\">\n\u003cimg src=\"{{img:lp-decollage}}\" loading=\"lazy\" alt=\"Un avion qui décolle vers le ciel bleu\" style=\"display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover\">\n\u003cdiv style=\"padding: 20px 22px 24px\">\n\u003cp style=\"margin: 0; font-size: 13px; font-weight: 700; color: #1B7385\">Étape 1 · Débutant\u003c/p>\n\u003ch3 style=\"margin: 6px 0 0; font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 600; color: #1F4E79\">Décollage\u003c/h3>\n\u003cp style=\"margin: 10px 0 0; font-size: 15px; line-height: 1.6; color: #33475B\">Les lettres, les sons, tes premières phrases. Tu quittes le sol !\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column\">\n\u003cimg src=\"{{img:lp-envol}}\" loading=\"lazy\" alt=\"Un avion en vol au-dessus des nuages et de la mer\" style=\"display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover\">\n\u003cdiv style=\"padding: 20px 22px 24px\">\n\u003cp style=\"margin: 0; font-size: 13px; font-weight: 700; color: #1B7385\">Étape 2 · Intermédiaire\u003c/p>\n\u003ch3 style=\"margin: 6px 0 0; font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 600; color: #1F4E79\">En vol\u003c/h3>\n\u003cp style=\"margin: 10px 0 0; font-size: 15px; line-height: 1.6; color: #33475B\">Tu tiens une conversation et tu comprends l'essentiel.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column\">\n\u003cimg src=\"{{img:lp-atterrissage}}\" loading=\"lazy\" alt=\"Un avion qui atterrit au-dessus de la plage et des tours de Tel-Aviv\" style=\"display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover\">\n\u003cdiv style=\"padding: 20px 22px 24px\">\n\u003cp style=\"margin: 0; font-size: 13px; font-weight: 700; color: #1B7385\">Étape 3 · Avancé\u003c/p>\n\u003ch3 style=\"margin: 6px 0 0; font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 600; color: #1F4E79\">Atterrissage\u003c/h3>\n\u003cp style=\"margin: 10px 0 0; font-size: 15px; line-height: 1.6; color: #33475B\">Travail, démarches, débats : tu te débrouilles partout.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column\">\n\u003cimg src=\"{{img:lp-bienvenue}}\" loading=\"lazy\" alt=\"Une famille qui accueille une voyageuse à l'aéroport avec des ballons et des fleurs\" style=\"display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover\">\n\u003cdiv style=\"padding: 20px 22px 24px\">\n\u003cp style=\"margin: 0; font-size: 13px; font-weight: 700; color: #1B7385\">Destination atteinte\u003c/p>\n\u003ch3 style=\"margin: 6px 0 0; font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 600; color: #1F4E79\">Bienvenue\u003c/h3>\n\u003cp style=\"margin: 10px 0 0; font-size: 15px; line-height: 1.6; color: #33475B\">Tu vis en hébreu, tout simplement.\u003c/p>\n\u003cp dir=\"rtl\" lang=\"he\" style=\"margin: 10px 0 0; font-family: Rubik, sans-serif; font-size: 22px; color: #1B7385; text-align: left\">בְּרוּכִים הַבָּאִים\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"valise\" style=\"max-width: 1120px; margin: 0 auto; padding: #1F4E79\">Sur mesure, selon ta spécialité\u003c/h3>\n\u003cp style=\"margin: 10px 0 0; font-size: 15.5px; line-height: 1.65; color: #33475B\">Ton vocabulaire, tes situations, tes patients : chaque cours est préparé pour ta spécialité, quelle qu'elle soit.\u003c/p>\n\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border: 2px solid #E07A5F; border-radius: 22px; padding: 24px\">\n\u003cp style=\"margin: 0; font-size: 28px\">🎭\u003c/p>\n\u003ch3 style=\"margin: 10px 0 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 22px; color: #1F4E79\">Des simulations\u003c/h3>\n\u003cp style=\"margin: 10px 0 0; font-size: 15.5px; line-height: 1.65; color: #33475B\">Consultation, examens, traitements, suivi médical : on s'entraîne en situation, comme au travail.\u003c/p>\n\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border: 2px solid #C99A2E; border-radius: 22px; padding: 24px\">\n\u003cp style=\"margin: 0; font-size: 28px\">📝\u003c/p>\n\u003ch3 style=\"margin: 10px 0 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 22px; color: #1F4E79\">L'écrit médical\u003c/h3>\n\u003cp style=\"margin: 10px 0 0; font-size: 15.5px; line-height: 1.65; color: #33475B\">Lire et rédiger des comptes rendus, comprendre un dossier, expliquer un traitement au patient et à sa famille.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection style=\"max-width: 1120px; margin: 0 auto; padding: 40px 24px 30px\">\n\u003cp style=\"margin: 0 0 10px; font-size: 15px; font-weight: 700; color: #B5502F; text-align: center\">Comment ça se passe\u003c/p>\n\u003ch2 style=\"margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 38px; color: #1F4E79; text-align: center\">Trois étapes, à ton rythme\u003c/h2>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; margin-top: 30px\">\n\u003cdiv style=\"background: #FFFFFF; border-radius: 22px; padding: 24px\">\u003cp style=\"margin: 0; width: 38px; height: 38px; border-radius: 50%; background: #F7C948; color: #1F4E79; font-weight: 800; display: grid; place-items: center\">1\u003c/p>\u003ch3 style=\"margin: 12px 0 0; font-size: 19px; color: #1F4E79\">Un cours d'essai\u003c/h3>\u003cp style=\"margin: 8px 0 0; font-size: 15.5px; line-height: 1.65; color: #33475B\">On fait le point sur ton niveau, ta spécialité et ton projet en Israël.\u003c/p>\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border-radius: 22px; padding: 24px\">\u003cp style=\"margin: 0; width: 38px; height: 38px; border-radius: 50%; background: #9ED7E3; color: #1F4E79; font-weight: 800; display: grid; place-items: center\">2\u003c/p>\u003ch3 style=\"margin: 12px 0 0; font-size: 19px; color: #1F4E79\">Ton programme sur mesure\u003c/h3>\u003cp style=\"margin: 8px 0 0; font-size: 15.5px; line-height: 1.65; color: #33475B\">Des cours en hébreu, avec le français quand il le faut, et des simulations de ton quotidien.\u003c/p>\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border-radius: 22px; padding: 24px\">\u003cp style=\"margin: 0; width: 38px; height: 38px; border-radius: 50%; background: #F2A88F; color: #1F4E79; font-weight: 800; display: grid; place-items: center\">3\u003c/p>\u003ch3 style=\"margin: 12px 0 0; font-size: 19px; color: #1F4E79\">Ta valise médicale\u003c/h3>\u003cp style=\"margin: 8px 0 0; font-size: 15.5px; line-height: 1.65; color: #33475B\">Après chaque cours, ton vocabulaire médical, tes flashcards et tes jeux t'attendent dans ton espace.\u003c/p>\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection style=\"max-width: 1120px; margin: 0 auto; padding: 30px 24px 70px\">\n\u003cdiv style=\"background: #1F4E79; color: #FFFFFF; border-radius: 30px; padding: 40px 30px; text-align: center\">\n\u003ch2 style=\"margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 34px\">Prêt·e à exercer en hébreu ?\u003c/h2>\n\u003cp style=\"margin: 12px 0 22px; font-size: 17px; opacity: .9\">Parle-moi de ta spécialité : on construit ton programme ensemble.\u003c/p>\n\u003ca href=\"#/embarquer\" style=\"display: inline-block; text-decoration: none; background: #F7C948; color: #1F4E79; font-weight: 700; font-size: 17px; padding: 15px 28px; border-radius: 999px\">Je réserve mon cours d'essai\u003c/a>\n\u003c/div>\n\u003c/section>\n\u003c/main>\n\n\u003cfooter style=\"background: #F1E2C4\">\n\u003cdiv style=\"max-width: 1120px; margin: 0 auto; padding: 28px 24px 36px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: center\">\n\u003ca href=\"#/\" style=\"font-family: Fraunces, Georgia, serif; font-size: 20px; font-weight: 600; color: #1F4E79; text-decoration: none\">Hébreu avec Maayane\u003c/a>\n\u003cp lang=\"he\" dir=\"rtl\" style=\"margin: 0; font-family: Rubik, sans-serif; font-size: 20px; color: #1F4E79\">בְּרִיאוּת וּבְהַצְלָחָה!\u003c/p>\n\u003c/div>\n\u003c/footer>\n\u003c/div>\n";
</script>
<script>
/* =====================================================================
   HP — noyau de progression partagé (espace élève, back-office, site perso)
   XP, niveaux, séries de jours, badges, résumé pour la prof, graphiques.
   Aucune dépendance. Les couleurs viennent des jetons de la charte.
   ===================================================================== */
var HP = (function () {
  'use strict';

  /* ---------- barème XP ---------- */
  var XP = {
    quizOk: 10, quizKo: 3,
    flashKnown: 8, flashAgain: 3, flashSoft: 2,
    conjKnown: 12, conjAgain: 4, conjSoft: 2,
    mastered: 15,      // chaque nouveau mot maîtrisé
    goal: 25,          // objectif du jour atteint
    combo: 20          // toutes les 10 bonnes réponses d'affilée
  };

  /* ---------- niveaux : une lettre de l'alphabet par niveau ---------- */
  var LETTERS = 'אבגדהוזחטיכלמנסעפצקרשת';
  var TIERS = [
    { from: 1,  fr: 'Débutant',    he: 'מַתְחִיל' },
    { from: 4,  fr: 'Apprenti',    he: 'תַּלְמִיד' },
    { from: 7,  fr: 'Explorateur', he: 'חוֹקֵר' },
    { from: 10, fr: 'Confirmé',    he: 'מְנֻסֶּה' },
    { from: 13, fr: 'Avancé',      he: 'מִתְקַדֵּם' },
    { from: 16, fr: 'Expert',      he: 'מֻמְחֶה' },
    { from: 19, fr: 'Maître',      he: 'רַב' },
    { from: 22, fr: 'Sage',        he: 'חָכָם' }
  ];
  function stepFor(level) { return 150 + 100 * (level - 1); }
  function levelInfo(xp) {
    xp = Math.max(0, xp || 0);
    var level = 1, floor = 0;
    while (xp >= floor + stepFor(level)) { floor += stepFor(level); level++; }
    var step = stepFor(level), tier = TIERS[0];
    TIERS.forEach(function (t) { if (level >= t.from) tier = t; });
    return {
      level: level,
      letter: LETTERS.charAt(Math.min(level, LETTERS.length) - 1),
      title: tier.fr, titleHe: tier.he,
      into: xp - floor, step: step, toNext: floor + step - xp,
      pct: Math.round(100 * (xp - floor) / step)
    };
  }

  /* ---------- dates ---------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseDay(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function shortDate(d) { return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); }

  function emptyDay() {
    return { xp: 0, qOk: 0, qKo: 0, fK: 0, fA: 0, fS: 0, cK: 0, cA: 0, cS: 0, goal: 0 };
  }
  function dayGood(d) { return (d.qOk || 0) + (d.fK || 0) + (d.cK || 0); }
  function dayBad(d) { return (d.qKo || 0) + (d.fA || 0) + (d.fS || 0) + (d.cA || 0) + (d.cS || 0); }
  function dayActive(d) { return d && dayGood(d) + dayBad(d) > 0; }

  function streaks(days) {
    var today = new Date(), cur = 0, best = 0, run = 0;
    var d = new Date(today);
    if (!dayActive(days[dayKey(d)])) d = addDays(d, -1);   // aujourd'hui pas encore joué : la série tient
    while (dayActive(days[dayKey(d)])) { cur++; d = addDays(d, -1); }
    var keys = Object.keys(days).filter(function (k) { return dayActive(days[k]); }).sort();
    var prev = null;
    keys.forEach(function (k) {
      var dt = parseDay(k);
      run = (prev && Math.round((dt - prev) / 864e5) === 1) ? run + 1 : 1;
      if (run > best) best = run;
      prev = dt;
    });
    return { cur: cur, best: Math.max(best, cur) };
  }

  /* ---------- maîtrise (quiz OU flashcards) ---------- */
  function quizMastered(s) {
    if (!s) return false;
    if (s.correct >= 3 && s.wrong === 0) return true;
    return s.seen >= 4 && s.correct / s.seen >= 0.8;
  }
  function flashMastered(s) {
    if (!s) return false;
    if (s.known >= 2 && !s.again && !s.soft) return true;
    return s.seen >= 4 && s.known / s.seen >= 0.8;
  }
  function wordMastered(storage, k) {
    return quizMastered(storage.wordStats && storage.wordStats[k]) ||
           flashMastered(storage.flash && storage.flash[k]);
  }

  function totalsFrom(storage, VOCAB) {
    var t = { qOk: 0, qKo: 0, fK: 0, fA: 0, fS: 0, cK: 0, cA: 0, cS: 0, mastered: 0 };
    var k, s;
    for (k in (storage.wordStats || {})) { s = storage.wordStats[k]; t.qOk += s.correct || 0; t.qKo += s.wrong || 0; }
    for (k in (storage.flash || {})) { s = storage.flash[k]; t.fK += s.known || 0; t.fA += s.again || 0; t.fS += s.soft || 0; }
    for (k in (storage.conj || {})) { s = storage.conj[k]; t.cK += s.known || 0; t.cA += s.again || 0; t.cS += s.soft || 0; }
    var seen = {};
    Object.keys(VOCAB || {}).forEach(function (th) {
      VOCAB[th].forEach(function (e) {
        var key = e[0] + '|' + e[1];
        if (seen[key]) return; seen[key] = 1;
        if (wordMastered(storage, key)) t.mastered++;
      });
    });
    return t;
  }

  function themeMastery(storage, VOCAB) {
    return Object.keys(VOCAB || {}).map(function (th) {
      var n = 0, m = 0, seen = 0, vu = {};
      VOCAB[th].forEach(function (e) {
        var key = e[0] + '|' + e[1];
        if (vu[key]) return; vu[key] = 1; n++;
        var q = storage.wordStats && storage.wordStats[key], f = storage.flash && storage.flash[key];
        if ((q && q.seen) || (f && f.seen)) seen++;
        if (wordMastered(storage, key)) m++;
      });
      var run = storage.themeRuns && storage.themeRuns[th];
      return { theme: th, n: n, m: m, seen: seen, pct: n ? Math.round(100 * m / n) : 0, runs: run ? +run.n || 0 : 0 };
    });
  }

  function weakWords(storage, max) {
    var map = {};
    function add(k, bad, seen) {
      var p = k.split('|');
      var o = map[k] || (map[k] = { he: p[0], fr: p[1] || '', bad: 0, seen: 0, q: 0, f: 0 });
      o.bad += bad; o.seen += seen;
      return o;
    }
    var k, s;
    /* q : erreurs aux exercices (quiz, jeux) ; f : « à revoir » aux cartes */
    for (k in (storage.wordStats || {})) { s = storage.wordStats[k]; if (s.wrong) add(k, s.wrong, s.seen || 0).q += s.wrong; }
    for (k in (storage.flash || {})) { s = storage.flash[k]; if (s.again) add(k, s.again, s.seen || 0).f += s.again; }
    return Object.keys(map).map(function (x) { return map[x]; })
      .sort(function (a, b) { return b.bad - a.bad || (b.bad / (b.seen || 1)) - (a.bad / (a.seen || 1)); })
      .slice(0, max || 15);
  }

  /* ---------- badges ---------- */
  var BADGES = [
    { id: 'first',   icon: '🌱', name: 'Premier pas',         desc: 'Répondre à sa première carte',             test: function (c) { return c.answers >= 1; } },
    { id: 'streak3', icon: '🔥', name: 'Ça chauffe',          desc: '3 jours de révision d\'affilée',            test: function (c) { return c.best >= 3; } },
    { id: 'streak7', icon: '🔥', name: 'Une semaine pile',    desc: '7 jours d\'affilée',                        test: function (c) { return c.best >= 7; } },
    { id: 'streak30',icon: '🌋', name: 'Inarrêtable',         desc: '30 jours d\'affilée',                       test: function (c) { return c.best >= 30; } },
    { id: 'goal7',   icon: '🎯', name: 'Régulier',            desc: 'Objectif du jour atteint 7 fois',           test: function (c) { return c.goalDays >= 7; } },
    { id: 'day200',  icon: '💪', name: 'Grosse journée',      desc: '200 XP en une journée',                     test: function (c) { return c.maxDay >= 200; } },
    { id: 'xp1000',  icon: '⭐', name: '1 000 XP',            desc: 'Cumuler 1 000 XP',                          test: function (c) { return c.xp >= 1000; } },
    { id: 'xp5000',  icon: '🌟', name: '5 000 XP',            desc: 'Cumuler 5 000 XP',                          test: function (c) { return c.xp >= 5000; } },
    { id: 'cards100',icon: '🃏', name: 'Cent cartes',         desc: '100 flashcards retournées',                 test: function (c) { return c.cards >= 100; } },
    { id: 'cards1k', icon: '🗂️', name: 'Mille cartes',        desc: '1 000 flashcards retournées',               test: function (c) { return c.cards >= 1000; } },
    { id: 'mast50',  icon: '📗', name: '50 mots acquis',      desc: '50 mots maîtrisés',                         test: function (c) { return c.mastered >= 50; } },
    { id: 'mast200', icon: '📚', name: '200 mots acquis',     desc: '200 mots maîtrisés',                        test: function (c) { return c.mastered >= 200; } },
    { id: 'theme',   icon: '🏆', name: 'Thème bouclé',        desc: 'Maîtriser tous les mots d\'un thème',      test: function (c) { return c.themesDone >= 1; } },
    { id: 'conj50',  icon: '🧩', name: 'Conjugueur',          desc: '50 conjugaisons réussies',                  test: function (c) { return c.conj >= 50; } },
    { id: 'combo20', icon: '⚡', name: 'Sans faute',          desc: '20 bonnes réponses d\'affilée',             test: function (c) { return c.combo >= 20; } },
    { id: 'early',   icon: '🌅', name: 'Lève-tôt',            desc: 'Réviser avant 8 h',                         test: function (c) { return c.early; } },
    { id: 'night',   icon: '🌙', name: 'Oiseau de nuit',      desc: 'Réviser après 22 h',                        test: function (c) { return c.night; } }
  ];

  function badgeContext(P, totals, themes) {
    var st = streaks(P.days || {}), goalDays = 0, maxDay = 0;
    Object.keys(P.days || {}).forEach(function (k) {

          (gp ? '<circle cx="40" cy="40" r="' + R + '" class="hp-ring-fg" stroke-dasharray="' + (C * gp / 100).toFixed(1) + ' ' + C.toFixed(1) + '"/>' : '') + '</svg>' +

  function heatmap(days, weeks) {
    weeks = weeks || 17;
    var today = new Date(), tk = dayKey(today);
    var end = addDays(today, 6 - ((today.getDay() + 6) % 7));        // dimanche de cette semaine
    var start = addDays(end, -(weeks * 7) + 1);
    var vis = [], max = 1, active = 0;
    for (var j = 0; j < weeks * 7; j++) { var dd = addDays(start, j); if (dd > today) break; var vv = days && days[dayKey(dd)] ? +days[dayKey(dd)].xp || 0 : 0; vis.push([dd, vv]); if (vv > max) max = vv; if (vv) active++; }

    for (var w = 0; w < weeks; w++) {

        months += '<span style="grid-column:' + (w + 1) + '">' + wkStart.toLocaleDateString('fr-FR', { month: 'short' }) + '</span>';

      }
      cols += '<div class="hp-hcol">' + cells + '</div>';
    }
    return '<div class="hp-heat" role="img" aria-label="Régularité : ' + active + ' jours actifs sur les ' + weeks + ' dernières semaines">' +
      '<div class="hp-heat-days" aria-hidden="true"><span></span><span>L</span><span></span><span>M</span><span></span><span>V</span><span></span><span>D</span></div>' +
      '<div class="hp-heat-body" aria-hidden="true"><div class="hp-heat-months" style="grid-template-columns:repeat(' + weeks + ',17px)">' + months + '</div>' +
      '<div class="hp-heat-grid">' + cols + '</div></div></div>' +

      '<i class="h3" title="' + (q(2) + 1) + ' à ' + q(3) + ' XP"></i><i class="h4" title="plus de ' + q(3) + ' XP"></i> Plus</div>' +
      dataTable('XP par jour, jours actifs', ['Jour', 'XP'], vis.filter(function (x) { return x[1]; }).reverse().slice(0, 60).map(function (x) { return [shortDate(x[0]), fmt(x[1])]; }));
  }

  function xpBars(days, n, goal) {

    var W = 620, H = 180, padB = 22, padT = 16, padL = 36, padR = goal ? 74 : 10, today = new Date(), vals = [], top = goal || 10;
    for (var i = n - 1; i >= 0; i--) {
      var d = addDays(today, -i), v = days && days[dayKey(d)] ? +days[dayKey(d)].xp || 0 : 0;
      vals.push({ d: d, v: v }); if (v > top) top = v;
    }

      svg += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + Y(g).toFixed(1) + '" y2="' + Y(g).toFixed(1) + '" class="' + (g ? 'hp-grid' : 'hp-base') + '"/>' +
        '<text x="' + (padL - 6) + '" y="' + (Y(g) + 4).toFixed(1) + '" class="hp-axis" text-anchor="end">' + fmt(g) + '</text>';

  function rateLine(days, weeks) {

        '" data-tip="' + (w.rate == null ? 'pas de réponse' : w.rate + ' % de réussite') + '|semaine du ' + shortDate(w.start) + (w.answers ? ' · ' + w.answers + ' réponses' : '') + '"/>';
    });

  /* infobulle commune : survol à la souris, toucher sur téléphone ; texte « valeur|détail » */
  function installTip() {

    var tip = document.createElement('div'); tip.className = 'hp-tip'; tip.setAttribute('role', 'tooltip'); tip.hidden = true;
    document.body.appendChild(tip); window.__hpTip = tip;
    function show(el, x, y) {
      var t = String(el.getAttribute('data-tip') || '').split('|');
      tip.textContent = ''; var b = document.createElement('b'); b.textContent = t[0]; tip.appendChild(b);
      if (t[1]) { var s = document.createElement('span'); s.textContent = t[1]; tip.appendChild(s); }
      tip.hidden = false;
      var w = tip.offsetWidth, h = tip.offsetHeight, vw = document.documentElement.clientWidth;
      tip.style.left = Math.max(6, Math.min(vw - w - 6, x - w / 2)) + 'px';

    }

      var el = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;

  var CSS = '' +

  'use strict';
  var DBN = 'mayane-hebreu-v1', ST = 'kv', idb = null, mem = {};

  function open() {
    return new Promise(function (res) {
      try {
        var r = indexedDB.open(DBN, 1);
        r.onupgradeneeded = function () { r.result.createObjectStore(ST); };
        r.onsuccess = function () { idb = r.result; res(); };
        r.onerror = function () { res(); };
        r.onblocked = function () { res(); };
      } catch (e) { res(); }
    });
  }
  function get(k) {
    if (!idb) return Promise.resolve(mem[k]);
    return new Promise(function (res) {
      try {
        var q = idb.transaction(ST).objectStore(ST).get(k);
        q.onsuccess = function () { res(q.result); };
        q.onerror = function () { res(mem[k]); };
      } catch (e) { res(mem[k]); }
    });
  }
  function set(k, v) {
    mem[k] = v;
    if (!idb) return Promise.resolve();
    return new Promise(function (res) {
      try {
        var t = idb.transaction(ST, 'readwrite');
        t.objectStore(ST).put(v, k);
        t.oncomplete = function () { res(); };
        t.onerror = function () { res(); };
      } catch (e) { res(); }
    });
  }
  function del(k) {
    delete mem[k];
    if (!idb) return Promise.resolve();
    return new Promise(function (res) {
      try {
        var t = idb.transaction(ST, 'readwrite');
        t.objectStore(ST).delete(k);
        t.oncomplete = function () { res(); };
        t.onerror = function () { res(); };
      } catch (e) { res(); }
    });
  }
  function clearAll() {
    mem = {};
    if (!idb) return Promise.resolve();
    return new Promise(function (res) {
      try {
        var t = idb.transaction(ST, 'readwrite');
        t.objectStore(ST).clear();
        t.oncomplete = function () { res(); };
        t.onerror = function () { res(); };
      } catch (e) { res(); }
    });
  }

  /* ---------- mots de passe : vérifiés par empreinte (hash) ; celui des élèves est aussi gardé pour Maayane ---------- */
  function rnd(n) {
    var a = new Uint8Array(n);
    try { crypto.getRandomValues(a); } catch (e) { for (var i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256); }
    return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }
  function hash(pw, salt) {
    var txt = salt + '::' + pw;
    try {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)).then(function (buf) {
        return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      });
    } catch (e) {
      var h = 5381; for (var i = 0; i < txt.length; i++) h = ((h << 5) + h + txt.charCodeAt(i)) | 0;
      return Promise.resolve('x' + (h >>> 0).toString(16));
    }
  }
  function withPassword(rec, pw) {
    rec.salt = rnd(12);
    return hash(pw, rec.salt).then(function (h) { rec.hash = h; return rec; });
  }
  var WORDS = ['shalom', 'toda', 'boker', 'layla', 'shemesh', 'yam', 'sefer', 'mayim', 'tapuz', 'kelev', 'perah', 'hatul', 'kochav', 'bayit', 'lehem'];
  function genPassword() {
    var a = new Uint32Array(2);
    try { crypto.getRandomValues(a); } catch (e) { a[0] = Math.random() * 1e9; a[1] = Math.random() * 1e9; }
    return WORDS[a[0] % WORDS.length] + '-' + (1000 + a[1] % 9000);
  }

  /* ---------- API ---------- */
  var api = {
    ready: open,
    genPassword: genPassword,
    reset: clearAll,

    getTeacher: function () { return get('teacher'); },
    setTeacherPassword: function (login, pw) {
      return get('teacher').then(function (t) {
        t = t || { name: 'Maayane' };
        t.login = login;
        if (!pw) return set('teacher', t);   /* identifiant seul : mot de passe inchangé */
        return withPassword(t, pw).then(function (r) { return set('teacher', r); });
      });
    },
    getSettings: function () { return get('settings').then(function (s) { return s || {}; }); },
    setSettings: function (s) { return set('settings', s); },

    /* ---------- documents montrés à l'élève (démo) ---------- */
    myDocs: function (sid) {
      return Promise.all([api.listDocs(), api.getSettings()]).then(function (r) {
        var ok = r[1].sharedDocs || [];
        return r[0].filter(function (d) { return ok.indexOf(d.id) >= 0 && (d.students || []).indexOf(sid) >= 0; })
          .map(function (d) { return { id: d.id, name: d.name, type: d.type, size: d.size, at: d.addedAt }; });
      });
    },
    myDocUrl: function (sid, id) { return api.getBlob(id).then(function (b) { return b ? URL.createObjectURL(b) : null; }); },

    /* ---------- tests de niveau (démo : gardés dans ce navigateur) ---------- */
    addLevelTest: function (rec) {
      return get('leveltests').then(function (l) {
        l = l || []; rec = JSON.parse(JSON.stringify(rec)); rec.at = new Date().toISOString();
        rec.id = rec.at.replace(/[:.]/g, '-') + '-' + Math.random().toString(36).slice(2, 8);
        l.push(rec); return set('leveltests', l.slice(-200));
      });
    },
    listLevelTests: function () { return get('leveltests').then(function (l) { return (l || []).slice().sort(function (a, b) { return a.id < b.id ? 1 : -1; }); }); },
    deleteLevelTest: function (id) { return get('leveltests').then(function (l) { return set('leveltests', (l || []).filter(function (r) { return r.id !== id; })); }); },

    listStudents: function () { return get('students').then(function (l) { return l || []; }); },
    getStudent: function (id) { return api.listStudents().then(function (l) { return l.filter(function (s) { return s.id === id; })[0] || null; }); },
    saveStudent: function (st, pw) {
      return api.listStudents().then(function (l) {
        /* la prof doit pouvoir retrouver le mot de passe de chaque élève : il est gardé avec le compte */
        if (pw) st.pw = pw;
        var p = pw ? withPassword(st, pw) : Promise.resolve(st);
        return p.then(function () {
          var i = l.findIndex(function (s) { return s.id === st.id; });
          if (i < 0) l.push(st); else l[i] = st;
          return set('students', l).then(function () { return st; });
        });
      });
    },
    deleteStudent: function (id) {
      return api.listStudents().then(function (l) {
        return set('students', l.filter(function (s) { return s.id !== id; }));
      }).then(function () {
        return Promise.all([del('content:' + id), del('summary:' + id), del('progress:' + id),
          get('bookings').then(function (l) { return set('bookings', (l || []).filter(function (b) { return b.studentId !== id; })); }),
          get('messages').then(function (l) { return set('messages', (l || []).filter(function (m) { return m.studentId !== id; })); })]);
      }).then(function () {
        return api.listDocs().then(function (docs) {
          docs.forEach(function (d) { d.students = (d.students || []).filter(function (x) { return x !== id; }); });
          return set('docs', docs);
        });
      });
    },
    loginTaken: function (login, exceptId) {
      login = (login || '').trim().toLowerCase();
      return Promise.all([api.listStudents(), get('teacher')]).then(function (r) {
        if (r[1] && r[1].login === login) return true;
        return r[0].some(function (s) { return s.login === login && s.id !== exceptId; });
      });
    },
    /* connexion : renvoie {role, id} ou null */
    login: function (login, pw) {
      login = (login || '').trim().toLowerCase();
      return Promise.all([get('teacher'), api.listStudents()]).then(function (r) {
        var t = r[0];
        if (t && t.login === login) return hash(pw, t.salt).then(function (h) { return h === t.hash ? { role: 'teacher' } : null; });
        var s = r[1].filter(function (x) { return x.login === login; })[0];
        if (!s) return null;
        return hash(pw, s.salt).then(function (h) {
          if (h !== s.hash) return null;
          if (s.active === false) return { role: 'blocked' };
          return { role: 'student', id: s.id };
        });
      });
    },

    getContent: function (id) { return get('content:' + id).then(function (c) { return c || null; }); },
    setContent: function (id, c) { c.updatedAt = new Date().toISOString(); return set('content:' + id, c); },
    getSummary: function (id) { return get('summary:' + id).then(function (s) { return s || null; }); },
    getProgress: function (id) { return get('progress:' + id).then(function (p) { return p || null; }); },
    /* appelé par l'espace élève à chaque réponse (regroupé) */
    pushProgress: function (id, summary, storage) {
      if (!id) return Promise.resolve();
      return Promise.all([set('summary:' + id, summary), set('progress:' + id, storage)]).then(function () {
        try { window.dispatchEvent(new CustomEvent('hp-progress', { detail: id })); } catch (e) {}
      });
    },

    listDocs: function () { return get('docs').then(function (l) { return l || []; }); },
    addDoc: function (file, students) {
      var d = {
        id: 'd' + Date.now().toString(36) + rnd(3), name: file.name, type: file.type || '', size: file.size,
        addedAt: new Date().toISOString(), students: students.slice(), status: 'pending'
      };
      return set('blob:' + d.id, file).then(function () { return api.listDocs(); }).then(function (l) {
        l.unshift(d); return set('docs', l);
      }).then(function () { return d; });
    },
    updateDoc: function (d) {
      return api.listDocs().then(function (l) {
        var i = l.findIndex(function (x) { return x.id === d.id; });
        if (i >= 0) l[i] = d; return set('docs', l);
      });
    },
    deleteDoc: function (id) {
      return api.listDocs().then(function (l) { return set('docs', l.filter(function (x) { return x.id !== id; })); })
        .then(function () { return del('blob:' + id); });
    },
    getBlob: function (id) { return get('blob:' + id); },

    /* ---------- messages (questions des élèves, réponses de Maayane) ---------- */
    listMessages: function (sid) {
      return get('messages').then(function (l) { return (l || []).filter(function (m) { return m.studentId === sid; }); });
    },
    sendMessage: function (sid, body, from) {
      return get('messages').then(function (l) {
        l = l || [];
        l.push({ id: 'm' + Date.now().toString(36) + rnd(3), studentId: sid, from: from === 'teacher' ? 'teacher' : 'student', body: String(body).slice(0, 2000), at: new Date().toISOString(), readAt: null });
        return set('messages', l);
      });
    },
    markMessagesRead: function (sid) {
      return get('messages').then(function (l) {
        l = l || []; var now = new Date().toISOString();
        l.forEach(function (m) { if (m.studentId === sid && m.from === 'student' && !m.readAt) m.readAt = now; });
        return set('messages', l);
      });
    },
    unreadMessages: function () {
      return get('messages').then(function (l) { var o = {}; (l || []).forEach(function (m) { if (m.from === 'student' && !m.readAt) o[m.studentId] = (o[m.studentId] || 0) + 1; }); return o; });
    },

    /* ---------- agenda : cours réservés (mêmes règles que le serveur, via HPCal) ---------- */
    listBookings: function (from, to) {
      return get('bookings').then(function (l) {
        return (l || []).filter(function (b) { return (!from || b.end > from) && (!to || b.start < to); })
          .sort(function (a, b) { return a.start - b.start; });
      });
    },
    addBooking: function (b) {
      return get('bookings').then(function (l) {
        l = l || [];
        if (l.some(function (x) { return x.status === 'booked' && x.start < b.end && x.end > b.start; })) { var e = new Error('créneau déjà pris'); e.code = 'taken'; throw e; }
        var r = { id: 'b' + Date.now().toString(36) + rnd(3), studentId: b.studentId, start: b.start, end: b.end, status: 'booked',
          note: String(b.note || '').slice(0, 500), by: b.by || 'teacher', createdAt: new Date().toISOString() };
        l.push(r);
        return set('bookings', l).then(function () { return r; });
      });
    },
    cancelBooking: function (id, by) {
      return get('bookings').then(function (l) {
        l = l || [];
        var r = l.filter(function (x) { return x.id === id; })[0];
        if (r) { r.status = 'cancelled'; r.cancelledBy = by || 'teacher'; r.cancelledAt = new Date().toISOString(); }
        return set('bookings', l);
      });
    },
    agendaState: function (sid, from, to) {
      return Promise.all([api.getSettings(), api.listBookings()]).then(function (r) {
        var now = Date.now();
        return {
          cfg: HPCal.pub(r[0].agenda), now: now,
          busy: r[1].filter(function (b) { return b.status === 'booked' && b.end > from && b.start < to; }).map(function (b) { return { s: b.start, e: b.end }; }),
          mine: r[1].filter(function (b) { return b.studentId === sid && b.start > from; })
        };
      });
    },
    agendaBook: function (sid, start, minutes, note) {
      return api.agendaState(sid, start - 864e5, start + 864e5).then(function (st) {
        var fail = function (code) { var e = new Error(code); e.code = code; throw e; };
        if (st.cfg.maxUpcoming && st.mine.filter(function (b) { return b.status === 'booked' && b.start > st.now; }).length >= st.cfg.maxUpcoming) fail('max_upcoming');
        var why = HPCal.check(st.cfg, st.busy, start, minutes, st.now);
        if (why) fail(why);
        return api.addBooking({ studentId: sid, start: start, end: start + minutes * 60000, note: note, by: 'student' });
      });
    },
    agendaCancel: function (sid, id) {
      return Promise.all([api.getSettings(), api.listBookings()]).then(function (r) {
        var b = r[1].filter(function (x) { return x.id === id && x.studentId === sid && x.status === 'booked'; })[0];
        var fail = function (code) { var e = new Error(code); e.code = code; throw e; };
        if (!b) fail('not_found');
        if (!HPCal.canCancel(r[0].agenda, b.start, Date.now())) fail('too_late');
        return api.cancelBooking(id, 'student');
      });
    },

    _set: set, _get: get, _withPassword: withPassword
  };
  return api;
})();

/* =====================================================================
   HPA — analyse des documents déposés par Maayane et mise à jour des
   espaces élèves. Lecture : PDF (pdf.js), Word .docx (mammoth), images,
   texte. L'analyse elle-même est faite par Claude ; rien n'est ajouté à
   un élève sans validation de Maayane.
   ===================================================================== */
var HPA = (function () {
  'use strict';
  var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  var PDFW = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var MAMMOTH = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
  var loaded = {};
  function script(src) {
    if (loaded[src]) return loaded[src];
    loaded[src] = new Promise(function (res, rej) {
      var s = document.createElement('script'); s.src = src; s.onload = res;
      s.onerror = function () { delete loaded[src]; rej(new Error('Impossible de charger ' + src)); };
      document.head.appendChild(s);
    });
    return loaded[src];
  }

  function kind(d) {
    var n = (d.name || '').toLowerCase(), t = d.type || '';
    if (t === 'application/pdf' || /\.pdf$/.test(n)) return 'pdf';
    if (/\.docx$/.test(n) || /wordprocessingml/.test(t)) return 'docx';
    if (/\.doc$/.test(n) || t === 'application/msword') return 'doc';
    if (/^image\//.test(t) || /\.(png|jpe?g|webp|gif|heic)$/.test(n)) return 'img';
    if (/^text\//.test(t) || /\.(txt|md|csv)$/.test(n)) return 'txt';
    return 'other';
  }

  /* ---------- extraction : {text, images[]} ---------- */
  function canvasBlob(c) { return new Promise(function (res) { c.toBlob(res, 'image/jpeg', 0.85); }); }
  function fromPdf(blob, onStep) {
    return script(PDFJS).then(function () {
      var lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = PDFW;
      return blob.arrayBuffer().then(function (buf) { return lib.getDocument({ data: buf }).promise; });
    }).then(function (pdf) {
      var n = pdf.numPages, out = [], i = 1;
      function next() {
        if (i > n) return Promise.resolve();
        onStep && onStep('Lecture de la page ' + i + ' / ' + n);
        return pdf.getPage(i).then(function (p) {
          return p.getTextContent().then(function (tc) {
            out.push({ page: i, text: tc.items.map(function (x) { return x.str + (x.hasEOL ? '\n' : ' '); }).join(''), p: p });
            i++; return next();
          });
        });
      }
      return next().then(function () {
        var text = out.map(function (o) { return '--- page ' + o.page + ' ---\n' + o.text.trim(); }).join('\n\n');
        var chars = out.reduce(function (s, o) { return s + o.text.trim().length; }, 0);
        if (chars > 80 * n) return { text: text, images: [], pages: n };
        /* PDF scanné (peu de texte) : toutes les pages partent en image. Chaque page n'est dessinée
           qu'au moment de son envoi, pour ne pas garder des centaines d'images en mémoire. */
        var max = Math.min(n, 400);
        var imgs = out.slice(0, max).map(function (o) {
          return function () {
            var vp = o.p.getViewport({ scale: 1.6 }), c = document.createElement('canvas');
            c.width = vp.width; c.height = vp.height;
            return o.p.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise.then(function () { return canvasBlob(c); });
          };
        });
        return { text: chars ? text : '', images: imgs, pages: n, scanned: true, cut: n > max };
      });
    });
  }
  function extract(doc, blob, onStep) {
    var k = kind(doc);
    if (k === 'pdf') return fromPdf(blob, onStep);
    if (k === 'docx') return script(MAMMOTH).then(function () {
      onStep && onStep('Lecture du document Word');
      return blob.arrayBuffer().then(function (buf) { return window.mammoth.extractRawText({ arrayBuffer: buf }); });
    }).then(function (r) { return { text: r.value || '', images: [] }; });
    if (k === 'img') return Promise.resolve({ text: '', images: [blob] });
    if (k === 'txt') return blob.text().then(function (t) { return { text: t, images: [] }; });
    if (k === 'doc') return Promise.reject(new Error('Les anciens fichiers Word (.doc) ne se lisent pas ici : enregistrez-le en .docx ou en PDF.'));
    return Promise.reject(new Error('Format non pris en charge.'));
  }

  /* ---------- consigne envoyée à Claude ---------- */
  var SCHEMA = '{\n' +
    '  "themes": [ { "name": "Nom du thème en français", "words": [ { "he": "mot sans nikoud en orthographe pleine", "he_nikud": "mot avec nikoud", "fr": "traduction française", "nature": "n", "binyan": "", "racine": "", "def_he": "définition simple en hébreu", "ex_he": "phrase courte en hébreu qui contient le mot" } ] } ],\n' +
    '  "grammar": [ { "category": "Catégorie", "title": "Titre de la fiche", "he": "titre en hébreu", "html": "<p>…</p>" } ],\n' +
    '  "summary": "une phrase qui résume le contenu du document"\n}';
  /* définition et phrase d'exemple : seuls ajouts autorisés avec le nikoud, pour les exercices « mot ↔ définition » et « phrase à compléter » */
  var EXTRA = 'Pour chaque mot, deux aides d\'exercice (seuls ajouts autorisés, avec le nikoud) :\n' +
    '- "def_he" : une définition TRÈS simple en hébreu facile (4 à 10 mots, avec nikoud), compréhensible par un élève de niveau débutant/intermédiaire, sans utiliser le mot lui-même ni un mot de la même racine. Pour un mot-outil, un nombre ou une expression où une définition n\'a pas de sens, mets "".\n' +
    '- "ex_he" : une phrase courte et naturelle en hébreu (4 à 10 mots, avec nikoud) qui contient le mot EXACTEMENT sous la forme de "he_nikud" (mêmes lettres, sans préfixe collé comme ה, ו, ב, ל, מ, ש, כ), pour qu\'on puisse le cacher dans un exercice à trous. Si le document donne un exemple qui convient, reprends-le. Si c\'est impossible, mets "".\n\n';
  /* consigne fixe (identique pour tous les morceaux d'un document : mise en cache par l'API) */
  function rules() {
    return 'Tu prépares le contenu de révision d\'un élève de Maayane, professeure d\'hébreu, à partir d\'UN document de cours qu\'elle a déposé.\n\n' +
      'RÈGLE ABSOLUE : n\'utilise QUE ce qui figure dans le document. N\'ajoute aucun mot, aucune règle, aucun exemple qui n\'y est pas. Si le document ne contient pas de vocabulaire ou de grammaire, renvoie des listes vides.\n\n' +
      'Vocabulaire : chaque mot hébreu du document avec sa traduction française. "he" = le mot SANS nikoud, en orthographe pleine (כתיב מלא, avec les ו et י d\'un journal : תחבושת, שולחן, דיבר). "he_nikud" = le mot avec nikoud (si le document n\'en donne pas, vocalise toi-même selon la norme standard, c\'est le seul ajout autorisé). "fr" = la traduction donnée par le document, sinon la tienne, courte. "nature" = une lettre : v verbe (à l\'infinitif si le document le donne ainsi), n nom, a adjectif, d adverbe, o mot-outil (préposition, pronom, conjonction), c nombre, x expression.\n' +
      'Range chaque mot dans UN des grands thèmes suivants, en recopiant exactement son nom (aucun autre thème, même pour un document très précis) : ' + VOCAB_THEMES.join(' ; ') + '. Un mot qui n\'entre dans aucun va dans « Autres mots ».\n' + INFO + '\n' +
      EXTRA +
      'Grammaire : une fiche par règle expliquée dans le document, en français, comme une fiche de révision claire : "html" n\'utilise que <p>, <ul>, <li>, <strong>, <em>, <br> et <div class="example"> pour les exemples, avec l\'hébreu dans <span class="he-inline">…</span>. Reprends les exemples du document. "category" = un de ces grands chapitres, recopié exactement : ' + GRAM_CHAPTERS.join(' ; ') + '.\n\n' +
      'Réponds UNIQUEMENT avec un objet JSON valide de cette forme :\n' + SCHEMA;
  }
  /* grands thèmes de vocabulaire : peu nombreux, pour que les révisions de l'élève restent simples (choix de Maayane) */
  var VOCAB_THEMES = ['Personnes, famille et présentation', 'Corps, santé et émotions', 'Maison et vie quotidienne', 'Nourriture et boissons',
    'Ville, transports et voyages', 'Études, travail et argent', 'Temps, dates et nombres', 'Nature, animaux et météo', 'Loisirs, culture et fêtes',
    'Mots-outils : pronoms, prépositions, questions', 'Expressions de tous les jours', 'Autres mots'];
  /* binyan et racine de chaque mot : servent à ranger le vocabulaire autrement (choix de Maayane pour chaque élève) */

  /* demande de Maayane : pas de nikoud dans les exercices des élèves. Les données enregistrées gardent

     Les fiches de grammaire et le cours « Passé & futur » ne sont pas touchés. */

      if (Array.isArray(x)) return x.map(st);
      if (x && typeof x === 'object') return Object.keys(x).reduce(function (o, k) { o[k.replace(N, '')] = st(x[k]); return o; }, {});
      return x;
    }
    var o = JSON.parse(JSON.stringify(c || {}));

      o.VOCAB[t] = (o.VOCAB[t] || []).map(function (e) {

    if (o.VERB_PRESENT) o.VERB_PRESENT = st(o.VERB_PRESENT);

  function bindTests() {

    m.innerHTML = '<div class="card"><button class="close" aria-label="Fermer">×</button>' + html + '</div>';
    var before = document.activeElement;
    function close() { m.remove(); document.removeEventListener('keydown', onEsc); if (before && before.focus) before.focus(); }
    function onEsc(e) { if (e.key === 'Escape' && m.isConnected) close(); }
    m.addEventListener('click', function (e) { if (e.target === m || e.target.classList.contains('close')) close(); });
    document.addEventListener('keydown', onEsc);
    document.body.appendChild(m);
    var first = m.querySelector('input, button:not(.close), a'); if (first) setTimeout(function () { first.focus(); }, 30);
    return m;
  }
