"tr\">doubárnou\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּם\u003c/td>\u003ctd class=\"hcell he\">דֻּבַּרְתֶּם\u003c/td>\u003ctd class=\"hcell he\">דוברתם\u003c/td>\u003ctd class=\"tr\">doubartém\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּן\u003c/td>\u003ctd class=\"hcell he\">דֻּבַּרְתֶּן\u003c/td>\u003ctd class=\"hcell he\">דוברתן\u003c/td>\u003ctd class=\"tr\">doubartén\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">דֻּבְּרוּ\u003c/td>\u003ctd class=\"hcell he\">דוברו\u003c/td>\u003ctd class=\"tr\">doubróu\u003c/td>\u003ctd>ils ont été dits\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n\n  \u003cdiv class=\"note\">\u003cb>Usage réel\u003c/b>\n  פועל est un binyan \u003cstrong>défectif\u003c/strong> en hébreu moderne&nbsp;: il n'a ni infinitif, ni impératif, et s'emploie presque uniquement à la 3\u003csup>e\u003c/sup> personne. Les 1\u003csup>re\u003c/sup> et 2\u003csup>e\u003c/sup> personnes sont grammaticalement correctes mais rarissimes.\u003cbr>\n  Exemples vivants&nbsp;: \u003cspan class=\"he\">סֻפַּר\u003c/span> (סופר, « il a été raconté »), \u003cspan class=\"he\">בֻּטַּל\u003c/span> (בוטל, « il a été annulé »), \u003cspan class=\"he\">טֻפַּל\u003c/span> (טופל, « il a été traité »), \u003cspan class=\"he\">קֻבַּל\u003c/span> (קובל)… Le participe présent est très fréquent, lui&nbsp;: \u003cspan class=\"he\">מְבֻטָּל\u003c/span> (מבוטל), \u003cspan class=\"he\">מְסֻפָּר\u003c/span>.\u003c/div>\n\n  \u003cdiv class=\"note tip\">\u003cb>Astuce de reconnaissance\u003c/b>\n  En ktiv malé, פועל se repère au \u003cspan class=\"he\">ו\u003c/span> après la 1\u003csup>re\u003c/sup> radicale&nbsp;: \u003cspan class=\"he\">בוטל, סודר, תורגם, אורגן\u003c/span>. Ne le confondez pas avec le \u003cspan class=\"he\">ו\u003c/span> du הופעל, qui vient \u003cem>après\u003c/em> un \u003cspan class=\"he\">ה\u003c/span>&nbsp;: \u003cspan class=\"he\">הוכתב\u003c/span>.\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"tabpane\" id=\"p-hifil\">\n  \u003cdiv class=\"card\" style=\"border-top:3px solid var(--hifil)\">\n  \u003ch3 style=\"margin-top:0;color:var(--hifil)\">הִפְעִיל — le causatif\u003c/h3>\n  \u003cp>\u003cb>Racine modèle&nbsp;:\u003c/b> \u003cspan class=\"he\">כ־ת־ב\u003c/span> · \u003cb>Thème&nbsp;:\u003c/b> \u003cspan class=\"he\">\u003cspan class=\"pfx\">הִ\u003c/span>כְתִּיב\u003c/span> · \u003cb>Marque&nbsp;:\u003c/b> préfixe \u003cspan class=\"he pfx\">הִ־\u003c/span> + \u003cem>yod\u003c/em> avant la dernière radicale.\u003c/p>\n  \u003cdiv class=\"tbl-wrap\">\u003ctable>\n  \u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Forme vocalisée\u003c/th>\u003cth>Ktiv malé\u003c/th>\u003cth>Prononciation\u003c/th>\u003cth>Traduction\u003c/th>\u003c/tr>\u003c/thead>\n  \u003ctbody>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">הִכְתַּבְתִּי\u003c/td>\u003ctd class=\"hcell he\">הכתבתי\u003c/td>\u003ctd class=\"tr\">hikhtávti\u003c/td>\u003ctd>j'ai dicté\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">הִכְתַּבְתָּ\u003c/td>\u003ctd class=\"hcell he\">הכתבת\u003c/td>\u003ctd class=\"tr\">hikhtávta\u003c/td>\u003ctd>tu as dicté (m.)\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">הִכְתַּבְתְּ\u003c/td>\u003ctd class=\"hcell he\">הכתבת\u003c/td>\u003ctd class=\"tr\">hikhtávt\u003c/td>\u003ctd>tu as dicté (f.)\u003c/td>\u003c/tr>\n  \u003ctr class=\"hl\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">הִכְתִּיב\u003c/td>\u003ctd class=\"hcell he\">הכתיב\u003c/td>\u003ctd class=\"tr\">hikhtív\u003c/td>\u003ctd>il a dicté\u003c/td>\u003c/tr>\n  \u003ctr class=\"hl\">\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">הִכְתִּיבָה\u003c/td>\u003ctd class=\"hcell he\">הכתיבה\u003c/td>\u003ctd class=\"tr\">hikhtíva\u003c/td>\u003ctd>elle a dicté\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">הִכְתַּבְנוּ\u003c/td>\u003ctd class=\"hcell he\">הכתבנו\u003c/td>\u003ctd class=\"tr\">hikhtávnou\u003c/td>\u003ctd>nous avons dicté\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּם\u003c/td>\u003ctd class=\"hcell he\">הִכְתַּבְתֶּם\u003c/td>\u003ctd class=\"hcell he\">הכתבתם\u003c/td>\u003ctd class=\"tr\">hikhtavtém\u003c/td>\u003ctd>vous avez dicté (m.)\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּן\u003c/td>\u003ctd class=\"hcell he\">הִכְתַּבְתֶּן\u003c/td>\u003ctd class=\"hcell he\">הכתבתן\u003c/td>\u003ctd class=\"tr\">hikhtavtén\u003c/td>\u003ctd>vous avez dicté (f.)\u003c/td>\u003c/tr>\n  \u003ctr class=\"hl\">\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">הִכְתִּיבוּ\u003c/td>\u003ctd class=\"hcell he\">הכתיבו\u003c/td>\u003ctd class=\"tr\">hikhtívou\u003c/td>\u003ctd>ils/elles ont dicté\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n\n  \u003cdiv class=\"note tip\">\u003cb>LA règle du הפעיל au passé\u003c/b>\n  Le \u003cspan class=\"he\">י\u003c/span> \u003cstrong>ne survit qu'à la 3\u003csup>e\u003c/sup> personne\u003c/strong> (les lignes surlignées). Aux 1\u003csup>re\u003c/sup> et 2\u003csup>e\u003c/sup> personnes, il disparaît et laisse un \u003cem>patah\u003c/em>&nbsp;:\u003cbr>\n  \u003cspan class=\"he he-lg\">הִכְתִּיב → הִכְתַּבְתִּי\u003c/span>\u003cbr>\n  \u003cspan class=\"he he-lg\">הִסְבִּיר → הִסְבַּרְתִּי\u003c/span> · \u003cspan class=\"he he-lg\">הִרְגִּישׁ → הִרְגַּשְׁתִּי\u003c/span> · \u003cspan class=\"he he-lg\">הִזְמִין → הִזְמַנְתִּי\u003c/span>\u003cbr>\n  C'est l'erreur n°1 des apprenants&nbsp;: ✗ \u003cspan class=\"he\">הרגישתי\u003c/span> → ✓ \u003cspan class=\"he\">הִרְגַּשְׁתִּי\u003c/span>.\u003c/div>\n\n  \u003cdiv class=\"note warn\">\u003cb>Quand la 1\u003csup>re\u003c/sup> radicale est gutturale\u003c/b>\n  Le \u003cem>hiriq\u003c/em> du préfixe devient \u003cem>segol\u003c/em>&nbsp;: \u003cspan class=\"he\">הֶאֱמִין\u003c/span> (croire) → \u003cspan class=\"he\">הֶאֱמַנְתִּי\u003c/span>&nbsp;; \u003cspan class=\"he\">הֶחְלִיט\u003c/span> (décider) → \u003cspan class=\"he\">הֶחְלַטְתִּי\u003c/span>&nbsp;; \u003cspan class=\"he\">הֶעֱבִיר\u003c/span> → \u003cspan class=\"he\">הֶעֱבַרְתִּי\u003c/span>&nbsp;; \u003cspan class=\"he\">הֶרְאָה\u003c/span> → \u003cspan class=\"he\">הֶרְאֵיתִי\u003c/span>.\u003c/div>\n\n  \u003cp>\u003cb>Valeurs du הפעיל&nbsp;:\u003c/b> causatif pur (\u003cspan class=\"he\">הִלְבִּישׁ\u003c/span> « il a habillé quelqu'un » vs \u003cspan class=\"he\">לָבַשׁ\u003c/span> « il a porté »), mais aussi quantité de verbes simplement transitifs, sans nuance causative perceptible&nbsp;: \u003cspan class=\"he\">הִסְבִּיר\u003c/span> (expliquer), \u003cspan class=\"he\">הִזְמִין\u003c/span> (inviter, commander), \u003cspan class=\"he\">הִבְטִיחַ\u003c/span> (promettre), \u003cspan class=\"he\">הִתְחִיל\u003c/span> (commencer — racine \u003cspan class=\"he\">ת־ח־ל\u003c/span>, à ne pas confondre avec un התפעל&nbsp;!), \u003cspan class=\"he\">הִגִּיעַ\u003c/span> (arriver).\u003c/p>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"tabpane\" id=\"p-hufal\">\n  \u003cdiv class=\"card\" style=\"border-top:3px solid var(--hufal)\">\n  \u003ch3 style=\"margin-top:0;color:var(--hufal)\">הוּפְעַל — le passif de הפעיל\u003c/h3>\n  \u003cp>\u003cb>Racine modèle&nbsp;:\u003c/b> \u003cspan class=\"he\">כ־ת־ב\u003c/span> · \u003cb>Thème&nbsp;:\u003c/b> \u003cspan class=\"he\">הֻכְתַּב\u003c/span> (ou \u003cspan class=\"he\">הוּכְתַּב\u003c/span>) · \u003cb>Marque&nbsp;:\u003c/b> préfixe \u003cspan class=\"he pfx\">הֻ־ / הוּ־\u003c/span>.\u003c/p>\n  \u003cdiv class=\"tbl-wrap\">\u003ctable>\n  \u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Forme vocalisée\u003c/th>\u003cth>Ktiv malé\u003c/th>\u003cth>Prononciation\u003c/th>\u003cth>Traduction\u003c/th>\u003c/tr>\u003c/thead>\n  \u003ctbody>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">הֻכְתַּבְתִּי\u003c/td>\u003ctd class=\"hcell he\">הוכתבתי\u003c/td>\u003ctd class=\"tr\">houkhtávti\u003c/td>\u003ctd>on m'a dicté\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">הֻכְתַּבְתָּ\u003c/td>\u003ctd class=\"hcell he\">הוכתבת\u003c/td>\u003ctd class=\"tr\">houkhtávta\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">הֻכְתַּבְתְּ\u003c/td>\u003ctd class=\"hcell he\">הוכתבת\u003c/td>\u003ctd class=\"tr\">houkhtávt\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n  \u003ctr class=\"hl\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">הֻכְתַּב\u003c/td>\u003ctd class=\"hcell he\">הוכתב\u003c/td>\u003ctd class=\"tr\">houkhtáv\u003c/td>\u003ctd>il a été dicté\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">הֻכְתְּבָה\u003c/td>\u003ctd class=\"hcell he\">הוכתבה\u003c/td>\u003ctd class=\"tr\">houkhtevá\u003c/td>\u003ctd>elle a été dictée\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">הֻכְתַּבְנוּ\u003c/td>\u003ctd class=\"hcell he\">הוכתבנו\u003c/td>\u003ctd class=\"tr\">houkhtávnou\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּם\u003c/td>\u003ctd class=\"hcell he\">הֻכְתַּבְתֶּם\u003c/td>\u003ctd class=\"hcell he\">הוכתבתם\u003c/td>\u003ctd class=\"tr\">houkhtavtém\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּן\u003c/td>\u003ctd class=\"hcell he\">הֻכְתַּבְתֶּן\u003c/td>\u003ctd class=\"hcell he\">הוכתבתן\u003c/td>\u003ctd class=\"tr\">houkhtavtén\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">הֻכְתְּבוּ\u003c/td>\u003ctd class=\"hcell he\">הוכתבו\u003c/td>\u003ctd class=\"tr\">houkhtevóu\u003c/td>\u003ctd>ils ont été dictés\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n\n  \u003cdiv class=\"note\">\u003cb>Usage réel\u003c/b>\n  Comme פועל, הופעל est \u003cstrong>défectif\u003c/strong> (pas d'infinitif ni d'impératif) et vit surtout à la 3\u003csup>e\u003c/sup> personne. Verbes courants&nbsp;: \u003cspan class=\"he\">הוּזְמַן\u003c/span> (il a été invité/commandé), \u003cspan class=\"he\">הוּחְלַט\u003c/span> (il a été décidé), \u003cspan class=\"he\">הוּפְסַק\u003c/span> (il a été interrompu), \u003cspan class=\"he\">הוּרְשָׁה\u003c/span> (il a été autorisé), \u003cspan class=\"he\">הוּעֲבַר\u003c/span> (il a été transféré).\u003cbr>\n  Phrase type&nbsp;: \u003cspan class=\"he\">הוּחְלַט לִדְחוֹת אֶת הַיְשִׁיבָה\u003c/span> — «&nbsp;il a été décidé de reporter la réunion&nbsp;».\u003c/div>\n\n  \u003cdiv class=\"note tip\">\u003cb>Ne pas confondre les deux passifs\u003c/b>\n  \u003cspan class=\"he\">הֻכְתַּב\u003c/span> (הופעל, avec ה) = passif de \u003cspan class=\"he\">הִכְתִּיב\u003c/span>.\u003cbr>\n  \u003cspan class=\"he\">כֻּתַּב\u003c/span> (פועל, sans ה) = passif de \u003cspan class=\"he\">כִּתֵּב\u003c/span>.\u003cbr>\n  Le \u003cspan class=\"he\">ה\u003c/span> initial est le seul discriminant à l'écrit non vocalisé.\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"tabpane\" id=\"p-hitpael\">\n  \u003cdiv class=\"card\" style=\"border-top:3px solid var(--hitpael)\">\n  \u003ch3 style=\"margin-top:0;color:var(--hitpael)\">הִתְפַּעֵל — réfléchi et réciproque\u003c/h3>\n  \u003cp>\u003cb>Racine modèle&nbsp;:\u003c/b> \u003cspan class=\"he\">ל־ב־שׁ\u003c/span> «&nbsp;s'habiller&nbsp;» · \u003cb>Thème&nbsp;:\u003c/b> \u003cspan class=\"he\">\u003cspan class=\"pfx\">הִתְ\u003c/span>לַבֵּשׁ\u003c/span> · \u003cb>Marque&nbsp;:\u003c/b> préfixe \u003cspan class=\"he pfx\">הִתְ־\u003c/span> + daguesh dans la 2\u003csup>e\u003c/sup> radicale.\u003c/p>\n  \u003cdiv class=\"tbl-wrap\">\u003ctable>\n  \u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Forme vocalisée\u003c/th>\u003cth>Ktiv malé\u003c/th>\u003cth>Prononciation\u003c/th>\u003cth>Traduction\u003c/th>\u003c/tr>\u003c/thead>\n  \u003ctbody>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">הִתְלַבַּשְׁתִּי\u003c/td>\u003ctd class=\"hcell he\">התלבשתי\u003c/td>\u003ctd class=\"tr\">hitlabáshti\u003c/td>\u003ctd>je me suis habillé\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">הִתְלַבַּשְׁתָּ\u003c/td>\u003ctd class=\"hcell he\">התלבשת\u003c/td>\u003ctd class=\"tr\">hitlabáshta\u003c/td>\u003ctd>tu t'es habillé\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">הִתְלַבַּשְׁתְּ\u003c/td>\u003ctd class=\"hcell he\">התלבשת\u003c/td>\u003ctd class=\"tr\">hitlabásht\u003c/td>\u003ctd>tu t'es habillée\u003c/td>\u003c/tr>\n  \u003ctr class=\"hl\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">הִתְלַבֵּשׁ\u003c/td>\u003ctd class=\"hcell he\">התלבש\u003c/td>\u003ctd class=\"tr\">hitlabésh\u003c/td>\u003ctd>il s'est habillé\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">הִתְלַבְּשָׁה\u003c/td>\u003ctd class=\"hcell he\">התלבשה\u003c/td>\u003ctd class=\"tr\">hitlabshá\u003c/td>\u003ctd>elle s'est habillée\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">הִתְלַבַּשְׁנוּ\u003c/td>\u003ctd class=\"hcell he\">התלבשנו\u003c/td>\u003ctd class=\"tr\">hitlabáshnou\u003c/td>\u003ctd>nous nous sommes habillés\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּם\u003c/td>\u003ctd class=\"hcell he\">הִתְלַבַּשְׁתֶּם\u003c/td>\u003ctd class=\"hcell he\">התלבשתם\u003c/td>\u003ctd class=\"tr\">hitlabashtém\u003c/td>\u003ctd>vous vous êtes habillés\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּן\u003c/td>\u003ctd class=\"hcell he\">הִתְלַבַּשְׁתֶּן\u003c/td>\u003ctd class=\"hcell he\">התלבשתן\u003c/td>\u003ctd class=\"tr\">hitlabashtén\u003c/td>\u003ctd>vous vous êtes habillées\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">הִתְלַבְּשׁוּ\u003c/td>\u003ctd class=\"hcell he\">התלבשו\u003c/td>\u003ctd class=\"tr\">hitlabshóu\u003c/td>\u003ctd>ils/elles se sont habillés\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n\n  \u003cdiv class=\"note warn\">\u003cb>La métathèse du תּ — règle indispensable\u003c/b>\n  Quand la 1\u003csup>re\u003c/sup> radicale est une sifflante, le \u003cspan class=\"he\">ת\u003c/span> du préfixe \u003cstrong>permute\u003c/strong> avec elle&nbsp;:\n  \u003cdiv class=\"tbl-wrap\" style=\"margin-top:10px\">\u003ctable>\n  \u003cthead>\u003ctr>\u003cth>1\u003csup>re\u003c/sup> radicale\u003c/th>\u003cth>Résultat\u003c/th>\u003cth>Exemple (passé, il)\u003c/th>\u003cth>Sens\u003c/th>\u003c/tr>\u003c/thead>\n  \u003ctbody>\n  \u003ctr>\u003ctd class=\"hcell he\">ס\u003c/td>\u003ctd class=\"hcell he\">הִסְתַּ־\u003c/td>\u003ctd class=\"hcell he\">הִסְתַּכֵּל\u003c/td>\u003ctd>il a regardé\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"hcell he\">שׂ\u003c/td>\u003ctd class=\"hcell he\">הִשְׂתַּ־\u003c/td>\u003ctd class=\"hcell he\">הִשְׂתַּדֵּל\u003c/td>\u003ctd>il s'est efforcé\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"hcell he\">שׁ\u003c/td>\u003ctd class=\"hcell he\">הִשְׁתַּ־\u003c/td>\u003ctd class=\"hcell he\">הִשְׁתַּמֵּשׁ\u003c/td>\u003ctd>il a utilisé\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"hcell he\">ז\u003c/td>\u003ctd class=\"hcell he\">הִזְדַּ־ \u003cspan class=\"tr\">(ת→ד)\u003c/span>\u003c/td>\u003ctd class=\"hcell he\">הִזְדַּקֵּן\u003c/td>\u003ctd>il a vieilli\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"hcell he\">צ\u003c/td>\u003ctd class=\"hcell he\">הִצְטַ־ \u003cspan class=\"tr\">(ת→ט)\u003c/span>\u003c/td>\u003ctd class=\"hcell he\">הִצְטַלֵּם\u003c/td>\u003ctd>il s'est fait photographier\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n  Avec \u003cspan class=\"he\">ד ט ת\u003c/span> initiaux, le \u003cspan class=\"he\">ת\u003c/span> du préfixe s'assimile&nbsp;: \u003cspan class=\"he\">הִדַּבֵּר\u003c/span>, \u003cspan class=\"he\">הִטַּהֵר\u003c/span>, \u003cspan class=\"he\">הִתַּמֵּם\u003c/span>.\n  \u003c/div>\n\n  \u003cp>\u003cb>Valeurs&nbsp;:\u003c/b> réfléchi (\u003cspan class=\"he\">הִתְרַחֵץ\u003c/span> se laver), réciproque (\u003cspan class=\"he\">הִתְכַּתַּבְנוּ\u003c/span> nous avons correspondu), devenir/entrer dans un état (\u003cspan class=\"he\">הִתְעַשֵּׁר\u003c/span> s'enrichir, \u003cspan class=\"he\">הִתְעַיֵּף\u003c/span> se fatiguer), et beaucoup de verbes de la vie courante&nbsp;: \u003cspan class=\"he\">הִתְקַשֵּׁר\u003c/span> téléphoner, \u003cspan class=\"he\">הִתְעוֹרֵר\u003c/span> se réveiller, \u003cspan class=\"he\">הִתְרַגֵּשׁ\u003c/span> être ému, \u003cspan class=\"he\">הִשְׁתַּתֵּף\u003c/span> participer.\u003c/p>\n  \u003c/div>\n\u003c/div>\n\n\u003ch3>2.3 · Tableau synoptique du passé\u003c/h3>\n\u003cp>La même racine \u003cspan class=\"he\">כ־ת־ב\u003c/span> dans tous les moules — c'est ce tableau qu'il faut savoir reconstruire de mémoire.\u003c/p>\n\u003cdiv class=\"tbl-wrap\">\n\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth>פָּעַל\u003c/th>\u003cth>נִפְעַל\u003c/th>\u003cth>פִּיעֵל\u003c/th>\u003cth>פּוּעַל\u003c/th>\u003cth>הִפְעִיל\u003c/th>\u003cth>הוּפְעַל\u003c/th>\u003cth>הִתְפַּעֵל\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">כָּתַבְתִּי\u003c/td>\u003ctd class=\"hcell he\">נִכְתַּבְתִּי\u003c/td>\u003ctd class=\"hcell he\">כִּתַּבְתִּי\u003c/td>\u003ctd class=\"hcell he\">כֻּתַּבְתִּי\u003c/td>\u003ctd class=\"hcell he\">הִכְתַּבְתִּי\u003c/td>\u003ctd class=\"hcell he\">הֻכְתַּבְתִּי\u003c/td>\u003ctd class=\"hcell he\">הִתְכַּתַּבְתִּי\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">כָּתַבְתָּ\u003c/td>\u003ctd class=\"hcell he\">נִכְתַּבְתָּ\u003c/td>\u003ctd class=\"hcell he\">כִּתַּבְתָּ\u003c/td>\u003ctd class=\"hcell he\">כֻּתַּבְתָּ\u003c/td>\u003ctd class=\"hcell he\">הִכְתַּבְתָּ\u003c/td>\u003ctd class=\"hcell he\">הֻכְתַּבְתָּ\u003c/td>\u003ctd class=\"hcell he\">הִתְכַּתַּבְתָּ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">כָּתַבְתְּ\u003c/td>\u003ctd class=\"hcell he\">נִכְתַּבְתְּ\u003c/td>\u003ctd class=\"hcell he\">כִּתַּבְתְּ\u003c/td>\u003ctd class=\"hcell he\">כֻּתַּבְתְּ\u003c/td>\u003ctd class=\"hcell he\">הִכְתַּבְתְּ\u003c/td>\u003ctd class=\"hcell he\">הֻכְתַּבְתְּ\u003c/td>\u003ctd class=\"hcell he\">הִתְכַּתַּבְתְּ\u003c/td>\u003c/tr>\n\u003ctr class=\"hl\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">כָּתַב\u003c/td>\u003ctd class=\"hcell he\">נִכְתַּב\u003c/td>\u003ctd class=\"hcell he\">כִּתֵּב\u003c/td>\u003ctd class=\"hcell he\">כֻּתַּב\u003c/td>\u003ctd class=\"hcell he\">הִכְתִּיב\u003c/td>\u003ctd class=\"hcell he\">הֻכְתַּב\u003c/td>\u003ctd class=\"hcell he\">הִתְכַּתֵּב\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">כָּתְבָה\u003c/td>\u003ctd class=\"hcell he\">נִכְתְּבָה\u003c/td>\u003ctd class=\"hcell he\">כִּתְּבָה\u003c/td>\u003ctd class=\"hcell he\">כֻּתְּבָה\u003c/td>\u003ctd class=\"hcell he\">הִכְתִּיבָה\u003c/td>\u003ctd class=\"hcell he\">הֻכְתְּבָה\u003c/td>\u003ctd class=\"hcell he\">הִתְכַּתְּבָה\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">כָּתַבְנוּ\u003c/td>\u003ctd class=\"hcell he\">נִכְתַּבְנוּ\u003c/td>\u003ctd class=\"hcell he\">כִּתַּבְנוּ\u003c/td>\u003ctd class=\"hcell he\">כֻּתַּבְנוּ\u003c/td>\u003ctd class=\"hcell he\">הִכְתַּבְנוּ\u003c/td>\u003ctd class=\"hcell he\">הֻכְתַּבְנוּ\u003c/td>\u003ctd class=\"hcell he\">הִתְכַּתַּבְנוּ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתֶּם\u003c/td>\u003ctd class=\"hcell he\">כְּתַבְתֶּם\u003c/td>\u003ctd class=\"hcell he\">נִכְתַּבְתֶּם\u003c/td>\u003ctd class=\"hcell he\">כִּתַּבְתֶּם\u003c/td>\u003ctd class=\"hcell he\">כֻּתַּבְתֶּם\u003c/td>\u003ctd class=\"hcell he\">הִכְתַּבְתֶּם\u003c/td>\u003ctd class=\"hcell he\">הֻכְתַּבְתֶּם\u003c/td>\u003ctd class=\"hcell he\">הִתְכַּתַּבְתֶּם\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">כָּתְבוּ\u003c/td>\u003ctd class=\"hcell he\">נִכְתְּבוּ\u003c/td>\u003ctd class=\"hcell he\">כִּתְּבוּ\u003c/td>\u003ctd class=\"hcell he\">כֻּתְּבוּ\u003c/td>\u003ctd class=\"hcell he\">הִכְתִּיבוּ\u003c/td>\u003ctd class=\"hcell he\">הֻכְתְּבוּ\u003c/td>\u003ctd class=\"hcell he\">הִתְכַּתְּבוּ\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003cp style=\"font-size:.92rem;color:var(--ink-soft)\">Lisez le tableau \u003cem>verticalement\u003c/em> pour apprendre un binyan, \u003cem>horizontalement\u003c/em> pour voir que les suffixes ne changent jamais.\u003c/p>\n\u003c/section>\n\n\u003chr>\n\n\u003csection id=\"futur\">\n\u003ch2>\u003cspan class=\"num\">3.\u003c/span> Le futur — עָתִיד\u003c/h2>\n\n\u003ch3>3.1 · Les préfixes (et les deux suffixes)\u003c/h3>\n\u003cp>Le futur inverse la logique du passé&nbsp;: la personne se marque \u003cstrong>devant\u003c/strong> le verbe. Quatre préfixes suffisent — \u003cspan class=\"he\">א · ת · י · נ\u003c/span> — auxquels s'ajoute, pour trois personnes seulement, un suffixe.\u003c/p>\n\n\u003cdiv class=\"formula\">\n\u003cspan class=\"he he-lg\">\u003cspan class=\"pfx\">אֶ\u003c/span> · \u003cspan class=\"pfx\">תִּ\u003c/span> · \u003cspan class=\"pfx\">יִ\u003c/span> · \u003cspan class=\"pfx\">נִ\u003c/span>\u003c/span>\u003cbr>\n\u003cspan style=\"font-size:.9rem\">א = moi &nbsp;|&nbsp; ת = toi / elle / vous &nbsp;|&nbsp; י = lui / eux &nbsp;|&nbsp; נ = nous\u003c/span>\n\u003c/div>\n\n\u003cdiv class=\"tbl-wrap\">\n\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Personne\u003c/th>\u003cth>Pronom\u003c/th>\u003cth>Préfixe\u003c/th>\u003cth>Suffixe\u003c/th>\u003cth>Exemple \u003cspan class=\"he\">כתב\u003c/span>\u003c/th>\u003cth>Prononciation\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>1\u003csup>re\u003c/sup> sing.\u003c/td>\u003ctd class=\"hcell he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he pfx\">אֶ־\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"hcell he\">אֶכְתּוֹב\u003c/td>\u003ctd class=\"tr\">ekhtóv\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003csup>e\u003c/sup> masc. sing.\u003c/td>\u003ctd class=\"hcell he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he pfx\">תִּ־\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"hcell he\">תִּכְתּוֹב\u003c/td>\u003ctd class=\"tr\">tikhtóv\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003csup>e\u003c/sup> fém. sing.\u003c/td>\u003ctd class=\"hcell he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he pfx\">תִּ־\u003c/td>\u003ctd class=\"hcell he sfx\">־ִי\u003c/td>\u003ctd class=\"hcell he\">תִּכְתְּבִי\u003c/td>\u003ctd class=\"tr\">tikhteví\u003c/td>\u003c/tr>\n\u003ctr class=\"hl2\">\u003ctd>3\u003csup>e\u003c/sup> masc. sing.\u003c/td>\u003ctd class=\"hcell he\">הוּא\u003c/td>\u003ctd class=\"hcell he pfx\">יִ־\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"hcell he\">יִכְתּוֹב\u003c/td>\u003ctd class=\"tr\">yikhtóv\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003csup>e\u003c/sup> fém. sing.\u003c/td>\u003ctd class=\"hcell he\">הִיא\u003c/td>\u003ctd class=\"hcell he pfx\">תִּ־\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"hcell he\">תִּכְתּוֹב\u003c/td>\u003ctd class=\"tr\">tikhtóv\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003csup>re\u003c/sup> plur.\u003c/td>\u003ctd class=\"hcell he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he pfx\">נִ־\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"hcell he\">נִכְתּוֹב\u003c/td>\u003ctd class=\"tr\">nikhtóv\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003csup>e\u003c/sup> plur.\u003c/td>\u003ctd class=\"hcell he\">אַתֶּם / אַתֶּן\u003c/td>\u003ctd class=\"hcell he pfx\">תִּ־\u003c/td>\u003ctd class=\"hcell he sfx\">־וּ\u003c/td>\u003ctd class=\"hcell he\">תִּכְתְּבוּ\u003c/td>\u003ctd class=\"tr\">tikhtevóu\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003csup>e\u003c/sup> plur.\u003c/td>\u003ctd class=\"hcell he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he pfx\">יִ־\u003c/td>\u003ctd class=\"hcell he sfx\">־וּ\u003c/td>\u003ctd class=\"hcell he\">יִכְתְּבוּ\u003c/td>\u003ctd class=\"tr\">yikhtevóu\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\n\u003cdiv class=\"note warn\">\n\u003cb>Deux ambiguïtés structurelles du futur\u003c/b>\n① \u003cspan class=\"he\">תִּכְתּוֹב\u003c/span> = «&nbsp;tu (m.) écriras&nbsp;» \u003cstrong>et\u003c/strong> «&nbsp;elle écrira&nbsp;». Une seule forme pour deux personnes&nbsp;; seul le sujet exprimé lève le doute.\u003cbr>\n② Au pluriel, l'hébreu moderne a \u003cstrong>abandonné\u003c/strong> le féminin&nbsp;: \u003cspan class=\"he\">תִּכְתְּבוּ / יִכְתְּבוּ\u003c/span> servent pour les deux genres.\n\u003c/div>\n\n\u003cdiv class=\"note\">\n\u003cb>Les formes littéraires en ־נָה\u003c/b>\nEn hébreu classique et soutenu, \u003cspan class=\"he\">אַתֶּן\u003c/span> et \u003cspan class=\"he\">הֵן\u003c/span> ont des formes propres&nbsp;: \u003cspan class=\"he\">תִּכְתּוֹבְנָה\u003c/span> (vous, f.) et \u003cspan class=\"he\">תִּכְתּוֹבְנָה\u003c/span> (elles — oui, avec \u003cspan class=\"he\">ת\u003c/span> et non \u003cspan class=\"he\">י\u003c/span>). On les rencontre en poésie, dans la Bible et dans les textes très formels. En pratique&nbsp;: apprenez à les reconnaître, ne les produisez pas.\n\u003c/div>\n\n\u003ch3>3.2 · Les deux patrons du פעל&nbsp;: אֶפְעוֹל vs אֶפְעַל\u003c/h3>\n\u003cp>Contrairement aux six autres binyanim, le פעל a \u003cstrong>deux\u003c/strong> vocalisations possibles au futur. C'est le point le plus déroutant du futur, et il n'y a pas de règle absolue — mais il y a de très bons indices.\u003c/p>\n\n\u003cdiv class=\"grid2\">\n\u003cdiv class=\"card\">\n\u003ch4 style=\"margin-top:0\">① Patron \u003cspan class=\"he\">אֶפְעוֹל\u003c/span> — holam\u003c/h4>\n\u003cp style=\"margin-bottom:6px\">Le patron par \u003cstrong>défaut\u003c/strong>, pour la majorité des verbes d'action.\u003c/p>\n\u003cp class=\"he\" style=\"margin:0\">אֶכְתּוֹב · תִּשְׁמוֹר · יִסְגּוֹר · נִלְבַּשׁ…\u003c/p>\n\u003cp style=\"font-size:.9rem;margin-top:8px\">\u003cspan class=\"he\">כָּתַב → יִכְתּוֹב\u003c/span> · \u003cspan class=\"he\">שָׁמַר → יִשְׁמוֹר\u003c/span> · \u003cspan class=\"he\">סָגַר → יִסְגּוֹר\u003c/span> · \u003cspan class=\"he\">גָּמַר → יִגְמוֹר\u003c/span> · \u003cspan class=\"he\">זָכַר → יִזְכּוֹר\u003c/span>\u003c/p>\n\u003cp style=\"font-size:.86rem;color:var(--ink-soft);margin:6px 0 0\">Le \u003cem>holam\u003c/em> s'écrit avec un \u003cspan class=\"he\">ו\u003c/span>&nbsp;: \u003cspan class=\"he\">אכתוב, ישמור, יסגור\u003c/span>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"card\">\n\u003ch4 style=\"margin-top:0\">② Patron \u003cspan class=\"he\">אֶפְעַל\u003c/span> — patah\u003c/h4>\n\u003cp style=\"margin-bottom:6px\">Obligatoire si la 2\u003csup>e\u003c/sup> ou la 3\u003csup>e\u003c/sup> radicale est une \u003cstrong>gutturale\u003c/strong> (\u003cspan class=\"he\">א ה ח ע ר\u003c/span>), et fréquent pour les verbes d'\u003cstrong>état\u003c/strong>.\u003c/p>\n\u003cp style=\"font-size:.9rem;margin-top:8px\">\u003cspan class=\"he\">שָׁמַע → יִשְׁמַע\u003c/span> · \u003cspan class=\"he\">בָּחַר → יִבְחַר\u003c/span> · \u003cspan class=\"he\">לָמַד → יִלְמַד\u003c/span> · \u003cspan class=\"he\">שָׁכַב → יִשְׁכַּב\u003c/span> · \u003cspan class=\"he\">לָבַשׁ → יִלְבַּשׁ\u003c/span> · \u003cspan class=\"he\">גָּדַל → יִגְדַּל\u003c/span>\u003c/p>\n\u003cp style=\"font-size:.86rem;color:var(--ink-soft);margin:6px 0 0\">Pas de \u003cspan class=\"he\">ו\u003c/span> en ktiv malé&nbsp;: \u003cspan class=\"he\">ישמע, ילמד\u003c/span>.\u003c/p>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"note tip\">\n\u003cb>Trois indices fiables\u003c/b>\n· \u003cstrong>Gutturale en 2\u003csup>e\u003c/sup> ou 3\u003csup>e\u003c/sup> position → patah\u003c/strong> presque toujours (\u003cspan class=\"he\">שאל → יִשְׁאַל\u003c/span>, \u003cspan class=\"he\">בחר → יִבְחַר\u003c/span>, \u003cspan class=\"he\">שמע → יִשְׁמַע\u003c/span>).\u003cbr>\n· \u003cstrong>Verbe d'état\u003c/strong> (grandir, vieillir, être content) → patah&nbsp;: \u003cspan class=\"he\">יִגְדַּל, יִזְקַן, יִשְׂמַח\u003c/span>.\u003cbr>\n· \u003cstrong>Verbe d'action transitif ordinaire\u003c/strong> → holam&nbsp;: \u003cspan class=\"he\">יִסְגּוֹר, יִמְכּוֹר, יִשְׁבּוֹר\u003c/span>.\u003cbr>\nLe reste s'apprend avec le lexique. Retenez le futur en même temps que l'infinitif quand vous notez un verbe nouveau.\n\u003c/div>\n\n\u003ch4>Comparaison complète des deux patrons\u003c/h4>\n\u003cdiv class=\"tbl-wrap\">\n\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth>אֶפְעוֹל — \u003cspan class=\"he\">שמר\u003c/span> (garder)\u003c/th>\u003cth>אֶפְעַל — \u003cspan class=\"he\">למד\u003c/span> (apprendre)\u003c/th>\u003cth>אֶפְעַל gutturale — \u003cspan class=\"he\">שמע\u003c/span>\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">אֶשְׁמוֹר\u003c/td>\u003ctd class=\"hcell he\">אֶלְמַד\u003c/td>\u003ctd class=\"hcell he\">אֶשְׁמַע\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">תִּשְׁמוֹר\u003c/td>\u003ctd class=\"hcell he\">תִּלְמַד\u003c/td>\u003ctd class=\"hcell he\">תִּשְׁמַע\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">תִּשְׁמְרִי\u003c/td>\u003ctd class=\"hcell he\">תִּלְמְדִי\u003c/td>\u003ctd class=\"hcell he\">תִּשְׁמְעִי\u003c/td>\u003c/tr>\n\u003ctr class=\"hl2\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">יִשְׁמוֹר\u003c/td>\u003ctd class=\"hcell he\">יִלְמַד\u003c/td>\u003ctd class=\"hcell he\">יִשְׁמַע\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">תִּשְׁמוֹר\u003c/td>\u003ctd class=\"hcell he\">תִּלְמַד\u003c/td>\u003ctd class=\"hcell he\">תִּשְׁמַע\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">נִשְׁמוֹר\u003c/td>\u003ctd class=\"hcell he\">נִלְמַד\u003c/td>\u003ctd class=\"hcell he\">נִשְׁמַע\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתֶּם\u003c/td>\u003ctd class=\"hcell he\">תִּשְׁמְרוּ\u003c/td>\u003ctd class=\"hcell he\">תִּלְמְדוּ\u003c/td>\u003ctd class=\"hcell he\">תִּשְׁמְעוּ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הֵם\u003c/td>\u003ctd class=\"hcell he\">יִשְׁמְרוּ\u003c/td>\u003ctd class=\"hcell he\">יִלְמְדוּ\u003c/td>\u003ctd class=\"hcell he\">יִשְׁמְעוּ\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\n\u003cdiv class=\"note\">\n\u003cb>Gutturale en 1\u003csup>re\u003c/sup> radicale\u003c/b>\nLe shva sous la gutturale devient un \u003cem>hataf\u003c/em>, et le préfixe s'ouvre en \u003cem>segol\u003c/em>&nbsp;: \u003cspan class=\"he\">עָמַד → יַעֲמוֹד\u003c/span> (patah au préfixe), \u003cspan class=\"he\">חָשַׁב → יַחְשׁוֹב\u003c/span>, \u003cspan class=\"he\">עָבַד → יַעֲבוֹד\u003c/span>, \u003cspan class=\"he\">הָרַג → יַהֲרוֹג\u003c/span>. Comparez avec \u003cspan class=\"he\">אָסַף → יֶאֱסוֹף\u003c/span> (segol, car \u003cspan class=\"he\">א\u003c/span>).\n\u003c/div>\n\n\u003ch3>3.3 · Les sept binyanim au futur\u003c/h3>\n\n\u003cdiv class=\"tabs\" data-group=\"fut\">\n  \u003cbutton class=\"on\" data-t=\"f-paal\">פָּעַל\u003c/button>\n  \u003cbutton data-t=\"f-nifal\">נִפְעַל\u003c/button>\n  \u003cbutton data-t=\"f-piel\">פִּיעֵל\u003c/button>\n  \u003cbutton data-t=\"f-pual\">פּוּעַל\u003c/button>\n  \u003cbutton data-t=\"f-hifil\">הִפְעִיל\u003c/button>\n  \u003cbutton data-t=\"f-hufal\">הוּפְעַל\u003c/button>\n  \u003cbutton data-t=\"f-hitpael\">הִתְפַּעֵל\u003c/button>\n\u003c/div>\n\n\u003cdiv class=\"tabpane on\" id=\"f-paal\">\n  \u003cdiv class=\"card\" style=\"border-top:3px solid var(--paal)\">\n  \u003ch3 style=\"margin-top:0;color:var(--paal)\">פָּעַל au futur\u003c/h3>\n  \u003cp>\u003cb>Préfixe vocalisé en \u003cem>hiriq\u003c/em>\u003c/b> (\u003cspan class=\"he\">אֶ\u003c/span> pour la 1\u003csup>re\u003c/sup> sing.), thème réduit&nbsp;: \u003cspan class=\"he\">־כְתּוֹב\u003c/span>.\u003c/p>\n  \u003cdiv class=\"tbl-wrap\">\u003ctable>\n  \u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Forme vocalisée\u003c/th>\u003cth>Ktiv malé\u003c/th>\u003cth>Prononciation\u003c/th>\u003cth>Traduction\u003c/th>\u003c/tr>\u003c/thead>\n  \u003ctbody>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">אֶכְתּוֹב\u003c/td>\u003ctd class=\"hcell he\">אכתוב\u003c/td>\u003ctd class=\"tr\">ekhtóv\u003c/td>\u003ctd>j'écrirai\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">תִּכְתּוֹב\u003c/td>\u003ctd class=\"hcell he\">תכתוב\u003c/td>\u003ctd class=\"tr\">tikhtóv\u003c/td>\u003ctd>tu écriras (m.)\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">תִּכְתְּבִי\u003c/td>\u003ctd class=\"hcell he\">תכתבי\u003c/td>\u003ctd class=\"tr\">tikhteví\u003c/td>\u003ctd>tu écriras (f.)\u003c/td>\u003c/tr>\n  \u003ctr class=\"hl2\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">יִכְתּוֹב\u003c/td>\u003ctd class=\"hcell he\">יכתוב\u003c/td>\u003ctd class=\"tr\">yikhtóv\u003c/td>\u003ctd>il écrira\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">תִּכְתּוֹב\u003c/td>\u003ctd class=\"hcell he\">תכתוב\u003c/td>\u003ctd class=\"tr\">tikhtóv\u003c/td>\u003ctd>elle écrira\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">נִכְתּוֹב\u003c/td>\u003ctd class=\"hcell he\">נכתוב\u003c/td>\u003ctd class=\"tr\">nikhtóv\u003c/td>\u003ctd>nous écrirons\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּם / אַתֶּן\u003c/td>\u003ctd class=\"hcell he\">תִּכְתְּבוּ\u003c/td>\u003ctd class=\"hcell he\">תכתבו\u003c/td>\u003ctd class=\"tr\">tikhtevóu\u003c/td>\u003ctd>vous écrirez\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">יִכְתְּבוּ\u003c/td>\u003ctd class=\"hcell he\">יכתבו\u003c/td>\u003ctd class=\"tr\">yikhtevóu\u003c/td>\u003ctd>ils/elles écriront\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n  \u003cdiv class=\"note tip\">\u003cb>Le \u003cem>holam\u003c/em> tombe devant un suffixe\u003c/b>\n  \u003cspan class=\"he\">יִכְתּוֹב\u003c/span> mais \u003cspan class=\"he\">יִכְתְּבוּ\u003c/span> (et non \u003cspan class=\"he\">יִכְתּוֹבוּ\u003c/span>). Dès qu'on ajoute \u003cspan class=\"he\">־ִי\u003c/span> ou \u003cspan class=\"he\">־וּ\u003c/span>, la voyelle du thème s'efface&nbsp;: c'est la même mécanique qu'au passé avec \u003cspan class=\"he\">כָּתְבָה / כָּתְבוּ\u003c/span>.\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"tabpane\" id=\"f-nifal\">\n  \u003cdiv class=\"card\" style=\"border-top:3px solid var(--nifal)\">\n  \u003ch3 style=\"margin-top:0;color:var(--nifal)\">נִפְעַל au futur\u003c/h3>\n  \u003cp>Le \u003cspan class=\"he\">נ־\u003c/span> du passé \u003cstrong>disparaît\u003c/strong>&nbsp;: il s'assimile et laisse un \u003cem>daguesh\u003c/em> dans la 1\u003csup>re\u003c/sup> radicale. Thème&nbsp;: \u003cspan class=\"he\">־כָּתֵב\u003c/span> avec préfixe en \u003cem>hiriq\u003c/em>.\u003c/p>\n  \u003cdiv class=\"tbl-wrap\">\u003ctable>\n  \u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Forme vocalisée\u003c/th>\u003cth>Ktiv malé\u003c/th>\u003cth>Prononciation\u003c/th>\u003cth>Traduction\u003c/th>\u003c/tr>\u003c/thead>\n  \u003ctbody>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">אֶכָּתֵב\u003c/td>\u003ctd class=\"hcell he\">איכתב\u003c/td>\u003ctd class=\"tr\">ekatév\u003c/td>\u003ctd>je serai écrit\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">תִּכָּתֵב\u003c/td>\u003ctd class=\"hcell he\">תיכתב\u003c/td>\u003ctd class=\"tr\">tikatév\u003c/td>\u003ctd>tu seras écrit\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">תִּכָּתְבִי\u003c/td>\u003ctd class=\"hcell he\">תיכתבי\u003c/td>\u003ctd class=\"tr\">tikatví\u003c/td>\u003ctd>tu seras écrite\u003c/td>\u003c/tr>\n  \u003ctr class=\"hl2\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">יִכָּתֵב\u003c/td>\u003ctd class=\"hcell he\">ייכתב\u003c/td>\u003ctd class=\"tr\">yikatév\u003c/td>\u003ctd>il sera écrit\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">תִּכָּתֵב\u003c/td>\u003ctd class=\"hcell he\">תיכתב\u003c/td>\u003ctd class=\"tr\">tikatév\u003c/td>\u003ctd>elle sera écrite\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">נִכָּתֵב\u003c/td>\u003ctd class=\"hcell he\">ניכתב\u003c/td>\u003ctd class=\"tr\">nikatév\u003c/td>\u003ctd>nous serons écrits\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּם / אַתֶּן\u003c/td>\u003ctd class=\"hcell he\">תִּכָּתְבוּ\u003c/td>\u003ctd class=\"hcell he\">תיכתבו\u003c/td>\u003ctd class=\"tr\">tikatvóu\u003c/td>\u003ctd>vous serez écrits\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">יִכָּתְבוּ\u003c/td>\u003ctd class=\"hcell he\">ייכתבו\u003c/td>\u003ctd class=\"tr\">yikatvóu\u003c/td>\u003ctd>ils seront écrits\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n  \u003cdiv class=\"note warn\">\u003cb>Le double yod\u003c/b>\n  En ktiv malé, la 3\u003csup>e\u003c/sup> personne s'écrit avec \u003cstrong>deux yod\u003c/strong>&nbsp;: \u003cspan class=\"he\">ייכתב, ייכנס, יישאר, ייפגש\u003c/span>. Le premier est le préfixe \u003cspan class=\"he\">י\u003c/span>, le second note le \u003cem>hiriq\u003c/em>. Même logique pour \u003cspan class=\"he\">תיכתב, ניכתב, איכתב\u003c/span>.\u003c/div>\n  \u003cdiv class=\"note\">\u003cb>Série complète à connaître\u003c/b>\n  \u003cspan class=\"he\">נִכְנַס → יִיכָּנֵס\u003c/span> (entrer) · \u003cspan class=\"he\">נִשְׁאַר → יִישָּׁאֵר\u003c/span> (rester) · \u003cspan class=\"he\">נִפְגַּשׁ → יִיפָּגֵשׁ\u003c/span> (se rencontrer) · \u003cspan class=\"he\">נִזְהַר → יִיזָּהֵר\u003c/span> (faire attention) · \u003cspan class=\"he\">נִגְמַר → יִיגָּמֵר\u003c/span> (se terminer).\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"tabpane\" id=\"f-piel\">\n  \u003cdiv class=\"card\" style=\"border-top:3px solid var(--piel)\">\n  \u003ch3 style=\"margin-top:0;color:var(--piel)\">פִּיעֵל au futur\u003c/h3>\n  \u003cp>\u003cb>Signe distinctif&nbsp;:\u003c/b> les préfixes portent un \u003cem>shva\u003c/em> (et \u003cspan class=\"he\">אֲ\u003c/span> avec \u003cem>hataf-patah\u003c/em> pour la 1\u003csup>re\u003c/sup> sing.). Le \u003cspan class=\"he\">י\u003c/span> du פיעל disparaît, le thème devient \u003cspan class=\"he\">־דַבֵּר\u003c/span>.\u003c/p>\n  \u003cdiv class=\"tbl-wrap\">\u003ctable>\n  \u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Forme vocalisée\u003c/th>\u003cth>Ktiv malé\u003c/th>\u003cth>Prononciation\u003c/th>\u003cth>Traduction\u003c/th>\u003c/tr>\u003c/thead>\n  \u003ctbody>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">אֲדַבֵּר\u003c/td>\u003ctd class=\"hcell he\">אדבר\u003c/td>\u003ctd class=\"tr\">adabér\u003c/td>\u003ctd>je parlerai\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">תְּדַבֵּר\u003c/td>\u003ctd class=\"hcell he\">תדבר\u003c/td>\u003ctd class=\"tr\">tedabér\u003c/td>\u003ctd>tu parleras (m.)\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">תְּדַבְּרִי\u003c/td>\u003ctd class=\"hcell he\">תדברי\u003c/td>\u003ctd class=\"tr\">tedabrí\u003c/td>\u003ctd>tu parleras (f.)\u003c/td>\u003c/tr>\n  \u003ctr class=\"hl2\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">יְדַבֵּר\u003c/td>\u003ctd class=\"hcell he\">ידבר\u003c/td>\u003ctd class=\"tr\">yedabér\u003c/td>\u003ctd>il parlera\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">תְּדַבֵּר\u003c/td>\u003ctd class=\"hcell he\">תדבר\u003c/td>\u003ctd class=\"tr\">tedabér\u003c/td>\u003ctd>elle parlera\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">נְדַבֵּר\u003c/td>\u003ctd class=\"hcell he\">נדבר\u003c/td>\u003ctd class=\"tr\">nedabér\u003c/td>\u003ctd>nous parlerons\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּם / אַתֶּן\u003c/td>\u003ctd class=\"hcell he\">תְּדַבְּרוּ\u003c/td>\u003ctd class=\"hcell he\">תדברו\u003c/td>\u003ctd class=\"tr\">tedabróu\u003c/td>\u003ctd>vous parlerez\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">יְדַבְּרוּ\u003c/td>\u003ctd class=\"hcell he\">ידברו\u003c/td>\u003ctd class=\"tr\">yedabróu\u003c/td>\u003ctd>ils/elles parleront\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n  \u003cdiv class=\"note tip\">\u003cb>Reconnaître un futur פיעל à l'oreille\u003c/b>\n  Le préfixe se prononce \u003cspan class=\"tr\">ye-, te-, ne-, a-\u003c/span> et non \u003cspan class=\"tr\">yi-, ti-, ni-, e-\u003c/span>. \u003cspan class=\"tr\">yedabér\u003c/span> (פיעל) vs \u003cspan class=\"tr\">yikhtóv\u003c/span> (פעל)&nbsp;: cette voyelle \u003cem>e\u003c/em> ouverte est votre signal.\u003c/div>\n  \u003cdiv class=\"note\">\u003cb>Attention à l'orthographe\u003c/b>\n  Le \u003cspan class=\"he\">י\u003c/span> qu'on écrit au passé (\u003cspan class=\"he\">דיברתי\u003c/span>) \u003cstrong>ne s'écrit pas\u003c/strong> au futur&nbsp;: \u003cspan class=\"he\">אדבר\u003c/span> et non ✗\u003cspan class=\"he\">אדיבר\u003c/span>. Même chose pour \u003cspan class=\"he\">סיפר → אספר\u003c/span>, \u003cspan class=\"he\">לימד → אלמד\u003c/span>, \u003cspan class=\"he\">טייל → אטייל\u003c/span> (ici le yod est radical).\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"tabpane\" id=\"f-pual\">\n  \u003cdiv class=\"card\" style=\"border-top:3px solid var(--pual)\">\n  \u003ch3 style=\"margin-top:0;color:var(--pual)\">פּוּעַל au futur\u003c/h3>\n  \u003cp>Mêmes préfixes en \u003cem>shva\u003c/em> que פיעל, thème en \u003cem>qoubouts\u003c/em>&nbsp;: \u003cspan class=\"he\">־דֻבַּר\u003c/span>.\u003c/p>\n  \u003cdiv class=\"tbl-wrap\">\u003ctable>\n  \u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Forme vocalisée\u003c/th>\u003cth>Ktiv malé\u003c/th>\u003cth>Prononciation\u003c/th>\u003c/tr>\u003c/thead>\n  \u003ctbody>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">אֲדֻבַּר\u003c/td>\u003ctd class=\"hcell he\">אדובר\u003c/td>\u003ctd class=\"tr\">adoubár\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">תְּדֻבַּר\u003c/td>\u003ctd class=\"hcell he\">תדובר\u003c/td>\u003ctd class=\"tr\">tedoubár\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">תְּדֻבְּרִי\u003c/td>\u003ctd class=\"hcell he\">תדוברי\u003c/td>\u003ctd class=\"tr\">tedoubrí\u003c/td>\u003c/tr>\n  \u003ctr class=\"hl2\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">יְדֻבַּר\u003c/td>\u003ctd class=\"hcell he\">ידובר\u003c/td>\u003ctd class=\"tr\">yedoubár\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">תְּדֻבַּר\u003c/td>\u003ctd class=\"hcell he\">תדובר\u003c/td>\u003ctd class=\"tr\">tedoubár\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">נְדֻבַּר\u003c/td>\u003ctd class=\"hcell he\">נדובר\u003c/td>\u003ctd class=\"tr\">nedoubár\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּם / אַתֶּן\u003c/td>\u003ctd class=\"hcell he\">תְּדֻבְּרוּ\u003c/td>\u003ctd class=\"hcell he\">תדוברו\u003c/td>\u003ctd class=\"tr\">tedoubróu\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">יְדֻבְּרוּ\u003c/td>\u003ctd class=\"hcell he\">ידוברו\u003c/td>\u003ctd class=\"tr\">yedoubróu\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n  \u003cdiv class=\"note\">\u003cb>En pratique\u003c/b>\n  Vous n'emploierez ce binyan qu'à la 3\u003csup>e\u003c/sup> personne&nbsp;: \u003cspan class=\"he\">הַיְשִׁיבָה תְּבֻטַּל\u003c/span> (la réunion sera annulée), \u003cspan class=\"he\">הַמִּסְמָךְ יְתֻרְגַּם\u003c/span> (le document sera traduit), \u003cspan class=\"he\">זֶה יְסֻדַּר\u003c/span> (ce sera arrangé — très courant à l'oral&nbsp;: \u003cspan class=\"tr\">zé yesoudár\u003c/span>).\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"tabpane\" id=\"f-hifil\">\n  \u003cdiv class=\"card\" style=\"border-top:3px solid var(--hifil)\">\n  \u003ch3 style=\"margin-top:0;color:var(--hifil)\">הִפְעִיל au futur\u003c/h3>\n  \u003cp>\u003cb>Signe distinctif&nbsp;:\u003c/b> les préfixes portent un \u003cem>patah\u003c/em> — \u003cspan class=\"he\">אַ · תַּ · יַ · נַ\u003c/span>. Le \u003cspan class=\"he\">ה\u003c/span> du passé disparaît, mais le \u003cspan class=\"he\">י\u003c/span> reste \u003cstrong>partout\u003c/strong>.\u003c/p>\n  \u003cdiv class=\"tbl-wrap\">\u003ctable>\n  \u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Forme vocalisée\u003c/th>\u003cth>Ktiv malé\u003c/th>\u003cth>Prononciation\u003c/th>\u003cth>Traduction\u003c/th>\u003c/tr>\u003c/thead>\n  \u003ctbody>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">אַכְתִּיב\u003c/td>\u003ctd class=\"hcell he\">אכתיב\u003c/td>\u003ctd class=\"tr\">akhtív\u003c/td>\u003ctd>je dicterai\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">תַּכְתִּיב\u003c/td>\u003ctd class=\"hcell he\">תכתיב\u003c/td>\u003ctd class=\"tr\">takhtív\u003c/td>\u003ctd>tu dicteras (m.)\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">תַּכְתִּיבִי\u003c/td>\u003ctd class=\"hcell he\">תכתיבי\u003c/td>\u003ctd class=\"tr\">takhtívi\u003c/td>\u003ctd>tu dicteras (f.)\u003c/td>\u003c/tr>\n  \u003ctr class=\"hl2\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">יַכְתִּיב\u003c/td>\u003ctd class=\"hcell he\">יכתיב\u003c/td>\u003ctd class=\"tr\">yakhtív\u003c/td>\u003ctd>il dictera\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">תַּכְתִּיב\u003c/td>\u003ctd class=\"hcell he\">תכתיב\u003c/td>\u003ctd class=\"tr\">takhtív\u003c/td>\u003ctd>elle dictera\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">נַכְתִּיב\u003c/td>\u003ctd class=\"hcell he\">נכתיב\u003c/td>\u003ctd class=\"tr\">nakhtív\u003c/td>\u003ctd>nous dicterons\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּם / אַתֶּן\u003c/td>\u003ctd class=\"hcell he\">תַּכְתִּיבוּ\u003c/td>\u003ctd class=\"hcell he\">תכתיבו\u003c/td>\u003ctd class=\"tr\">takhtívou\u003c/td>\u003ctd>vous dicterez\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">יַכְתִּיבוּ\u003c/td>\u003ctd class=\"hcell he\">יכתיבו\u003c/td>\u003ctd class=\"tr\">yakhtívou\u003c/td>\u003ctd>ils/elles dicteront\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n  \u003cdiv class=\"note tip\">\u003cb>Le futur du הפעיל est le plus régulier des sept\u003c/b>\n  Contrairement au passé, \u003cstrong>aucune alternance\u003c/strong>&nbsp;: le \u003cspan class=\"he\">י\u003c/span> est présent à toutes les personnes. \u003cspan class=\"he\">אַרְגִּישׁ, תַּרְגִּישׁ, יַרְגִּישׁ, נַרְגִּישׁ\u003c/span> — pas de piège.\u003cbr>\n  Comparez&nbsp;: \u003cspan class=\"he\">הִרְגַּשְׁתִּי\u003c/span> (passé, sans yod) / \u003cspan class=\"he\">אַרְגִּישׁ\u003c/span> (futur, avec yod).\u003c/div>\n  \u003cdiv class=\"note\">\u003cb>Le \u003cem>patah\u003c/em> est votre repère\u003c/b>\n  \u003cspan class=\"tr\">ya-\u003c/span> = הפעיל &nbsp;·&nbsp; \u003cspan class=\"tr\">yi-\u003c/span> = פעל ou נפעל ou התפעל &nbsp;·&nbsp; \u003cspan class=\"tr\">ye-\u003c/span> = פיעל ou פועל &nbsp;·&nbsp; \u003cspan class=\"tr\">you-\u003c/span> = הופעל.\u003cbr>\n  Cette seule voyelle du préfixe identifie le binyan dans 90&nbsp;% des cas.\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"tabpane\" id=\"f-hufal\">\n  \u003cdiv class=\"card\" style=\"border-top:3px solid var(--hufal)\">\n  \u003ch3 style=\"margin-top:0;color:var(--hufal)\">הוּפְעַל au futur\u003c/h3>\n  \u003cp>Préfixes en \u003cem>qoubouts\u003c/em> / \u003cem>shourouq\u003c/em>&nbsp;: \u003cspan class=\"he\">אֻ · תֻּ · יֻ · נֻ\u003c/span>, écrits \u003cspan class=\"he\">או, תו, יו, נו\u003c/span>.\u003c/p>\n  \u003cdiv class=\"tbl-wrap\">\u003ctable>\n  \u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Forme vocalisée\u003c/th>\u003cth>Ktiv malé\u003c/th>\u003cth>Prononciation\u003c/th>\u003c/tr>\u003c/thead>\n  \u003ctbody>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">אֻכְתַּב\u003c/td>\u003ctd class=\"hcell he\">אוכתב\u003c/td>\u003ctd class=\"tr\">oukhtáv\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">תֻּכְתַּב\u003c/td>\u003ctd class=\"hcell he\">תוכתב\u003c/td>\u003ctd class=\"tr\">toukhtáv\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">תֻּכְתְּבִי\u003c/td>\u003ctd class=\"hcell he\">תוכתבי\u003c/td>\u003ctd class=\"tr\">toukhteví\u003c/td>\u003c/tr>\n  \u003ctr class=\"hl2\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">יֻכְתַּב\u003c/td>\u003ctd class=\"hcell he\">יוכתב\u003c/td>\u003ctd class=\"tr\">youkhtáv\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">תֻּכְתַּב\u003c/td>\u003ctd class=\"hcell he\">תוכתב\u003c/td>\u003ctd class=\"tr\">toukhtáv\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">נֻכְתַּב\u003c/td>\u003ctd class=\"hcell he\">נוכתב\u003c/td>\u003ctd class=\"tr\">noukhtáv\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּם / אַתֶּן\u003c/td>\u003ctd class=\"hcell he\">תֻּכְתְּבוּ\u003c/td>\u003ctd class=\"hcell he\">תוכתבו\u003c/td>\u003ctd class=\"tr\">toukhtevóu\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">יֻכְתְּבוּ\u003c/td>\u003ctd class=\"hcell he\">יוכתבו\u003c/td>\u003ctd class=\"tr\">youkhtevóu\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n  \u003cdiv class=\"note\">\u003cb>Exemples vivants\u003c/b>\n  \u003cspan class=\"he\">יוּזְמַן\u003c/span> (il sera invité) · \u003cspan class=\"he\">יוּחְלַט\u003c/span> (il sera décidé) · \u003cspan class=\"he\">תּוּפְסַק הַתּוֹכְנִית\u003c/span> (l'émission sera interrompue) · \u003cspan class=\"he\">הָעֻבְדּוֹת יוּצְגוּ מָחָר\u003c/span> (les faits seront présentés demain).\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"tabpane\" id=\"f-hitpael\">\n  \u003cdiv class=\"card\" style=\"border-top:3px solid var(--hitpael)\">\n  \u003ch3 style=\"margin-top:0;color:var(--hitpael)\">הִתְפַּעֵל au futur\u003c/h3>\n  \u003cp>Le \u003cspan class=\"he\">ה\u003c/span> du préfixe \u003cspan class=\"he\">הִתְ־\u003c/span> tombe et laisse \u003cspan class=\"he\">־תְ־\u003c/span>&nbsp;: \u003cspan class=\"he\">אֶתְ־ · תִּתְ־ · יִתְ־ · נִתְ־\u003c/span>.\u003c/p>\n  \u003cdiv class=\"tbl-wrap\">\u003ctable>\n  \u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Forme vocalisée\u003c/th>\u003cth>Ktiv malé\u003c/th>\u003cth>Prononciation\u003c/th>\u003cth>Traduction\u003c/th>\u003c/tr>\u003c/thead>\n  \u003ctbody>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">אֶתְלַבֵּשׁ\u003c/td>\u003ctd class=\"hcell he\">אתלבש\u003c/td>\u003ctd class=\"tr\">etlabésh\u003c/td>\u003ctd>je m'habillerai\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">תִּתְלַבֵּשׁ\u003c/td>\u003ctd class=\"hcell he\">תתלבש\u003c/td>\u003ctd class=\"tr\">titlabésh\u003c/td>\u003ctd>tu t'habilleras (m.)\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">תִּתְלַבְּשִׁי\u003c/td>\u003ctd class=\"hcell he\">תתלבשי\u003c/td>\u003ctd class=\"tr\">titlabshí\u003c/td>\u003ctd>tu t'habilleras (f.)\u003c/td>\u003c/tr>\n  \u003ctr class=\"hl2\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">יִתְלַבֵּשׁ\u003c/td>\u003ctd class=\"hcell he\">יתלבש\u003c/td>\u003ctd class=\"tr\">yitlabésh\u003c/td>\u003ctd>il s'habillera\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">תִּתְלַבֵּשׁ\u003c/td>\u003ctd class=\"hcell he\">תתלבש\u003c/td>\u003ctd class=\"tr\">titlabésh\u003c/td>\u003ctd>elle s'habillera\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">נִתְלַבֵּשׁ\u003c/td>\u003ctd class=\"hcell he\">נתלבש\u003c/td>\u003ctd class=\"tr\">nitlabésh\u003c/td>\u003ctd>nous nous habillerons\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">אַתֶּם / אַתֶּן\u003c/td>\u003ctd class=\"hcell he\">תִּתְלַבְּשׁוּ\u003c/td>\u003ctd class=\"hcell he\">תתלבשו\u003c/td>\u003ctd class=\"tr\">titlabshóu\u003c/td>\u003ctd>vous vous habillerez\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">יִתְלַבְּשׁוּ\u003c/td>\u003ctd class=\"hcell he\">יתלבשו\u003c/td>\u003ctd class=\"tr\">yitlabshóu\u003c/td>\u003ctd>ils/elles s'habilleront\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\n  \u003cdiv class=\"note warn\">\u003cb>La métathèse reste valable au futur\u003c/b>\n  \u003cspan class=\"he\">הִשְׁתַּמֵּשׁ → יִשְׁתַּמֵּשׁ\u003c/span> · \u003cspan class=\"he\">הִסְתַּכֵּל → יִסְתַּכֵּל\u003c/span> · \u003cspan class=\"he\">הִזְדַּקֵּן → יִזְדַּקֵּן\u003c/span> · \u003cspan class=\"he\">הִצְטַלֵּם → יִצְטַלֵּם\u003c/span>.\u003cbr>\n  La séquence \u003cspan class=\"he\">תת\u003c/span> à l'écrit (\u003cspan class=\"he\">תתלבש\u003c/span>) surprend les débutants&nbsp;: le premier \u003cspan class=\"he\">ת\u003c/span> est le préfixe de 2\u003csup>e\u003c/sup> personne, le second appartient au binyan.\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003ch3>3.4 · Tableau synoptique du futur\u003c/h3>\n\u003cdiv class=\"tbl-wrap\">\n\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth>פָּעַל\u003c/th>\u003cth>נִפְעַל\u003c/th>\u003cth>פִּיעֵל\u003c/th>\u003cth>פּוּעַל\u003c/th>\u003cth>הִפְעִיל\u003c/th>\u003cth>הוּפְעַל\u003c/th>\u003cth>הִתְפַּעֵל\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">אֶכְתּוֹב\u003c/td>\u003ctd class=\"hcell he\">אֶכָּתֵב\u003c/td>\u003ctd class=\"hcell he\">אֲכַתֵּב\u003c/td>\u003ctd class=\"hcell he\">אֲכֻתַּב\u003c/td>\u003ctd class=\"hcell he\">אַכְתִּיב\u003c/td>\u003ctd class=\"hcell he\">אֻכְתַּב\u003c/td>\u003ctd class=\"hcell he\">אֶתְכַּתֵּב\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתָּה / הִיא\u003c/td>\u003ctd class=\"hcell he\">תִּכְתּוֹב\u003c/td>\u003ctd class=\"hcell he\">תִּכָּתֵב\u003c/td>\u003ctd class=\"hcell he\">תְּכַתֵּב\u003c/td>\u003ctd class=\"hcell he\">תְּכֻתַּב\u003c/td>\u003ctd class=\"hcell he\">תַּכְתִּיב\u003c/td>\u003ctd class=\"hcell he\">תֻּכְתַּב\u003c/td>\u003ctd class=\"hcell he\">תִּתְכַּתֵּב\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">תִּכְתְּבִי\u003c/td>\u003ctd class=\"hcell he\">תִּכָּתְבִי\u003c/td>\u003ctd class=\"hcell he\">תְּכַתְּבִי\u003c/td>\u003ctd class=\"hcell he\">תְּכֻתְּבִי\u003c/td>\u003ctd class=\"hcell he\">תַּכְתִּיבִי\u003c/td>\u003ctd class=\"hcell he\">תֻּכְתְּבִי\u003c/td>\u003ctd class=\"hcell he\">תִּתְכַּתְּבִי\u003c/td>\u003c/tr>\n\u003ctr class=\"hl2\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">יִכְתּוֹב\u003c/td>\u003ctd class=\"hcell he\">יִכָּתֵב\u003c/td>\u003ctd class=\"hcell he\">יְכַתֵּב\u003c/td>\u003ctd class=\"hcell he\">יְכֻתַּב\u003c/td>\u003ctd class=\"hcell he\">יַכְתִּיב\u003c/td>\u003ctd class=\"hcell he\">יֻכְתַּב\u003c/td>\u003ctd class=\"hcell he\">יִתְכַּתֵּב\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">נִכְתּוֹב\u003c/td>\u003ctd class=\"hcell he\">נִכָּתֵב\u003c/td>\u003ctd class=\"hcell he\">נְכַתֵּב\u003c/td>\u003ctd class=\"hcell he\">נְכֻתַּב\u003c/td>\u003ctd class=\"hcell he\">נַכְתִּיב\u003c/td>\u003ctd class=\"hcell he\">נֻכְתַּב\u003c/td>\u003ctd class=\"hcell he\">נִתְכַּתֵּב\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתֶּם\u003c/td>\u003ctd class=\"hcell he\">תִּכְתְּבוּ\u003c/td>\u003ctd class=\"hcell he\">תִּכָּתְבוּ\u003c/td>\u003ctd class=\"hcell he\">תְּכַתְּבוּ\u003c/td>\u003ctd class=\"hcell he\">תְּכֻתְּבוּ\u003c/td>\u003ctd class=\"hcell he\">תַּכְתִּיבוּ\u003c/td>\u003ctd class=\"hcell he\">תֻּכְתְּבוּ\u003c/td>\u003ctd class=\"hcell he\">תִּתְכַּתְּבוּ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">יִכְתְּבוּ\u003c/td>\u003ctd class=\"hcell he\">יִכָּתְבוּ\u003c/td>\u003ctd class=\"hcell he\">יְכַתְּבוּ\u003c/td>\u003ctd class=\"hcell he\">יְכֻתְּבוּ\u003c/td>\u003ctd class=\"hcell he\">יַכְתִּיבוּ\u003c/td>\u003ctd class=\"hcell he\">יֻכְתְּבוּ\u003c/td>\u003ctd class=\"hcell he\">יִתְכַּתְּבוּ\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\n\u003cdiv class=\"note tip\">\n\u003cb>La voyelle du préfixe = carte d'identité du binyan\u003c/b>\n\u003cdiv class=\"tbl-wrap\" style=\"margin-top:8px\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Son du préfixe (3\u003csup>e\u003c/sup> m.s.)\u003c/th>\u003cth>Binyan\u003c/th>\u003cth>Exemple\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003cspan class=\"tr\">yi-\u003c/span> + thème court\u003c/td>\u003ctd>פָּעַל\u003c/td>\u003ctd class=\"hcell he\">יִכְתּוֹב\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cspan class=\"tr\">yi-\u003c/span> + daguesh (double yod à l'écrit)\u003c/td>\u003ctd>נִפְעַל\u003c/td>\u003ctd class=\"hcell he\">יִיכָּתֵב\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cspan class=\"tr\">ye-\u003c/span>\u003c/td>\u003ctd>פִּיעֵל\u003c/td>\u003ctd class=\"hcell he\">יְכַתֵּב\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cspan class=\"tr\">ye-\u003c/span> + \u003cem>ou\u003c/em>\u003c/td>\u003ctd>פּוּעַל\u003c/td>\u003ctd class=\"hcell he\">יְכֻתַּב\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cspan class=\"tr\">ya-\u003c/span>\u003c/td>\u003ctd>הִפְעִיל\u003c/td>\u003ctd class=\"hcell he\">יַכְתִּיב\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cspan class=\"tr\">you-\u003c/span>\u003c/td>\u003ctd>הוּפְעַל\u003c/td>\u003ctd class=\"hcell he\">יֻכְתַּב\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cspan class=\"tr\">yit-\u003c/span>\u003c/td>\u003ctd>הִתְפַּעֵל\u003c/td>\u003ctd class=\"hcell he\">יִתְכַּתֵּב\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/div>\n\n\u003ch3>3.5 · Du futur à l'impératif\u003c/h3>\n\u003cp>L'impératif hébreu (צִוּוּי) se fabrique à partir du futur&nbsp;: on prend la 2\u003csup>e\u003c/sup> personne et on \u003cstrong>retire le préfixe\u003c/strong> \u003cspan class=\"he\">תּ־\u003c/span>.\u003c/p>\n\n\u003cdiv class=\"tbl-wrap\">\n\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Binyan\u003c/th>\u003cth>Futur (אַתָּה)\u003c/th>\u003cth>→ Impératif m.s.\u003c/th>\u003cth>f.s.\u003c/th>\u003cth>pluriel\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>פָּעַל\u003c/td>\u003ctd class=\"hcell he\">תִּכְתּוֹב\u003c/td>\u003ctd class=\"hcell he\">כְּתוֹב!\u003c/td>\u003ctd class=\"hcell he\">כִּתְבִי!\u003c/td>\u003ctd class=\"hcell he\">כִּתְבוּ!\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>נִפְעַל\u003c/td>\u003ctd class=\"hcell he\">תִּכָּנֵס\u003c/td>\u003ctd class=\"hcell he\">הִיכָּנֵס!\u003c/td>\u003ctd class=\"hcell he\">הִיכָּנְסִי!\u003c/td>\u003ctd class=\"hcell he\">הִיכָּנְסוּ!\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>פִּיעֵל\u003c/td>\u003ctd class=\"hcell he\">תְּדַבֵּר\u003c/td>\u003ctd class=\"hcell he\">דַּבֵּר!\u003c/td>\u003ctd class=\"hcell he\">דַּבְּרִי!\u003c/td>\u003ctd class=\"hcell he\">דַּבְּרוּ!\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>הִפְעִיל\u003c/td>\u003ctd class=\"hcell he\">תַּסְבִּיר\u003c/td>\u003ctd class=\"hcell he\">הַסְבֵּר!\u003c/td>\u003ctd class=\"hcell he\">הַסְבִּירִי!\u003c/td>\u003ctd class=\"hcell he\">הַסְבִּירוּ!\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>הִתְפַּעֵל\u003c/td>\u003ctd class=\"hcell he\">תִּתְלַבֵּשׁ\u003c/td>\u003ctd class=\"hcell he\">הִתְלַבֵּשׁ!\u003c/td>\u003ctd class=\"hcell he\">הִתְלַבְּשִׁי!\u003c/td>\u003ctd class=\"hcell he\">הִתְלַבְּשׁוּ!\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003cp style=\"font-size:.9rem;color:var(--ink-soft)\">פועל et הופעל, étant passifs, n'ont pas d'impératif.\u003c/p>\n\n\u003cdiv class=\"note tip\">\n\u003cb>Dans la vraie vie, on utilise le futur\u003c/b>\nL'hébreu israélien courant remplace massivement l'impératif normatif par la forme de futur&nbsp;:\u003cbr>\n\u003cspan class=\"he\">תִּכְתּוֹב לִי מָחָר\u003c/span> «&nbsp;écris-moi demain&nbsp;» · \u003cspan class=\"he\">תַּגִּיד לִי…\u003c/span> «&nbsp;dis-moi…&nbsp;» · \u003cspan class=\"he\">תָּבוֹאִי!\u003c/span> «&nbsp;viens&nbsp;!&nbsp;» · \u003cspan class=\"he\">תִּשְׁתּוּ מַשֶּׁהוּ\u003c/span> «&nbsp;buvez quelque chose&nbsp;».\u003cbr>\nC'est perçu comme plus doux, moins martial que l'impératif vrai. L'impératif normatif survit dans les consignes écrites, l'armée, la publicité et les expressions figées (\u003cspan class=\"he\">סְלַח לִי, בּוֹא הֵנָּה, שֵׁב\u003c/span>).\n\u003c/div>\n\n\u003cdiv class=\"note warn\">\n\u003cb>L'impératif négatif n'existe qu'au futur\u003c/b>\nOn ne dit \u003cstrong>jamais\u003c/strong> ✗\u003cspan class=\"he\">לֹא כְּתוֹב\u003c/span>. La défense se construit avec \u003cspan class=\"he\">אַל\u003c/span> + futur 2\u003csup>e\u003c/sup> personne&nbsp;:\u003cbr>\n\u003cspan class=\"he he-lg\">אַל תִּכְתּוֹב! · אַל תֵּלְכִי! · אַל תִּדְאֲגוּ!\u003c/span>\u003cbr>\n«&nbsp;N'écris pas&nbsp;! · N'y va pas&nbsp;! · Ne vous inquiétez pas&nbsp;!&nbsp;»\u003cbr>\n\u003cspan class=\"he\">לֹא\u003c/span> + futur = négation d'un futur ordinaire (\u003cspan class=\"he\">לֹא אֶכְתּוֹב\u003c/span> « je n'écrirai pas »)&nbsp;; \u003cspan class=\"he\">אַל\u003c/span> + futur = interdiction.\n\u003c/div>\n\u003c/section>\n\n\u003chr>\n\n\u003csection id=\"gzarot\">\n\u003ch2>\u003cspan class=\"num\">4.\u003c/span> Les verbes faibles — הַגְּזָרוֹת\u003c/h2>\n\n\u003cp>Une \u003cem>gzira\u003c/em> (גִּזְרָה) est une famille de racines dont une consonne « faible » (\u003cspan class=\"he\">א ה ו י נ\u003c/span>) ou une gutturale se comporte mal&nbsp;: elle disparaît, s'assimile, se transforme en voyelle. Les tableaux vus jusqu'ici valent toujours — c'est simplement le \u003cstrong>thème\u003c/strong> qui se déforme. Les suffixes du passé et les préfixes du futur, eux, ne bougent jamais.\u003c/p>\n\n\u003cp>La nomenclature utilise le verbe modèle \u003cspan class=\"he\">פ־ע־ל\u003c/span>&nbsp;: \u003cspan class=\"he\">פ\u003c/span> = 1\u003csup>re\u003c/sup> radicale, \u003cspan class=\"he\">ע\u003c/span> = 2\u003csup>e\u003c/sup>, \u003cspan class=\"he\">ל\u003c/span> = 3\u003csup>e\u003c/sup>. Ainsi \u003cspan class=\"he\">ל״ה\u003c/span> = « troisième radicale \u003cspan class=\"he\">ה\u003c/span> ».\u003c/p>\n\n\u003cdiv class=\"note tip\">\n\u003cb>Ordre de priorité pour un apprenant\u003c/b>\nSi vous devez en choisir trois, prenez \u003cspan class=\"he\">ל״ה\u003c/span>, \u003cspan class=\"he\">ע״ו/ע״י\u003c/span> et \u003cspan class=\"he\">פ״נ\u003c/span>&nbsp;: à elles seules elles couvrent une part énorme du vocabulaire courant (היה, עשה, רצה, ראה, קם, בא, שם, נתן, נסע, לקח…).\n\u003c/div>\n\n\u003cdetails open>\n\u003csummary>ל״ה — 3\u003csup>e\u003c/sup> radicale \u003cspan class=\"he\">ה\u003c/span> \u003cspan class=\"gz-tag\">la plus fréquente\u003c/span>\u003c/summary>\n\u003cdiv class=\"detbody\">\n\u003cp>\u003cb>Verbes concernés&nbsp;:\u003c/b> \u003cspan class=\"he\">הָיָה, עָשָׂה, רָאָה, קָנָה, בָּנָה, רָצָה, שָׁתָה, עָנָה, פָּנָה, עָלָה, שָׁנָה\u003c/span>&nbsp;; en פיעל \u003cspan class=\"he\">גִּילָּה, קִיווָה, נִיסָּה, חִיכָּה, שִׁינָּה, נִיקָּה\u003c/span>&nbsp;; en הפעיל \u003cspan class=\"he\">הֶרְאָה, הִקְנָה, הֶעֱלָה, הִשְׁוָה\u003c/span>.\u003c/p>\n\n\u003cdiv class=\"note warn\">\u003cb>Le principe\u003c/b>\nLe \u003cspan class=\"he\">ה\u003c/span> final n'est pas une vraie consonne&nbsp;: c'est une \u003cem>mater lectionis\u003c/em> qui note une ancienne semi-voyelle \u003cspan class=\"he\">י\u003c/span>. Résultat&nbsp;:\u003cbr>\n· \u003cstrong>Passé\u003c/strong>&nbsp;: devant les suffixes consonantiques, le \u003cspan class=\"he\">ה\u003c/span> devient \u003cspan class=\"he\">־ִי־ / ־ֵי־\u003c/span> → \u003cspan class=\"he\">קָנִיתִי\u003c/span>. À la 3\u003csup>e\u003c/sup> personne il disparaît ou se contracte → \u003cspan class=\"he\">קָנָה / קָנְתָה / קָנוּ\u003c/span>.\u003cbr>\n· \u003cstrong>Futur\u003c/strong>&nbsp;: la finale est \u003cspan class=\"he\">־ֶה\u003c/span>, qui tombe devant \u003cspan class=\"he\">־ִי\u003c/span> et \u003cspan class=\"he\">־וּ\u003c/span> → \u003cspan class=\"he\">יִקְנֶה\u003c/span> mais \u003cspan class=\"he\">יִקְנוּ\u003c/span>.\n\u003c/div>\n\n\u003ch4>פעל — \u003cspan class=\"he\">קָנָה\u003c/span> (acheter)\u003c/h4>\n\u003cdiv class=\"tbl-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth>Passé\u003c/th>\u003cth>Prononc.\u003c/th>\u003cth>Futur\u003c/th>\u003cth>Prononc.\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">קָנִיתִי\u003c/td>\u003ctd class=\"tr\">kaníti\u003c/td>\u003ctd class=\"hcell he\">אֶקְנֶה\u003c/td>\u003ctd class=\"tr\">eknè\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">קָנִיתָ\u003c/td>\u003ctd class=\"tr\">kaníta\u003c/td>\u003ctd class=\"hcell he\">תִּקְנֶה\u003c/td>\u003ctd class=\"tr\">tiknè\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">קָנִית\u003c/td>\u003ctd class=\"tr\">kanít\u003c/td>\u003ctd class=\"hcell he\">תִּקְנִי\u003c/td>\u003ctd class=\"tr\">tikní\u003c/td>\u003c/tr>\n\u003ctr class=\"hl\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">קָנָה\u003c/td>\u003ctd class=\"tr\">kaná\u003c/td>\u003ctd class=\"hcell he\">יִקְנֶה\u003c/td>\u003ctd class=\"tr\">yiknè\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">קָנְתָה\u003c/td>\u003ctd class=\"tr\">kantá\u003c/td>\u003ctd class=\"hcell he\">תִּקְנֶה\u003c/td>\u003ctd class=\"tr\">tiknè\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">קָנִינוּ\u003c/td>\u003ctd class=\"tr\">kanínou\u003c/td>\u003ctd class=\"hcell he\">נִקְנֶה\u003c/td>\u003ctd class=\"tr\">niknè\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתֶּם\u003c/td>\u003ctd class=\"hcell he\">קְנִיתֶם\u003c/td>\u003ctd class=\"tr\">knitém\u003c/td>\u003ctd class=\"hcell he\">תִּקְנוּ\u003c/td>\u003ctd class=\"tr\">tiknóu\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">קָנוּ\u003c/td>\u003ctd class=\"tr\">kanóu\u003c/td>\u003ctd class=\"hcell he\">יִקְנוּ\u003c/td>\u003ctd class=\"tr\">yiknóu\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003ch4>Les autres binyanim (3\u003csup>e\u003c/sup> masc. sing. et 1\u003csup>re\u003c/sup> sing.)\u003c/h4>\n\u003cdiv class=\"tbl-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Binyan\u003c/th>\u003cth>Verbe\u003c/th>\u003cth>Passé — הוא\u003c/th>\u003cth>Passé — אני\u003c/th>\u003cth>Passé — היא\u003c/th>\u003cth>Futur — הוא\u003c/th>\u003cth>Futur — הם\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>נִפְעַל\u003c/td>\u003ctd class=\"hcell he\">נִבְנָה\u003c/td>\u003ctd class=\"hcell he\">נִבְנָה\u003c/td>\u003ctd class=\"hcell he\">נִבְנֵיתִי\u003c/td>\u003ctd class=\"hcell he\">נִבְנְתָה\u003c/td>\u003ctd class=\"hcell he\">יִיבָּנֶה\u003c/td>\u003ctd class=\"hcell he\">יִיבָּנוּ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>פִּיעֵל\u003c/td>\u003ctd class=\"hcell he\">גִּילָּה\u003c/td>\u003ctd class=\"hcell he\">גִּילָּה\u003c/td>\u003ctd class=\"hcell he\">גִּילִּיתִי\u003c/td>\u003ctd class=\"hcell he\">גִּילְּתָה\u003c/td>\u003ctd class=\"hcell he\">יְגַלֶּה\u003c/td>\u003ctd class=\"hcell he\">יְגַלּוּ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>פּוּעַל\u003c/td>\u003ctd class=\"hcell he\">גּוּלָּה\u003c/td>\u003ctd class=\"hcell he\">גּוּלָּה\u003c/td>\u003ctd class=\"hcell he\">גּוּלֵּיתִי\u003c/td>\u003ctd class=\"hcell he\">גּוּלְּתָה\u003c/td>\u003ctd class=\"hcell he\">יְגוּלֶּה\u003c/td>\u003ctd class=\"hcell he\">יְגוּלּוּ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>הִפְעִיל\u003c/td>\u003ctd class=\"hcell he\">הִקְנָה\u003c/td>\u003ctd class=\"hcell he\">הִקְנָה\u003c/td>\u003ctd class=\"hcell he\">הִקְנֵיתִי\u003c/td>\u003ctd class=\"hcell he\">הִקְנְתָה\u003c/td>\u003ctd class=\"hcell he\">יַקְנֶה\u003c/td>\u003ctd class=\"hcell he\">יַקְנוּ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>הוּפְעַל\u003c/td>\u003ctd class=\"hcell he\">הוּקְנָה\u003c/td>\u003ctd class=\"hcell he\">הוּקְנָה\u003c/td>\u003ctd class=\"hcell he\">הוּקְנֵיתִי\u003c/td>\u003ctd class=\"hcell he\">הוּקְנְתָה\u003c/td>\u003ctd class=\"hcell he\">יוּקְנֶה\u003c/td>\u003ctd class=\"hcell he\">יוּקְנוּ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>הִתְפַּעֵל\u003c/td>\u003ctd class=\"hcell he\">הִתְנַסָּה\u003c/td>\u003ctd class=\"hcell he\">הִתְנַסָּה\u003c/td>\u003ctd class=\"hcell he\">הִתְנַסֵּיתִי\u003c/td>\u003ctd class=\"hcell he\">הִתְנַסְּתָה\u003c/td>\u003ctd class=\"hcell he\">יִתְנַסֶּה\u003c/td>\u003ctd class=\"hcell he\">יִתְנַסּוּ\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003cdiv class=\"note tip\">\u003cb>La signature ל״ה, tous binyanim confondus\u003c/b>\nPassé&nbsp;: \u003cspan class=\"he\">הוא\u003c/span> → \u003cspan class=\"he\">־ָה\u003c/span> · \u003cspan class=\"he\">היא\u003c/span> → \u003cspan class=\"he\">־ְתָה\u003c/span> · \u003cspan class=\"he\">הם\u003c/span> → \u003cspan class=\"he\">־וּ\u003c/span> · toutes les autres personnes → \u003cspan class=\"he\">־ִית־ / ־ֵית־\u003c/span>.\u003cbr>\nFutur&nbsp;: \u003cspan class=\"he\">־ֶה\u003c/span> au singulier sans suffixe, rien devant \u003cspan class=\"he\">־ִי\u003c/span> et \u003cspan class=\"he\">־וּ\u003c/span>.\u003cbr>\nVous n'avez donc \u003cstrong>qu'un seul schéma\u003c/strong> à mémoriser pour toute la gzira.\u003c/div>\n\n\u003ch4>Deux verbes ל״ה indispensables, conjugués en entier\u003c/h4>\n\u003cdiv class=\"tbl-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth class=\"hcell he\">עָשָׂה — passé\u003c/th>\u003cth class=\"hcell he\">עָשָׂה — futur\u003c/th>\u003cth class=\"hcell he\">רָאָה — passé\u003c/th>\u003cth class=\"hcell he\">רָאָה — futur\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">עָשִׂיתִי\u003c/td>\u003ctd class=\"hcell he\">אֶעֱשֶׂה\u003c/td>\u003ctd class=\"hcell he\">רָאִיתִי\u003c/td>\u003ctd class=\"hcell he\">אֶרְאֶה\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">עָשִׂיתָ\u003c/td>\u003ctd class=\"hcell he\">תַּעֲשֶׂה\u003c/td>\u003ctd class=\"hcell he\">רָאִיתָ\u003c/td>\u003ctd class=\"hcell he\">תִּרְאֶה\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">עָשִׂית\u003c/td>\u003ctd class=\"hcell he\">תַּעֲשִׂי\u003c/td>\u003ctd class=\"hcell he\">רָאִית\u003c/td>\u003ctd class=\"hcell he\">תִּרְאִי\u003c/td>\u003c/tr>\n\u003ctr class=\"hl\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">עָשָׂה\u003c/td>\u003ctd class=\"hcell he\">יַעֲשֶׂה\u003c/td>\u003ctd class=\"hcell he\">רָאָה\u003c/td>\u003ctd class=\"hcell he\">יִרְאֶה\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">עָשְׂתָה\u003c/td>\u003ctd class=\"hcell he\">תַּעֲשֶׂה\u003c/td>\u003ctd class=\"hcell he\">רָאֲתָה\u003c/td>\u003ctd class=\"hcell he\">תִּרְאֶה\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">עָשִׂינוּ\u003c/td>\u003ctd class=\"hcell he\">נַעֲשֶׂה\u003c/td>\u003ctd class=\"hcell he\">רָאִינוּ\u003c/td>\u003ctd class=\"hcell he\">נִרְאֶה\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתֶּם\u003c/td>\u003ctd class=\"hcell he\">עֲשִׂיתֶם\u003c/td>\u003ctd class=\"hcell he\">תַּעֲשׂוּ\u003c/td>\u003ctd class=\"hcell he\">רְאִיתֶם\u003c/td>\u003ctd class=\"hcell he\">תִּרְאוּ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">עָשׂוּ\u003c/td>\u003ctd class=\"hcell he\">יַעֲשׂוּ\u003c/td>\u003ctd class=\"hcell he\">רָאוּ\u003c/td>\u003ctd class=\"hcell he\">יִרְאוּ\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp style=\"font-size:.9rem;color:var(--ink-soft)\">\u003cspan class=\"he\">עשה\u003c/span> cumule deux difficultés&nbsp;: ל״ה \u003cem>et\u003c/em> gutturale en 1\u003csup>re\u003c/sup> radicale (d'où \u003cspan class=\"he\">יַעֲשֶׂה\u003c/span> avec patah et hataf). \u003cspan class=\"he\">ראה\u003c/span> a un \u003cspan class=\"he\">ר\u003c/span> qui ne prend pas de hataf&nbsp;: \u003cspan class=\"he\">יִרְאֶה\u003c/span>.\u003c/p>\n\u003c/div>\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ע״ו / ע״י — verbes « creux » \u003cspan class=\"gz-tag\">très courant\u003c/span>\u003c/summary>\n\u003cdiv class=\"detbody\">\n\u003cp>\u003cb>Verbes concernés&nbsp;:\u003c/b> \u003cspan class=\"he\">קָם, בָּא, שָׂם, רָץ, גָּר, טָס, שָׁב, מֵת, זָז\u003c/span> (ע״ו)&nbsp;; \u003cspan class=\"he\">שָׁר, שָׂם, רִיב, דָּן\u003c/span> (ע״י). En apparence ils n'ont que \u003cstrong>deux\u003c/strong> consonnes&nbsp;; la 2\u003csup>e\u003c/sup> radicale est un \u003cspan class=\"he\">ו\u003c/span> ou un \u003cspan class=\"he\">י\u003c/span> qui ne se réalise qu'au futur et à l'infinitif.\u003c/p>\n\n\u003cdiv class=\"note warn\">\u003cb>Le principe\u003c/b>\n· \u003cstrong>Passé\u003c/strong>&nbsp;: aucune trace de la 2\u003csup>e\u003c/sup> radicale. 3\u003csup>e\u003c/sup> personnes en \u003cem>qamats\u003c/em> (\u003cspan class=\"he\">קָם, קָמָה, קָמוּ\u003c/span>), 1\u003csup>re\u003c/sup>/2\u003csup>e\u003c/sup> personnes en \u003cem>patah\u003c/em> bref (\u003cspan class=\"he\">קַמְתִּי, קַמְנוּ\u003c/span>).\u003cbr>\n· \u003cstrong>Futur\u003c/strong>&nbsp;: la voyelle réapparaît en pleine longueur — \u003cspan class=\"he\">יָקוּם\u003c/span> (ou), \u003cspan class=\"he\">יָשִׁיר\u003c/span> (i), \u003cspan class=\"he\">יָבוֹא\u003c/span> (o) — et le \u003cstrong>préfixe prend un \u003cem>qamats\u003c/em>\u003c/strong>, jamais un hiriq.\u003c/p>\n\u003c/div>\n\n\u003cdiv class=\"tbl-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Pronom\u003c/th>\u003cth class=\"hcell he\">קָם passé\u003c/th>\u003cth class=\"hcell he\">קָם futur\u003c/th>\u003cth class=\"hcell he\">בָּא passé\u003c/th>\u003cth class=\"hcell he\">בָּא futur\u003c/th>\u003cth class=\"hcell he\">שָׁר passé\u003c/th>\u003cth class=\"hcell he\">שָׁר futur\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"pron he\">אֲנִי\u003c/td>\u003ctd class=\"hcell he\">קַמְתִּי\u003c/td>\u003ctd class=\"hcell he\">אָקוּם\u003c/td>\u003ctd class=\"hcell he\">בָּאתִי\u003c/td>\u003ctd class=\"hcell he\">אָבוֹא\u003c/td>\u003ctd class=\"hcell he\">שַׁרְתִּי\u003c/td>\u003ctd class=\"hcell he\">אָשִׁיר\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתָּה\u003c/td>\u003ctd class=\"hcell he\">קַמְתָּ\u003c/td>\u003ctd class=\"hcell he\">תָּקוּם\u003c/td>\u003ctd class=\"hcell he\">בָּאתָ\u003c/td>\u003ctd class=\"hcell he\">תָּבוֹא\u003c/td>\u003ctd class=\"hcell he\">שַׁרְתָּ\u003c/td>\u003ctd class=\"hcell he\">תָּשִׁיר\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתְּ\u003c/td>\u003ctd class=\"hcell he\">קַמְתְּ\u003c/td>\u003ctd class=\"hcell he\">תָּקוּמִי\u003c/td>\u003ctd class=\"hcell he\">בָּאת\u003c/td>\u003ctd class=\"hcell he\">תָּבוֹאִי\u003c/td>\u003ctd class=\"hcell he\">שַׁרְתְּ\u003c/td>\u003ctd class=\"hcell he\">תָּשִׁירִי\u003c/td>\u003c/tr>\n\u003ctr class=\"hl\">\u003ctd class=\"pron he\">הוּא\u003c/td>\u003ctd class=\"hcell he\">קָם\u003c/td>\u003ctd class=\"hcell he\">יָקוּם\u003c/td>\u003ctd class=\"hcell he\">בָּא\u003c/td>\u003ctd class=\"hcell he\">יָבוֹא\u003c/td>\u003ctd class=\"hcell he\">שָׁר\u003c/td>\u003ctd class=\"hcell he\">יָשִׁיר\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הִיא\u003c/td>\u003ctd class=\"hcell he\">קָמָה\u003c/td>\u003ctd class=\"hcell he\">תָּקוּם\u003c/td>\u003ctd class=\"hcell he\">בָּאָה\u003c/td>\u003ctd class=\"hcell he\">תָּבוֹא\u003c/td>\u003ctd class=\"hcell he\">שָׁרָה\u003c/td>\u003ctd class=\"hcell he\">תָּשִׁיר\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אֲנַחְנוּ\u003c/td>\u003ctd class=\"hcell he\">קַמְנוּ\u003c/td>\u003ctd class=\"hcell he\">נָקוּם\u003c/td>\u003ctd class=\"hcell he\">בָּאנוּ\u003c/td>\u003ctd class=\"hcell he\">נָבוֹא\u003c/td>\u003ctd class=\"hcell he\">שַׁרְנוּ\u003c/td>\u003ctd class=\"hcell he\">נָשִׁיר\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">אַתֶּם\u003c/td>\u003ctd class=\"hcell he\">קַמְתֶּם\u003c/td>\u003ctd class=\"hcell he\">תָּקוּמוּ\u003c/td>\u003ctd class=\"hcell he\">בָּאתֶם\u003c/td>\u003ctd class=\"hcell he\">תָּבוֹאוּ\u003c/td>\u003ctd class=\"hcell he\">שַׁרְתֶּם\u003c/td>\u003ctd class=\"hcell he\">תָּשִׁירוּ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pron he\">הֵם / הֵן\u003c/td>\u003ctd class=\"hcell he\">קָמוּ\u003c/td>\u003ctd class=\"hcell he\">יָקוּמוּ\u003c/td>\u003ctd class=\"hcell he\">בָּאוּ\u003c/td>\u003ctd class=\"hcell he\">יָבוֹאוּ\u003c/td>\u003ctd class=\"hcell he\">שָׁרוּ\u003c/td>\u003ctd class=\"hcell he\">יָשִׁירוּ\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003cdiv class=\"note\">\u003cb>Le cas \u003cspan class=\"he\">מֵת\u003c/span>\u003c/b>\nIl se conjugue en \u003cem>tsere\u003c/em> aux 3\u003csup>e\u003c/sup> personnes&nbsp;: \u003cspan class=\"he\">מֵת, מֵתָה, מֵתוּ\u003c/span> — mais \u003cspan class=\"he\">מַתִּי, מַתְנוּ\u003c/span> aux autres. Futur&nbsp;: \u003cspan class=\"he\">אָמוּת, יָמוּת, יָמוּתוּ\u003c/span>.\u003c/div>\n\n\u003ch4>Les creux dans les autres binyanim\u003c/h4>\n\u003cdiv class=\"tbl-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Binyan\u003c/th>\u003cth>Verbe\u003c/th>\u003cth>Passé — הוא\u003c/th>\u003cth>Passé — אני\u003c/th>\u003cth>Futur — הוא\u003c/th>\u003cth>Sens\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>הִפְעִיל\u003c/td>\u003ctd class=\"hcell he\">הֵכִין\u003c/td>\u003ctd class=\"hcell he\">הֵכִין\u003c/td>\u003ctd class=\"hcell he\">הֵכַנְתִּי\u003c/td>\u003ctd class=\"hcell he\">יָכִין\u003c/td>\u003ctd>préparer\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>הִפְעִיל\u003c/td>\u003ctd class
