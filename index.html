      \u003cp>Le \u003cstrong>בינוני פעול\u003c/strong> (participe passif) est une \u003cstrong>forme adjectivale dérivée du verbe\u003c/strong>. Il décrit un état résultant d'une action — souvent traduisible par un participe passé français (« écrit », « cassé », « fermé »).\u003c/p>\n          \u003cp>Forme de base au binyan Pa'al : \u003cspan class=\"he-inline\">XָXוּX\u003c/span>. Il s'accorde en genre et en nombre comme un adjectif normal :\u003c/p>\n          \u003ctable>\n            \u003ctbody>\u003ctr>\u003cth>m. sg.\u003c/th>\u003cth>f. sg.\u003c/th>\u003cth>m. pl.\u003c/th>\u003cth>f. pl.\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">כָּתוּב\u003c/td>\u003ctd class=\"he-cell\">כְּתוּבָה\u003c/td>\u003ctd class=\"he-cell\">כְּתוּבִים\u003c/td>\u003ctd class=\"he-cell\">כְּתוּבוֹת\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">שָׁבוּר\u003c/td>\u003ctd class=\"he-cell\">שְׁבוּרָה\u003c/td>\u003ctd class=\"he-cell\">שְׁבוּרִים\u003c/td>\u003ctd class=\"he-cell\">שְׁבוּרוֹת\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">סָגוּר\u003c/td>\u003ctd class=\"he-cell\">סְגוּרָה\u003c/td>\u003ctd class=\"he-cell\">סְגוּרִים\u003c/td>\u003ctd class=\"he-cell\">סְגוּרוֹת\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">פָּתוּחַ\u003c/td>\u003ctd class=\"he-cell\">פְּתוּחָה\u003c/td>\u003ctd class=\"he-cell\">פְּתוּחִים\u003c/td>\u003ctd class=\"he-cell\">פְּתוּחוֹת\u003c/td>\u003c/tr>\n          \u003c/tbody>\u003c/table>\n          \u003cp>Le sens du participe passif correspond généralement à celui du verbe :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">כּוֹתֵב\u003c/span> (écrit, verbe) → \u003cspan class=\"he-inline\">כָּתוּב\u003c/span> (écrit, état)\u003cbr>\n            \u003cspan class=\"he-inline\">שׁוֹבֵר\u003c/span> (casse) → \u003cspan class=\"he-inline\">שָׁבוּר\u003c/span> (cassé)\u003cbr>\n            \u003cspan class=\"he-inline\">סוֹגֵר\u003c/span> (ferme) → \u003cspan class=\"he-inline\">סָגוּר\u003c/span> (fermé)\n          \u003c/div>\n          \u003cp>\u003cstrong>Attention\u003c/strong> : pour certains participes, le sens s'est \u003cstrong>éloigné\u003c/strong> du verbe d'origine et il faut les apprendre comme des adjectifs à part entière :\u003c/p>\n          \u003cul>\n            \u003cli>\u003cspan class=\"he-inline\">חָשׁוּב\u003c/span> → important (pas seulement « pensé »)\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">עָסוּק\u003c/span> → occupé\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">בָּרוּר\u003c/span> → clair, évident\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">בָּטוּחַ\u003c/span> → sûr, certain\u003c/li>\n            \u003cli>\u003cspan class=\"he-inline\">קָשׁוּר\u003c/span> → lié\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">הַחַלּוֹן שָׁבוּר\u003c/span> → La fenêtre est cassée.\u003cbr>\n            \u003cspan class=\"he-inline\">הַחֲנוּת סְגוּרָה הַיּוֹם\u003c/span> → Le magasin est fermé aujourd'hui.\u003cbr>\n            \u003cspan class=\"he-inline\">אֲנִי עָסוּקָה כָּל הַשָּׁבוּעַ\u003c/span> → Je suis occupée toute la semaine.\u003cbr>\n            \u003cspan class=\"he-inline\">זֶה חָשׁוּב לִי\u003c/span> → C'est important pour moi.\n          \u003c/div>\n        \u003c/div>\n    \u003c/div>\u003cdiv class=\"grammar-section\">\n      \u003cdiv class=\"grammar-header\">\n        \u003cdiv class=\"grammar-title\">נמצא — se trouver / être situé \u003cspan class=\"he\" dir=\"rtl\">נמצא\u003c/span>\u003c/div>\n        \u003cdiv class=\"grammar-toggle\">+\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grammar-content\">\n          \u003cp>Le verbe \u003cspan class=\"he-inline\">נִמְצָא\u003c/span> (binyan Nif'al) sert à \u003cstrong>localiser\u003c/strong> quelque chose ou quelqu'un dans l'espace.\u003c/p>\n          \u003ctable>\n            \u003ctbody>\u003ctr>\u003cth>Genre / nombre\u003c/th>\u003cth>Forme\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>m. sg.\u003c/td>\u003ctd class=\"he-cell\">נִמְצָא\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>f. sg.\u003c/td>\u003ctd class=\"he-cell\">נִמְצֵאת\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>m. pl.\u003c/td>\u003ctd class=\"he-cell\">נִמְצָאִים\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>f. pl.\u003c/td>\u003ctd class=\"he-cell\">נִמְצָאוֹת\u003c/td>\u003c/tr>\n          \u003c/tbody>\u003c/table>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֵיפֹה נִמְצֵאת הָעִיר צְפַת?\u003c/span> → Où se trouve la ville de Tsfat ?\u003cbr>\n            \u003cspan class=\"he-inline\">הָעִיר אֵילַת נִמְצֵאת בַּדָּרוֹם\u003c/span> → La ville d'Eilat se trouve dans le sud.\u003cbr>\n            \u003cspan class=\"he-inline\">רְחוֹב בֶּן יְהוּדָה נִמְצָא בְּתֵל אָבִיב\u003c/span> → La rue Ben Yehuda se trouve à Tel-Aviv.\u003cbr>\n            \u003cspan class=\"he-inline\">הַסְּפָרִים נִמְצָאִים עַל הַשֻּׁלְחָן\u003c/span> → Les livres se trouvent sur la table.\n          \u003c/div>\n          \u003cp>\u003cstrong>Différence avec יש\u003c/strong> : \u003cspan class=\"he-inline\">יֵשׁ\u003c/span> = « il y a » (existence), \u003cspan class=\"he-inline\">נִמְצָא\u003c/span> = « se trouve à » (localisation précise).\u003c/p>\n        \u003c/div>\n    \u003c/div>\u003cdiv class=\"grammar-category\">⁘ Comparaison &amp; quantité\u003c/div>\u003cdiv class=\"grammar-section\">\n      \u003cdiv class=\"grammar-header\">\n        \u003cdiv class=\"grammar-title\">Comparatif &amp; superlatif \u003cspan class=\"he\" dir=\"rtl\">יותר / הכי\u003c/span>\u003c/div>\n        \u003cdiv class=\"grammar-toggle\">+\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grammar-content\">\n          \u003cp>\u003cstrong>Comparatif\u003c/strong> : \u003cspan class=\"he-inline\">יוֹתֵר\u003c/span> (plus) / \u003cspan class=\"he-inline\">פָּחוֹת\u003c/span> (moins).\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">הוּא יוֹתֵר גָּבוֹהַּ מִמֶּנִּי\u003c/span> → Il est plus grand que moi.\u003cbr>\n            \u003cspan class=\"he-inline\">זֶה פָּחוֹת יָקָר\u003c/span> → C'est moins cher.\n          \u003c/div>\n          \u003cp>\u003cstrong>Superlatif\u003c/strong> : \u003cspan class=\"he-inline\">הֲכִי\u003c/span> + adjectif = « le plus… ». Très courant en hébreu parlé.\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">הוּא הֲכִי חָכָם בַּכִּתָּה\u003c/span> → Il est le plus intelligent de la classe.\u003cbr>\n            \u003cspan class=\"he-inline\">זֹאת הַמִּסְעָדָה הֲכִי יְקָרָה בָּעִיר\u003c/span> → C'est le restaurant le plus cher de la ville.\n          \u003c/div>\n        \u003c/div>\n    \u003c/div>\u003cdiv class=\"grammar-section\">\n      \u003cdiv class=\"grammar-header\">\n        \u003cdiv class=\"grammar-title\">כזה / כזאת / כאלה — comme celui-ci \u003cspan class=\"he\" dir=\"rtl\">כזה / כזאת / כאלה\u003c/span>\u003c/div>\n        \u003cdiv class=\"grammar-toggle\">+\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grammar-content\">\n          \u003cp>Ces 3 mots remplacent la construction \u003cspan class=\"he-inline\">כְּמוֹ\u003c/span> + démonstratif. Ils signifient « \u003cstrong>comme celui-ci / comme ça\u003c/strong> » et s'accordent en genre et en nombre.\u003c/p>\n          \u003ctable>\n            \u003ctbody>\u003ctr>\u003cth>Forme\u003c/th>\u003cth>Équivaut à\u003c/th>\u003cth>Sens\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">כָּזֶה\u003c/td>\u003ctd class=\"he-cell\">כְּמוֹ זֶה\u003c/td>\u003ctd>comme celui-ci / comme ça (m.sg)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">כָּזֹאת\u003c/td>\u003ctd class=\"he-cell\">כְּמוֹ זֹאת\u003c/td>\u003ctd>comme celle-ci / comme ça (f.sg)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">כָּאֵלֶּה\u003c/td>\u003ctd class=\"he-cell\">כְּמוֹ אֵלֶּה\u003c/td>\u003ctd>comme ceux-ci / celles-ci (pl.)\u003c/td>\u003c/tr>\n          \u003c/tbody>\u003c/table>\n          \u003cp>L'accord se fait avec le \u003cstrong>nom auquel se rapporte la comparaison\u003c/strong> :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">לֹא רָאִיתִי סֵפֶר כָּזֶה מֵעוֹלָם\u003c/span> → Je n'ai jamais vu un livre comme ça. (\u003cspan class=\"he-inline\">ספר\u003c/span> est m.sg → כזה)\u003cbr>\n            \u003cspan class=\"he-inline\">אֲנִי רוֹצָה שִׂמְלָה כָּזֹאת\u003c/span> → Je veux une robe comme celle-ci. (\u003cspan class=\"he-inline\">שמלה\u003c/span> est f.sg → כזאת)\u003cbr>\n            \u003cspan class=\"he-inline\">יֵשׁ לִי חֲבֵרִים כָּאֵלֶּה\u003c/span> → J'ai des amis comme ça. (\u003cspan class=\"he-inline\">חברים\u003c/span> est pl. → כאלה)\u003cbr>\n            \u003cspan class=\"he-inline\">לָמָּה אַתָּה אוֹמֵר דְּבָרִים כָּאֵלֶּה?\u003c/span> → Pourquoi tu dis des choses pareilles ?\n          \u003c/div>\n          \u003cp>\u003cstrong>Astuce\u003c/strong> : la forme est plus courte et plus naturelle à l'oral que \u003cspan class=\"he-inline\">כְּמוֹ\u003c/span> + démonstratif, mais les deux sont corrects.\u003c/p>\n        \u003c/div>\n    \u003c/div>\u003cdiv class=\"grammar-section\">\n      \u003cdiv class=\"grammar-header\">\n        \u003cdiv class=\"grammar-title\">Les chiffres et l'accord \u003cspan class=\"he\" dir=\"rtl\">מספרים\u003c/span>\u003c/div>\n        \u003cdiv class=\"grammar-toggle\">+\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grammar-content\">\n          \u003cp>En hébreu, les chiffres s'accordent en genre avec le nom qu'ils comptent.\u003c/p>\n          \u003cp>\u003cstrong>« Un »\u003c/strong> se place \u003cstrong>après\u003c/strong> le nom ; les autres chiffres se placent \u003cstrong>avant\u003c/strong>.\u003c/p>\n          \u003ctable>\n            \u003ctbody>\u003ctr>\u003cth>Nombre\u003c/th>\u003cth>Masculin\u003c/th>\u003cth>Féminin\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>1\u003c/td>\u003ctd class=\"he-cell\">אֶחָד\u003c/td>\u003ctd class=\"he-cell\">אַחַת\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>2\u003c/td>\u003ctd class=\"he-cell\">שְׁנַיִם / שְׁנֵי\u003c/td>\u003ctd class=\"he-cell\">שְׁתַּיִם / שְׁתֵּי\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>3\u003c/td>\u003ctd class=\"he-cell\">שְׁלוֹשָׁה\u003c/td>\u003ctd class=\"he-cell\">שָׁלוֹשׁ\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>4\u003c/td>\u003ctd class=\"he-cell\">אַרְבָּעָה\u003c/td>\u003ctd class=\"he-cell\">אַרְבַּע\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>5\u003c/td>\u003ctd class=\"he-cell\">חֲמִשָּׁה\u003c/td>\u003ctd class=\"he-cell\">חָמֵשׁ\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>6\u003c/td>\u003ctd class=\"he-cell\">שִׁשָּׁה\u003c/td>\u003ctd class=\"he-cell\">שֵׁשׁ\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>7\u003c/td>\u003ctd class=\"he-cell\">שִׁבְעָה\u003c/td>\u003ctd class=\"he-cell\">שֶׁבַע\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>8\u003c/td>\u003ctd class=\"he-cell\">שְׁמוֹנָה\u003c/td>\u003ctd class=\"he-cell\">שְׁמוֹנֶה\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>9\u003c/td>\u003ctd class=\"he-cell\">תִּשְׁעָה\u003c/td>\u003ctd class=\"he-cell\">תֵּשַׁע\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>10\u003c/td>\u003ctd class=\"he-cell\">עֲשָׂרָה\u003c/td>\u003ctd class=\"he-cell\">עֶשֶׂר\u003c/td>\u003c/tr>\n          \u003c/tbody>\u003c/table>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">בַּיִת אֶחָד\u003c/span> → une maison (m.)\u003cbr>\n            \u003cspan class=\"he-inline\">שָׁלוֹשׁ תְּמוּנוֹת\u003c/span> → trois tableaux (f.)\u003cbr>\n            \u003cspan class=\"he-inline\">חֲמִשָּׁה שִׁירִים\u003c/span> → cinq chansons (m.)\n          \u003c/div>\n          \u003cp>\u003cstrong>Particularité\u003c/strong> : \u003cspan class=\"he-inline\">שְׁתַּיִם\u003c/span> devient \u003cspan class=\"he-inline\">שְׁתֵּי\u003c/span> quand suivi d'un nom (état construit).\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">שְׁתֵּי שְׂמָלוֹת\u003c/span> → deux robes\n          \u003c/div>\n        \u003c/div>\n    \u003c/div>\u003cdiv class=\"grammar-section\">\n      \u003cdiv class=\"grammar-header\">\n        \u003cdiv class=\"grammar-title\">Nombres ordinaux \u003cspan class=\"he\" dir=\"rtl\">מספרים סודרים\u003c/span>\u003c/div>\n        \u003cdiv class=\"grammar-toggle\">+\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grammar-content\">\n          \u003cp>Les ordinaux ont des formes au masculin et au féminin, et s'accordent comme un adjectif (avec le ה défini si besoin).\u003c/p>\n          \u003ctable>\n            \u003ctbody>\u003ctr>\u003cth>Rang\u003c/th>\u003cth>Masculin\u003c/th>\u003cth>Féminin\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>1er\u003c/td>\u003ctd class=\"he-cell\">רִאשׁוֹן\u003c/td>\u003ctd class=\"he-cell\">רִאשׁוֹנָה\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>2e\u003c/td>\u003ctd class=\"he-cell\">שֵׁנִי\u003c/td>\u003ctd class=\"he-cell\">שְׁנִיָּה\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>3e\u003c/td>\u003ctd class=\"he-cell\">שְׁלִישִׁי\u003c/td>\u003ctd class=\"he-cell\">שְׁלִישִׁית\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>4e\u003c/td>\u003ctd class=\"he-cell\">רְבִיעִי\u003c/td>\u003ctd class=\"he-cell\">רְבִיעִית\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>5e\u003c/td>\u003ctd class=\"he-cell\">חֲמִישִׁי\u003c/td>\u003ctd class=\"he-cell\">חֲמִישִׁית\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>6e\u003c/td>\u003ctd class=\"he-cell\">שִׁשִּׁי\u003c/td>\u003ctd class=\"he-cell\">שִׁשִּׁית\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>7e\u003c/td>\u003ctd class=\"he-cell\">שְׁבִיעִי\u003c/td>\u003ctd class=\"he-cell\">שְׁבִיעִית\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>8e\u003c/td>\u003ctd class=\"he-cell\">שְׁמִינִי\u003c/td>\u003ctd class=\"he-cell\">שְׁמִינִית\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>9e\u003c/td>\u003ctd class=\"he-cell\">תְּשִׁיעִי\u003c/td>\u003ctd class=\"he-cell\">תְּשִׁיעִית\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>10e\u003c/td>\u003ctd class=\"he-cell\">עֲשִׂירִי\u003c/td>\u003ctd class=\"he-cell\">עֲשִׂירִית\u003c/td>\u003c/tr>\n          \u003c/tbody>\u003c/table>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">הַשִּׁעוּר הָרִאשׁוֹן\u003c/span> → la première leçon (m.)\u003cbr>\n            \u003cspan class=\"he-inline\">הַחֻלְצָה הַשְּׁלִישִׁית\u003c/span> → la troisième chemise (f.)\n          \u003c/div>\n        \u003c/div>\n    \u003c/div>\u003cdiv class=\"grammar-section\">\n      \u003cdiv class=\"grammar-header\">\n        \u003cdiv class=\"grammar-title\">Âge : בן / בת \u003cspan class=\"he\" dir=\"rtl\">בן כמה אתה?\u003c/span>\u003c/div>\n        \u003cdiv class=\"grammar-toggle\">+\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grammar-content\">\n          \u003cp>Pour exprimer l'âge, on n'utilise pas le verbe « avoir » mais les noms \u003cspan class=\"he-inline\">בֵּן\u003c/span> (fils, m.) ou \u003cspan class=\"he-inline\">בַּת\u003c/span> (fille, f.).\u003c/p>\n          \u003cp>\u003cstrong>Demander l'âge :\u003c/strong>\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">בֶּן כַּמָּה אַתָּה?\u003c/span> → Quel âge as-tu ? (à un homme)\u003cbr>\n            \u003cspan class=\"he-inline\">בַּת כַּמָּה אַתְּ?\u003c/span> → Quel âge as-tu ? (à une femme)\u003cbr>\n            \u003cspan class=\"he-inline\">בְּנֵי כַּמָּה הֵם?\u003c/span> → Quel âge ont-ils ?\u003cbr>\n            \u003cspan class=\"he-inline\">בְּנוֹת כַּמָּה הֵן?\u003c/span> → Quel âge ont-elles ?\n          \u003c/div>\n          \u003cp>\u003cstrong>Répondre :\u003c/strong>\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֲנִי בֶּן חֲמִישִּׁים וְחָמֵשׁ\u003c/span> → J'ai 55 ans (m.)\u003cbr>\n            \u003cspan class=\"he-inline\">אֲנִי בַּת שְׁלוֹשִׁים וְאַרְבַּע\u003c/span> → J'ai 34 ans (f.)\n          \u003c/div>\n        \u003c/div>\n    \u003c/div>\u003cdiv class=\"grammar-category\">⁘ Négation &amp; condition\u003c/div>\u003cdiv class=\"grammar-section\">\n      \u003cdiv class=\"grammar-header\">\n        \u003cdiv class=\"grammar-title\">Négation : personne / jamais / rien \u003cspan class=\"he\" dir=\"rtl\">אף אחד / אף פעם / כלום\u003c/span>\u003c/div>\n        \u003cdiv class=\"grammar-toggle\">+\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grammar-content\">\n          \u003cp>En hébreu, la négation utilise \u003cstrong>deux mots\u003c/strong> (un peu comme « ne... rien » en français).\u003c/p>\n          \u003ctable>\n            \u003ctbody>\u003ctr>\u003cth>Français\u003c/th>\u003cth>Hébreu\u003c/th>\u003cth>Structure\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>personne ne…\u003c/td>\u003ctd class=\"he-cell\">אף אחד … לא\u003c/td>\u003ctd>אף אחד + לא + verbe (m.sg.)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>ne… jamais\u003c/td>\u003ctd class=\"he-cell\">אף פעם … לא\u003c/td>\u003ctd>אף פעם + לא + verbe\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>ne… rien\u003c/td>\u003ctd class=\"he-cell\">שום דבר / כלום\u003c/td>\u003ctd>לא + verbe + כלום\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>pas encore\u003c/td>\u003ctd class=\"he-cell\">עדיין לא\u003c/td>\u003ctd>עדיין + לא + verbe\u003c/td>\u003c/tr>\n          \u003c/tbody>\u003c/table>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אַף אֶחָד לֹא בָּא\u003c/span> → Personne ne vient.\u003cbr>\n            \u003cspan class=\"he-inline\">אֲנִי לֹא רוֹצָה כְּלוּם\u003c/span> → Je ne veux rien.\u003cbr>\n            \u003cspan class=\"he-inline\">הִיא אַף פַּעַם לֹא הָיְתָה בְּצָרְפַת\u003c/span> → Elle n'est jamais allée en France.\n          \u003c/div>\n        \u003c/div>\n    \u003c/div>\u003cdiv class=\"grammar-section\">\n      \u003cdiv class=\"grammar-header\">\n        \u003cdiv class=\"grammar-title\">Toujours : תמיד \u003cspan class=\"he\" dir=\"rtl\">תמיד\u003c/span>\u003c/div>\n        \u003cdiv class=\"grammar-toggle\">+\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grammar-content\">\n          \u003cp>\u003cspan class=\"he-inline\">תָּמִיד\u003c/span> exprime une habitude, quelque chose de constant. Il se met \u003cstrong>généralement au présent\u003c/strong>.\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">הִיא תָּמִיד מַגִּיעָה מֻקְדָּם\u003c/span> → Elle arrive toujours en avance.\u003cbr>\n            \u003cspan class=\"he-inline\">אַתָּה תָּמִיד שׁוֹכֵחַ אֶת הַמַּפְתְּחוֹת\u003c/span> → Tu oublies toujours tes clés.\n          \u003c/div>\n        \u003c/div>\n    \u003c/div>\u003cdiv class=\"grammar-section\">\n      \u003cdiv class=\"grammar-header\">\n        \u003cdiv class=\"grammar-title\">Condition réelle : אם \u003cspan class=\"he\" dir=\"rtl\">תנאי קיים\u003c/span>\u003c/div>\n        \u003cdiv class=\"grammar-toggle\">+\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grammar-content\">\n          \u003cp>Pour une condition qu'on considère \u003cstrong>possible\u003c/strong>, on utilise \u003cspan class=\"he-inline\">אִם\u003c/span> (= « si »).\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אִם יִהְיֶה גֶּשֶׁם, אֲנִי אֶשָּׁאֵר בַּבַּיִת\u003c/span>\u003cbr>\n            → S'il pleut, je resterai à la maison.\u003cbr>\n            \u003cspan class=\"he-inline\">אִם אַתָּה רוֹצֶה, אַתָּה יָכוֹל לָבוֹא\u003c/span>\u003cbr>\n            → Si tu veux, tu peux venir.\n          \u003c/div>\n        \u003c/div>\n    \u003c/div>\u003cdiv class=\"grammar-section\">\n      \u003cdiv class=\"grammar-header\">\n        \u003cdiv class=\"grammar-title\">Condition irréelle : אילו / לו \u003cspan class=\"he\" dir=\"rtl\">תנאי בטל\u003c/span>\u003c/div>\n        \u003cdiv class=\"grammar-toggle\">+\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grammar-content\">\n          \u003cp>La condition \u003cstrong>irréelle\u003c/strong> sert à parler d'une situation qui ne s'est pas produite ou qui est purement hypothétique.\u003c/p>\n          \u003cp>Mots utilisés : \u003cspan class=\"he-inline\">אִילּוּ\u003c/span> ou \u003cspan class=\"he-inline\">לוּ\u003c/span> (= « si »).\u003c/p>\n          \u003cp>\u003cstrong>En hébreu soutenu\u003c/strong> : \u003cspan class=\"he-inline\">אילו\u003c/span> + verbe au passé, ou un verbe composé (être au passé + participe présent).\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אִילּוּ הָיִיתִי לוֹמֵד לַמִּבְחָן, הָיִיתִי מַצְלִיחַ\u003c/span>\u003cbr>\n            → Si j'avais étudié pour l'examen, j'aurais réussi.\n          \u003c/div>\n          \u003cp>\u003cstrong>En hébreu parlé\u003c/strong>, on utilise plutôt \u003cspan class=\"he-inline\">אם\u003c/span> + verbe composé dans les deux propositions :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אִם הָיִיתִי לוֹמֵד לַמִּבְחָן, הָיִיתִי מַצְלִיחַ\u003c/span>\u003cbr>\n            → Si j'avais étudié pour l'examen, j'aurais réussi. (même sens, registre courant)\n          \u003c/div>\n          \u003cp>\u003cstrong>Quand l'utiliser ?\u003c/strong>\u003c/p>\n          \u003cul>\n            \u003cli>Le passé est révolu et on ne peut plus revenir en arrière : « Si j'avais étudié, j'aurais réussi » (mais je n'ai pas étudié, donc je n'ai pas réussi).\u003c/li>\n            \u003cli>Situation hypothétique non réelle : « Si j'étais un oiseau, je pourrais voler » (mais je ne suis pas un oiseau).\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n    \u003c/div>\u003cdiv class=\"grammar-category\">⁘ Directions &amp; mouvements\u003c/div>\u003cdiv class=\"grammar-section\">\n      \u003cdiv class=\"grammar-header\">\n        \u003cdiv class=\"grammar-title\">Points cardinaux &amp; directions \u003cspan class=\"he\" dir=\"rtl\">כיוונים\u003c/span>\u003c/div>\n        \u003cdiv class=\"grammar-toggle\">+\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grammar-content\">\n          \u003cp>L'hébreu a plusieurs formes selon le sens utilisé. Le suffixe \u003cspan class=\"he-inline\">ה‑\u003c/span> ajouté à un nom indique le mouvement vers (équivalent de « vers le… »).\u003c/p>\n          \u003ctable>\n            \u003ctbody>\u003ctr>\u003cth>Point\u003c/th>\u003cth>Nord\u003c/th>\u003cth>Sud\u003c/th>\u003cth>Est\u003c/th>\u003cth>Ouest\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>« le »\u003c/td>\u003ctd class=\"he-cell\">צפון\u003c/td>\u003ctd class=\"he-cell\">דרום\u003c/td>\u003ctd class=\"he-cell\">מזרח\u003c/td>\u003ctd class=\"he-cell\">מערב\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>« vers »\u003c/td>\u003ctd class=\"he-cell\">צפונה\u003c/td>\u003ctd class=\"he-cell\">דרומה\u003c/td>\u003ctd class=\"he-cell\">מזרחה\u003c/td>\u003ctd class=\"he-cell\">מערבה\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>« à / au »\u003c/td>\u003ctd class=\"he-cell\">לצפון\u003c/td>\u003ctd class=\"he-cell\">לדרום\u003c/td>\u003ctd class=\"he-cell\">למזרח\u003c/td>\u003ctd class=\"he-cell\">למערב\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>« dans »\u003c/td>\u003ctd class=\"he-cell\">בצפון\u003c/td>\u003ctd class=\"he-cell\">בדרום\u003c/td>\u003ctd class=\"he-cell\">במזרח\u003c/td>\u003ctd class=\"he-cell\">במערב\u003c/td>\u003c/tr>\n          \u003c/tbody>\u003c/table>\n          \u003cp>Le suffixe \u003cspan class=\"he-inline\">ה‑\u003c/span> de direction s'applique aussi à d'autres mots :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">יָמִינָה\u003c/span> → à droite, \u003cspan class=\"he-inline\">שְׂמֹאלָה\u003c/span> → à gauche\u003cbr>\n            \u003cspan class=\"he-inline\">לְמַעְלָה / לְמַטָּה\u003c/span> → en haut / en bas\u003cbr>\n            \u003cspan class=\"he-inline\">הַבַּיְתָה\u003c/span> → à la maison (vers la maison)\n          \u003c/div>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֲנִי בַּדָּרוֹם, אֲבָל אֲנִי נוֹסֵעַ צָפוֹנָה\u003c/span>\u003cbr>\n            → Je suis dans le sud, mais je voyage vers le nord.\n          \u003c/div>\n        \u003c/div>\n    \u003c/div>\u003cdiv class=\"grammar-section\">\n      \u003cdiv class=\"grammar-header\">\n        \u003cdiv class=\"grammar-title\">Mots interrogatifs de lieu \u003cspan class=\"he\" dir=\"rtl\">איפה / לאן / מאיפה\u003c/span>\u003c/div>\n        \u003cdiv class=\"grammar-toggle\">+\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grammar-content\">\n          \u003cp>Trois mots interrogatifs distincts selon le mouvement :\u003c/p>\n          \u003ctable>\n            \u003ctbody>\u003ctr>\u003cth>Mot\u003c/th>\u003cth>Sens\u003c/th>\u003cth>Préposition\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">אֵיפֹה?\u003c/td>\u003ctd>Où ? (statique)\u003c/td>\u003ctd class=\"he-cell\">בְּ‑\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לְאָן?\u003c/td>\u003ctd>Vers où ? (mouvement)\u003c/td>\u003ctd class=\"he-cell\">לְ‑\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">מֵאַיִן? / מֵאֵיפֹה?\u003c/td>\u003ctd>D'où ? (origine)\u003c/td>\u003ctd class=\"he-cell\">מִ‑\u003c/td>\u003c/tr>\n          \u003c/tbody>\u003c/table>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֵיפֹה אַתָּה גָּר?\u003c/span> → Où habites-tu ?\u003cbr>\n            \u003cspan class=\"he-inline\">לְאָן אַתְּ נוֹסַעַת?\u003c/span> → Où vas-tu ?\u003cbr>\n            \u003cspan class=\"he-inline\">מֵאַיִן אַתָּה?\u003c/span> → D'où viens-tu ?\n          \u003c/div>\n        \u003c/div>\n    \u003c/div>\u003cdiv class=\"grammar-category\">⁘ Liaisons &amp; connecteurs\u003c/div>\u003cdiv class=\"grammar-section\">\n      \u003cdiv class=\"grammar-header\">\n        \u003cdiv class=\"grammar-title\">Connecteurs de temps : avant / après / pendant \u003cspan class=\"he\" dir=\"rtl\">אחרי / לפני / בזמן\u003c/span>\u003c/div>\n        \u003cdiv class=\"grammar-toggle\">+\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grammar-content\">\n          \u003cp>Les connecteurs \u003cspan class=\"he-inline\">אַחֲרֵי\u003c/span>, \u003cspan class=\"he-inline\">לִפְנֵי\u003c/span>, \u003cspan class=\"he-inline\">בִּזְמַן\u003c/span> ont \u003cstrong>deux constructions\u003c/strong> selon ce qui les suit :\u003c/p>\n          \u003ctable>\n            \u003ctbody>\u003ctr>\u003cth>Sens\u003c/th>\u003cth>+ nom\u003c/th>\u003cth>+ ש + phrase\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>après\u003c/td>\u003ctd class=\"he-cell\">אחרי\u003c/td>\u003ctd class=\"he-cell\">אחרי ש\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>avant\u003c/td>\u003ctd class=\"he-cell\">לפני\u003c/td>\u003ctd class=\"he-cell\">לפני ש\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>pendant\u003c/td>\u003ctd class=\"he-cell\">בזמן\u003c/td>\u003ctd class=\"he-cell\">בזמן ש\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>au moment où\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"he-cell\">ברגע ש\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>quand / lorsque\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"he-cell\">כש / כאשר\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>durant (durée)\u003c/td>\u003ctd class=\"he-cell\">במשך\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n          \u003c/tbody>\u003c/table>\n          \u003cp>\u003cstrong>+ nom\u003c/strong> (sans ש) :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אַחֲרֵי הָעֲבוֹדָה\u003c/span> → après le travail\u003cbr>\n            \u003cspan class=\"he-inline\">לִפְנֵי הַשִּׁעוּר\u003c/span> → avant le cours\u003cbr>\n            \u003cspan class=\"he-inline\">בִּזְמַן הָאֲרוּחָה\u003c/span> → pendant le repas\u003cbr>\n            \u003cspan class=\"he-inline\">בְּמֶשֶׁךְ הַיּוֹם\u003c/span> → tout au long de la journée\n          \u003c/div>\n          \u003cp>\u003cstrong>+ ש + phrase complète\u003c/strong> (avec verbe conjugué) :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אַחֲרֵי שֶׁגָּמַרְתִּי לַעֲבוֹד, הָלַכְתִּי הַבַּיְתָה\u003c/span>\u003cbr>\n            → Après que j'ai fini de travailler, je suis rentré à la maison.\u003cbr>\n            \u003cspan class=\"he-inline\">לִפְנֵי שֶׁהִתְחִיל הַשִּׁעוּר, שָׁתִיתִי קָפֶה\u003c/span>\u003cbr>\n            → Avant que le cours commence, j'ai bu un café.\u003cbr>\n            \u003cspan class=\"he-inline\">בָּרֶגַע שֶׁמִּישֶׁהוּ מַעֲצְבֵּן אוֹתִי, אֲנִי יוֹצֵא\u003c/span>\u003cbr>\n            → Dès que quelqu'un m'agace, je sors.\u003cbr>\n            \u003cspan class=\"he-inline\">כְּשֶׁחַם בַּחוּץ, אֲנִי שׁוֹתֶה הַרְבֵּה מַיִם\u003c/span>\u003cbr>\n            → Quand il fait chaud dehors, je bois beaucoup d'eau.\n          \u003c/div>\n        \u003c/div>\n    \u003c/div>\u003cdiv class=\"grammar-section\">\n      \u003cdiv class=\"grammar-header\">\n        \u003cdiv class=\"grammar-title\">Enchaîner : d'abord / ensuite \u003cspan class=\"he\" dir=\"rtl\">קודם / אחר כך\u003c/span>\u003c/div>\n        \u003cdiv class=\"grammar-toggle\">+\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grammar-content\">\n          \u003cp>Pour relier \u003cstrong>deux phrases dans l'ordre chronologique\u003c/strong>, on peut utiliser plusieurs connecteurs.\u003c/p>\n          \u003ctable>\n            \u003ctbody>\u003ctr>\u003cth>Mot\u003c/th>\u003cth>Sens\u003c/th>\u003cth>Place\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">קוֹדֶם...\u003c/td>\u003ctd>d'abord, en premier\u003c/td>\u003ctd>début de la 1ère phrase\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">אַחַר כָּךְ...\u003c/td>\u003ctd>ensuite, après cela\u003c/td>\u003ctd>début de la 2e phrase\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">לִפְנֵי כֵן\u003c/td>\u003ctd>auparavant, avant cela\u003c/td>\u003ctd>2e phrase (référence en arrière)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"he-cell\">וְאָז\u003c/td>\u003ctd>et alors, et ensuite\u003c/td>\u003ctd>liaison directe\u003c/td>\u003c/tr>\n          \u003c/tbody>\u003c/table>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">קוֹדֶם שָׁתִיתִי קָפֶה, אַחַר כָּךְ אָכַלְתִּי חוּמוּס\u003c/span>\u003cbr>\n            → D'abord j'ai bu un café, ensuite j'ai mangé du houmous.\u003cbr>\n            \u003cspan class=\"he-inline\">אָכַלְתִּי חוּמוּס. לִפְנֵי כֵן, שָׁתִיתִי קָפֶה\u003c/span>\u003cbr>\n            → J'ai mangé du houmous. Avant cela, j'ai bu un café.\u003cbr>\n            \u003cspan class=\"he-inline\">שָׁתִיתִי קָפֶה וְאָז אָכַלְתִּי חוּמוּס\u003c/span>\u003cbr>\n            → J'ai bu un café et ensuite j'ai mangé du houmous.\n          \u003c/div>\n        \u003c/div>\n    \u003c/div>\u003cdiv class=\"grammar-section\">\n      \u003cdiv class=\"grammar-header\">\n        \u003cdiv class=\"grammar-title\">אבל vs אלא — « mais » \u003cspan class=\"he\" dir=\"rtl\">אבל / אלא\u003c/span>\u003c/div>\n        \u003cdiv class=\"grammar-toggle\">+\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grammar-content\">\n          \u003cp>Le français « mais » se traduit par \u003cstrong>deux mots différents\u003c/strong> en hébreu selon le contexte.\u003c/p>\n          \u003ctable>\n            \u003ctbody>\u003ctr>\u003cth>Contexte\u003c/th>\u003cth>Mot\u003c/th>\u003cth>Exemple\u003c/th>\u003c/tr>\n            \u003ctr>\u003ctd>Phrase affirmative avant\u003c/td>\u003ctd class=\"he-cell\">אֲבָל\u003c/td>\u003ctd>café mais sans lait\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Négation avant (לא / אין / אי אפשר)\u003c/td>\u003ctd class=\"he-cell\">אֶלָּא\u003c/td>\u003ctd>pas X mais Y\u003c/td>\u003c/tr>\n          \u003c/tbody>\u003c/table>\n          \u003cp>\u003cstrong>אֲבָל\u003c/strong> — pour opposer ou nuancer une affirmation :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֲנִי שׁוֹתָה קָפֶה אֲבָל בְּלִי חָלָב\u003c/span>\u003cbr>\n            → Je bois du café mais sans lait.\n          \u003c/div>\n          \u003cp>\u003cstrong>אֶלָּא\u003c/strong> — uniquement après une négation, pour \u003cstrong>remplacer\u003c/strong> ce qui a été nié par autre chose :\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">אֲנִי לֹא שׁוֹתָה קָפֶה אֶלָּא תֵּה\u003c/span>\u003cbr>\n            → Je ne bois pas de café mais du thé.\u003cbr>\n            \u003cspan class=\"he-inline\">הוּא לֹא גָּר בִּירוּשָׁלַיִם, אֶלָּא בְּחֵיפָה\u003c/span>\u003cbr>\n            → Il n'habite pas à Jérusalem, mais à Haïfa.\u003cbr>\n            \u003cspan class=\"he-inline\">אֵין לִי חֲבֵרוֹת אֶלָּא חֲבֵרִים\u003c/span>\u003cbr>\n            → Je n'ai pas d'amies mais des amis.\u003cbr>\n            \u003cspan class=\"he-inline\">אִי אֶפְשָׁר לְדַבֵּר בְּקוֹל אֶלָּא בְּשֶׁקֶט\u003c/span>\u003cbr>\n            → On ne peut pas parler fort, seulement en silence.\n          \u003c/div>\n          \u003cp>\u003cstrong>Astuce\u003c/strong> : \u003cspan class=\"he-inline\">אֶלָּא\u003c/span> = « (pas X) mais plutôt Y ». Si tu peux dire « mais plutôt » en français, c'est \u003cspan class=\"he-inline\">אֶלָּא\u003c/span> en hébreu.\u003c/p>\n        \u003c/div>\n    \u003c/div>\u003cdiv class=\"grammar-section\">\n      \u003cdiv class=\"grammar-header\">\n        \u003cdiv class=\"grammar-title\">לא רק... אלא גם... \u003cspan class=\"he\" dir=\"rtl\">לא רק... אלא גם...\u003c/span>\u003c/div>\n        \u003cdiv class=\"grammar-toggle\">+\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grammar-content\">\n          \u003cp>La structure \u003cstrong>« non seulement… mais aussi… »\u003c/strong> se construit en hébreu avec \u003cspan class=\"he-inline\">לֹא רַק... אֶלָּא גַּם...\u003c/span>\u003c/p>\n          \u003cp>On l'utilise pour \u003cstrong>ajouter\u003c/strong> un deuxième élément à un premier, en insistant sur les deux.\u003c/p>\n          \u003cp>Structure : \u003cspan class=\"he-inline\">לֹא רַק\u003c/span> + élément 1, \u003cspan class=\"he-inline\">אֶלָּא גַּם\u003c/span> + élément 2\u003c/p>\n          \u003cdiv class=\"example\">\n            \u003cspan class=\"he-inline\">בַּנֶּגֶב חַיִּים לֹא רַק יְהוּדִים, אֶלָּא גַּם בֶּדּוּוִים\u003c/span>\u003cbr>\n            → Dans le Néguev vivent non seulement des juifs, mais aussi des bédouins.\u003cbr>\u003cbr>\n            \u003cspan class=\"he-inline\">הַזּוּג הַצָּעִיר הֶחְלִיט לֹא רַק לִבְנוֹת בַּיִת בַּגָּלִיל, אֶלָּא גַּם לִפְתּוֹחַ שָׁם בֵּית מָלוֹן\u003c/span>\u003cbr>\n            → Le jeune couple a décidé non seulement de construire une maison en Galilée, mais aussi d'y ouvrir un hôtel.\u003cbr>\u003cbr>\n            \u003cspan class=\"he-inline\">אֶת הַנּוֹף הַמְּיוּחָד שֶׁל הַמִּדְבָּר רוֹאִים לֹא רַק מֵהַטַּיֶּלֶת, אֶלָּא גַּם מֵחַלּוֹנוֹת הַבָּתִּים\u003c/span>\u003cbr>\n            → On voit le paysage unique du désert non seulement depuis la promenade, mais aussi depuis les fenêtres des maisons.\n          \u003c/div>\n          \u003cp>\u003cstrong>À noter\u003c/strong> : c'est un cas particulier de l'usage de \u003cspan class=\"he-inline\">אֶלָּא\u003c/span>, où la 1ère partie est implicitement négative (\u003cspan class=\"he-inline\">לֹא רַק\u003c/span> = pas seulement).\u003c/p>\n        \u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\n  \u003c!-- ================ STATS PANEL ================ -->\n  \u003c!-- ================ COURS PANEL ================ -->\n  \u003cdiv class=\"panel\" id=\"panel-cours\">\n    \u003cdiv class=\"cours-dash\" id=\"cours-dash\">\n      \u003cdiv class=\"cd-grid\">\n        \u003cdiv class=\"cd-box\">\u003cb id=\"cd-seen\">0\u003c/b>\u003cspan>mots vus\u003c/span>\u003c/div>\n        \u003cdiv class=\"cd-box green\">\u003cb id=\"cd-mastered\">0\u003c/b>\u003cspan>ma&icirc;tris&eacute;s\u003c/span>\u003c/div>\n        \u003cdiv class=\"cd-box red\">\u003cb id=\"cd-review\">0\u003c/b>\u003cspan>&agrave; revoir (quiz + cartes)\u003c/span>\u003c/div>\n        \u003cdiv class=\"cd-box gold\">\u003cb id=\"cd-rate\">&mdash;\u003c/b>\u003cspan>r&eacute;ussite quiz\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"cd-flash\" id=\"cd-flash\">&mdash;\u003c/div>\n      \u003cdiv class=\"cd-actions\">\n        \u003cbutton class=\"btn primary\" id=\"cd-review-flash\">R&eacute;viser les mots rat&eacute;s en flashcards\u003c/button>\n        \u003cbutton class=\"btn\" id=\"cd-review-list\">Voir la liste des mots rat&eacute;s\u003c/button>\n        \u003cbutton class=\"btn\" id=\"cd-conj\">Flashcards de conjugaison\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"cours-views\" id=\"cours-views\">\n      \u003cbutton type=\"button\" class=\"view-btn on\" data-view=\"theme\">Par th&egrave;me\u003c/button>\n      \u003cbutton type=\"button\" class=\"view-btn\" data-view=\"nature\">Par nature\u003c/button>\n      \u003cbutton type=\"button\" class=\"view-btn\" data-view=\"revoir\">&Agrave; revoir\u003c/button>\n      \u003cbutton type=\"button\" class=\"view-btn\" data-view=\"soft\">Non essentiels\u003c/button>\n    \u003c/div>\n    \u003cinput class=\"cours-search\" id=\"cours-search\" autocomplete=\"off\"\n           placeholder=\"Rechercher un mot en français ou en hébreu…\">\n    \u003cdiv class=\"cours-bar\">\n      \u003cspan id=\"cours-count\">\u003c/span>\n      \u003cspan>\u003ca id=\"cours-open\">Tout déplier\u003c/a> &nbsp;&middot;&nbsp; \u003ca id=\"cours-close\">Tout replier\u003c/a>\u003c/span>\n    \u003c/div>\n    \u003cdiv id=\"cours-list\">\u003c/div>\n  \u003c/div>\n\n  \u003c!-- ================ COURS PASSE / FUTUR ================ -->\n  \u003cdiv class=\"panel\" id=\"panel-tenses\">\n\u003c!--HP_TENSES-->\n  \u003c/div>\n\n  \u003cdiv class=\"panel\" id=\"panel-stats\">\n    \u003cdiv class=\"stats-card\">\n      \u003ch3>Vue d'ensemble\u003c/h3>\n      \u003cdiv class=\"stats-numbers\">\n        \u003cdiv class=\"stat-box\">\u003cspan class=\"num\" id=\"st-seen\">1\u003c/span>\u003cspan class=\"lbl\">mots vus\u003c/span>\u003c/div>\n        \u003cdiv class=\"stat-box green\">\u003cspan class=\"num\" id=\"st-mastered\">0\u003c/span>\u003cspan class=\"lbl\">maîtrisés\u003c/span>\u003c/div>\n        \u003cdiv class=\"stat-box red\">\u003cspan class=\"num\" id=\"st-difficult\">0\u003c/span>\u003cspan class=\"lbl\">à revoir\u003c/span>\u003c/div>\n        \u003cdiv class=\"stat-box gold\">\u003cspan class=\"num\" id=\"st-rate\">100%\u003c/span>\u003cspan class=\"lbl\">% réussite\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"font-size: 12px; color: var(--muted); font-style: italic;\">\n        Un mot est \"maîtrisé\" après 3 bonnes réponses sans aucune erreur, ou avec un taux ≥ 80% sur au moins 4 tentatives.\n        Il est \"à revoir\" si tu as eu plus d'erreurs que de réussites.\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"stats-card\">\n      \u003ch3>Top 15 des mots à revoir\u003c/h3>\n      \u003cul class=\"difficult-list\" id=\"difficult-list\">\u003cli style=\"color: var(--muted); justify-content: center; font-style: italic;\">Aucun mot à revoir pour l'instant — démarre un quiz !\u003c/li>\u003c/ul>\n    \u003c/div>\n\n    \u003cdiv class=\"stats-card\" id=\"excluded-card\" style=\"display:none;\">\n      \u003ch3>Mots mis de côté\u003c/h3>\n      \u003cp class=\"missed-intro\" id=\"excluded-intro\">—\u003c/p>\n      \u003cdiv class=\"missed-actions\">\n        \u003cbutton class=\"btn\" id=\"excluded-toggle\">Voir la liste\u003c/button>\n      \u003c/div>\n      \u003cul class=\"difficult-list\" id=\"excluded-list\" style=\"display:none;\">\u003c/ul>\n    \u003c/div>\n\n    \u003cdiv class=\"stats-card\">\n      \u003ch3>Mes mots ratés\u003c/h3>\n      \u003cp class=\"missed-intro\" id=\"missed-intro\">—\u003c/p>\n      \u003cdiv class=\"missed-actions\">\n        \u003cbutton class=\"btn\" id=\"missed-toggle\">Voir la liste\u003c/button>\n        \u003cbutton class=\"btn primary\" id=\"missed-quiz\">Quiz sur ces mots\u003c/button>\n        \u003cbutton class=\"btn\" id=\"missed-flash\">Flashcards sur ces mots\u003c/button>\n      \u003c/div>\n      \u003cul class=\"difficult-list\" id=\"missed-list\" style=\"display:none;\">\u003c/ul>\n    \u003c/div>\n\n    \u003cdiv class=\"stats-card\">\n      \u003ch3>Flashcards\u003c/h3>\n      \u003cdiv class=\"stats-numbers\">\n        \u003cdiv class=\"stat-box\">\u003cspan class=\"num\" id=\"fs-seen\">0\u003c/span>\u003cspan class=\"lbl\">cartes vues\u003c/span>\u003c/div>\n        \u003cdiv class=\"stat-box green\">\u003cspan class=\"num\" id=\"fs-known\">0\u003c/span>\u003cspan class=\"lbl\">sues\u003c/span>\u003c/div>\n        \u003cdiv class=\"stat-box red\">\u003cspan class=\"num\" id=\"fs-again\">0\u003c/span>\u003cspan class=\"lbl\">à revoir\u003c/span>\u003c/div>\n        \u003cdiv class=\"stat-box\">\u003cspan class=\"num\" id=\"fs-soft\">0\u003c/span>\u003cspan class=\"lbl\">non essentiels\u003c/span>\u003c/div>\n        \u003cdiv class=\"stat-box gold\">\u003cspan class=\"num\" id=\"fs-rate\">—\u003c/span>\u003cspan class=\"lbl\">% de réussite\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"font-size: 12px; color: var(--muted); font-style: italic; margin-bottom: 14px;\">\n        Compteur propre aux flashcards : il n'entre pas dans les statistiques du quiz à choix multiples ci-dessus.\n      \u003c/div>\n      \u003cp class=\"missed-intro\" id=\"flash-intro\">—\u003c/p>\n      \u003cdiv class=\"missed-actions\">\n        \u003cbutton class=\"btn\" id=\"flash-toggle\">Voir la liste\u003c/button>\n        \u003cbutton class=\"btn primary\" id=\"flash-redo\">Flashcards sur ces mots\u003c/button>\n      \u003c/div>\n      \u003cul class=\"difficult-list\" id=\"flash-list\" style=\"display:none;\">\u003c/ul>\n      \u003cp class=\"missed-intro\" id=\"soft-intro\" style=\"margin-top:18px\">—\u003c/p>\n      \u003cdiv class=\"missed-actions\">\n        \u003cbutton class=\"btn\" id=\"soft-toggle\">Voir les non essentiels\u003c/button>\n        \u003cbutton class=\"btn\" id=\"soft-redo\">Flashcards sur ces mots\u003c/button>\n      \u003c/div>\n      \u003cul class=\"difficult-list\" id=\"soft-list\" style=\"display:none;\">\u003c/ul>\n      \u003cdiv class=\"missed-actions\" style=\"margin-top:14px\">\n        \u003cbutton class=\"btn\" id=\"reset-flash\">Effacer mes stats de flashcards\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"stats-card\">\n      \u003ch3>Conjugaison\u003c/h3>\n      \u003cdiv class=\"stats-numbers\">\n        \u003cdiv class=\"stat-box\">\u003cspan class=\"num\" id=\"cj-seen\">0\u003c/span>\u003cspan class=\"lbl\">cartes vues\u003c/span>\u003c/div>\n        \u003cdiv class=\"stat-box green\">\u003cspan class=\"num\" id=\"cj-known\">0\u003c/span>\u003cspan class=\"lbl\">réussies\u003c/span>\u003c/div>\n        \u003cdiv class=\"stat-box red\">\u003cspan class=\"num\" id=\"cj-again\">0\u003c/span>\u003cspan class=\"lbl\">à revoir\u003c/span>\u003c/div>\n        \u003cdiv class=\"stat-box\">\u003cspan class=\"num\" id=\"cj-soft\">0\u003c/span>\u003cspan class=\"lbl\">non essentiels\u003c/span>\u003c/div>\n        \u003cdiv class=\"stat-box gold\">\u003cspan class=\"num\" id=\"cj-rate\">—\u003c/span>\u003cspan class=\"lbl\">% de réussite\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cp class=\"missed-intro\" id=\"cj-intro\">—\u003c/p>\n      \u003cdiv class=\"missed-actions\">\n        \u003cbutton class=\"btn primary\" id=\"cj-start\">Lancer une série de conjugaison\u003c/button>\n        \u003cbutton class=\"btn\" id=\"cj-redo\">Réviser les verbes ratés\u003c/button>\n      \u003c/div>\n      \u003cul class=\"difficult-list\" id=\"cj-list\">\u003c/ul>\n    \u003c/div>\n\n    \u003cdiv class=\"stats-card\">\n      \u003ch3>Données\u003c/h3>\n      \u003cp style=\"font-size: 13px; color: var(--ink-soft); margin-bottom: 14px;\">\n        Tes stats sont enregistrées dans ton espace : ta professeure voit ta progression (XP, régularité, mots à revoir) pour adapter ses cours.\n      \u003c/p>\n      \u003cbutton class=\"danger-btn\" id=\"reset-stats\">Effacer toutes mes statistiques\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"flash-ov\" id=\"flash-ov\" role=\"dialog\" aria-modal=\"true\">\n    \u003cdiv class=\"flash-box\">\n      \u003cdiv class=\"flash-top\">\n        \u003cspan class=\"flash-title\" id=\"flash-title\">—\u003c/span>\n        \u003cbutton class=\"flash-close\" id=\"flash-close\" title=\"Fermer (Échap)\">&times;\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"flash-sub\">\n        \u003cspan id=\"flash-progress\">—\u003c/span>\n        \u003cspan class=\"flash-dirs\" id=\"flash-dirs\">\n          \u003cbutton type=\"button\" class=\"flash-dir on\" data-dir=\"fr\">FR &rarr; עב\u003c/button>\n          \u003cbutton type=\"button\" class=\"flash-dir\" data-dir=\"he\">עב &rarr; FR\u003c/button>\n          \u003cbutton type=\"button\" class=\"flash-dir\" data-dir=\"mix\">Al&eacute;atoire\u003c/button>\n        \u003c/span>\n      \u003c/div>\n      \u003cdiv id=\"flash-body\">\u003c/div>\n      \u003cdiv class=\"flash-bar\">\u003ci id=\"flash-bar-i\" style=\"width:0\">\u003c/i>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cfooter>\n    \u003cspan class=\"ornament-small\">⁘\u003c/span> Étudie un peu chaque jour \u003cspan class=\"ornament-small\">⁘\u003c/span> לאט לאט \u003cspan class=\"ornament-small\">⁘\u003c/span>\n  \u003c/footer>\n\u003c/div>\n\n\u003cscript>\n/* ============================================\n   VOCABULAIRE — organisé par thèmes\n   ============================================ */\n/* Données propres à l'élève — injectées par l'espace de Mayane, uniquement depuis ses PDF */\nconst __D = window.__HP_DATA__ || {};\nconst VOCAB = __D.VOCAB || {};\nconst NATURE = __D.NATURE || {};\nconst CONJ = __D.CONJ || [];\nconst CORE_THEMES = __D.CORE_THEMES || Object.keys(VOCAB);\nconst ADVANCED_THEMES = __D.ADVANCED_THEMES || [];\nconst VERB_PRESENT = __D.VERB_PRESENT || {};\nconst GRAMMAR_CATEGORIES = __D.GRAMMAR_CATEGORIES || [];\n\n/* ============================================\n   STATE & STORAGE\n   ============================================ */\nconst STORAGE_KEY = window.__HP_KEY__ || 'hebrew_quiz_v2';\n\nfunction loadData() {\n  try {\n    const raw = (typeof window.__HP_RAW__ === 'string') ? window.__HP_RAW__ : localStorage.getItem(STORAGE_KEY);\n    if (!raw) return defaultData();\n    const parsed = JSON.parse(raw);\n    return { ...defaultData(), ...parsed };\n  } catch (e) {\n    return defaultData();\n  }\n}\n\nfunction defaultData() {\n  return {\n    wordStats: {},   // \"he|fr\" → {seen, correct, wrong}\n    excluded: [],    // \"he|fr\" des mots mis de cote\n    preferences: {\n      mode: 'normal',\n      direction: 'fr-he',\n      selectedThemes: Object.keys(VOCAB)\n    }\n  };\n}\n\nfunction saveData() {\n  try {\n    localStorage.setItem(STORAGE_KEY, JSON.stringify(storage));\n  } catch (e) {\n    console.warn('Save failed', e);\n  }\n}\n\nlet storage = loadData();\n\n/* Themes renommes (numeros de cours retires) : on reporte les choix enregistres. */\n(function () {\n  var REN = {\"Connecteurs temporels (cours 46)\": \"Connecteurs temporels\", \"Désert & Néguev (cours 46-47)\": \"Désert & Néguev\", \"Sécurité & danger (cours 48)\": \"Sécurité & danger\", \"Divers (cours 51)\": \"Divers\", \"Argent (unité 7 · cours 2)\": \"Argent\", \"Verbes (cours 40-42)\": \"Verbes (suite)\", \"Verbes (cours 43)\": \"Verbes (suite)\", \"Verbes (cours 44-47)\": \"Verbes (suite)\", \"Verbes (cours 48-49)\": \"Verbes (suite)\"};\n  var pr = storage.preferences || (storage.preferences = {});\n  ['selectedThemes', 'knownThemes'].forEach(function (key) {\n    if (!Array.isArray(pr[key])) return;\n    var out = [];\n    pr[key].forEach(function (t) {\n      var n = REN[t] || t;\n      if (out.indexOf(n) === -1) out.push(n);\n    });\n    pr[key] = out;\n  });\n})();\n\nconst state = {\n  mode: storage.preferences.mode || 'normal',\n  direction: storage.preferences.direction || 'fr-he',\n  selectedThemes: new Set(storage.preferences.selectedThemes || Object.keys(VOCAB)),\n  seriesLength: (storage.preferences.seriesLength !== undefined ? storage.preferences.seriesLength : 20),\n  pool: [],\n  missed: [],\n  current: null,\n  revealed: false,\n  correct: 0,\n  wrong: 0,\n  total: 0,\n  questionNum: 0,\n  recentlySeen: [] // pour éviter de répéter le même mot\n};\n\n/* Themes ajoutes apres coup : coches par defaut dans le quiz,\n   sans toucher aux themes que l'utilisateur a decoches lui-meme. */\n(function () {\n  var all = Object.keys(VOCAB);\n  var known = storage.preferences.knownThemes;\n  if (!Array.isArray(known)) {\n    known = all.filter(function (t) {\n      return t !== 'Argent' && t !== \"Nombres (jusqu'au million)\";\n    });\n  }\n  var added = false;\n  all.forEach(function (t) {\n    if (known.indexOf(t) === -1) { state.selectedThemes.add(t); added = true; }\n  });\n  storage.preferences.knownThemes = all;\n  if (added && storage.preferences.selectedThemes) {\n    storage.preferences.selectedThemes = Array.from(state.selectedThemes);\n  }\n  saveData();\n})();\n\nfunction wordKey(item) { return item.he + '|' + item.fr; }\n\n/* --- mots mis de cote : exclus des series ET des listes de rates ---\n   On conserve leurs statistiques : la mise de cote est reversible. */\nif (!Array.isArray(storage.excluded)) storage.excluded = [];\nfunction isExcludedKey(k) { return storage.excluded.indexOf(k) !== -1; }\nfunction isExcluded(item) { return isExcludedKey(wordKey(item)); }\nfunction excludeWord(item) {\n  const k = wordKey(item);\n  if (!isExcludedKey(k)) storage.excluded.push(k);\n  saveData();\n}\nfunction unexcludeWord(k) {\n  const i = storage.excluded.indexOf(k);\n  if (i !== -1) storage.excluded.splice(i, 1);\n  saveData();\n}\nfunction getWordStat(item) {\n  return storage.wordStats[wordKey(item)] || { seen: 0, correct: 0, wrong: 0 };\n}\nfunction updateWordStat(item, result) {\n  const k = wordKey(item);\n  const cur = storage.wordStats[k] || { seen: 0, correct: 0, wrong: 0 };\n  cur.seen++;\n  if (result === 'correct') cur.correct++;\n  else if (result === 'wrong') cur.wrong++;\n  storage.wordStats[k] = cur;\n  saveData();\n}\n\nfunction isMastered(stat) {\n  if (!stat) return false;\n  if (stat.seen >= 3 && stat.wrong === 0 && stat.correct >= 3) return true;\n  if (stat.seen >= 4 && stat.correct / stat.seen >= 0.8) return true;\n  return false;\n}\n/* \"rate\" = jamais reussi a l'usage courant : au moins une erreur.\n   Plus large que isDifficult, qui exige plus d'erreurs que de reussites. */\nfunction isMissed(stat) { return !!stat && stat.wrong > 0; }\nfunction isDifficult(stat) {\n  if (!stat || stat.seen === 0) return false;\n  return stat.wrong > stat.correct;\n}\n\nfunction computeGlobalStats() {\n  let seen = 0, mastered = 0, difficult = 0;\n  let totalCorrect = 0, totalAttempts = 0;\n  for (const k in storage.wordStats) {\n    if (isExcludedKey(k)) continue;\n    const s = storage.wordStats[k];\n    seen++;\n    if (isMastered(s)) mastered++;\n    if (isDifficult(s)) difficult++;\n    totalCorrect += s.correct;\n    totalAttempts += s.correct + s.wrong;\n  }\n  const rate = totalAttempts > 0 ? Math.round(100 * totalCorrect / totalAttempts) : null;\n  return { seen, mastered, difficult, rate };\n}\n\nfunction refreshGlobalStatsDisplay() {\n  const s = computeGlobalStats();\n  document.getElementById('gs-seen').textContent = s.seen;\n  document.getElementById('gs-mastered').textContent = s.mastered;\n  document.getElementById('gs-difficult').textContent = s.difficult;\n\n  document.getElementById('st-seen').textContent = s.seen;\n  document.getElementById('st-mastered').textContent = s.mastered;\n  document.getElementById('st-difficult').textContent = s.difficult;\n  document.getElementById('st-rate').textContent = s.rate !== null ? s.rate + '%' : '—';\n\n  // Top 15 difficult words\n  const allWords = [];\n  for (const theme in VOCAB) {\n    VOCAB[theme].forEach(([he, fr]) => {\n      const stat = storage.wordStats[he + '|' + fr];\n      if (stat && stat.wrong > 0 && !isExcludedKey(he + '|' + fr)) {\n        allWords.push({ he, fr, theme, stat });\n      }\n    });\n  }\n  allWords.sort((a, b) => {\n    // sort by wrong/seen ratio first, then by absolute wrong count\n    const aRatio = a.stat.wrong / (a.stat.seen || 1);\n    const bRatio = b.stat.wrong / (b.stat.seen || 1);\n    if (Math.abs(aRatio - bRatio) > 0.05) return bRatio - aRatio;\n    return b.stat.wrong - a.stat.wrong;\n  });\n  if (typeof refreshMissedCard === 'function') refreshMissedCard();\n  if (typeof refreshExcludedCard === 'function') refreshExcludedCard();\n\n  const top = allWords.slice(0, 15);\n  const list = document.getElementById('difficult-list');\n  if (top.length === 0) {\n    list.innerHTML = '\u003cli style=\"color: var(--muted); justify-content: center; font-style: italic;\">Aucun mot à revoir pour l\\'instant — démarre un quiz !\u003c/li>';\n  } else {\n    list.innerHTML = top.map(w => `\n      \u003cli>\n        \u003cspan class=\"word-he\">${w.he}\u003c/span>\n        \u003cspan class=\"word-fr\">${w.fr}\u003c/span>\n        \u003cspan class=\"word-stat\">${w.stat.wrong} faux / ${w.stat.seen} vus\u003c/span>\n      \u003c/li>\n    `).join('');\n  }\n}\n\n/* ============================================\n   UI: Tabs\n   ============================================ */\ndocument.querySelectorAll('.tab').forEach(t => {\n  t.addEventListener('click', () => {\n    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));\n    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));\n    t.classList.add('active');\n    document.getElementById('panel-' + t.dataset.tab).classList.add('active');\n    if (t.dataset.tab === 'stats') refreshGlobalStatsDisplay();\n  });\n});\n\n/* Mode (normal / review) */\ndocument.querySelectorAll('.mode-btn[data-mode]').forEach(b => {\n  b.addEventListener('click', () => {\n    document.querySelectorAll('.mode-btn[data-mode]').forEach(x => x.classList.remove('active'));\n    b.classList.add('active');\n    state.mode = b.dataset.mode;\n    storage.preferences.mode = state.mode;\n    saveData();\n    const info = document.getElementById('review-info');\n    const themesLabel = document.getElementById('themes-label');\n    if (state.mode === 'review') {\n      // Count available difficult words\n      let count = 0;\n      for (const k in storage.wordStats) {\n        if (isDifficult(storage.wordStats[k])) count++;\n      }\n      info.style.display = 'block';\n      document.getElementById('review-count').textContent = count > 0 ? `(${count} mots disponibles à réviser)` : '— mais tu n\\'as encore aucun mot raté.';\n      themesLabel.innerHTML = '④ Thèmes (les mots à revoir seront filtrés par thème)';\n    } else {\n      info.style.display = 'none';\n      themesLabel.innerHTML = '④ Thèmes (choisis-en au moins un)';\n    }\n    updateStartBtn();\n  });\n});\n\n/* Direction */\ndocument.querySelectorAll('.dir-btn').forEach(b => {\n  b.addEventListener('click', () => {\n    document.querySelectorAll('.dir-btn').forEach(x => x.classList.remove('active'));\n    b.classList.add('active');\n    state.direction = b.dataset.dir;\n    storage.preferences.direction = state.direction;\n    saveData();\n  });\n});\n\n/* Set initial direction button */\ndocument.querySelectorAll('.dir-btn').forEach(b => {\n  if (b.dataset.dir === state.direction) {\n    document.querySelectorAll('.dir-btn').forEach(x => x.classList.remove('active'));\n    b.classList.add('active');\n  }\n});\n\n/* Themes */\nconst themesGrid = document.getElementById('themes-grid');\n/* Les puces des themes sont generees ici a partir de VOCAB. */\nthemesGrid.innerHTML = '';\nObject.entries(VOCAB).forEach(([theme, items]) => {\n  const chip = document.createElement('div');\n  chip.className = 'theme-chip' + (state.selectedThemes.has(theme) ? ' checked' : '');\n  chip.dataset.theme = theme;\n  chip.innerHTML = `\u003cspan>${theme}\u003c/span>\u003cspan class=\"count\">${items.length}\u003c/span>`;\n  chip.addEventListener('click', () => {\n    chip.classList.toggle('checked');\n    if (chip.classList.contains('checked')) state.selectedThemes.add(theme);\n    else state.selectedThemes.delete(theme);\n    storage.preferences.selectedThemes = [...state.selectedThemes];\n    saveData();\n    updateStartBtn();\n  });\n  themesGrid.appendChild(chip);\n});\n\nfunction applyThemeSelection(themes) {\n  state.selectedThemes.clear();\n  themes.forEach(t => state.selectedThemes.add(t));\n  document.querySelectorAll('.theme-chip').forEach(c => {\n    c.classList.toggle('checked', state.selectedThemes.has(c.dataset.theme));\n  });\n  storage.preferences.selectedThemes = [...state.selectedThemes];\n  saveData();\n  updateStartBtn();\n}\n\ndocument.getElementById('select-all').addEventListener('click', () => applyThemeSelection(Object.keys(VOCAB)));\ndocument.getElementById('select-none').addEventListener('click', () => applyThemeSelection([]));\ndocument.getElementById('select-core').addEventListener('click', () => applyThemeSelection(CORE_THEMES));\ndocument.getElementById('select-advanced').addEventListener('click', () => applyThemeSelection(ADVANCED_THEMES));\n\nfunction updateStartBtn() {\n  const btn = document.getElementById('start-btn');\n  if (state.selectedThemes.size === 0) {\n    btn.disabled = true;\n    btn.textContent = 'Sélectionne au moins un thème';\n    return;\n  }\n  if (state.mode === 'review') {\n    // check if there are any difficult words in selected themes\n    let count = 0;\n    state.selectedThemes.forEach(theme => {\n      VOCAB[theme].forEach(([he, fr]) => {\n        const stat = storage.wordStats[he + '|' + fr];\n        if (isMissed(stat) && !isExcludedKey(he + '|' + fr)) count++;\n      });\n    });\n    if (count === 0) {\n      btn.disabled = true;\n      btn.textContent = 'Aucun mot raté dans ces thèmes';\n    } else {\n      btn.disabled = false;\n      const n = state.seriesLength === 0 ? count : Math.min(state.seriesLength, count);\n      btn.textContent = `Réviser ${n} mot${n > 1 ? 's' : ''} raté${n > 1 ? 's' : ''}`;\n    }\n  } else {\n    btn.disabled = false;\n    btn.textContent = state.seriesLength === 0\n      ? 'Commencer — tous les mots'\n      : `Commencer une série de ${state.seriesLength}`;\n  }\n}\n\n/* Start quiz */\ndocument.getElementById('start-btn').addEventListener('click', () => {\n  buildPool();\n  if (state.pool.length === 0) return;\n  state.correct = 0; state.wrong = 0; state.total = 0; state.questionNum = 0;\n  state.recentlySeen = [];\n  state.missed = [];\n  document.getElementById('series-end').style.display = 'none';\n  updateScore();\n  document.getElementById('setup-view').style.display = 'none';\n  document.getElementById('quiz-view').style.display = 'block';\n  nextQuestion();\n});\n\ndocument.getElementById('back-setup').addEventListener('click', () => {\n  document.getElementById('setup-view').style.display = 'block';\n  document.getElementById('quiz-view').style.display = 'none';\n  updateStartBtn();\n});\n\nfunction buildPool() {\n  /* On constitue une file de mots DISTINCTS, tiree au sort avec ponderation\n     et sans remise : plus de repetition a l'interieur d'une meme serie. */\n  const cands = [];\n  state.selectedThemes.forEach(theme => {\n    VOCAB[theme].forEach(entry => {\n      const he = entry[0], fr = entry[1], heVoc = entry[2] || null;\n      const stat = storage.wordStats[he + '|' + fr];\n      if (isExcludedKey(he + '|' + fr)) return;\n      if (state.mode === 'review') {\n        if (isMissed(stat)) cands.push({ he, fr, heVoc, theme, w: 1 });\n      } else {\n        let w = 1;\n        if (isDifficult(stat)) w = 3;\n        else if (isMastered(stat)) w = 0.3;\n        cands.push({ he, fr, heVoc, theme, w });\n      }\n    });\n  });\n\n  const n = (state.seriesLength === 0)\n    ? cands.length\n    : Math.min(state.seriesLength, cands.length);\n\n  const rest = cands.slice();\n  const queue = [];\n  for (let i = 0; i \u003c n && rest.length; i++) {\n    let tot = 0;\n    for (const c of rest) tot += c.w;\n    let r = Math.random() * tot, idx = rest.length - 1;\n    for (let j = 0; j \u003c rest.length; j++) {\n      r -= rest[j].w;\n      if (r \u003c= 0) { idx = j; break; }\n    }\n    queue.push(rest.splice(idx, 1)[0]);\n  }\n  state.pool = queue;\n  state.seriesTotal = queue.length;\n}\n\nfunction pickRandom() {\n  return state.pool.length ? state.pool.shift() : null;\n}\n\nfunction nextQuestion() {\n  const word = pickRandom();\n  if (!word) { endSeries(); return; }\n  state.current = word;\n  state.revealed = false;\n  state.questionNum++;\n\n  let dir = state.direction;\n  if (dir === 'mixed') dir = Math.random() \u003c 0.5 ? 'fr-he' : 'he-fr';\n  state.currentDir = dir;\n\n  document.getElementById('current-theme').textContent = word.theme;\n  document.getElementById('question-num').textContent = 'Q ' + state.questionNum;\n\n  // Display word stats\n  const stat = getWordStat(word);\n  const statsEl = document.getElementById('word-stats');\n  if (stat.seen > 0) {\n    statsEl.textContent = `${stat.correct}/${stat.seen}`;\n    statsEl.classList.toggle('difficult', isDifficult(stat));\n  } else {\n    statsEl.textContent = 'nouveau';\n    statsEl.classList.remove('difficult');\n  }\n\n  const wordEl = document.getElementById('quiz-word');\n  const promptEl = document.getElementById('quiz-prompt');\n\n  if (dir === 'fr-he') {\n    promptEl.textContent = 'Traduis en hébreu :';\n    wordEl.textContent = word.fr;\n    wordEl.classList.remove('hebrew');\n    wordEl.removeAttribute('dir');\n  } else {\n    promptEl.textContent = 'Traduis en français :';\n    wordEl.textContent = word.he;\n    wordEl.classList.add('hebrew');\n    wordEl.setAttribute('dir', 'rtl');\n  }\n\n  const az = document.getElementById('answer-zone');\n  az.classList.add('empty');\n  az.innerHTML = '';\n\n  document.getElementById('actions-reveal').style.display = 'flex';\n  document.getElementById('actions-judge').style.display = 'none';\n  document.querySelector('#quiz-view .quiz-card').classList.remove('revealed');\n}\n\nfunction reveal() {\n  if (state.revealed) return;\n  state.revealed = true;\n  const word = state.current;\n  const dir = state.currentDir;\n  const isHebrew = dir === 'fr-he';\n  const answer = isHebrew ? word.he : word.fr;\n  const heVoc = word.heVoc;\n  const showVoc = heVoc && heVoc !== word.he;\n\n  const az = document.getElementById('answer-zone');\n  az.classList.remove('empty');\n  let html = `\u003cdiv class=\"answer-label\">Réponse\u003c/div>\n    \u003cdiv class=\"answer-text ${isHebrew ? 'hebrew' : ''}\" ${isHebrew ? 'dir=\"rtl\"' : ''}>${answer}\u003c/div>`;\n  if (showVoc) {\n    html += `\u003cdiv class=\"answer-voc-label\">avec voyelles\u003c/div>\n      \u003cdiv class=\"answer-voc\" dir=\"rtl\">${heVoc}\u003c/div>`;\n  }\n  const pres = VERB_PRESENT[heVoc] || VERB_PRESENT[word.he];\n  if (pres) {\n    html += `\u003cdiv class=\"answer-voc-label\">au présent\u003c/div>\n      \u003cdiv class=\"answer-pres\" dir=\"rtl\">אֲנִי ${pres}\u003c/div>`;\n  }\n  az.innerHTML = html;\n\n  document.getElementById('actions-reveal').style.display = 'none';\n  document.getElementById('actions-judge').style.display = 'flex';\n  document.querySelector('#quiz-view .quiz-card').classList.add('revealed');\n}\n\n/* Toute la carte est cliquable : reveal() ressort immediatement si la\n   reponse est deja affichee, donc un second clic ne fait rien. */\ndocument.querySelector('#quiz-view .quiz-card').addEventListener('click', e => {\n  if (e.target.closest('.judge-btn') || e.target.closest('.card-x')) return;\n  reveal();\n});\n// Touches clavier : Espace ou Entrée pour révéler la réponse\ndocument.addEventListener('keydown', e => {\n  if (document.getElementById('quiz-view').style.display === 'none') return;\n  if (e.key === ' ' || e.key === 'Enter') {\n    if (!state.revealed) {\n      e.preventDefault();\n      reveal();\n    }\n    return;\n  }\n  /* une fois la reponse affichee : A = juste, P = faux (fleches haut/bas aussi) */\n  if (state.revealed) {\n    if (e.ctrlKey || e.metaKey || e.altKey) return;\n    var k = (e.key || '').toLowerCase();\n    if (k === 'a' || e.key === 'ArrowUp')   { e.preventDefault(); document.getElementById('correct-btn').click(); }\n    if (k === 'p' || e.key === 'ArrowDown') { e.preventDefault(); document.getElementById('wrong-btn').click(); }\n  }\n});\n\ndocument.getElementById('correct-btn').addEventListener('click', () => {\n  state.correct++; state.total++;\n  updateWordStat(state.current, 'correct');\n  updateScore();\n  nextQuestion();\n});\n\ndocument.getElementById('wrong-btn').addEventListener('click', () => {\n  state.wrong++; state.total++;\n  state.missed.push(state.current);\n  updateWordStat(state.current, 'wrong');\n  updateScore();\n  nextQuestion();\n});\n\nfunction updateScore() {\n  document.getElementById('score-c').textContent = state.correct;\n  document.getElementById('score-w').textContent = state.wrong;\n  document.getElementById('score-t').textContent = state.total;\n  refreshGlobalStatsDisplay();\n}\n\n/* GRAMMAR list */\nconst grammarList = document.getElementById('grammar-list');\n/* Les 47 sections presentes en dur dans le HTML sont regenerees ci-dessous :\n   sans ce vidage elles apparaissaient en double, et les statiques n'avaient\n   pas d'ecouteur de clic (elles ne s'ouvraient donc jamais). */\ngrammarList.innerHTML = '';\nGRAMMAR_CATEGORIES.forEach(cat => {\n  const catHeader = document.createElement('div');\n  catHeader.className = 'grammar-category';\n  catHeader.textContent = '⁘ ' + cat.name;\n  grammarList.appendChild(catHeader);\n  cat.items.slice().sort((a, b) =>\n    String(a.title).localeCompare(String(b.title), 'fr', { sensitivity: 'base', ignorePunctuation: true })\n  ).forEach(g => {\n    const section = document.createElement('div');\n    section.className = 'grammar-section';\n    section.innerHTML = `\n      \u003cdiv class=\"grammar-header\">\n        \u003cdiv class=\"grammar-title\">${g.title} \u003cspan class=\"he\" dir=\"rtl\">${g.he}\u003c/span>\u003c/div>\n        \u003cdiv class=\"grammar-toggle\">+\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grammar-content\">${g.body}\u003c/div>\n    `;\n    section.querySelector('.grammar-header').addEventListener('click', () => {\n      section.classList.toggle('open');\n    });\n    grammarList.appendChild(section);\n  });\n});\n\n/* Reset stats */\ndocument.getElementById('reset-stats').addEventListener('click', () => {\n  if (confirm('Es-tu sûr de vouloir effacer toutes tes statistiques ? Cette action est irréversible.')) {\n    storage.wordStats = {};\n    saveData();\n    refreshGlobalStatsDisplay();\n    alert('Statistiques effacées.');\n  }\n});\n\n/* Set initial mode button state */\ndocument.querySelectorAll('.mode-btn[data-mode]').forEach(b => {\n  if (b.dataset.mode === state.mode) b.click();\n});\n\nupdateStartBtn();\nrefreshGlobalStatsDisplay();\n\n/* ================ COURS — lexique consultable ================ */\n(function () {\n  var list = document.getElementById('cours-list');\n  var search = document.getElementById('cours-search');\n  var countEl = document.getElementById('cours-count');\n  if (!list || typeof VOCAB === 'undefined') return;\n\n  function esc(s) {\n    return String(s).replace(/[&\u003c>\"]/g, function (c) {\n      return { '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;' }[c];\n    });\n  }\n  /* recherche insensible aux points-voyelles (nikud) */\n  function strip(s) {\n    return String(s == null ? '' : s).replace(/[֑-ׇ]/g, '');\n  }\n  /* surlignage uniquement côté français : les index restent alignés */\n  function hlFr(txt, q) {\n    if (!q) return esc(txt);\n    var i = txt.toLowerCase().indexOf(q);\n    if (i \u003c 0) return esc(txt);\n    return esc(txt.slice(0, i)) + '\u003cmark>' + esc(txt.slice(i, i + q.length)) +\n           '\u003c/mark>' + esc(txt.slice(i + q.length));\n  }\n\n  /* Masquage par theme : 'he', 'fr' ou null. Conserve hors du rendu\n     pour survivre a une recherche ou a un repli/depli. */\n  var masks = {};\n\n  /* Vue courante : 'theme' (l'origine) ou 'nature' (grandes listes). */\n  var view = 'theme';\n  var CAT_ORDER = [\n    ['v', 'Verbes'],\n    ['n', 'Noms'],\n    ['a', 'Adjectifs'],\n    ['d', 'Adverbes'],\n    ['o', 'Mots-outils (pronoms, pr\\u00e9positions, liaisons)'],\n    ['c', 'Nombres & ordinaux'],\n    ['x', 'Expressions & tournures']\n  ];\n\n  /* Renvoie les sections a afficher, selon la vue. En vue 'nature' un mot\n     present dans deux themes n'est liste qu'une fois, et chaque liste est\n     classee alphabetiquement sur le francais. */\n  /* mot a revoir = plus de ratees que de reussites, en flashcards OU au quiz */\n  function toReview(e) {\n    var k = e[0] + '|' + e[1];\n    if (typeof isExcludedKey === 'function' && isExcludedKey(k)) return false;\n    var f = (typeof storage !== 'undefined' && storage.flash) ? storage.flash[k] : null;\n    if (f && f.again > f.known) return true;\n    var s = (typeof storage !== 'undefined' && storage.wordStats) ? storage.wordStats[k] : null;\n    if (s && s.wrong > s.correct) return true;\n    return false;\n  }\n\n  /* rate en flashcards mais marque \"non essentiel\" (touche O), et pas deja\n     dans la liste des mots a revoir */\n  function toSoft(e) {\n    var k = e[0] + '|' + e[1];\n    if (typeof isExcludedKey === 'function' && isExcludedKey(k)) return false;\n    if (toReview(e)) return false;\n    var f = (typeof storage !== 'undefined' && storage.flash) ? storage.flash[k] : null;\n    return !!(f && f.soft > 0 && f.soft > f.known);\n  }\n\n  function softRows() {\n    var out = [], vu = {};\n    Object.keys(VOCAB).forEach(function (t) {\n      (VOCAB[t] || []).forEach(function (e) {\n        var k = e[0] + '|' + e[1];\n        if (vu[k] || !toSoft(e)) return;\n        vu[k] = 1; out.push(e);\n      });\n    });\n    out.sort(function (a, b) {\n      return String(a[1]).localeCompare(String(b[1]), 'fr', { sensitivity: 'base' });\n    });\n    return out;\n  }\n\n  /* ordre alphabetique francais, accents et ponctuation ignores */\n  function alpha(a, b) {\n    return String(a).localeCompare(String(b), 'fr', { sensitivity: 'base', ignorePunctuation: true });\n  }\n\n  function reviewRows() {\n    var out = [], vu = {};\n    Object.keys(VOCAB).forEach(function (t) {\n      (VOCAB[t] || []).forEach(function (e) {\n        var k = e[0] + '|' + e[1];\n        if (vu[k] || !toReview(e)) return;\n        vu[k] = 1; out.push(e);\n      });\n    });\n    out.sort(function (a, b) {\n      return String(a[1]).localeCompare(String(b[1]), 'fr', { sensitivity: 'base' });\n    });\n    return out;\n  }\n\n  function groups() {\n    if (view === 'soft') {\n      var sr = softRows();\n      return sr.length ? [{ name: 'Non essentiels', rows: sr }] : [];\n    }\n    if (view === 'revoir') {\n      var out = reviewRows();\n      return out.length ? [{ name: '\\u00c0 revoir', rows: out }] : [];\n    }\n    if (view === 'theme') {\n      return Object.keys(VOCAB).slice().sort(alpha).map(function (t) {\n        return { name: t, rows: VOCAB[t] || [] };\n      });\n    }\n    var buckets = {}, seen = {};\n    CAT_ORDER.forEach(function (c) { buckets[c[0]] = []; });\n    Object.keys(VOCAB).forEach(function (t) {\n      var code = (typeof NATURE !== 'undefined' && NATURE[t]) || '';\n      (VOCAB[t] || []).forEach(function (e, i) {\n        var c = code.charAt(i) || 'n';\n        var key = c + '|' + e[0] + '|' + e[1];\n        if (seen[key]) return;\n        seen[key] = 1;\n        if (buckets[c]) buckets[c].push(e);\n      });\n    });\n    return CAT_ORDER.map(function (c) {\n      var arr = buckets[c[0]].slice().sort(function (a, b) {\n        return String(a[1]).localeCompare(String(b[1]), 'fr', { sensitivity: 'base' });\n      });\n      return { name: c[1], rows: arr };\n    }).filter(function (g) { return g.rows.length; })\n      .sort(function (a, b) { return alpha(a.name, b.name); });\n  }\n\n  var lastGroups = {};\n\n  function render() {\n    var raw = search.value.trim();\n    var q = strip(raw).toLowerCase();\n    var html = '', total = 0, shown = 0;\n\n    lastGroups = {};\n    groups().forEach(function (g) {\n      var theme = g.name;\n      var rows = g.rows;\n      lastGroups[g.name] = g.rows;\n      total += rows.length;\n      if (q) {\n        rows = rows.filter(function (e) {\n          return strip(e[1]).toLowerCase().indexOf(q) >= 0 ||\n                 strip(e[0]).toLowerCase().indexOf(q) >= 0 ||\n                 strip(e[2]).toLowerCase().indexOf(q) >= 0;\n        });\n      }\n      if (!rows.length) return;\n      shown += rows.length;\n      var mk = masks[theme] || '';\n      html += '\u003cdetails class=\"cours-sec' + (mk ? ' hide-' + mk : '') + '\"' +\n              (q ? ' open' : '') + ' data-theme=\"' + esc(theme) + '\">' +\n              '\u003csummary>\u003cspan class=\"cours-name\">' + esc(theme) + '\u003c/span>' +\n              '\u003cspan class=\"cours-tools\">' +\n                '\u003cbutton type=\"button\" class=\"mask-btn' + (mk === 'he' ? ' on' : '') +\n                  '\" data-mask=\"he\">Masquer l\\'hébreu\u003c/button>' +\n                '\u003cbutton type=\"button\" class=\"mask-btn' + (mk === 'fr' ? ' on' : '') +\n                  '\" data-mask=\"fr\">Masquer le français\u003c/button>' +\n              '\u003c/span>' +\n              '\u003cbutton type=\"button\" class=\"flash-btn\" data-flash=\"1\">Flashcards\u003c/button>' +\n              '\u003cspan class=\"c\">' + rows.length + ' mot' + (rows.length > 1 ? 's' : '') + '\u003c/span>\u003c/summary>' +\n              '\u003ctable class=\"cours-tbl\">\u003ctbody>' +\n              rows.map(function (e) {\n                var pr = VERB_PRESENT[e[2]] || VERB_PRESENT[e[0]];\n                return '\u003ctr>\u003ctd class=\"cours-he\">' + esc(e[2] || e[0]) +\n                       (pr ? '\u003cspan class=\"cours-pres\">אֲנִי ' + esc(pr) + '\u003c/span>' : '') +\n                       '\u003c/td>\u003ctd class=\"cours-fr\">' + hlFr(e[1], q) + '\u003c/td>\u003c/tr>';\n              }).join('') +\n              '\u003c/tbody>\u003c/table>\u003c/details>';\n    });\n\n    list.innerHTML = html || (view === 'soft' && !q\n      ? '\u003cdiv class=\"cours-empty\">Aucun mot non essentiel pour l\\'instant. Un mot arrive ici quand tu le rates en flashcards avec la touche O.\u003c/div>'\n      : view === 'revoir' && !q\n      ? '\u003cdiv class=\"cours-empty\">Aucun mot à revoir pour l\\'instant. Un mot arrive ici dès qu\\'il est raté plus souvent que réussi, en flashcards ou au quiz.\u003c/div>'\n      : '\u003cdiv class=\"cours-empty\">Aucun mot ne correspond à &laquo;&nbsp;' + esc(raw) + '&nbsp;&raquo;\u003c/div>');\n    countEl.textContent = q\n      ? shown + ' mot' + (shown > 1 ? 's' : '') + ' trouvé' + (shown > 1 ? 's' : '')\n      : total + ' mots au total';\n    dash();\n  }\n\n  /* Les boutons vivent dans le \u003csummary> : sans preventDefault, le clic\n     replierait la categorie qu'on veut justement garder ouverte. */\n  list.addEventListener('click', function (e) {\n    var fb = e.target.closest('.flash-btn');\n    if (fb) {\n      e.preventDefault();\n      e.stopPropagation();\n      var s0 = fb.closest('.cours-sec');\n      var name = s0.dataset.theme;\n      var src = lastGroups[name] || [];\n      if (src.length && typeof window.openFlash === 'function') window.openFlash(name, src);\n      return;\n    }\n    var btn = e.target.closest('.mask-btn');\n    if (btn) {\n      e.preventDefault();\n      e.stopPropagation();\n      var sec = btn.closest('.cours-sec');\n      var theme = sec.dataset.theme;\n      var want = btn.dataset.mask;\n      masks[theme] = (masks[theme] === want) ? null : want;   // second clic = on demasque\n      sec.classList.toggle('hide-he', masks[theme] === 'he');\n      sec.classList.toggle('hide-fr', masks[theme] === 'fr');\n      sec.querySelectorAll('.mask-btn').forEach(function (b) {\n        b.classList.toggle('on', b.dataset.mask === masks[theme]);\n      });\n      sec.querySelectorAll('.shown').forEach(function (c) { c.classList.remove('shown'); });\n      return;\n    }\n    /* un mot masque se devoile a l'unite */\n    var cell = e.target.closest('.cours-he, .cours-fr');\n    if (!cell) return;\n    var s = cell.closest('.cours-sec');\n    if (!s) return;\n    var masked = (s.classList.contains('hide-he') && cell.classList.contains('cours-he')) ||\n                 (s.classList.contains('hide-fr') && cell.classList.contains('cours-fr'));\n    if (masked) cell.classList.toggle('shown');\n  });\n\n  /* --- bandeau de stats en haut de l'onglet Cours --- */\n  function dash() {\n    var seen = 0, mastered = 0, correct = 0, att = 0;\n    for (var k in storage.wordStats) {\n      if (typeof isExcludedKey === 'function' && isExcludedKey(k)) continue;\n      var s = storage.wordStats[k];\n      seen++;\n      if (typeof isMastered === 'function' && isMastered(s)) mastered++;\n      correct += s.correct; att += s.correct + s.wrong;\n    }\n    var nrev = reviewRows().length;\n    var set = function (id, v) { var el = document.getElementById(id); if (el) el.textContent = v; };\n    set('cd-seen', seen);\n    set('cd-mastered', mastered);\n    set('cd-review', nrev);\n    set('cd-rate', att ? Math.round(100 * correct / att) + '%' : '—');\n\n    var fs = 0, fk = 0, fa = 0, fo = 0;\n    var fl = storage.flash || {};\n    for (var j in fl) { fs += fl[j].seen; fk += fl[j].known; fa += fl[j].again; fo += (fl[j].soft || 0); }\n    var fEl = document.getElementById('cd-flash');\n    if (fEl) fEl.textContent = fs\n      ? 'Flashcards : ' + fs + ' carte' + (fs > 1 ? 's' : '') + ' vue' + (fs > 1 ? 's' : '') +\n        ' · ' + fk + ' sue' + (fk > 1 ? 's' : '') + ' · ' + fa + ' à revoir' +\n        (fo ? ' · ' + fo + ' non essentielle' + (fo > 1 ? 's' : '') : '') +\n        ' · ' + Math.round(100 * fk / fs) + ' % de réussite'\n      : 'Flashcards : aucune carte révisée pour l\\'instant — le bouton Flashcards de chaque liste lance une série.';\n\n    var bF = document.getElementById('cd-review-flash');\n    var bL = document.getElementById('cd-review-list');\n    if (bF) {\n      bF.disabled = !nrev;\n      bF.style.opacity = nrev ? '' : '.45';\n      bF.textContent = nrev\n        ? 'Réviser les ' + nrev + ' mot' + (nrev > 1 ? 's' : '') + ' raté' + (nrev > 1 ? 's' : '') + ' en flashcards'\n        : 'Aucun mot à revoir';\n    }\n    if (bL) bL.style.display = nrev ? 'inline-block' : 'none';\n  }\n  window.updateCoursDash = dash;\n\n  var bRF = document.getElementById('cd-review-flash');\n  if (bRF) bRF.addEventListener('click', function () {\n    var rows = reviewRows();\n    if (rows.length && typeof window.openFlash === 'function') window.openFlash('À revoir', rows);\n  });\n  var bCJ = document.getElementById('cd-conj');\n  if (bCJ) bCJ.addEventListener('click', function () {\n    if (typeof window.openConj === 'function') window.openConj();\n  });\n  var bRL = document.getElementById('cd-review-list');\n  if (bRL) bRL.addEventListener('click', function () {\n    var b = document.querySelector('.view-btn[data-view=\"revoir\"]');\n    if (b) b.click();\n    document.getElementByI
