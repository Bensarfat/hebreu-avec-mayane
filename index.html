<meta charset="utf-8">
<title>Hébreu avec Mayane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&family=Noto+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Charte « doux & lumineux » : fond pêche → rose → lavande, cartes blanches,
       violet pour l'hébreu et l'action, menthe / abricot / corail pour les verdicts. */
    --bg: #fbf6fb;
    --bg-1: #ffe4d1;
    --bg-2: #fcdcee;
    --bg-3: #e4e6ff;
    --paper: #ffffff;
    --glass: rgba(255, 255, 255, 0.72);
    --ink: #2e2540;
    --ink-soft: #4f4462;
    --muted: #877c99;
    --line: #ece3f3;
    --line-strong: #dccfea;
    --hover: #f7f2fc;
    --zebra: #faf6fd;
    --accent: #7457f5;
    --accent-2: #b86cf2;
    --accent-soft: #9580ff;
    --accent-tint: #efeaff;
    --on-accent: #ffffff;
    --he: #5a3fe0;
    --olive: #188a5c;
    --mint: #ddf6ea;
    --gold: #c46a12;
    --peach: #ffedde;
    --rose: #d9466f;
    --rose-tint: #ffe6ee;
    --bad: #d93a45;
    --bad-tint: #ffe5e7;
    --sky: #1f86c8;
    --sky-tint: #e2f2fc;
    --salmon: #ffb9a6;
    --on-salmon: #6e2817;
    --mark: rgba(116, 87, 245, 0.18);
    --selection: rgba(116, 87, 245, 0.22);
    --overlay: rgba(46, 37, 64, 0.38);
    --shadow: rgba(84, 52, 150, 0.10);
    --shadow-card: 0 1px 2px rgba(84, 52, 150, 0.06), 0 14px 34px -22px rgba(116, 87, 245, 0.45);
    --shadow-pop: 0 30px 70px -30px rgba(84, 52, 150, 0.55);
    /* cours passé / futur */
    --t-soft: #f5f0fb;
    --t-note: #fff4e8;
    --t-warn: #ffece9;
    --t-tip: #e6f7ef;
    --t-th: #f3edfb;
    --t-hl: #fff1cf;
    --t-hl2: #e6f1fc;
    --t-sfx: #0f78a8;
    --t-pfx: #8a44c4;
    --t-past: #c4531f;
    --t-fut: #2c74a8;
    --t-past-tint: #ffeadf;
    --t-fut-tint: #e1effa;
    --b-paal: #9a5a1e;
    --b-nifal: #2f7d50;
    --b-piel: #a8336b;
    --b-pual: #b45f8a;
    --b-hifil: #2d63b0;
    --b-hufal: #5b7fc0;
    --b-hitpael: #7044c4;
    --t-warn-ink: #b8352b;
    --t-ok: #1e8456;

    --font-ui: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display: "Nunito", "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-he: "Noto Sans Hebrew", "Arial Hebrew", "David", "Frank Ruhl Libre", sans-serif;
    --radius: 20px;
    --radius-sm: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
    --bg: #15111e;
    --bg-1: #241829;
    --bg-2: #1f1529;
    --bg-3: #141a30;
    --paper: #211a2e;
    --glass: rgba(33, 26, 46, 0.72);
    --ink: #f4effb;
    --ink-soft: #d8cfe7;
    --muted: #a397b6;
    --line: #342a47;
    --line-strong: #463a5c;
    --hover: #2a2239;
    --zebra: #251e33;
    --accent: #a891ff;
    --accent-2: #d08cff;
    --accent-soft: #c3b5ff;
    --accent-tint: #2e2550;
    --on-accent: #1a1330;
    --he: #bcaaff;
    --olive: #55d39d;
    --mint: #173b2c;
    --gold: #f3a35b;
    --peach: #3b2a1b;
    --rose: #ff86a8;
    --rose-tint: #40202d;
    --bad: #ff7076;
    --bad-tint: #401f25;
    --sky: #6cc0f2;
    --sky-tint: #16303f;
    --salmon: #ff9e86;
    --on-salmon: #2b120b;
    --mark: rgba(168, 145, 255, 0.28);
    --selection: rgba(168, 145, 255, 0.32);
    --overlay: rgba(6, 4, 12, 0.62);
    --shadow: rgba(0, 0, 0, 0.35);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.35), 0 16px 36px -24px rgba(0, 0, 0, 0.8);
    --shadow-pop: 0 30px 70px -30px rgba(0, 0, 0, 0.9);
    --t-soft: #2a2238;
    --t-note: #33261b;
    --t-warn: #3a2023;
    --t-tip: #17332a;
    --t-th: #2b2340;
    --t-hl: #3a3016;
    --t-hl2: #162b3d;
    --t-sfx: #6cc6ef;
    --t-pfx: #cf9bff;
    --t-past: #ff9a66;
    --t-fut: #74b9ec;
    --t-past-tint: #3a2419;
    --t-fut-tint: #172c3d;
    --b-paal: #e6a76a;
    --b-nifal: #6fd29b;
    --b-piel: #f58cbc;
    --b-pual: #e3a3c4;
    --b-hifil: #7fb0f5;
    --b-hufal: #a7bdf0;
    --b-hitpael: #b99bff;
    --t-warn-ink: #ff8b80;
    --t-ok: #5fd6a0;
    color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15111e;
    --bg-1: #241829;
    --bg-2: #1f1529;
    --bg-3: #141a30;
    --paper: #211a2e;
    --glass: rgba(33, 26, 46, 0.72);
    --ink: #f4effb;
    --ink-soft: #d8cfe7;
    --muted: #a397b6;
    --line: #342a47;
    --line-strong: #463a5c;
    --hover: #2a2239;
    --zebra: #251e33;
    --accent: #a891ff;
    --accent-2: #d08cff;
    --accent-soft: #c3b5ff;
    --accent-tint: #2e2550;
    --on-accent: #1a1330;
    --he: #bcaaff;
    --olive: #55d39d;
    --mint: #173b2c;
    --gold: #f3a35b;
    --peach: #3b2a1b;
    --rose: #ff86a8;
    --rose-tint: #40202d;
    --bad: #ff7076;
    --bad-tint: #401f25;
    --sky: #6cc0f2;
    --sky-tint: #16303f;
    --salmon: #ff9e86;
    --on-salmon: #2b120b;
    --mark: rgba(168, 145, 255, 0.28);
    --selection: rgba(168, 145, 255, 0.32);
    --overlay: rgba(6, 4, 12, 0.62);
    --shadow: rgba(0, 0, 0, 0.35);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.35), 0 16px 36px -24px rgba(0, 0, 0, 0.8);
    --shadow-pop: 0 30px 70px -30px rgba(0, 0, 0, 0.9);
    --t-soft: #2a2238;
    --t-note: #33261b;
    --t-warn: #3a2023;
    --t-tip: #17332a;
    --t-th: #2b2340;
    --t-hl: #3a3016;
    --t-hl2: #162b3d;
    --t-sfx: #6cc6ef;
    --t-pfx: #cf9bff;
    --t-past: #ff9a66;
    --t-fut: #74b9ec;
    --t-past-tint: #3a2419;
    --t-fut-tint: #172c3d;
    --b-paal: #e6a76a;
    --b-nifal: #6fd29b;
    --b-piel: #f58cbc;
    --b-pual: #e3a3c4;
    --b-hifil: #7fb0f5;
    --b-hufal: #a7bdf0;
    --b-hitpael: #b99bff;
    --t-warn-ink: #ff8b80;
    --t-ok: #5fd6a0;
    color-scheme: dark;
  }
  body {
    background-image:
      radial-gradient(1100px 620px at -5% -10%, var(--bg-1) 0%, transparent 62%),
      radial-gradient(900px 620px at 105% 0%, var(--bg-2) 0%, transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-3) 100%);
    background-attachment: fixed;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; font-family: var(--font-ui); color: var(--ink); background-color: var(--bg); }
  body { -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.5; min-height: 100vh; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
  a { color: var(--accent); }
  .he { font-family: var(--font-he); }
  [hidden] { display: none !important; }

  /* ---------- boutons & champs (repris du site) ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer;
    border-radius: 999px; font-weight: 700; font-size: 14px; padding: 10px 18px;
    border: 1.5px solid var(--line-strong); background: var(--paper); color: var(--ink-soft); text-decoration: none; white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s;
  }
  .btn:hover { background: var(--hover); border-color: var(--accent-soft); color: var(--ink); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: var(--on-accent); box-shadow: 0 10px 22px -12px var(--accent); }
  .btn.primary:hover { filter: brightness(1.06); color: var(--on-accent); }
  .btn.small { padding: 6px 12px; font-size: 12.5px; }
  .btn.danger { color: var(--bad); border-color: var(--bad-tint); background: var(--bad-tint); }
  .btn.danger:hover { background: var(--bad); color: var(--paper); border-color: var(--bad); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn:disabled { opacity: .5; cursor: default; filter: none; }
  label.f { display: grid; gap: 5px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .in {
    width: 100%; border: 1.5px solid var(--line); background: var(--paper); border-radius: 14px;
    padding: 11px 14px; font-size: 15px; transition: border-color .15s, box-shadow .15s;
  }
  .in:focus { outline: 0; border-color: var(--accent-soft); box-shadow: 0 0 0 4px var(--accent-tint); }
  .in.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .02em; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; background: var(--accent-tint); color: var(--accent); white-space: nowrap; }
  .pill.green { background: var(--mint); color: var(--olive); }
  .pill.gold { background: var(--peach); color: var(--gold); }
  .pill.rose { background: var(--rose-tint); color: var(--rose); }
  .pill.grey { background: var(--zebra); color: var(--muted); border: 1px solid var(--line); }

  .card {
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-card); padding: 24px;
  }
  .card h2, .card h3 { font-family: var(--font-display); font-weight: 800; margin: 0 0 14px; color: var(--ink); }
  .card h2 { font-size: 20px; } .card h3 { font-size: 17px; }
  .card h3 small { font: 700 12px var(--font-ui); color: var(--muted); margin-left: 6px; }
  .stack { display: grid; gap: 18px; }

  /* ---------- connexion ---------- */
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
  .login { width: 100%; max-width: 440px; text-align: center; }
  .kicker { display: inline-block; font: 700 12px/1 var(--font-ui); color: var(--accent); background: var(--accent-tint); padding: 7px 14px; border-radius: 999px; margin-bottom: 14px; }
  .login h1, .page-title {
    font-family: var(--font-display); font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; margin: 0;
  }
  .login h1 { font-size: clamp(32px, 7vw, 44px); }
  .grad { font-family: var(--font-he); font-weight: 700; background: linear-gradient(120deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .login .sub { color: var(--muted); margin: 8px 0 26px; }
  .login form { text-align: left; display: grid; gap: 14px; }
  .login .btn.primary { padding: 15px; font-size: 16px; font-weight: 800; }
  .err { color: var(--bad); background: var(--bad-tint); border-radius: 12px; padding: 9px 12px; font-size: 13.5px; font-weight: 600; }
  .ok { color: var(--olive); background: var(--mint); border-radius: 12px; padding: 9px 12px; font-size: 13.5px; font-weight: 600; }
  .demo-box { margin-top: 18px; text-align: left; font-size: 13px; color: var(--ink-soft); background: var(--peach); border-radius: 18px; padding: 14px 16px; }
  .demo-box b { color: var(--ink); } .demo-box table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .demo-box td { padding: 3px 4px; } .demo-box td:first-child { color: var(--muted); }
  .demo-box button { all: unset; cursor: pointer; color: var(--accent); font-weight: 700; }

  /* ---------- back-office ---------- */
  .bo-top {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px max(16px, calc((100vw - 1180px) / 2)); background: var(--glass); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font: 900 18px var(--font-display); color: var(--ink); text-decoration: none; }
  .brand .logo { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); font: 700 20px var(--font-he); transform: rotate(-6deg); }
  .bo-nav { display: flex; gap: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 4px; margin-left: auto; flex-wrap: wrap; }
  .bo-nav a { text-decoration: none; padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--muted); }
  .bo-nav a:hover { color: var(--ink); background: var(--hover); }
  .bo-nav a.on { background: var(--ink); color: var(--paper); }
  .bo-nav .count { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--rose); color: var(--paper); font-size: 11px; margin-left: 4px; }
  .bo-main { max-width: 1180px; margin: 0 auto; padding: 26px 16px 70px; }
  .bo-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  .page-title { font-size: clamp(26px, 4vw, 34px); }
  .bo-head p { margin: 4px 0 0; color: var(--muted); }
  .demo-strip { background: var(--peach); color: var(--ink-soft); text-align: center; font-size: 12.5px; padding: 6px 16px; }
  .demo-strip b { color: var(--gold); }

  /* tableau élèves */
  .tbl-wrap { overflow-x: auto; margin: 0 -8px; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 860px; }
  .tbl th { text-align: left; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 800; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; }
  .tbl th.sorted { color: var(--accent); }
  .tbl td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--hover); }
  .tbl .num { font-variant-numeric: tabular-nums; font-weight: 700; }
  .who { display: flex; align-items: center; gap: 10px; }
  .av { width: 36px; height: 36px; flex: none; border-radius: 12px; display: grid; place-items: center; font: 800 14px var(--font-display); color: var(--on-accent); background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .av.lg { width: 64px; height: 64px; border-radius: 20px; font-size: 24px; }
  .who b { display: block; } .who small { color: var(--muted); }
  .lv { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; }
  .lv .he { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 8px; background: var(--accent-tint); color: var(--accent); }

  .alerts { display: grid; gap: 8px; }
  .alert { display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-radius: 16px; background: var(--zebra); font-size: 14px; cursor: pointer; border: 1px solid var(--line); }
  .alert:hover { border-color: var(--accent-soft); }
  .alert .ic { font-size: 18px; } .alert.warn { background: var(--rose-tint); border-color: transparent; } .alert.good { background: var(--mint); border-color: transparent; }
  .lb { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .lb li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 14px; }
  .lb li:nth-child(1) { background: var(--peach); } .lb .rk { font: 900 16px var(--font-display); color: var(--muted); text-align: center; }
  .lb li:nth-child(1) .rk { color: var(--gold); }

  .dash-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .dash-grid { grid-template-columns: 1fr; } }

  /* fiche élève */
  .st-head { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .st-head h1 { font: 900 clamp(24px, 4vw, 32px)/1.1 var(--font-display); margin: 0; }
  .st-head .meta { display: flex; gap: 6px 14px; flex-wrap: wrap; color: var(--muted); font-size: 13.5px; margin-top: 4px; }
  .st-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 20px 0; }
  .st-tabs a { text-decoration: none; padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--muted); border: 1.5px solid var(--line); background: var(--paper); }
  .st-tabs a.on { background: var(--accent-tint); color: var(--accent); border-color: var(--accent-soft); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
  .back { display: inline-flex; gap: 6px; align-items: center; text-decoration: none; font-weight: 700; color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .back:hover { color: var(--accent); }

  /* dépôt de documents */
  .drop {
    border: 2px dashed var(--line-strong); border-radius: 22px; padding: 30px 18px; text-align: center; background: var(--zebra);
    transition: background .15s, border-color .15s; cursor: pointer;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-tint); }
  .drop .big { font-size: 34px; } .drop b { display: block; font: 800 17px var(--font-display); margin: 6px 0 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); padding: 6px 12px; font-weight: 600; font-size: 13.5px; cursor: pointer; color: var(--ink-soft); }
  .chip.on { background: var(--accent-tint); color: var(--accent); border-color: var(--accent-soft); }
  .chip.on::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .docs { display: grid; gap: 8px; }
  .doc { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); }
  .doc .ft { width: 44px; height: 52px; border-radius: 10px; display: grid; place-items: center; font: 800 10.5px var(--font-ui); letter-spacing: .04em; color: var(--paper); }
  .ft.pdf { background: var(--rose); } .ft.doc { background: var(--sky); } .ft.img { background: var(--olive); } .ft.txt { background: var(--muted); }
  .doc .nm { font-weight: 700; overflow-wrap: anywhere; } .doc .sb { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
  .doc .act { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  @media (max-width: 640px) { .doc { grid-template-columns: 44px 1fr; } .doc .act { grid-column: 1 / -1; justify-content: flex-start; } }

  /* revue d'analyse */
  .review { border: 1.5px solid var(--accent-soft); background: var(--paper); border-radius: 20px; padding: 18px; margin-top: 12px; }
  .review h4 { font: 800 15px var(--font-display); margin: 16px 0 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .rv-words { width: 100%; border-collapse: collapse; font-size: 14px; }
  .rv-words td { padding: 6px; border-bottom: 1px solid var(--line); }
  .rv-words td.he { font-family: var(--font-he); font-size: 17px; color: var(--he); direction: rtl; text-align: right; white-space: nowrap; }
  .rv-words tr.dup td { opacity: .5; }
  .rv-gram { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }

.word-stats {\n    font-size: 10px;\n    color: var(--muted);\n  }\n  .quiz-meta .word-stats.difficult { color: var(--accent); }\n  .quiz-prompt {\n    font-size: 11px;\n    color: var(--muted);\n    text-transform: uppercase;\n    letter-spacing: 2px;\n    margin-bottom: 14px;\n  }\n  .quiz-word {\n    font-size: 42px;\n    margin: 24px 0 32px;\n    min-height: 60px;\n    line-height: 1.2;\n    color: var(--ink);\n    word-wrap: break-word;\n  }\n  .quiz-word.hebrew {\n    direction: rtl;\n    font-family: var(--font-he);\n    font-weight: bold;\n    color: var(--accent);\n    font-size: 50px;\n  }\n  .answer-zone {\n    min-height: 50px;\n    margin: 14px 0;\n    padding: 14px;\n    border-top: 1px dashed var(--line);\n    border-bottom: 1px dashed var(--line);\n  }\n  .answer-zone.empty { border: none; min-height: 0; padding: 0; margin: 0; }\n  .answer-label {\n    font-size: 11px;\n    color: var(--muted);\n    text-transform: uppercase;\n    letter-spacing: 2px;\n    margin-bottom: 8px;\n  }\n  .answer-text {\n    font-size: 28px;\n    color: var(--olive);\n    word-wrap: break-word;\n  }\n  .answer-text.hebrew {\n    direction: rtl;\n    font-family: var(--font-he);\n    font-weight: bold;\n    font-size: 34px;\n  }\n  .answer-voc {\n    direction: rtl;\n    font-family: var(--font-he);\n    font-size: 26px;\n    color: var(--gold);\n    margin-top: 10px;\n    padding-top: 10px;\n    border-top: 1px dotted var(--line);\n    line-height: 1.5;\n  }\n  .answer-voc-label {\n    font-size: 10px;\n    color: var(--muted);\n    text-transform: uppercase;\n    letter-spacing: 2px;\n    margin-top: 12px;\n    margin-bottom: 4px;\n  }\n  .actions {\n    display: flex;\n    gap: 10px;\n    flex-wrap: wrap;\n    justify-content: center;\n    margin-top: 18px;\n  }\n  .btn {\n    padding: 12px 22px;\n    font-family: inherit;\n    font-size: 13px;\n    letter-spacing: 1px;\n    text-transform: uppercase;\n    cursor: pointer;\n    border: 1px solid var(--ink);\n    background: transparent;\n    color: var(--ink);\n    transition: all 0.15s;\n  }\n  .btn:hover { background: var(--ink); color: var(--paper); }\n  .btn.primary { background: var(--ink); color: var(--paper); }\n  .btn.primary:hover { background: var(--accent); border-color: var(--accent); }\n  .btn.correct { border-color: var(--olive); color: var(--olive); }\n  .btn.correct:hover { background: var(--olive); color: var(--on-accent); }\n  .btn.wrong { border-color: var(--accent); color: var(--accent); }\n  .btn.wrong:hover { background: var(--accent); color: var(--on-accent); }\n\n  /* SCORE BAR */\n  .score-bar {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    padding: 14px 20px;\n    background: var(--paper);\n    border: 1px solid var(--line);\n    margin-top: 16px;\n    font-size: 13px;\n    flex-wrap: wrap;\n    gap: 8px;\n  }\n  .score-item { color: var(--ink-soft); }\n  .score-item strong { color: var(--ink); font-size: 16px; margin-right: 4px; }\n  .score-correct strong { color: var(--olive); }\n  .score-wrong strong { color: var(--accent); }\n  .reset-link {\n    color: var(--muted);\n    cursor: pointer;\n    font-size: 11px;\n    text-decoration: underline;\n    text-decoration-style: dotted;\n  }\n  .reset-link:hover { color: var(--accent); }\n\n  /* GRAMMAR */\n  .grammar-intro {\n    color: var(--ink-soft);\n    margin-bottom: 24px;\n    font-style: italic;\n    padding-left: 16px;\n    border-left: 2px solid var(--accent);\n  }\n  .grammar-section {\n    background: var(--paper);\n    border: 1px solid var(--line);\n    margin-bottom: 12px;\n    box-shadow: 0 1px 2px var(--shadow);\n  }\n  .grammar-header {\n    padding: 16px 22px;\n    cursor: pointer;\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    user-select: none;\n    gap: 12px;\n  }\n  .grammar-header:hover { background: var(--bg); }\n  .grammar-title {\n    font-size: 16px;\n    color: var(--ink);\n  }\n  .grammar-title .he {\n    direction: rtl;\n    color: var(--accent);\n    font-family: var(--font-he);\n    font-weight: bold;\n    margin-right: 10px;\n    font-size: 18px;\n  }\n  .grammar-toggle {\n    color: var(--accent);\n    font-size: 20px;\n    transition: transform 0.2s;\n    flex-shrink: 0;\n  }\n  .grammar-section.open .grammar-toggle {\n    transform: rotate(45deg);\n  }\n  .grammar-content {\n    display: none;\n    padding: 0 22px 22px;\n    border-top: 1px dashed var(--line);\n    padding-top: 16px;\n    color: var(--ink-soft);\n    line-height: 1.75;\n  }\n  .grammar-section.open .grammar-content { display: block; }\n  .grammar-content p { margin-bottom: 12px; }\n  .grammar-content ul { margin: 12px 0 12px 22px; }\n  .grammar-content li { margin-bottom: 6px; }\n  .grammar-content .example {\n    background: var(--bg);\n    padding: 10px 14px;\n    margin: 10px 0;\n    border-left: 2px solid var(--gold);\n    font-size: 14px;\n  }\n  .grammar-content .he-inline {\n    direction: rtl;\n    unicode-bidi: isolate;\n    font-family: var(--font-he);\n    color: var(--accent);\n    font-weight: bold;\n    font-size: 17px;\n  }\n  .grammar-content table {\n    width: 100%;\n    border-collapse: collapse;\n    margin: 12px 0;\n    font-size: 14px;\n  }\n  .grammar-content th, .grammar-content td {\n    border: 1px solid var(--line);\n    padding: 8px 12px;\n    text-align: left;\n    vertical-align: top;\n  }\n  .grammar-content th {\n    background: var(--bg);\n    font-weight: normal;\n    color: var(--accent);\n    font-size: 12px;\n    text-transform: uppercase;\n    letter-spacing: 1px;\n  }\n  .grammar-content .he-cell {\n    direction: rtl;\n    font-family: var(--font-he);\n    color: var(--accent);\n    font-weight: bold;\n  }\n\n  /* SECTION HEADERS in grammar list */\n  .grammar-category {\n    margin: 28px 0 10px;\n    font-size: 11px;\n    color: var(--muted);\n    text-transform: uppercase;\n    letter-spacing: 2px;\n    padding-left: 4px;\n  }\n  .grammar-category:first-child { margin-top: 0; }\n\n  /* COURS PANEL */\n  .cours-search {\n    width: 100%; padding: 14px 18px;\n    font-family: var(--font-ui); font-size: 15px;\n    background: var(--paper); border: 1px solid var(--line); color: var(--ink);\n    box-shadow: 0 1px 2px var(--shadow);\n  }\n  .cours-search:focus { outline: none; border-color: var(--accent-soft); }\n  .cours-search::placeholder { color: var(--muted); }\n  .cours-bar {\n    display: flex; justify-content: space-between; align-items: center;\n    margin: 14px 2px 18px; font-size: 11px; color: var(--muted);\n    letter-spacing: 1.5px; text-transform: uppercase;\n  }\n  .cours-bar a { color: var(--accent); cursor: pointer; border-bottom: 1px solid transparent; }\n  .cours-bar a:hover { border-bottom-color: var(--accent); }\n  .cours-sec {\n    background: var(--paper); border: 1px solid var(--line);\n    margin-bottom: 12px; box-shadow: 0 1px 2px var(--shadow);\n  }\n  .cours-sec > summary {\n    list-style: none; cursor: pointer; padding: 16px 22px;\n    display: flex; justify-content: space-between; align-items: center; gap: 14px;\n  }\n  .cours-sec > summary::-webkit-details-marker { display: none; }\n  .cours-sec > summary .c {\n    font-size: 11px; color: var(--muted); letter-spacing: 1.5px;\n    text-transform: uppercase; white-space: nowrap;\n  }\n  .cours-sec[open] > summary { border-bottom: 1px solid var(--line); }\n  .cours-tbl { width: 100%; border-collapse: collapse; }\n  .cours-tbl td { padding: 10px 22px; border-bottom: 1px solid var(--line); vertical-align: middle; }\n  .cours-tbl tr:last-child td { border-bottom: none; }\n  .cours-tbl tr:nth-child(even) { background: var(--zebra); }\n  .cours-he { direction: rtl; text-align: right; font-size: 21px; color: var(--accent); width: 46%; }\n  .cours-fr { color: var(--ink-soft); font-size: 15px; }\n  .cours-empty {\n    background: var(--paper); border: 1px solid var(--line);\n    padding: 34px; text-align: center; color: var(--muted);\n  }\n  .cours-tbl mark { background: var(--mark); color: inherit; padding: 0 2px; }\n  @media (max-width: 600px) {\n    .cours-he { font-size: 19px; width: 44%; }\n    .cours-tbl td { padding: 9px 14px; }\n    .cours-sec > summary { padding: 14px 16px; }\n  }\n\n  /* STATS PANEL */\n  .stats-card {\n    background: var(--paper);\n    border: 1px solid var(--line);\n    padding: 24px 28px;\n    margin-bottom: 16px;\n    box-shadow: 0 1px 3px var(--shadow);\n  }\n  .stats-card h3 {\n    font-size: 12px;\n    text-transform: uppercase;\n    letter-spacing: 2px;\n    color: var(--accent);\n    font-weight: normal;\n    margin-bottom: 14px;\n  }\n  .stats-numbers {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));\n    gap: 14px;\n    margin-bottom: 18px;\n  }\n  .stat-box {\n    text-align: center;\n    padding: 14px 8px;\n    border: 1px solid var(--line);\n    background: var(--bg);\n  }\n  .stat-box .num {\n    font-size: 28px;\n    color: var(--ink);\n    display: block;\n    line-height: 1;\n    margin-bottom: 4px;\n  }\n  .stat-box .lbl {\n    font-size: 10px;\n    color: var(--muted);\n    text-transform: uppercase;\n    letter-spacing: 1px;\n  }\n  .stat-box.green .num { color: var(--olive); }\n  .stat-box.red .num { color: var(--accent); }\n  .stat-box.gold .num { color: var(--gold); }\n  .difficult-list {\n    list-style: none;\n    padding: 0;\n  }\n  .difficult-list li {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    padding: 8px 0;\n    border-bottom: 1px dashed var(--line);\n    font-size: 14px;\n    gap: 12px;\n  }\n  .difficult-list li:last-child { border-bottom: none; }\n  .difficult-list .word-he {\n    direction: rtl;\n    font-family: var(--font-he);\n    color: var(--accent);\n    font-weight: bold;\n    font-size: 17px;\n    flex-shrink: 0;\n  }\n  .difficult-list .word-fr {\n    color: var(--ink-soft);\n    flex: 1;\n    text-align: center;\n  }\n  .difficult-list .word-stat {\n    font-size: 11px;\n    color: var(--muted);\n    flex-shrink: 0;\n  }\n  .danger-btn {\n    background: transparent;\n    color: var(--accent);\n    border: 1px solid var(--accent);\n    padding: 10px 18px;\n    font-family: inherit;\n    font-size: 12px;\n    letter-spacing: 1px;\n    text-transform: uppercase;\n    cursor: pointer;\n    margin-top: 12px;\n  }\n  .danger-btn:hover { background: var(--accent); color: var(--on-accent); }\n\n  .empty-state {\n    text-align: center;\n    padding: 60px 20px;\n    color: var(--muted);\n    font-style: italic;\n  }\n  .empty-state .big { font-size: 36px; color: var(--accent); margin-bottom: 16px; }\n\n  footer {\n    text-align: center;\n    margin-top: 40px;\n    color: var(--muted);\n    font-size: 11px;\n    letter-spacing: 1px;\n    text-transform: uppercase;\n  }\n  footer .ornament-small { color: var(--accent); margin: 0 8px; }\n\n  @media (max-width: 600px) {\n    .container { padding: 24px 14px 60px; }\n    h1 { font-size: 26px; }\n    .quiz-card { padding: 28px 18px; }\n    .quiz-word { font-size: 30px; }\n    .quiz-word.hebrew { font-size: 36px; }\n    .answer-text { font-size: 22px; }\n    .answer-text.hebrew { font-size: 26px; }\n    .themes-grid { grid-template-columns: 1fr 1fr; }\n    .tab { padding: 10px 12px; font-size: 11px; letter-spacing: 0.5px; }\n    .setup-card { padding: 20px 16px; }\n    .mode-btn { min-width: 100px; padding: 12px 8px; }\n  }\n\n  /* ============================================================\n     THEME CLAIR — noir sur blanc\n     Le fichier etait deja pilote par variables : on redefinit la\n     palette ci-dessus, et on traite ici les 3 roles que --accent\n     cumulait (hebreu / interface / erreur) + les etats \"inverses\".\n     ============================================================ */\n\n  /* Hebreu en bleu nuit : lisible sur blanc, distinct du texte noir */\n  h1 .he,\n  .quiz-word.hebrew,\n  .grammar-title .he,\n  .grammar-content .he-inline,\n  .grammar-content .he-cell,\n  .difficult-list .word-he,\n  .answer-voc,\n  .cours-he { color: var(--he); }\n\n  /* Etats selectionnes : bleu plein */\n  .mode-btn.active,\n  .theme-chip.checked {\n    background: var(--accent);\n    color: var(--on-accent);\n    border-color: var(--accent);\n  }\n  .mode-btn:not(.active):hover { border-color: var(--accent); color: var(--ink); }\n  .theme-chip:not(.checked):hover { border-color: var(--accent-soft); }\n\n  .btn { border-color: var(--line); color: var(--ink); }\n  .btn:hover,\n  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }\n  .btn.primary:hover { background: var(--accent-soft); border-color: var(--accent-soft); }\n\n  .start-btn {\n    background: linear-gradient(135deg, var(--accent), var(--accent-2));\n    color: var(--on-accent);\n    border-radius: 2px;\n  }\n  .start-btn:hover:not(:disabled) {\n    background: linear-gradient(135deg, var(--accent), var(--accent-2));\n    filter: brightness(1.08);\n  }\n  .start-btn:disabled { background: var(--line); color: var(--muted); }\n\n  /* Reussite / erreur : vert et rouge, jamais la couleur d'accent */\n  .btn.correct { border-color: var(--olive); color: var(--olive); }\n  .btn.correct:hover { background: var(--olive); color: var(--on-accent); border-color: var(--olive); }\n  .btn.wrong { border-color: var(--bad); color: var(--bad); }\n  .btn.wrong:hover { background: var(--bad); color: var(--on-accent); border-color: var(--bad); }\n  .score-wrong strong { color: var(--bad); }\n  .stat-box.red .num { color: var(--bad); }\n  .quiz-meta .word-stats.difficult { color: var(--gold); }\n  .danger-btn { color: var(--bad); border-color: var(--bad); }\n  .danger-btn:hover { background: var(--bad); color: var(--on-accent); }\n\n  /* Onglet Cours */\n  .cours-search { font-family: inherit; }\n  .cours-tbl tr:nth-child(even) { background: var(--zebra); }\n  .cours-tbl mark { background: var(--mark); color: var(--ink); }\n\n  ::selection { background: var(--selection); }\n  ::-webkit-scrollbar { width: 10px; height: 10px; }\n  ::-webkit-scrollbar-track { background: var(--bg); }\n  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }\n  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }\n\n\n  /* Sur blanc, les survols en var(--bg) seraient invisibles */\n  .grammar-header:hover { background: var(--hover); }\n  .theme-chip:not(.checked):hover { background: var(--hover); }\n  .mode-btn:not(.active):hover { background: var(--hover); }\n  ::-webkit-scrollbar-track { background: var(--bg); }\n\n\n  /* Survol des elements deja selectionnes : on garde le bleu, on l'eclaircit */\n  .theme-chip.checked:hover,\n  .mode-btn.active:hover,\n  .dir-btn.active:hover { filter: brightness(1.15); }\n\n\n  /* ============================================================\n     MISE EN PAGE ADAPTATIVE\n     Le conteneur s'elargit par paliers. La largeur sert la ou elle\n     aide (puces de themes, lexique, grammaire) ; la question du quiz\n     et les textes suivis restent bornes pour rester lisibles.\n     ============================================================ */\n  @media (min-width: 1000px) { .container { max-width: 940px; } }\n  @media (min-width: 1280px) { .container { max-width: 1180px; padding-left: 32px; padding-right: 32px; } }\n  @media (min-width: 1600px) { .container { max-width: 1440px; } }\n  @media (min-width: 1900px) { .container { max-width: 1660px; } }\n\n  @media (min-width: 1000px) {\n    /* la question reste centree : une ligne de texte tres large se lit mal */\n    .quiz-card, .score-bar, #series-end .quiz-card {\n      max-width: 860px; margin-left: auto; margin-right: auto;\n    }\n    .grammar-intro { max-width: 860px; }\n\n    /* lexique et grammaire en colonnes */\n    #cours-list {\n      display: grid; gap: 12px; align-items: start;\n      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));\n    }\n    #grammar-list {\n      display: grid; gap: 12px; align-items: start;\n      grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));\n    }\n    .cours-sec, .grammar-section { margin-bottom: 0; }\n    .grammar-category { grid-column: 1 / -1; margin-top: 18px; }\n    .grammar-category:first-child { margin-top: 0; }\n  }\n\n  /* ============================================================\n     SERIE ET MOTS RATES\n     ============================================================ */\n  .series-score { font-size: 46px; font-weight: bold; color: var(--accent); margin: 6px 0 2px; }\n  .series-sub { color: var(--muted); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }\n  .series-msg { margin: 14px 0 22px; color: var(--ink-soft); font-size: 15px; }\n  .missed-toggle {\n    display: inline-block; margin-top: 20px; cursor: pointer;\n    color: var(--accent); font-size: 13px; border-bottom: 1px solid transparent;\n  }\n  .missed-toggle:hover { border-bottom-color: var(--accent); }\n  .missed-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }\n  .missed-intro { font-size: 13px; color: var(--ink-soft); margin-bottom: 14px; }\n  .missed-empty { color: var(--muted); font-style: italic; justify-content: center; }\n  #series-missed-list { text-align: left; margin-top: 14px; }\n\n\n  /* Forme au present des verbes */\n  .answer-pres {\n    direction: rtl; margin-top: 2px; font-size: 26px; color: var(--gold);\n    font-family: var(--font-he);\n  }\n  .cours-pres {\n    display: block; direction: rtl; margin-top: 3px;\n    font-size: 15px; color: var(--gold); opacity: 0.95;\n  }\n\n\n  /* ============================================================\n     CARTE DE QUIZ CLIQUABLE + POUCES\n     ============================================================ */\n  /* uniquement la carte du quiz : l'ecran de fin de serie reutilise .quiz-card */\n  #quiz-view .quiz-card { cursor: pointer; transition: box-shadow .18s, transform .18s; user-select: none; }\n  #quiz-view .quiz-card:hover { box-shadow: 0 4px 18px var(--shadow); }\n  #quiz-view .quiz-card:active { transform: scale(0.997); }\n  #quiz-view .quiz-card.revealed { cursor: default; }\n  #quiz-view .quiz-card.revealed:hover { box-shadow: 0 1px 3px var(--shadow); }\n  #quiz-view .quiz-card.revealed:active { transform: none; }\n\n  .tap-hint {\n    font-size: 12px; color: var(--muted); letter-spacing: 1.5px;\n    text-transform: uppercase; animation: hintPulse 2.4s ease-in-out infinite;\n  }\n  @keyframes hintPulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }\n\n  .judge-btn {\n    display: flex; flex-direction: column; align-items: center; gap: 7px;\n    padding: 15px 34px; cursor: pointer; background: transparent;\n    border: 2px solid var(--line); border-radius: 14px;\n    font-family: inherit; font-size: 11px; letter-spacing: 1.5px;\n    text-transform: uppercase; color: var(--muted);\n    transition: all .15s;\n  }\n  .judge-btn svg { width: 34px; height: 34px; display: block; }\n  .judge-up { color: var(--olive); border-color: var(--olive); }\n  .judge-up:hover { background: var(--olive); color: var(--on-accent); }\n  .judge-down { color: var(--bad); border-color: var(--bad); }\n  .judge-down:hover { background: var(--bad); color: var(--on-accent); }\n  .judge-btn:active { transform: translateY(1px); }\n  #actions-judge { gap: 18px; margin-top: 22px; }\n\n  @media (max-width: 600px) {\n    .judge-btn { padding: 13px 26px; }\n    .judge-btn svg { width: 30px; height: 30px; }\n  }\n\n\n  /* Croix : mettre un mot de cote */\n  /* Au repos, la croix etait en var(--line) sur fond blanc : 1,31:1 de\n     contraste, donc invisible. Elle est desormais lisible et libellee. */\n  .card-x {\n    position: absolute; top: 14px; right: 14px;\n    display: flex; align-items: center; gap: 7px;\n    padding: 7px 13px;\n    background: var(--bg); border: 1px solid var(--line); border-radius: 20px;\n    color: var(--muted); cursor: pointer; transition: all .15s; z-index: 2;\n    font-family: inherit; font-size: 10px; letter-spacing: 1.2px;\n    text-transform: uppercase; line-height: 1;\n  }\n  .card-x svg { width: 13px; height: 13px; flex: none; }\n  .card-x:hover {\n    color: var(--bad); border-color: var(--bad);\n    background: var(--bad-tint);\n  }\n  /* la pastille se loge au-dessus de l'en-tete de la carte */\n  #quiz-view .quiz-card { padding-top: 62px; }\n  @media (max-width: 700px) {\n    .card-x-label { display: none; }\n    .card-x { padding: 9px; border-radius: 50%; }\n    .card-x svg { width: 15px; height: 15px; }\n    #quiz-view .quiz-card { padding-top: 56px; }\n  }\n  .restore-btn {\n    margin-left: auto; padding: 5px 12px; cursor: pointer;\n    background: transparent; border: 1px solid var(--line); border-radius: 8px;\n    font-family: inherit; font-size: 11px; letter-spacing: 1px;\n    text-transform: uppercase; color: var(--muted); transition: all .15s;\n  }\n  .restore-btn:hover { border-color: var(--accent); color: var(--accent); }\n\n\n  /* ============================================================\n     COURS PASSE / FUTUR — feuille de style d'origine, cloisonnee\n     sous #panel-tenses. Le document stylait des balises nues (h2, p, ul, .he)\n     qui existent aussi dans le site : sans cloisonnement il aurait\n     repeint toute la page.\n     ============================================================ */\n\n#panel-tenses{\n  --bg: transparent;\n  --panel: var(--paper);\n  --accent: var(--b-paal);\n  --past: var(--t-past);\n  --fut: var(--t-fut);\n  --paal: var(--b-paal);\n  --nifal: var(--b-nifal);\n  --piel: var(--b-piel);\n  --pual: var(--b-pual);\n  --hifil: var(--b-hifil);\n  --hufal: var(--b-hufal);\n  --hitpael: var(--b-hitpael);\n  --warn: var(--t-warn-ink);\n  --ok: var(--t-ok);\n}\n#panel-tenses *{box-sizing:border-box}\n#panel-tenses{scroll-behavior:smooth;scroll-padding-top:70px}\n#panel-tenses{\n  margin:0;background:var(--bg);color:var(--ink);\n  font-family:var(--font-ui);\n  font-size:16.5px;line-height:1.65;\n}\n#panel-tenses .he{\n  font-family:var(--font-he);\n  direction:rtl;unicode-bidi:isolate;font-size:1.32em;line-height:2;\n}\n#panel-tenses .he-lg{font-size:1.6em}\n#panel-tenses .tr{color:var(--ink-soft);font-style:italic;font-size:.86em;white-space:nowrap}\n\n/* ---------- layout ---------- */\n#panel-tenses header.top{\n  position:sticky;top:0;z-index:50;background:var(--glass);\n  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);\n}\n#panel-tenses .topinner{max-width:1080px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}\n#panel-tenses .brand{font-weight:700;letter-spacing:-.01em;font-size:1.02rem;margin-right:auto}\n#panel-tenses .brand span{color:var(--accent)}\n#panel-tenses nav a{\n  color:var(--ink-soft);text-decoration:none;font-size:.83rem;font-weight:600;\n  padding:5px 9px;border-radius:6px;white-space:nowrap;\n}\n#panel-tenses nav a:hover{background:var(--hover);color:var(--ink)}\n#panel-tenses main{max-width:1080px;margin:0 auto;padding:0 22px 90px}\n#panel-tenses .hero{padding:54px 0 30px;border-bottom:1px solid var(--line);margin-bottom:34px}\n#panel-tenses .hero h1{font-size:2.5rem;line-height:1.15;margin:0 0 14px;letter-spacing:-.02em}\n#panel-tenses .hero p{color:var(--ink-soft);max-width:66ch;margin:0 0 8px;font-size:1.04rem}\n#panel-tenses .kicker{text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;font-weight:700;color:var(--accent);margin-bottom:12px}\n#panel-tenses section{margin:0 0 20px;scroll-margin-top:70px}\n#panel-tenses h2{font-size:1.62rem;letter-spacing:-.015em;margin:46px 0 6px;padding-top:14px}\n#panel-tenses h2 .num{color:var(--accent);font-variant-numeric:tabular-nums;margin-left:2px}\n#panel-tenses h3{font-size:1.16rem;margin:30px 0 8px;letter-spacing:-.01em}\n#panel-tenses h4{font-size:.97rem;margin:20px 0 6px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.07em}\n#panel-tenses p{margin:0 0 12px}\n#panel-tenses ul, #panel-tenses ol{margin:0 0 14px;padding-left:2 y:flex;flex-wrap:wrap;gap:6px;margin:18px 0 0}\n#panel-tenses .tabs button{\n  border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);\n  padding:8px 14px;border-radius:9px;cursor:pointer;font-size:.87rem;font-weight:700;\n  font-family:inherit;transition:.15s;\n}\n#panel-tenses .tabs button:hover{border-color:var(--line-strong);color:var(--ink)}\n#panel-tenses .tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}\n#panel-tenses .tabpane{display:none;animation:fade .2s ease}\n#panel-tenses .tabpane.on{display:block}\n@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}\n\n/* ---------- accordion ---------- */\n#panel-tenses details{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:10px 0;overflow:hidden}\n#panel-tenses details[open]{box-shadow:0 1px 3px var(--shadow)}\n#panel-tenses summary{\n  cursor:pointer;padding:13px 18px;font-weight:700;list-style:none;\n  display:flex;align-items:center;gap:10px;font-size:1rem;\n}\n#panel-tenses summary::-webkit-details-marker{display:none}\n#panel-tenses summary::before{content:\"▸\";color:var(--accent);font-size:.9em;transition:.15s}\n#panel-tenses details[open] summary::before{transform:rotate(90deg)}\n#panel-tenses summary:hover{background:var(--hover)}\n#panel-tenses .detbody{padding:2px 18px 18px;border-top:1px solid var(--line)}\n#panel-tenses .gz-tag{\n  margin-left:auto;font-size:.72rem;font-weight:700;letter-spacing:.05em;\n  background:var(--t-soft);color:var(--ink-soft);padding:3px 9px;border-radius:20px;text-transform:uppercase;\n}\n\n/* ---------- misc ---------- */\n#panel-tenses .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}\n@media(max-width:760px){.grid2{grid-template-columns:1fr}.hero h1{font-size:1.9rem}}\n#panel-tenses .pill{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:20px;letter-spacing:.04em}\n#panel-tenses .pill.past{background:var(--t-past-tint);color:var(--past)}\n#panel-tenses .pill.fut{background:var(--t-fut-tint);color:var(--fut)}\n#panel-tenses .formula{\n  font-size:1.05rem;text-align:center;padding:16px;background:var(--t-soft);\n  border:1px dashed var(--line-strong);border-radius:10px;margin:14px 0;\n}\n#panel-tenses .toc{columns:2;column-gap:30px;font-size:.94rem}\n@media(max-width:640px){.toc{columns:1}}\n#panel-tenses .toc a{color:var(--ink);text-decoration:none;display:block;padding:3px 0;border-bottom:1px dotted var(--line)}\n#panel-tenses .toc a:hover{color:var(--accent)}\n#panel-tenses footer{border-top:1px solid var(--line);padding:26px 0;color:var(--ink-soft);font-size:.87rem;text-align:center}\n\n/* ---------- quiz ---------- */\n#panel-tenses .q{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:15px 18px;margin:12px 0}\n#panel-tenses .q .qnum{font-size:.74rem;font-weight:700;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}\n#panel-tenses .q .qtext{margin:5px 0 10px}\n#panel-tenses .q input[type=text]{\n  font-family:var(--font-he);direction:rtl;font-size:1.25rem;\n  padding:7px 12px;border:1px solid var(--line-strong);border-radius:8px;width:230px;background:var(--paper);\n}\n#panel-tenses .q input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}\n#panel-tenses .opts{display:flex;flex-direction:column;gap:6px}\n#panel-tenses .opt{\n  border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;\n  background:var(--paper);text-align:right;direction:rtl;\n  font-family:var(--font-he);font-size:1.2rem;transition:.12s;\n}\n#panel-tenses .opt:hover{border-color:var(--accent)}\n#panel-tenses .opt.sel{border-color:var(--ink);background:var(--hover)}\n#panel-tenses .opt.good{border-color:var(--ok);background:var(--mint)}\n#panel-tenses .opt.bad{border-color:var(--warn);background:var(--bad-tint)}\n#panel-tenses .fb{margin-top:9px;font-size:.9rem;display:none}\n#panel-tenses .fb.show{display:block}\n#panel-tenses .fb.good{color:var(--ok)}\n#panel-tenses .fb.bad{color:var(--warn)}\n#panel-tenses .qbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}\n#panel-tenses .btn{\n  background:var(--ink);color:var(--paper);border:0;padding:10px 20px;border-radius:9px;\n  font-weight:700;cursor:pointer;font-size:.9rem;font-family:inherit;\n}\n#panel-tenses .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}\n#panel-tenses .btn:hover{opacity:.88}\n@media print{\n  #panel-tenses header.top{display:none}\n  #panel-tenses .tabpane{display:block !important}\n  #panel-tenses details{page-break-inside:avoid}\n  #panel-tenses details .detbody{display:block !important}\n}\n\n  /* neutralisations : le document etait une page autonome */\n  #panel-tenses { min-height: 0; }\n  #panel-tenses header.top { position: static; backdrop-filter: none; }\n  #panel-tenses .hero { padding-top: 8px; }\n\n\n  /* ============================================================\n     COURS — bandeau de stats et de revision en haut de l'onglet\n     ============================================================ */\n  .cours-dash {\n    border: 1px solid var(--line); background: var(--paper);\n    border-radius: 6px; padding: 16px 18px; margin: 0 0 16px;\n  }\n  .cd-grid {\n    display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));\n    gap: 10px; margin-bottom: 12px;\n  }\n  .cd-box { text-align: center; padding: 10px 6px; border: 1px solid var(--line); background: var(--bg); }\n  .cd-box b { display: block; font-size: 23px; font-weight: 400; line-height: 1; margin-bottom: 4px; color: var(--ink); }\n  .cd-box span { font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }\n  .cd-box.green b { color: var(--olive); }\n  .cd-box.red b { color: var(--bad); }\n  .cd-box.gold b { color: var(--gold); }\n  .cd-flash {\n    font-size: 11.5px; color: var(--muted); letter-spacing: .4px;\n    display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center;\n  }\n  .cd-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }\n  .cd-actions .btn { font-size: 11px; padding: 9px 16px; }\n  @media (max-width: 700px) {\n    .cours-dash { padding: 14px; }\n    .cd-box b { font-size: 20px; }\n  }\n\n  /* ============================================================\n     FLASHCARDS — revision par theme, en superposition\n     ============================================================ */\n  .flash-btn {\n    padding: 5px 11px; cursor: pointer; white-space: nowrap;\n    background: var(--accent); border: 1px solid var(--accent); border-radius: 20px;\n    font-family: inherit; font-size: 10px; letter-spacing: 1px;\n    text-transform: uppercase; color: var(--on-accent); transition: all .15s;\n  }\n  .flash-btn:hover { filter: brightness(1.12); }\n  /* En-tete de section : ligne 1 = nom + Flashcards + nombre de mots ;\n     ligne 2 (section ouverte) = boutons de masquage. Rien ne deborde du cadre. */\n  .cours-sec > summary { flex-wrap: wrap; row-gap: 10px; }\n  .cours-sec > summary .cours-name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }\n  .cours-sec > summary .flash-btn { margin-left: 0; flex: none; }\n  .cours-sec > summary .c { flex: none; }\n  .cours-sec > summary .cours-tools {\n    order: 9; flex: 1 1 100%; margin: 0; justify-content: flex-start;\n  }\n\n  .flash-ov {\n    position: fixed; inset: 0; z-index: 90; display: none;\n    background: var(--overlay); backdrop-filter: blur(3px);\n    padding: 20px; overflow-y: auto;\n  }\n  .flash-ov.on { display: flex; align-items: center; justify-content: center; }\n  .flash-box {\n    width: 100%; max-width: 620px; background: var(--paper);\n    border: 1px solid var(--line); border-radius: 6px; padding: 22px;\n    box-shadow: 0 18px 50px var(--shadow);\n  }\n  .flash-top { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }\n  .flash-title { font-weight: 600; font-size: 15px; flex: 1; }\n  .flash-close {\n    background: none; border: none; cursor: pointer; font-size: 22px;\n    line-height: 1; color: var(--muted); font-family: inherit; padding: 0 4px;\n  }\n  .flash-close:hover { color: var(--accent); }\n  .flash-sub {\n    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;\n    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;\n    color: var(--muted); margin-bottom: 16px;\n  }\n  .flash-dirs { display: flex; gap: 6px; margin-left: auto; }\n  .flash-dir {\n    padding: 4px 10px; cursor: pointer; background: var(--bg);\n    border: 1px solid var(--line); border-radius: 20px; font-family: inherit;\n    font-size: 10px; letter-spacing: 1px; text-transform: uppercase;\n    color: var(--muted); transition: all .15s;\n  }\n  .flash-dir:hover { border-color: var(--accent); color: var(--accent); }\n  .flash-dir.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }\n\n  .conj-line { display: flex; gap: 12px; align-items: baseline; justify-content: center; flex-wrap: wrap; }\n  .conj-tense {\n    font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase;\n    color: var(--muted); min-width: 62px; text-align: left;\n  }\n  .conj-form { direction: rtl; font-size: 27px; color: var(--accent); }\n  .conj-ask { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }\n  .conj-inf {\n    font-size: 13px; color: var(--ink-soft); display: flex; gap: 10px;\n    align-items: baseline; justify-content: center; flex-wrap: wrap;\n  }\n  .conj-inf .he { direction: rtl; font-size: 17px; color: var(--ink); }\n  .flash-card.solo .conj-form { font-size: 40px; }\n  @media (max-width: 700px) {\n    .conj-form { font-size: 23px; }\n    .flash-card.solo .conj-form { font-size: 31px; }\n    .conj-tense { min-width: 54px; }\n  }\n\n  .flash-card {\n    border: 1px solid var(--line); border-radius: 6px; background: var(--bg);\n    min-height: 210px; display: flex; flex-direction: column; align-items: center;\n    justify-content: center; gap: 12px; padding: 26px 20px; cursor: pointer;\n    text-align: center; user-select: none;\n  }\n  .flash-card:hover { border-color: var(--accent-soft); }\n  .flash-face-fr { font-size: 22px; color: var(--ink); }\n  .flash-face-he { direction: rtl; font-size: 34px; color: var(--accent); line-height: 1.5; }\n  .flash-pres { direction: rtl; font-size: 17px; color: var(--gold); }\n  .flash-sep { width: 46px; border-top: 1px solid var(--line); }\n  .flash-hint { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }\n  .flash-card.solo .flash-face-fr { font-size: 34px; }\n  .flash-card.solo .flash-face-he { font-size: 50px; }\n  .flash-key {\n    display: inline-block; margin-left: 7px; padding: 1px 6px;\n    border: 1px solid currentColor; border-radius: 4px; opacity: .65;\n    font-size: 10px; line-height: 1.5; vertical-align: 1px;\n  }\n  .flash-acts { display: flex; gap: 8px; margin-top: 16px; }\n  .flash-acts .btn {\n    white-space: nowrap; padding: 12px 10px; font-size: 11.5px; letter-spacing: .6px;\n  }\n  .flash-acts .btn { flex: 1; }\n  .flash-bar { height: 3px; background: var(--line); border-radius: 3px; margin: 16px 0 0; overflow: hidden; }\n  .flash-bar i { display: block; height: 100%; background: var(--accent); transition: width .2s; }\n  .flash-end { text-align: center; padding: 18px 0 4px; }\n  .flash-end .big { font-size: 30px; color: var(--accent); }\n  .flash-end p { color: var(--ink-soft); margin: 10px 0 18px; }\n  @media (max-width: 700px) {\n    .flash-box { padding: 16px; }\n    .flash-card { min-height: 180px; padding: 20px 14px; }\n    .flash-face-he { font-size: 29px; }\n    .flash-face-fr { font-size: 19px; }\n    .flash-card.solo .flash-face-fr { font-size: 26px; }\n    .flash-card.solo .flash-face-he { font-size: 38px; }\n    .flash-acts { flex-direction: column; }\n  }\n\n  /* ============================================================\n     LEXIQUE — vues : par theme / par nature grammaticale\n     ============================================================ */\n  .cours-views { display: flex; gap: 8px; margin: 0 0 14px; flex-wrap: wrap; }\n  .view-btn {\n    padding: 8px 16px; cursor: pointer; background: var(--bg);\n    border: 1px solid var(--line); border-radius: 20px; font-family: inherit;\n    font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;\n    color: var(--muted); transition: all .15s;\n  }\n  .view-btn:hover { border-color: var(--accent); color: var(--accent); }\n  .view-btn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }\n\n  /* ============================================================\n     LEXIQUE — masquage d'une colonne pour s'entrainer\n     ============================================================ */\n  .cours-sec > summary { gap: 10px; }\n  .cours-name { flex: none; }\n  .cours-tools { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }\n  /* les options n'apparaissent qu'une fois la categorie ouverte */\n  .cours-sec:not([open]) .cours-tools { display: none; }\n  .mask-btn {\n    padding: 5px 11px; cursor: pointer; white-space: nowrap;\n    background: var(--bg); border: 1px solid var(--line); border-radius: 20px;\n    font-family: inherit; font-size: 10px; letter-spacing: 1px;\n    text-transform: uppercase; color: var(--muted); transition: all .15s;\n  }\n  .mask-btn:hover { border-color: var(--accent); color: var(--accent); }\n  .mask-btn.on {\n    background: var(--accent); border-color: var(--accent); color: var(--on-accent);\n  }\n  .cours-sec.hide-he .cours-he:not(.shown),\n  .cours-sec.hide-fr .cours-fr:not(.shown) {\n    filter: blur(6px); cursor: pointer; user-select: none;\n  }\n  .cours-sec.hide-he .cours-he:not(.shown):hover,\n  .cours-sec.hide-fr .cours-fr:not(.shown):hover { filter: blur(2.5px); }\n  .cours-sec.hide-he .cours-he.shown,\n  .cours-sec.hide-fr .cours-fr.shown { cursor: pointer; }\n  @media (max-width: 700px) {\n    .cours-sec > summary .cours-tools { margin: 0; }\n    .mask-btn { font-size: 9px; padding: 5px 9px; }\n  }\n\n\n  /* ============================================================\n     CHARTE « DOUX & LUMINEUX » (2026)\n     Couche finale : formes, typographie et couleurs des composants,\n     entièrement pilotée par les jetons définis dans :root.\n     ============================================================ */\n  html, body { font-family: var(--font-ui); color: var(--ink); background-color: var(--bg); }\n  body { -webkit-font-smoothing: antialiased; font-size: 15px; }\n  :focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 10px; }\n\n  /* --- en-tête --- */\n  .container > header { border-bottom: 0; padding-bottom: 6px; margin-bottom: 18px; }\n  .container > header .ornament {\n    display: inline-flex; align-items: center; justify-content: center;\n    letter-spacing: 0; font-size: 0; margin-bottom: 14px;\n  }\n  .container > header .ornament::before {\n    content: \"Révisions quotidiennes\"; font: 700 12px/1 var(--font-ui);\n    color: var(--accent); background: var(--accent-tint); padding: 7px 14px; border-radius: 999px;\n  }\n  h1 {\n    font-family: var(--font-display); font-weight: 900; color: var(--ink);\n    font-size: clamp(32px, 5.4vw, 48px); letter-spacing: -0.02em; line-height: 1.1;\n    text-wrap: balance;\n  }\n  h1 .he {\n    font-family: var(--font-he); font-weight: 700;\n    background: linear-gradient(120deg, var(--accent), var(--accent-2));\n    -webkit-background-clip: text; background-clip: text; color: transparent;\n  }\n  .subtitle { font-style: normal; font-size: 15px; letter-spacing: 0; color: var(--muted); margin-top: 6px; }\n\n  .global-stats { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; letter-spacing: 0; font-size: 13px; }\n  .global-stats > span:not(.sep) {\n    background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;\n    backdrop-filter: blur(8px);\n  }\n  .global-stats .sep { display: none; }\n  .global-stats strong { font-weight: 800; color: var(--accent); }\n\n  /* --- navigation principale : pilules --- */\n  .container > .tabs {\n    border-bottom: 0; gap: 6px; flex-wrap: wrap; justify-content: center;\n    background: var(--glass); border: 1px solid var(--line); border-radius: 999px;\n    padding: 6px; width: fit-content; max-width: 100%; margin: 0 auto 30px;\n    backdrop-filter: blur(10px); box-shadow: var(--shadow-card);\n  }\n  .container > .tabs .tab {\n    border: 0; border-radius: 999px; padding: 9px 18px;\n    text-transform: none; letter-spacing: 0; font-size: 14.5px; font-weight: 700; color: var(--muted);\n  }\n  .container > .tabs .tab:hover { color: var(--ink); background: var(--hover); }\n  .container > .tabs .tab.active { color: var(--paper); background: var(--ink); border: 0; }\n\n  /* --- cartes --- */\n  .setup-card, .quiz-card, .stats-card, .grammar-section, .cours-sec, .cours-dash, .flash-box {\n    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);\n    box-shadow: var(--shadow-card);\n  }\n  .setup-card { padding: 28px; }\n  .setup-card h2, .stats-card h3 {\n    font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: 0;\n    text-transform: none; color: var(--ink); margin-bottom: 14px;\n  }\n  .stats-card { padding: 24px; }\n\n  /* --- boutons --- */\n  .btn, .danger-btn {\n    border-radius: 999px; text-transform: none; letter-spacing: 0; font-weight: 700; font-size: 14px;\n    padding: 11px 20px; border: 1.5px solid var(--line-strong); background: var(--paper); color: var(--ink-soft);\n  }\n  .btn:hover { background: var(--hover); border-color: var(--accent-soft); color: var(--ink); }\n  .btn.primary {\n    background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: var(--on-accent);\n    box-shadow: 0 10px 22px -12px var(--accent);\n  }\n  .btn.primary:hover { filter: brightness(1.06); background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); }\n  .danger-btn { color: var(--bad); border-color: var(--bad-tint); background: var(--bad-tint); }\n  .danger-btn:hover { background: var(--bad); color: var(--paper); border-color: var(--bad); }\n  .start-btn {\n    border-radius: 999px; text-transform: none; letter-spacing: 0; font-weight: 800; font-size: 16px; padding: 17px;\n    box-shadow: 0 16px 30px -16px var(--accent);\n  }\n  .start-btn:disabled { box-shadow: none; }\n\n  /* modes, longueur de série, sens de traduction */\n  .mode-btn {\n    border-radius: var(--radius-sm); border: 1.5px solid var(--line); background: var(--paper);\n    font-weight: 700; color: var(--ink-soft); padding: 13px 10px;\n  }\n  .mode-btn .sub { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 12px; }\n  .mode-btn:not(.active):hover { border-color: var(--accent-soft); background: var(--hover); }\n  .mode-btn.active { background: var(--accent-tint); color: var(--accent); border-color: var(--accent-soft); }\n\n  /* puces de thèmes */\n  .themes-grid { gap: 8px; }\n  .theme-chip {\n    border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper);\n    color: var(--ink-soft); font-weight: 600; padding: 9px 14px;\n  }\n  .theme-chip:not(.checked):hover { border-color: var(--accent-soft); background: var(--hover); }\n  .theme-chip.checked { background: var(--accent-tint); color: var(--accent); border-color: var(--accent-soft); }\n  .theme-chip.checked::before {\n    content: \"\"; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none;\n  }\n  .theme-chip .count { font-variant-numeric: tabular-nums; font-weight: 700; }\n  .theme-actions a { text-decoration: none; font-weight: 700; color: var(--accent); }\n  .theme-actions a:hover { text-decoration: underline; }\n  .review-info { border-left: 0; background: var(--peach); color: var(--ink-soft); border-radius: var(--radius-sm); font-style: normal; }\n\n  /* --- carte de quiz --- */\n  .quiz-card { padding: 34px 30px; border-radius: 26px; }\n  .quiz-meta { border-bottom: 1px solid var(--line); letter-spacing: .08em; font-weight: 700; }\n  .quiz-meta .theme-tag {\n    color: var(--accent); background: var(--accent-tint); padding: 4px 11px; border-radius: 999px; letter-spacing: 0;\n    text-transform: none; font-size: 12.5px;\n  }\n  .quiz-prompt { letter-spacing: .12em; font-weight: 700; }\n  .quiz-word { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.01em; }\n  .quiz-word.hebrew, .answer-text.hebrew, .answer-voc { font-family: var(--font-he); }\n  .answer-zone { border-color: var(--line); border-style: solid; border-width: 1px 0; }\n  .answer-text { color: var(--olive); font-weight: 700; }\n  .judge-btn { border-radius: 18px; border-width: 1.5px; font-weight: 800; letter-spacing: .04em; }\n  .judge-up { background: var(--mint); border-color: transparent; }\n  .judge-down { background: var(--bad-tint); border-color: transparent; }\n  .judge-up:hover { background: var(--olive); color: var(--paper); }\n  .judge-down:hover { background: var(--bad); color: var(--paper); }\n  .card-x { border-radius: 999px; }\n  .score-bar { letter-spacing: 0; }\n  .score-item strong { font-family: var(--font-display); font-weight: 900; }\n\n  /* --- statistiques en tuiles teintées --- */\n  .stats-numbers { gap: 10px; }\n  .stat-box { border: 0; border-radius: 18px; background: var(--accent-tint); padding: 16px 8px; }\n  .stat-box .num { font-family: var(--font-display); font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; }\n  .stat-box .lbl { color: var(--ink-soft); font-weight: 700; letter-spacing: .06em; }\n  .stat-box.green { background: var(--mint); } .stat-box.green .num { color: var(--olive); }\n  .stat-box.red { background: var(--rose-tint); } .stat-box.red .num { color: var(--rose); }\n  .stat-box.gold { background: var(--peach); } .stat-box.gold .num { color: var(--gold); }\n  .difficult-list li { border-color: var(--line); }\n  .difficult-list .word-he { font-family: var(--font-he); }\n\n  /* --- onglet Cours --- */\n  .cours-dash { padding: 20px; }\n  .cd-box { border: 0; border-radius: 16px; background: var(--accent-tint); }\n  .cd-box b { font-family: var(--font-display); font-weight: 900; color: var(--accent); }\n  .cd-box span { color: var(--ink-soft); font-weight: 700; }\n  .cd-box.green { background: var(--mint); } .cd-box.green b { color: var(--olive); }\n  .cd-box.red { background: var(--rose-tint); } .cd-box.red b { color: var(--rose); }\n  .cd-box.gold { background: var(--peach); } .cd-box.gold b { color: var(--gold); }\n  .cd-actions .btn { font-size: 13.5px; padding: 10px 18px; }\n\n  .view-btn {\n    border-radius: 999px; text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 700;\n    padding: 9px 18px; border: 1.5px solid var(--line); background: var(--paper); color: var(--muted);\n  }\n  .view-btn:hover { color: var(--ink); border-color: var(--accent-soft); }\n  .view-btn.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }\n  .cours-search {\n    border-radius: 999px; padding: 14px 22px; border: 1.5px solid var(--line); box-shadow: var(--shadow-card);\n    background: var(--paper);\n  }\n  .cours-search:focus { border-color: var(--accent-soft); box-shadow: 0 0 0 4px var(--accent-tint); outline: none; }\n  .cours-bar { letter-spacing: .06em; font-weight: 700; }\n  .cours-bar a { color: var(--accent); }\n  .cours-sec { overflow: hidden; }\n  .cours-sec > summary .cours-name { font-family: var(--font-display); font-weight: 800; font-size: 17px; color: var(--ink); }\n  .cours-sec > summary .c { font-weight: 700; letter-spacing: .06em; }\n  .cours-sec:hover > summary { background: var(--hover); }\n  .cours-sec[open] > summary { border-bottom-color: var(--line); }\n  .cours-tbl td { border-color: var(--line); }\n  .cours-tbl tr:nth-child(even) { background: var(--zebra); }\n  .cours-he { font-family: var(--font-he); color: var(--he); font-weight: 600; }\n  .cours-fr { color: var(--ink-soft); }\n  .cours-pres { color: var(--gold); font-family: var(--font-he); }\n  .cours-empty { border-radius: var(--radius); background: var(--glass); border: 1px dashed var(--line-strong); }\n  .mask-btn {\n    border-radius: 999px; text-transform: none; letter-spacing: 0; font-size: 12.5px; font-weight: 700;\n    padding: 6px 13px; border: 1.5px solid var(--line); background: var(--paper); color: var(--muted);\n  }\n  .mask-btn:hover { color: var(--accent); border-color: var(--accent-soft); }\n  .mask-btn.on { background: var(--accent-tint); color: var(--accent); border-color: var(--accent-soft); }\n  .flash-btn {\n    border-radius: 999px; text-transform: none; letter-spacing: 0; font-size: 12.5px; font-weight: 800;\n    padding: 7px 14px; border: 0; color: var(--on-accent);\n    background: linear-gradient(135deg, var(--accent), var(--accent-2));\n    box-shadow: 0 8px 16px -10px var(--accent);\n  }\n\n  /* --- grammaire --- */\n  .grammar-intro { border-left: 0; font-style: normal; background: var(--glass); border-radius: var(--radius-sm); padding: 14px 18px; }\n  .grammar-category { font-family: var(--font-display); font-weight: 800; letter-spacing: 0; text-transform: none; font-size: 15px; color: var(--accent); }\n  .grammar-section { overflow: hidden; }\n  .grammar-header { padding: 18px 22px; }\n  .grammar-title { font-family: var(--font-display); font-weight: 800; }\n  .grammar-title .he { font-family: var(--font-he); color: var(--he); }\n  .grammar-toggle {\n    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;\n    background: var(--accent-tint); color: var(--accent); font-size: 18px; line-height: 1;\n  }\n  .grammar-content { border-top: 1px solid var(--line); }\n  .grammar-content .example { border-left: 0; background: var(--peach); border-radius: var(--radius-sm); padding: 12px 16px; }\n  .grammar-content .he-inline, .grammar-content .he-cell { font-family: var(--font-he); color: var(--he); }\n  .grammar-content table { border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }\n  .grammar-content th, .grammar-content td { border: 0; border-bottom: 1px solid var(--line); }\n  .grammar-content tr:last-child td { border-bottom: 0; }\n  .grammar-content th { background: var(--accent-tint); color: var(--accent); font-weight: 800; letter-spacing: .04em; }\n\n  /* --- flashcards --- */\n  .flash-ov { background: var(--overlay); backdrop-filter: blur(8px); }\n  .flash-box { border-radius: 26px; box-shadow: var(--shadow-pop); padding: 24px; }\n  .flash-title { font-family: var(--font-display); font-weight: 900; font-size: 18px; }\n  .flash-close { width: 34px; height: 34px; border-radius: 50%; background: var(--hover); padding: 0; }\n  .flash-dir {\n    border-radius: 999px; text-transform: none; letter-spacing: 0; font-weight: 700; font-size: 12px;\n    border: 1.5px solid var(--line); background: var(--paper); color: var(--muted);\n  }\n  .flash-dir.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }\n  .flash-card {\n    border-radius: 22px; border: 1px solid var(--line);\n    background: linear-gradient(160deg, var(--paper) 0%, var(--accent-tint) 140%);\n  }\n  .flash-card:hover { border-color: var(--accent-soft); }\n  .flash-face-fr { font-family: var(--font-display); font-weight: 800; color: var(--ink); }\n  .flash-face-he, .conj-form, .flash-pres { font-family: var(--font-he); }\n  .flash-face-he, .conj-form { color: var(--he); }\n  .flash-bar { height: 6px; border-radius: 999px; background: var(--hover); }\n  .flash-bar i { border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }\n  .flash-acts .btn { border-radius: 999px; }\n  .flash-acts [data-ans=\"known\"], .flash-acts [data-flip] {\n    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); border-color: transparent;\n  }\n  .flash-acts [data-ans=\"soft\"] { background: var(--paper); color: var(--muted); border-color: var(--line-strong); }\n  .flash-acts [data-ans=\"again\"] { background: var(--salmon); color: var(--on-salmon); border-color: transparent; }\n  .flash-acts [data-ans]:hover { filter: brightness(1.05); }\n  .flash-end .big { font-family: var(--font-display); font-weight: 900; color: var(--accent); }\n\n  /* --- cours passé / futur : même typographie, couleurs harmonisées --- */\n  #panel-tenses { font-family: var(--font-ui); color: var(--ink); background: transparent; }\n  #panel-tenses .he { font-family: var(--font-he); }\n  #panel-tenses header.top { border-radius: var(--radius); border: 1px solid var(--line); backdrop-filter: blur(10px); }\n  #panel-tenses h1, #panel-tenses h2, #panel-tenses h3 { font-family: var(--font-display); }\n  #panel-tenses table { border-radius: var(--radius-sm); }\n\n  footer { color: var(--muted); }\n\n  @media (max-width: 600px) {\n    .container > .tabs { border-radius: 22px; }\n    .container > .tabs .tab { padding: 8px 13px; font-size: 13.5px; }\n    .quiz-card { padding: 26px 18px; }\n  }\n\n  /* ajustements apres revue */\n  .theme-chip { border-radius: 16px; }\n  .flash-acts .btn { font-size: 14px; letter-spacing: 0; font-weight: 800; padding: 13px 10px; }\n  #panel-tenses .note { border-left: 0; border-radius: var(--radius-sm); }\n  @media (max-width: 600px) {\n    .container > .tabs {\n      flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; width: 100%;\n      border-radius: 999px; scrollbar-width: none;\n    }\n    .container > .tabs::-webkit-scrollbar { display: none; }\n    /* fondu a droite : indique que la barre defile */\n    .container > .tabs { -webkit-mask-image: linear-gradient(90deg, #000 82%, transparent); mask-image: linear-gradient(90deg, #000 82%, transparent); }\n    .container > .tabs .tab { flex: none; }\n  }\n  /* sur telephone ou tablette tactile, pas de clavier : on cache les lettres A / O / P */\n  @media (hover: none), (max-width: 700px) {\n    .flash-key { display: none; }\n  }\n  @media (prefers-reduced-motion: reduce) {\n    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"container\">\n\u003c!--HP_BAR-->\n  \u003cheader>\n    \u003cdiv class=\"ornament\">⁘ &nbsp; ⁘ &nbsp; ⁘\u003c/div>\n    \u003ch1>Quiz d'Hébreu \u003cspan class=\"he\">עברית\u003c/span>\u003c/h1>\n    \u003cdiv class=\"subtitle\">Vocabulaire, conjugaisons &amp; grammaire — d'après tes cours\u003c/div>\n  \u003c/header>\n\n  \u003cdiv class=\"global-stats\" id=\"global-stats\">\n    \u003cspan>\u003cstrong id=\"gs-seen\">1\u003c/strong>mots vus\u003c/span>\n    \u003cspan class=\"sep\">·\u003c/span>\n    \u003cspan>\u003cstrong id=\"gs-mastered\">0\u003c/strong>maîtrisés\u003c/span>\n    \u003cspan class=\"sep\">·\u003c/span>\n    \u003cspan>\u003cstrong id=\"gs-difficult\">0\u003c/strong>à revoir\u003c/span>\n  \u003c/div>\n\n  \u003cdiv class=\"tabs\">\n    \u003cbutton class=\"tab active\" data-tab=\"quiz\">Quiz\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"grammar\">Grammaire\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"cours\">Vocabulaire\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"tenses\">Passé &amp; futur\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"stats\">Mes stats\u003c/button>\n  \u003c/div>\n\n  \u003c!-- ================ QUIZ PANEL ================ -->\n  \u003cdiv class=\"panel active\" id=\"panel-quiz\">\n    \u003cdiv id=\"setup-view\">\n      \u003cdiv class=\"setup-card\">\n        \u003ch2>① Mode\u003c/h2>\n        \u003cdiv class=\"mode-group\">\n          \u003cbutton class=\"mode-btn active\" data-mode=\"normal\">Quiz normal\u003cspan class=\"sub\">tous les thèmes\u003c/span>\u003c/button>\n          \u003cbutton class=\"mode-btn\" data-mode=\"review\">Révision\u003cspan class=\"sub\">mots difficiles\u003c/span>\u003c/button>\n        \u003c/div>\n\n        \u003ch2>② Sens de la traduction\u003c/h2>\n        \u003cdiv class=\"mode-group\">\n          \u003cbutton class=\"dir-btn mode-btn active\" data-dir=\"fr-he\">FR → עברית\u003c/button>\n          \u003cbutton class=\"dir-btn mode-btn\" data-dir=\"he-fr\">עברית → FR\u003c/button>\n          \u003cbutton class=\"dir-btn mode-btn\" data-dir=\"mixed\">Aléatoire\u003c/button>\n        \u003c/div>\n\n        \u003ch2>③ Longueur de la série\u003c/h2>\n        \u003cdiv class=\"mode-group\">\n          \u003cbutton class=\"len-btn mode-btn\" data-len=\"10\">10 mots\u003c/button>\n          \u003cbutton class=\"len-btn mode-btn\" data-len=\"20\">20 mots\u003c/button>\n          \u003cbutton class=\"len-btn mode-btn\" data-len=\"50\">50 mots\u003c/button>\n          \u003cbutton class=\"len-btn mode-btn\" data-len=\"0\">Tous les mots\u003c/button>\n        \u003c/div>\n\n        \u003cdiv id=\"review-info\" class=\"review-info\" style=\"display:none;\">\n          Mode Révision : la série ne contient que les mots que tu as ratés au moins une fois.\n          \u003cspan id=\"review-count\">\u003c/span>\n        \u003c/div>\n\n        \u003ch2 id=\"themes-label\">④ Thèmes (choisis-en au moins un)\u003c/h2>\n        \u003cdiv class=\"themes-grid\" id=\"themes-grid\">\u003c/div>\n        \u003cdiv class=\"theme-actions\">\n          \u003ca id=\"select-all\">Tout sélectionner\u003c/a>\n          \u003ca id=\"select-none\">Tout désélectionner\u003c/a>\n          \u003ca id=\"select-core\">Thèmes de base\u003c/a>\n          \u003ca id=\"select-advanced\">Thèmes avancés\u003c/a>\n        \u003c/div>\n\n        \u003cbutton class=\"start-btn\" id=\"start-btn\">Commencer le quiz\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv id=\"quiz-view\" style=\"display:none;\">\n      \u003cdiv class=\"quiz-card\">\n        \u003cbutton class=\"card-x\" id=\"exclude-btn\" title=\"Mettre ce mot de côté (retiré des prochains quiz et de la liste des ratés)\" aria-label=\"Mettre ce mot de côté\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 5l14 14M19 5L5 19\"/>\u003c/svg>\u003cspan class=\"card-x-label\">Mettre de côté\u003c/span>\u003c/button>\n        \u003cdiv class=\"quiz-meta\">\n          \u003cspan class=\"theme-tag\" id=\"current-theme\">—\u003c/span>\n          \u003cspan class=\"word-stats\" id=\"word-stats\">\u003c/span>\n          \u003cspan id=\"question-num\">Question 1\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"quiz-prompt\" id=\"quiz-prompt\">Traduis en hébreu :\u003c/div>\n        \u003cdiv class=\"quiz-word\" id=\"quiz-word\">—\u003c/div>\n        \u003cdiv class=\"answer-zone empty\" id=\"answer-zone\">\u003c/div>\n        \u003cdiv class=\"actions\" id=\"actions-reveal\">\n          \u003cspan class=\"tap-hint\">Clique sur la carte pour voir la réponse\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"actions\" id=\"actions-judge\" style=\"display:none;\">\n          \u003cbutton class=\"judge-btn judge-up\" id=\"correct-btn\" title=\"J'avais juste\" aria-label=\"J'avais juste\">\n            \u003csvg viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\">\u003cpath d=\"M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z\"/>\u003c/svg>\u003cspan>J'avais juste \u003cspan class=\"flash-key\">A\u003c/span>\u003c/span>\n          \u003c/button>\n          \u003cbutton class=\"judge-btn judge-down\" id=\"wrong-btn\" title=\"J'avais faux\" aria-label=\"J'avais faux\">\n            \u003csvg viewBox=\"0 0 24 24\" fil
