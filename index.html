  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-image:
      radial-gradient(1100px 620px at -5% -10%, var(--bg-1) 0%, transparent 62%),
      radial-gradient(900px 620px at 105% 0%, var(--bg-2) 0%, transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-3) 100%);
    background-attachment: fixed;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; font-family: var(--font-ui); color: var(--ink); background-color: var(--bg); }
  body { -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.5; min-height: 100vh; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
  a { color: var(--accent); }
  .he { font-family: var(--font-he); }
  [hidden] { display: none !important; }

  /* ---------- boutons & champs (repris du site) ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer;
    border-radius: 999px; font-weight: 700; font-size: 14px; padding: 10px 18px;
    border: 1.5px solid var(--line-strong); background: var(--paper); color: var(--ink-soft); text-decoration: none; white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s;
  }
  .btn:hover { background: var(--hover); border-color: var(--accent-soft); color: var(--ink); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: var(--on-accent); box-shadow: 0 10px 22px -12px var(--accent); }
  .btn.primary:hover { filter: brightness(1.06); color: var(--on-accent); }
  .btn.small { padding: 6px 12px; font-size: 12.5px; }
  .btn.danger { color: var(--bad); border-color: var(--bad-tint); background: var(--bad-tint); }
  .btn.danger:hover { background: var(--bad); color: var(--paper); border-color: var(--bad); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn:disabled { opacity: .5; cursor: default; filter: none; }
  label.f { display: grid; gap: 5px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .in {
    width: 100%; border: 1.5px solid var(--line); background: var(--paper); border-radius: 14px;
    padding: 11px 14px; font-size: 15px; transition: border-color .15s, box-shadow .15s;
  }
  .in:focus { outline: 0; border-color: var(--accent-soft); box-shadow: 0 0 0 4px var(--accent-tint); }
  .in.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .02em; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; background: var(--accent-tint); color: var(--accent); white-space: nowrap; }
  .pill.green { background: var(--mint); color: var(--olive); }
  .pill.gold { background: var(--peach); color: var(--gold); }
  .pill.rose { background: var(--rose-tint); color: var(--rose); }
  .pill.grey { background: var(--zebra); color: var(--muted); border: 1px solid var(--line); }

  .card {
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-card); padding: 24px;
  }
  .card h2, .card h3 { font-family: var(--font-display); font-weight: 800; margin: 0 0 14px; color: var(--ink); }
  .card h2 { font-size: 20px; } .card h3 { font-size: 17px; }
  .card h3 small { font: 700 12px var(--font-ui); color: var(--muted); margin-left: 6px; }
  .stack { display: grid; gap: 18px; }

  /* ---------- connexion ---------- */
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
  .login { width: 100%; max-width: 440px; text-align: center; }
  .kicker { display: inline-block; font: 700 12px/1 var(--font-ui); color: var(--accent); background: var(--accent-tint); padding: 7px 14px; border-radius: 999px; margin-bottom: 14px; }
  .login h1, .page-title {
    font-family: var(--font-display); font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; margin: 0;
  }
  .login h1 { font-size: clamp(32px, 7vw, 44px); }
  .grad { font-family: var(--font-he); font-weight: 700; background: linear-gradient(120deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .login .sub { color: var(--muted); margin: 8px 0 26px; }
  .login form { text-align: left; display: grid; gap: 14px; }
  .login .btn.primary { padding: 15px; font-size: 16px; font-weight: 800; }
  .err { color: var(--t-warn-ink, var(--bad)); background: var(--bad-tint); border-radius: 12px; padding: 9px 12px; font-size: 13.5px; font-weight: 600; }
  .ok { color: var(--olive); background: var(--mint); border-radius: 12px; padding: 9px 12px; font-size: 13.5px; font-weight: 600; }
  .demo-box { margin-top: 18px; text-align: left; font-size: 13px; color: var(--ink-soft); background: var(--peach); border-radius: 18px; padding: 14px 16px; }
  .demo-box b { color: var(--ink); } .demo-box table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .demo-box td { padding: 3px 4px; } .demo-box td:first-child { color: var(--muted); }
  .demo-box button { all: unset; cursor: pointer; color: var(--accent); font-weight: 700; }

  /* ---------- back-office ---------- */
  .bo-top {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px max(16px, calc((100vw - 1180px) / 2)); background: var(--glass); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font: 900 18px var(--font-display); color: var(--ink); text-decoration: none; }
  .brand .logo { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); font: 700 20px var(--font-he); transform: rotate(-6deg); }
  .bo-nav { display: flex; gap: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 4px; margin-left: auto; flex-wrap: wrap; }
  .bo-nav a { text-decoration: none; padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--muted); }
  .bo-nav a:hover { color: var(--ink); background: var(--hover); }
  .bo-nav a.on { background: var(--ink); color: var(--paper); }
  .bo-nav .count { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--rose); color: var(--paper); font-size: 11px; margin-left: 4px; }
  .bo-main { max-width: 1180px; margin: 0 auto; padding: 26px 16px 70px; }
  .bo-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  .page-title { font-size: clamp(26px, 4vw, 34px); }
  .bo-head p { margin: 4px 0 0; color: var(--muted); }
  .demo-strip { background: var(--peach); color: var(--ink-soft); text-align: center; font-size: 12.5px; padding: 6px 16px; }
  .demo-strip b { color: var(--gold); }

  /* tableau élèves */
  .tbl-wrap { overflow-x: auto; margin: 0 -8px; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 860px; }
  .tbl th { text-align: left; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 800; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; }
  .tbl th.sorted { color: var(--accent); }
  .tbl td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--hover); }
  .tbl .num { font-variant-numeric: tabular-nums; font-weight: 700; }
  .who { display: flex; align-items: center; gap: 10px; }
  .av { width: 36px; height: 36px; flex: none; border-radius: 12px; display: grid; place-items: center; font: 800 14px var(--font-display); color: var(--on-accent); background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .av.lg { width: 64px; height: 64px; border-radius: 20px; font-size: 24px; }
  .who b { display: block; } .who small { color: var(--muted); }
  .lv { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; }
  .lv .he { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 8px; background: var(--accent-tint); color: var(--accent); }

  .alerts { display: grid; gap: 8px; }
  .alert { display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-radius: 16px; background: var(--zebra); font-size: 14px; cursor: pointer; border: 1px solid var(--line); }
  .alert:hover { border-color: var(--accent-soft); }
  .alert .ic { font-size: 18px; } .alert.warn { background: var(--rose-tint); border-color: transparent; } .alert.good { background: var(--mint); border-color: transparent; }
  .lb { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .lb li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 14px; }
  .lb li:nth-child(1) { background: var(--peach); } .lb .rk { font: 900 16px var(--font-display); color: var(--muted); text-align: center; }
  .lb li:nth-child(1) .rk { color: var(--gold); }

  .dash-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .dash-grid { grid-template-columns: 1fr; } }

  /* fiche élève */
  .st-head { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .st-head h1 { font: 900 clamp(24px, 4vw, 32px)/1.1 var(--font-display); margin: 0; }
  .st-head .meta { display: flex; gap: 6px 14px; flex-wrap: wrap; color: var(--muted); font-size: 13.5px; margin-top: 4px; }
  .st-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 20px 0; }
  .st-tabs a { text-decoration: none; padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--muted); border: 1.5px solid var(--line); background: var(--paper); }
  .st-tabs a.on { background: var(--accent-tint); color: var(--accent); border-color: var(--accent-soft); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
  .back { display: inline-flex; gap: 6px; align-items: center; text-decoration: none; font-weight: 700; color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .back:hover { color: var(--accent); }

  /* dépôt de documents */
  .drop {
    border: 2px dashed var(--line-strong); border-radius: 22px; padding: 30px 18px; text-align: center; background: var(--zebra);
    transition: background .15s, border-color .15s; cursor: pointer;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-tint); }
  .drop .big { font-size: 34px; } .drop b { display: block; font: 800 17px var(--font-display); margin: 6px 0 2px; }

  function parseDay(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function shortDate(d) { return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); }

  function emptyDay() {
    return { xp: 0, qOk: 0, qKo: 0, fK: 0, fA: 0, fS: 0, cK: 0, cA: 0, cS: 0, goal: 0 };
  }
  function dayGood(d) { return (d.qOk || 0) + (d.fK || 0) + (d.cK || 0); }
  function dayBad(d) { return (d.qKo || 0) + (d.fA || 0) + (d.fS || 0) + (d.cA || 0) + (d.cS || 0); }
  function dayActive(d) { return d && dayGood(d) + dayBad(d) > 0; }

  function streaks(days) {
    var today = new Date(), cur = 0, best = 0, run = 0;
    var d = new Date(today);
    if (!dayActive(days[dayKey(d)])) d = addDays(d, -1);   // aujourd'hui pas encore joué : la série tient
    while (dayActive(days[dayKey(d)])) { cur++; d = addDays(d, -1); }
    var keys = Object.keys(days).filter(function (k) { return dayActive(days[k]); }).sort();
    var prev = null;
    keys.forEach(function (k) {
      var dt = parseDay(k);
      run = (prev && Math.round((dt - prev) / 864e5) === 1) ? run + 1 : 1;
      if (run > best) best = run;
      prev = dt;
    });
    return { cur: cur, best: Math.max(best, cur) };
  }

  /* ---------- maîtrise (quiz OU flashcards) ---------- */
  function quizMastered(s) {
    if (!s) return false;
    if (s.correct >= 3 && s.wrong === 0) return true;
    return s.seen >= 4 && s.correct / s.seen >= 0.8;
  }
  function flashMastered(s) {
    if (!s) return false;
    if (s.known >= 2 && !s.again && !s.soft) return true;
    return s.seen >= 4 && s.known / s.seen >= 0.8;
  }
  function wordMastered(storage, k) {
    return quizMastered(storage.wordStats && storage.wordStats[k]) ||
           flashMastered(storage.flash && storage.flash[k]);
  }

  function totalsFrom(storage, VOCAB) {
    var t = { qOk: 0, qKo: 0, fK: 0, fA: 0, fS: 0, cK: 0, cA: 0, cS: 0, mastered: 0 };
    var k, s;
    for (k in (storage.wordStats || {})) { s = storage.wordStats[k]; t.qOk += s.correct || 0; t.qKo += s.wrong || 0; }
    for (k in (storage.flash || {})) { s = storage.flash[k]; t.fK += s.known || 0; t.fA += s.again || 0; t.fS += s.soft || 0; }
    for (k in (storage.conj || {})) { s = storage.conj[k]; t.cK += s.known || 0; t.cA += s.again || 0; t.cS += s.soft || 0; }
    var seen = {};
    Object.keys(VOCAB || {}).forEach(function (th) {
      VOCAB[th].forEach(function (e) {
        var key = e[0] + '|' + e[1];
        if (seen[key]) return; seen[key] = 1;
        if (wordMastered(storage, key)) t.mastered++;
      });
    });
    return t;
  }

  function themeMastery(storage, VOCAB) {
    return Object.keys(VOCAB || {}).map(function (th) {
      var n = 0, m = 0, seen = 0, vu = {};
      VOCAB[th].forEach(function (e) {
        var key = e[0] + '|' + e[1];
        if (vu[key]) return; vu[key] = 1; n++;
        var q = storage.wordStats && storage.wordStats[key], f = storage.flash && storage.flash[key];
        if ((q && q.seen) || (f && f.seen)) seen++;
        if (wordMastered(storage, key)) m++;
      });
      var run = storage.themeRuns && storage.themeRuns[th];
      return { theme: th, n: n, m: m, seen: seen, pct: n ? Math.round(100 * m / n) : 0, runs: run ? +run.n || 0 : 0 };
    });
  }

  function weakWords(storage, max) {
    var map = {};
    function add(k, bad, seen) {
      var p = k.split('|');
      var o = map[k] || (map[k] = { he: p[0], fr: p[1] || '', bad: 0, seen: 0 });
      o.bad += bad; o.seen += seen;
    }
    var k, s;
    for (k in (storage.wordStats || {})) { s = storage.wordStats[k]; if (s.wrong) add(k, s.wrong, s.seen || 0); }
    for (k in (storage.flash || {})) { s = storage.flash[k]; if (s.again) add(k, s.again, s.seen || 0); }
    return Object.keys(map).map(function (x) { return map[x]; })
      .sort(function (a, b) { return b.bad - a.bad || (b.bad / (b.seen || 1)) - (a.bad / (a.seen || 1)); })
      .slice(0, max || 15);
  }

  /* ---------- badges ---------- */
  var BADGES = [
    { id: 'first',   icon: '🌱', name: 'Premier pas',         desc: 'Répondre à sa première carte',             test: function (c) { return c.answers >= 1; } },
    { id: 'streak3', icon: '🔥', name: 'Ça chauffe',          desc: '3 jours de révision d\'affilée',            test: function (c) { return c.best >= 3; } },
    { id: 'streak7', icon: '🔥', name: 'Une semaine pile',    desc: '7 jours d\'affilée',                        test: function (c) { return c.best >= 7; } },
    { id: 'streak30',icon: '🌋', name: 'Inarrêtable',         desc: '30 jours d\'affilée',                       test: function (c) { return c.best >= 30; } },
    { id: 'goal7',   icon: '🎯', name: 'Régulier',            desc: 'Objectif du jour atteint 7 fois',           test: function (c) { return c.goalDays >= 7; } },
    { id: 'day200',  icon: '💪', name: 'Grosse journée',      desc: '200 XP en une journée',                     test: function (c) { return c.maxDay >= 200; } },
    { id: 'xp1000',  icon: '⭐', name: '1 000 XP',            desc: 'Cumuler 1 000 XP',                          test: function (c) { return c.xp >= 1000; } },
    { id: 'xp5000',  icon: '🌟', name: '5 000 XP',            desc: 'Cumuler 5 000 XP',                          test: function (c) { return c.xp >= 5000; } },
    { id: 'cards100',icon: '🃏', name: 'Cent cartes',         desc: '100 flashcards retournées',                 test: function (c) { return c.cards >= 100; } },
    { id: 'cards1k', icon: '🗂️', name: 'Mille cartes',        desc: '1 000 flashcards retournées',               test: function (c) { return c.cards >= 1000; } },
    { id: 'mast50',  icon: '📗', name: '50 mots acquis',      desc: '50 mots maîtrisés',                         test: function (c) { return c.mastered >= 50; } },
    { id: 'mast200', icon: '📚', name: '200 mots acquis',     desc: '200 mots maîtrisés',                        test: function (c) { return c.mastered >= 200; } },
    { id: 'theme',   icon: '🏆', name: 'Thème bouclé',        desc: 'Maîtriser tous les mots d\'un thème',      test: function (c) { return c.themesDone >= 1; } },
    { id: 'conj50',  icon: '🧩', name: 'Conjugueur',          desc: '50 conjugaisons réussies',                  test: function (c) { return c.conj >= 50; } },
    { id: 'combo20', icon: '⚡', name: 'Sans faute',          desc: '20 bonnes réponses d\'affilée',             test: function (c) { return c.combo >= 20; } },
    { id: 'early',   icon: '🌅', name: 'Lève-tôt',            desc: 'Réviser avant 8 h',                         test: function (c) { return c.early; } },
    { id: 'night',   icon: '🌙', name: 'Oiseau de nuit',      desc: 'Réviser après 22 h',                        test: function (c) { return c.night; } }
  ];

  function badgeContext(P, totals, themes) {
    var st = streaks(P.days || {}), goalDays = 0, maxDay = 0;
    Object.keys(P.days || {}).forEach(function (k) {
      var d = P.days[k]; if (d.goal) goalDays++; if (d.xp > maxDay) maxDay = d.xp;
    });
    return {
      xp: P.xp || 0, best: st.best, cur: st.cur, goalDays: goalDays, maxDay: maxDay,
      answers: totals.qOk + totals.qKo + totals.fK + totals.fA + totals.fS + totals.cK + totals.cA + totals.cS,
      cards: totals.fK + totals.fA + totals.fS + totals.cK + totals.cA + totals.cS,
      mastered: totals.mastered, conj: totals.cK,
      themesDone: (themes || []).filter(function (t) { return t.n >= 5 && t.m === t.n; }).length,
      combo: P.bestCombo || 0, early: !!P.early, night: !!P.night
    };
  }

  /* ---------- résumé envoyé à la prof ---------- */
  function summarize(storage, P, VOCAB) {
    var totals = totalsFrom(storage, VOCAB), themes = themeMastery(storage, VOCAB);
    var st = streaks(P.days || {}), keep = {}, cut = dayKey(addDays(new Date(), -180));
    Object.keys(P.days || {}).forEach(function (k) { if (k >= cut) keep[k] = P.days[k]; });
    var last = Object.keys(keep).filter(function (k) { return dayActive(keep[k]); }).sort().pop() || null;
    return {
      updatedAt: new Date().toISOString(), xp: P.xp || 0, level: levelInfo(P.xp).level,
      streak: st.cur, best: st.best, lastActive: last, goal: P.goal || 60,
      days: keep, totals: totals, themes: themes, weak: weakWords(storage, 15),
      badges: P.badges || {}, bestCombo: P.bestCombo || 0
    };
  }

  /* ---------- agrégats ---------- */
  function rangeSum(days, from, n) {
    var s = emptyDay();
    for (var i = 0; i < n; i++) {
      var d = days[dayKey(addDays(from, i))];
      if (d) for (var k in s) s[k] += +d[k] || 0;
    }
    return s;
  }
  function rate(d) { var g = dayGood(d), b = dayBad(d); return g + b ? Math.round(100 * g / (g + b)) : null; }
  function weekly(days, weeks) {
    var out = [], today = new Date();
    var monday = addDays(today, -((today.getDay() + 6) % 7));
    for (var w = weeks - 1; w >= 0; w--) {
      var start = addDays(monday, -7 * w), s = rangeSum(days, start, 7);
      out.push({ start: start, sum: s, rate: rate(s), xp: s.xp, answers: dayGood(s) + dayBad(s) });
    }
    return out;
  }

  /* ---------- rendu ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(n) { n = +n; return (isFinite(n) ? n : 0).toLocaleString('fr-FR'); }

  /* tableau de données sous chaque graphique (lecteurs d'écran, lecture précise) */
  function dataTable(caption, head, rows) {
    if (!rows.length) return '';
    return '<details class="hp-table"><summary>Voir les données</summary><table><caption>' + esc(caption) + '</caption><thead><tr>' +
      head.map(function (h) { return '<th scope="col">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) { return '<tr>' + r.map(function (c, i) { return i ? '<td>' + esc(c) + '</td>' : '<th scope="row">' + esc(c) + '</th>'; }).join('') + '</tr>'; }).join('') +
      '</tbody></table></details>';
  }
  function niceMax(v) {
    if (v <= 10) return 10;
    var p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  }
  /* barre arrondie seulement en haut, posée sur la ligne de base */
  function barPath(x, y, w, h, r) {
    if (h <= 0) return '';
    r = Math.min(r, w / 2, h);
    return '<path d="M' + x.toFixed(1) + ',' + (y + h).toFixed(1) + 'V' + (y + r).toFixed(1) + 'Q' + x.toFixed(1) + ',' + y.toFixed(1) + ' ' + (x + r).toFixed(1) + ',' + y.toFixed(1) +
      'H' + (x + w - r).toFixed(1) + 'Q' + (x + w).toFixed(1) + ',' + y.toFixed(1) + ' ' + (x + w).toFixed(1) + ',' + (y + r).toFixed(1) + 'V' + (y + h).toFixed(1) + 'Z"';
  }

  function levelCard(P, opts) {
    opts = opts || {};
    var L = levelInfo(P.xp), st = streaks(P.days || {}), today = (P.days || {})[dayKey()] || emptyDay();
    var goal = P.goal || 60, gp = Math.min(100, Math.round(100 * today.xp / goal));
    var R = 34, C = 2 * Math.PI * R;
    return '<div class="hp-level">' +
      '<div class="hp-medal" aria-hidden="true"><span>' + L.letter + '</span></div>' +
      '<div class="hp-level-main">' +
        '<div class="hp-level-top"><strong>Niveau ' + L.level + '</strong>' +
        '<span class="hp-tier">' + L.title + ' · <span class="hp-he">' + L.titleHe + '</span></span></div>' +
        '<div class="hp-xpbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + L.pct + '" aria-label="Progression vers le niveau ' + (L.level + 1) + '"><i style="width:' + L.pct + '%"></i></div>' +
        '<div class="hp-level-sub">' + fmt(P.xp) + ' XP au total · encore <b>' + fmt(L.toNext) + ' XP</b> pour le niveau ' + (L.level + 1) + '</div>' +
      '</div>' +
      '<div class="hp-mini">' +
        '<div class="hp-ring" role="img" aria-label="Objectif du jour : ' + today.xp + ' XP sur ' + goal + '">' +
          '<svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="' + R + '" class="hp-ring-bg"/>' +
          (gp ? '<circle cx="40" cy="40" r="' + R + '" class="hp-ring-fg" stroke-dasharray="' + (C * gp / 100).toFixed(1) + ' ' + C.toFixed(1) + '"/>' : '') + '</svg>' +
          '<div class="hp-ring-txt">' + (today.xp >= goal ? '<b>✓</b><span>atteint</span>' : '<b>' + today.xp + '</b><span>/ ' + goal + ' XP</span>') + '</div>' +
        '</div>' +
        '<div class="hp-streak"><span class="hp-flame" aria-hidden="true">' + (st.cur ? '🔥' : '·') + '</span><b>' + st.cur + '</b><span>jour' + (st.cur > 1 ? 's' : '') + ' d\'affilée</span><em>record ' + st.best + '</em></div>' +
      '</div>' +
      (opts.goalPicker ? '<div class="hp-goalpick">Objectif du jour : ' + [30, 60, 100, 150].map(function (g) {
        return '<button type="button" data-goal="' + g + '" class="' + (g === goal ? 'on' : '') + '">' + g + ' XP</button>';
      }).join('') + '</div>' : '') +
    '</div>';
  }

  function heatmap(days, weeks) {
    weeks = weeks || 17;
    var today = new Date(), tk = dayKey(today);
    var end = addDays(today, 6 - ((today.getDay() + 6) % 7));        // dimanche de cette semaine
    var start = addDays(end, -(weeks * 7) + 1);
    var vis = [], max = 1, active = 0;
    for (var j = 0; j < weeks * 7; j++) { var dd = addDays(start, j); if (dd > today) break; var vv = days && days[dayKey(dd)] ? +days[dayKey(dd)].xp || 0 : 0; vis.push([dd, vv]); if (vv > max) max = vv; if (vv) active++; }
    var q = function (l) { return Math.max(1, Math.round(max * l / 4)); };
    var cols = '', months = '', lastM = -1, lastCol = -9;
    for (var w = 0; w < weeks; w++) {
      var cells = '';
      var wkStart = addDays(start, w * 7);
      if (wkStart.getMonth() !== lastM && w - lastCol >= 3) {
        months += '<span style="grid-column:' + (w + 1) + '">' + wkStart.toLocaleDateString('fr-FR', { month: 'short' }) + '</span>';
        lastM = wkStart.getMonth(); lastCol = w;
      }
      for (var i = 0; i < 7; i++) {
        var d = addDays(start, w * 7 + i), k = dayKey(d), v = days && days[k] ? +days[k].xp || 0 : 0;
        var lvl = d > today ? 'f' : (v ? Math.min(4, 1 + Math.floor(3.999 * v / max)) : 0);
        cells += '<i class="h' + lvl + (k === tk ? ' today' : '') + '"' + (d > today ? '' : ' data-tip="' + v + ' XP|' + shortDate(d) + '"') + '></i>';
      }
      cols += '<div class="hp-hcol">' + cells + '</div>';
    }
    return '<div class="hp-heat" role="img" aria-label="Régularité : ' + active + ' jours actifs sur les ' + weeks + ' dernières semaines">' +
      '<div class="hp-heat-days" aria-hidden="true"><span></span><span>L</span><span></span><span>M</span><span></span><span>V</span><span></span><span>D</span></div>' +
      '<div class="hp-heat-body" aria-hidden="true"><div class="hp-heat-months" style="grid-template-columns:repeat(' + weeks + ',17px)">' + months + '</div>' +
      '<div class="hp-heat-grid">' + cols + '</div></div></div>' +
      '<div class="hp-legend">Moins <i class="h0" title="aucune activité"></i><i class="h1" title="1 à ' + q(1) + ' XP"></i><i class="h2" title="' + (q(1) + 1) + ' à ' + q(2) + ' XP"></i>' +
      '<i class="h3" title="' + (q(2) + 1) + ' à ' + q(3) + ' XP"></i><i class="h4" title="plus de ' + q(3) + ' XP"></i> Plus</div>' +
      dataTable('XP par jour, jours actifs', ['Jour', 'XP'], vis.filter(function (x) { return x[1]; }).reverse().slice(0, 60).map(function (x) { return [shortDate(x[0]), fmt(x[1])]; }));
  }

  function xpBars(days, n, goal) {
    n = n || 30;
    var W = 620, H = 180, padB = 22, padT = 16, padL = 36, padR = goal ? 74 : 10, today = new Date(), vals = [], top = goal || 10;
    for (var i = n - 1; i >= 0; i--) {
      var d = addDays(today, -i), v = days && days[dayKey(d)] ? +days[dayKey(d)].xp || 0 : 0;
      vals.push({ d: d, v: v }); if (v > top) top = v;
    }
    var max = niceMax(top), ph = H - padB - padT, pw = W - padL - padR, bw = pw / n, base = H - padB, svg = '';
    var Y = function (v) { return base - ph * v / max; };
    [0, max / 2, max].forEach(function (g) {
      svg += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + Y(g).toFixed(1) + '" y2="' + Y(g).toFixed(1) + '" class="' + (g ? 'hp-grid' : 'hp-base') + '"/>' +
        '<text x="' + (padL - 6) + '" y="' + (Y(g) + 4).toFixed(1) + '" class="hp-axis" text-anchor="end">' + fmt(g) + '</text>';
    });
    vals.forEach(function (o, i) {
      var h = ph * o.v / max, x = padL + i * bw + bw * 0.18;
      if (o.v) svg += barPath(x, base - Math.max(h, 2), bw * 0.64, Math.max(h, 2), 3) + ' class="' + (!goal || o.v >= goal ? 'hp-bar-hit' : 'hp-bar') + '"/>';
      svg += '<rect class="hp-hit" x="' + (padL + i * bw).toFixed(1) + '" y="' + padT + '" width="' + bw.toFixed(1) + '" height="' + ph + '" data-tip="' + o.v + ' XP|' + shortDate(o.d) + '"/>';
      if (i % 7 === (n - 1) % 7) {
        var tx = padL + i * bw + bw / 2;
        svg += '<text x="' + tx.toFixed(1) + '" y="' + (H - 6) + '" class="hp-axis" text-anchor="' + (tx > W - padR - 24 ? 'end' : 'middle') + '">' + shortDate(o.d) + '</text>';
      }
    });
    var last = vals[vals.length - 1];
    if (last.v) svg += '<text x="' + (padL + (n - 0.5) * bw).toFixed(1) + '" y="' + (Y(last.v) - 5).toFixed(1) + '" class="hp-val" text-anchor="middle">' + last.v + '</text>';
    if (goal) {
      var gy = Y(goal);
      svg += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + gy.toFixed(1) + '" y2="' + gy.toFixed(1) + '" class="hp-goal-line"/>' +
             '<text x="' + (W - padR + 6) + '" y="' + (gy - 2).toFixed(1) + '" class="hp-axis hp-goal-txt">objectif</text>' +
             '<text x="' + (W - padR + 6) + '" y="' + (gy + 11).toFixed(1) + '" class="hp-axis hp-goal-txt">' + goal + ' XP</text>';
    }
    var hit = vals.filter(function (o) { return goal && o.v >= goal; }).length, act = vals.filter(function (o) { return o.v; }).length;
    return '<div class="hp-chart-wrap" data-end="1"><svg class="hp-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="XP par jour sur ' + n + ' jours : ' + act + ' jours actifs' + (goal ? ', objectif atteint ' + hit + ' fois' : '') + '">' + svg + '</svg></div>' +
      (goal ? '<div class="hp-legend2"><i class="hit"></i> objectif atteint <i class="below"></i> en dessous</div>' : '') +
      dataTable('XP par jour', ['Jour', 'XP'], vals.slice().reverse().map(function (o) { return [shortDate(o.d), fmt(o.v)]; }));
  }

  function rateLine(days, weeks) {
    var data = weekly(days || {}, weeks || 8), W = 620, H = 180, padB = 22, padT = 18, padL = 42, padR = 18;
    var rated = data.filter(function (w) { return w.rate != null; });
    var lo = rated.length ? Math.min(50, Math.floor(Math.min.apply(null, rated.map(function (w) { return w.rate; })) / 10) * 10) : 50;
    var ph = H - padB - padT, Y = function (r) { return H - padB - ph * (r - lo) / (100 - lo); };
    var svg = '';
    [lo, Math.round((lo + 100) / 2), 100].forEach(function (g) {
      svg += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + Y(g).toFixed(1) + '" y2="' + Y(g).toFixed(1) + '" class="' + (g === lo ? 'hp-base' : 'hp-grid') + '"/>' +
             '<text x="' + (padL - 8) + '" y="' + (Y(g) + 4).toFixed(1) + '" class="hp-axis" text-anchor="end">' + g + ' %</text>';
    });
    var step = (W - padL - padR) / Math.max(1, data.length - 1), seg = [], segs = [];
    data.forEach(function (w, i) {
      var x = padL + i * step;
      svg += '<text x="' + x.toFixed(1) + '" y="' + (H - 6) + '" class="hp-axis" text-anchor="' + (i === 0 ? 'start' : i === data.length - 1 ? 'end' : 'middle') + '">' + shortDate(w.start) + '</text>';
      if (w.rate == null) { if (seg.length) segs.push(seg); seg = []; return; }
      seg.push([x, Y(w.rate), w]);
    });
    if (seg.length) segs.push(seg);
    segs.forEach(function (sg) {
      if (sg.length > 1) svg += '<polyline class="hp-line" points="' + sg.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '"/>';

  function pub(c) { c = norm(c); delete c.feed; return c; }

  /* ---------- fuseaux horaires (sans bibliothèque) ---------- */
  var fmts = {};
  function dtf(tz) {

    if (o2 !== o1) t = g - o2 * MIN;

  /* minuit (dans tz) du jour donné « AAAA-MM-JJ » */
  function dayStart(key, tz) { var p = key.split('-'); return zoned(+p[0], +p[1], +p[2], 0, 0, tz); }

  /* intervalles occupés : cours réservés (avec la pause) et fermetures */
  function conflicts(c, busy, s, e) {
    var b = c.buffer * MIN, i, x;
    for (i = 0; i < busy.length; i++) { x = busy[i]; if (x.s < e + b && x.e > s - b) return true; }
    for (i = 0; i < c.blocks.length; i++) { x = c.blocks[i]; if (Date.parse(x.s) < e && Date.parse(x.e) > s) return true; }
    return false;

  /* créneaux libres de « minutes » minutes, entre from et to (ms) */
  function slots(c, busy, from, to, minutes, now) {
    c = norm(c); busy = busy || [];
    var lo = Math.max(from, now + c.notice * HOUR), hi = Math.min(to, now + c.horizon * 7 * DAY);

    var key = dayKey(lo - DAY, c.tz), last = dayKey(hi + DAY, c.tz), guard = 0;

    return out.sort(function (a, b) { return a - b; });
  }

  /* un élève peut-il réserver ce créneau ? null si oui, sinon la raison */
  function check(c, busy, start, minutes, now) {
    c = norm(c);
    if (!c.open) return 'closed';
    if (c.durations.indexOf(minutes) < 0) return 'duration';
    if (start < now + c.notice * HOUR) return 'too_soon';

  function icsDate(ms) { return new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }

  function ics(events, name) {
    var L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Hebreu avec Mayane//Agenda//FR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
    if (name) { L.push('X-WR-CALNAME:' + icsText(name)); L.push('REFRESH-INTERVAL;VALUE=DURATION:PT1H'); L.push('X-PUBLISHED-TTL:PT1H'); }

      L.push('BEGIN:VEVENT', 'UID:' + ev.uid + '@hebreu-avec-mayane', 'DTSTAMP:' + stamp, 'DTSTART:' + icsDate(ev.s), 'DTEND:' + icsDate(ev.e),

    return L.join('\r\n') + '\r\n';
  }

  return {
    DEF: DEF, norm: norm, pub: pub, parts: parts, zoned: zoned, offset: offset, dayKey: dayKey, dayStart: dayStart,
    addDaysKey: addDaysKey, weekdayOfKey: weekdayOfKey, windows: windows, conflicts: conflicts, slots: slots, check: check,
    canCancel: canCancel, hm: hm, hmStr: hmStr, durLabel: durLabel, tzCity: tzCity, ics: ics, validTz: validTz
  };
});

/* =====================================================================
   HPB — stockage du site de Mayane.
   Version 1 (démo) : tout est conservé dans ce navigateur (IndexedDB).
   L'interface est volontairement réduite à ces fonctions pour pouvoir
   brancher ensuite un vrai serveur (comptes partagés entre appareils)
   sans toucher au reste du site.
   ===================================================================== */
var HPB = (function () {
  'use strict';
  var DBN = 'mayane-hebreu-v1', ST = 'kv', idb = null, mem = {};

  function open() {
    return new Promise(function (res) {
      try {
        var r = indexedDB.open(DBN, 1);
        r.onupgradeneeded = function () { r.result.createObjectStore(ST); };
        r.onsuccess = function () { idb = r.result; res(); };
        r.onerror = function () { res(); };
        r.onblocked = function () { res(); };
      } catch (e) { res(); }
    });
  }
  function get(k) {
    if (!idb) return Promise.resolve(mem[k]);
    return new Promise(function (res) {
      try {
        var q = idb.transaction(ST).objectStore(ST).get(k);
        q.onsuccess = function () { res(q.result); };
        q.onerror = function () { res(mem[k]); };
      } catch (e) { res(mem[k]); }
    });
  }
  function set(k, v) {
    mem[k] = v;
    if (!idb) return Promise.resolve();
    return new Promise(function (res) {
      try {
        var t = idb.transaction(ST, 'readwrite');
        t.objectStore(ST).put(v, k);
        t.oncomplete = function () { res(); };
        t.onerror = function () { res(); };
      } catch (e) { res(); }
    });
  }
  function del(k) {
    delete mem[k];
    if (!idb) return Promise.resolve();
    return new Promise(function (res) {
      try {
        var t = idb.transaction(ST, 'readwrite');
        t.objectStore(ST).delete(k);
        t.oncomplete = function () { res(); };
        t.onerror = function () { res(); };
      } catch (e) { res(); }
    });
  }
  function clearAll() {
    mem = {};
    if (!idb) return Promise.resolve();
    return new Promise(function (res) {
      try {
        var t = idb.transaction(ST, 'readwrite');
        t.objectStore(ST).clear();
        t.oncomplete = function () { res(); };
        t.onerror = function () { res(); };
      } catch (e) { res(); }
    });
  }

  /* ---------- mots de passe : vérifiés par empreinte (hash) ; celui des élèves est aussi gardé pour Mayane ---------- */
  function rnd(n) {
    var a = new Uint8Array(n);
    try { crypto.getRandomValues(a); } catch (e) { for (var i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256); }
    return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');

  function hash(pw, salt) {

        return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      });
    } catch (e) {
      var h = 5381; for (var i = 0; i < txt.length; i++) h = ((h << 5) + h + txt.charCodeAt(i)) | 0;
      return Promise.resolve('x' + (h >>> 0).toString(16));

  function withPassword(rec, pw) {
    rec.salt = rnd(12);
    return hash(pw, rec.salt).then(function (h) { rec.hash = h; return rec; });
  }
  var WORDS = ['shalom', 'toda', 'boker', 'layla', 'shemesh', 'yam', 'sefer', 'mayim', 'tapuz', 'kelev', 'perah', 'hatul', 'kochav', 'bayit', 'lehem'];
  function genPassword() {
    var a = new Uint32Array(2);
    try { crypto.getRandomValues(a); } catch (e) { a[0] = Math.random() * 1e9; a[1] = Math.random() * 1e9; }
    return WORDS[a[0] % WORDS.length] + '-' + (1000 + a[1] % 9000);
  }

  /* ---------- API ---------- */
  var api = {
    ready: open,
    genPassword: genPassword,
    reset: clearAll,

    getTeacher: function () { return get('teacher'); },
    setTeacherPassword: function (login, pw) {
      return get('teacher').then(function (t) {
        t = t || { name: 'Mayane' };
        t.login = login;
        if (!pw) return set('teacher', t);   /* identifiant seul : mot de passe inchangé */
        return withPassword(t, pw).then(function (r) { return set('teacher', r); });
      });
    },
    getSettings: function () { return get('settings').then(function (s) { return s || {}; }); },
    setSettings: function (s) { return set('settings', s); },

    listStudents: function () { return get('students').then(function (l) { return l || []; }); },
    getStudent: function (id) { return api.listStudents().then(function (l) { return l.filter(function (s) { return s.id === id; })[0] || null; }); },
    saveStudent: function (st, pw) {
      return api.listStudents().then(function (l) {
        /* la prof doit pouvoir retrouver le mot de passe de chaque élève : il est gardé avec le compte */
        if (pw) st.pw = pw;
        var p = pw ? withPassword(st, pw) : Promise.resolve(st);
        return p.then(function () {
          var i = l.findIndex(function (s) { return s.id === st.id; });
          if (i < 0) l.push(st); else l[i] = st;
          return set('students', l).then(function () { return st; });
        });
      });
    },
    deleteStudent: function (id) {
      return api.listStudents().then(function (l) {
        return set('students', l.filter(function (s) { return s.id !== id; }));
      }).then(function () {
        return Promise.all([del('content:' + id), del('summary:' + id), del('progress:' + id),
          get('bookings').then(function (l) { return set('bookings', (l || []).filter(function (b) { return b.studentId !== id; })); })]);
      }).then(function () {
        return api.listDocs().then(function (docs) {
          docs.forEach(function (d) { d.students = (d.students || []).filter(function (x) { return x !== id; }); });
          return set('docs', docs);
        });
      });
    },
    loginTaken: function (login, exceptId) {
      login = (login || '').trim().toLowerCase();
      return Promise.all([api.listStudents(), get('teacher')]).then(function (r) {
        if (r[1] && r[1].login === login) return true;
        return r[0].some(function (s) { return s.login === login && s.id !== exceptId; });
      });
    },
    /* connexion : renvoie {role, id} ou null */
    login: function (login, pw) {
      login = (login || '').trim().toLowerCase();
      return Promise.all([get('teacher'), api.listStudents()]).then(function (r) {
        var t = r[0];
        if (t && t.login === login) return hash(pw, t.salt).then(function (h) { return h === t.hash ? { role: 'teacher' } : null; });
        var s = r[1].filter(function (x) { return x.login === login; })[0];
        if (!s) return null;
        return hash(pw, s.salt).then(function (h) {
          if (h !== s.hash) return null;
          if (s.active === false) return { role: 'blocked' };
          return { role: 'student', id: s.id };
        });
      });
    },

    getContent: function (id) { return get('content:' + id).then(function (c) { return c || null; }); },
    setContent: function (id, c) { c.updatedAt = new Date().toISOString(); return set('content:' + id, c); },
    getSummary: function (id) { return get('summary:' + id).then(function (s) { return s || null; }); },
    getProgress: function (id) { return get('progress:' + id).then(function (p) { return p || null; }); },
    /* appelé par l'espace élève à chaque réponse (regroupé) */
    pushProgress: function (id, summary, storage) {
      if (!id) return Promise.resolve();
      return Promise.all([set('summary:' + id, summary), set('progress:' + id, storage)]).then(function () {
        try { window.dispatchEvent(new CustomEvent('hp-progress', { detail: id })); } catch (e) {}
      });
    },

    listDocs: function () { return get('docs').then(function (l) { return l || []; }); },
    addDoc: function (file, students) {
      var d = {
        id: 'd' + Date.now().toString(36) + rnd(3), name: file.name, type: file.type || '', size: file.size,
        addedAt: new Date().toISOString(), students: students.slice(), status: 'pending'
      };
      return set('blob:' + d.id, file).then(function () { return api.listDocs(); }).then(function (l) {
        l.unshift(d); return set('docs', l);
      }).then(function () { return d; });
    },
    updateDoc: function (d) {
      return api.listDocs().then(function (l) {
        var i = l.findIndex(function (x) { return x.id === d.id; });
        if (i >= 0) l[i] = d; return set('docs', l);
      });
    },
    deleteDoc: function (id) {
      return api.listDocs().then(function (l) { return set('docs', l.filter(function (x) { return x.id !== id; })); })
        .then(function () { return del('blob:' + id); });
    },
    getBlob: function (id) { return get('blob:' + id); },

    /* ---------- agenda : cours réservés (mêmes règles que le serveur, via HPCal) ---------- */
    listBookings: function (from, to) {
      return get('bookings').then(function (l) {
        return (l || []).filter(function (b) { return (!from || b.end > from) && (!to || b.start < to); })
          .sort(function (a, b) { return a.start - b.start; });
      });
    },
    addBooking: function (b) {
      return get('bookings').then(function (l) {
        l = l || [];
        if (l.some(function (x) { return x.status === 'booked' && x.start < b.end && x.end > b.start; })) { var e = new Error('créneau déjà pris'); e.code = 'taken'; throw e; }
        var r = { id: 'b' + Date.now().toString(36) + rnd(3), studentId: b.studentId, start: b.start, end: b.end, status: 'booked',
          note: String(b.note || '').slice(0, 500), by: b.by || 'teacher', createdAt: new Date().toISOString() };
        l.push(r);
        return set('bookings', l).then(function () { return r; });
      });
    },
    cancelBooking: function (id, by) {
      return get('bookings').then(function (l) {
        l = l || [];
        var r = l.filter(function (x) { return x.id === id; })[0];
        if (r) { r.status = 'cancelled'; r.cancelledBy = by || 'teacher'; r.cancelledAt = new Date().toISOString(); }
        return set('bookings', l);
      });
    },
    agendaState: function (sid, from, to) {
      return Promise.all([api.getSettings(), api.listBookings()]).then(function (r) {
        var now = Date.now();
        return {
          cfg: HPCal.pub(r[0].agenda), now: now,
          busy: r[1].filter(function (b) { return b.status === 'booked' && b.end > from && b.start < to; }).map(function (b) { return { s: b.start, e: b.end }; }),
          mine: r[1].filter(function (b) { return b.studentId === sid && b.start > from; })
        };
      });
    },
    agendaBook: function (sid, start, minutes, note) {
      return api.agendaState(sid, start - 864e5, start + 864e5).then(function (st) {
        var fail = function (code) { var e = new Error(code); e.code = code; throw e; };
        if (st.cfg.maxUpcoming && st.mine.filter(function (b) { return b.status === 'booked' && b.start > st.now; }).length >= st.cfg.maxUpcoming) fail('max_upcoming');
        var why = HPCal.check(st.cfg, st.busy, start, minutes, st.now);
        if (why) fail(why);
        return api.addBooking({ studentId: sid, start: start, end: start + minutes * 60000, note: note, by: 'student' });
      });
    },
    agendaCancel: function (sid, id) {
      return Promise.all([api.getSettings(), api.listBookings()]).then(function (r) {
        var b = r[1].filter(function (x) { return x.id === id && x.studentId === sid && x.status === 'booked'; })[0];
        var fail = function (code) { var e = new Error(code); e.code = code; throw e; };
        if (!b) fail('not_found');
        if (!HPCal.canCancel(r[0].agenda, b.start, Date.now())) fail('too_late');
        return api.cancelBooking(id, 'student');
      });
    },

    _set: set, _get: get, _withPassword: withPassword
  };
  return api;
})();

/* =====================================================================
   HPA — analyse des documents déposés par Mayane et mise à jour des
   espaces élèves. Lecture : PDF (pdf.js), Word .docx (mammoth), images,
   texte. L'analyse elle-même est faite par Claude ; rien n'est ajouté à
   un élève sans validation de Mayane.
   ===================================================================== */
var HPA = (function () {
  'use strict';
  var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  var PDFW = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var MAMMOTH = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
  var loaded = {};
  function script(src) {
    if (loaded[src]) return loaded[src];
    loaded[src] = new Promise(function (res, rej) {
      var s = document.createElement('script'); s.src = src; s.onload = res;
      s.onerror = function () { delete loaded[src]; rej(new Error('Impossible de charger ' + src)); };
      document.head.appendChild(s);
    });
    return loaded[src];
  }

  function kind(d) {
    var n = (d.name || '').toLowerCase(), t = d.type || '';
    if (t === 'application/pdf' || /\.pdf$/.test(n)) return 'pdf';
    if (/\.docx$/.test(n) || /wordprocessingml/.test(t)) return 'docx';
    if (/\.doc$/.test(n) || t === 'application/msword') return 'doc';
    if (/^image\//.test(t) || /\.(png|jpe?g|webp|gif|heic)$/.test(n)) return 'img';
    if (/^text\//.test(t) || /\.(txt|md|csv)$/.test(n)) return 'txt';
    return 'other';
  }

  /* ---------- extraction : {text, images[]} ---------- */
  function canvasBlob(c) { return new Promise(function (res) { c.toBlob(res, 'image/jpeg', 0.85); }); }
  function fromPdf(blob, onStep) {
    return script(PDFJS).then(function () {
      var lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = PDFW;
      return blob.arrayBuffer().then(function (buf) { return lib.getDocument({ data: buf }).promise; });
    }).then(function (pdf) {
      var n = pdf.numPages, out = [], i = 1;
      function next() {
        if (i > n) return Promise.resolve();
        onStep && onStep('Lecture de la page ' + i + ' / ' + n);
        return pdf.getPage(i).then(function (p) {
          return p.getTextContent().then(function (tc) {
            out.push({ page: i, text: tc.items.map(function (x) { return x.str + (x.hasEOL ? '\n' : ' '); }).join(''), p: p });
            i++; return next();
          });
        });
      }
      return next().then(function () {
        var text = out.map(function (o) { return '--- page ' + o.page + ' ---\n' + o.text.trim(); }).join('\n\n');
        var chars = out.reduce(function (s, o) { return s + o.text.trim().length; }, 0);
        if (chars > 80 * n) return { text: text, images: [], pages: n };
        /* PDF scanné (peu de texte) : on envoie les pages en image */
        var imgs = [], max = Math.min(n, 40), j = 0;
        function snap() {
          if (j >= max) return Promise.resolve();
          onStep && onStep('Préparation de la page ' + (j + 1) + ' (document scanné)');
          var pg = out[j].p, vp = pg.getViewport({ scale: 1.6 });
          var c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
          return pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise
            .then(function () { return canvasBlob(c); }).then(function (b) { imgs.push(b); j++; return snap(); });
        }
        return snap().then(function () { return { text: chars ? text : '', images: imgs, pages: n, scanned: true, cut: n > max }; });
      });
    });
  }
  function extract(doc, blob, onStep) {
    var k = kind(doc);
    if (k === 'pdf') return fromPdf(blob, onStep);
    if (k === 'docx') return script(MAMMOTH).then(function () {
      onStep && onStep('Lecture du document Word');

    getTeacher: function () { return Promise.resolve({ remote: true }); },

    getSettings: function () { return q(sbc.from('settings').select('data').eq('id', 1).maybeSingle()).then(function (r) { return (r && r.data) || {}; }).catch(function () { return {}; }); },

    },
    getSummary: function (id) { return q(sbc.from('progress').select('summary').eq('student_id', id).maybeSingle()).then(function (r) { return r ? r.summary : null; }); },
    getProgress: function (id) { return q(sbc.from('progress').select('storage').eq('student_id', id).maybeSingle()).then(function (r) { return r ? r.storage : null; }); },
    pushProgress: function (id, summary, storage) {
      if (!id) return Promise.resolve();

    addDoc: function (file, students) {
      var id = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  /* ---------- tableau de bord ---------- */

    var rates = S.map(function (s) { return M[s.id].rate7; }).filter(function (r) { return r != null; });
    var avg = null;   /* calculée plus bas sur toutes les réponses de la classe (pondérée) */
    var pend = cache.docs.filter(function (d) { return d.status !== 'done'; }).length;

      var d = M[s.id].days;

      var m = M[s.id], n = m.last ? Math.round((HP.parseDay(HP.dayKey()) - HP.parseDay(m.last)) / 864e5) : null;

      '<div class="stack">' +
      '<div class="hp-kpis">' +

      '</div>' +

      '<div class="dash-grid"><div class="card"><h3>À surveiller</h3>' + (alerts.length ? '<div class="alerts">' + alerts.map(function (a) {

      }).join('') + '</div>' : '<p class="hp-empty">Rien à signaler.</p>') + '</div>' + AG.dashboardCard() + '</div>' +
      '<div class="card"><h3>Activité de la classe <small>XP par jour, 30 jours</small></h3>' + HP.xpBars(classDays, 30, 0) + '</div>' +
      '</div>';
  }

  /* ---------- modale de création ---------- */
  function modal(html) {
    var m = document.createElement('div'); m.className = 'modal';
    m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
    m.innerHTML = '<div class="card"><button class="close" aria-label="Fermer">×</button>' + html + '</div>';
    var before = document.activeElement;
    function close() { m.remove(); document.removeEventListener('keydown', onEsc); if (before && before.focus) before.focus(); }
    function onEsc(e) { if (e.key === 'Escape' && m.isConnected) close(); }
    m.addEventListener('click', function (e) { if (e.target === m || e.target.classList.contains('close')) close(); });
    document.addEventListener('keydown', onEsc);
    document.body.appendChild(m);
    var first = m.querySelector('input, button:not(.close), a'); if (first) setTimeout(function () { first.focus(); }, 30);
    return m;
  }
  function newStudent() {
    var m = modal('<h2>Créer un compte élève</h2><form id="nf">' + studentForm() +
      '<div id="nf-msg" style="margin-top:10px"></div><div class="row" style="margin-top:16px"><button class="btn primary" type="submit">Créer le compte</button></div></form>');
    var f = $('#nf', m), touched = false;
    f.login.addEventListener('input', function () { touched = true; });
    function sug() { if (!touched) f.login.value = slug(f.first.value + (f.last.value ? '.' + f.last.value : '')); }
    f.first.addEventListener('input', sug); f.last.addEventListener('input', sug);
    $('[data-gen]', m).onclick = function () { f.pw.value = HPB.genPassword(); };
    f.first.focus();
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var login = slug(f.login.value);
      if (!login) { $('#nf-msg', m).innerHTML = '<div class="err">Choisissez un identifiant en lettres latines (par exemple « sarah.cohen »).</div>'; return; }
      var btn = $('button[type=submit]', f); if (btn.disabled) return; btn.disabled = true;
      HPB.loginTaken(login).catch(function () { return false; }).then(function (taken) {
        btn.disabled = false;
        if (taken) { $('#nf-msg', m).innerHTML = '<div class="err">Cet identifiant est déjà utilisé.</div>'; return; }
        var s = { id: 's' + Date.now().toString(36), first: f.first.value.trim(), last: f.last.value.trim(), email: f.email.value.trim(), phone: f.phone.value.trim(), login: login, active: true, createdAt: new Date().toISOString() };
        var pw = f.pw.value.trim();
        btn.disabled = true;
        HPB.saveStudent(s, pw).catch(function (err) {
          btn.disabled = false;
          $('#nf-msg', m).innerHTML = '<div class="err">Création impossible : ' + esc(errText(err)) + '</div>';
          throw err;
        }).then(function () {
          cache.students.push(s);
          $('.card', m).innerHTML = '<button class="close" aria-label="Fermer">×</button><h2>Compte créé 🎉</h2><p class="muted">Transmettez ces accès à ' + esc(s.first) + '.</p>' + accessCard(s, pw) +
            '<div class="row" style="margin-top:16px"><a class="btn primary" href="#/eleve/' + s.id + '/documents">Déposer ses premiers documents</a></div>';
          bindCopy(m);
          $('.btn.primary', m).addEventListener('click', function () { m.remove(); });
          if (/eleves|tableau/.test(location.hash) || !location.hash) renderTeacher();
        }).catch(function () {});
      });
    });
  }
  function bindCopy(r) { $$('[data-copy]', r).forEach(function (b) { b.onclick = function () { copy(b.dataset.copy); }; }); }

  /* ---------- dépôt et analyse ---------- */
  function handleFiles(files, targets) {
    files = Array.prototype.slice.call(files || []);
    if (!files.length) return;
    if (!targets.length) { toast('Choisissez d\'abord au moins un élève'); return; }
    var refused = files.filter(function (f) { var k = HPA.kind(f); return k === 'doc' || k === 'other'; });
    files = files.filter(function (f) { return refused.indexOf(f) < 0; });
    if (refused.length) toast(refused.map(function (f) { return f.name; }).join(', ') + ' : format non lu. Enregistrez-le en .docx ou en PDF.', true);
    if (!files.length) return;
    var drop = $('#drop'); if (drop) drop.classList.add('busy');
    var ok = 0;
    /* un par un : chaque ajout relit la liste, des ajouts simultanés s'écraseraient */
    files.reduce(function (p, f) {
      return p.then(function () { return HPB.addDoc(f, targets).then(function () { ok++; }, function (e) { toast(f.name + ' n\'a pas pu être déposé : ' + errText(e), true); }); });
    }, Promise.resolve()).then(function () {
      if (ok) toast(plural(ok, 'document déposé', 'documents déposés'));
      return loadAll();
    }).then(renderTeacher, function (e) { if (drop) drop.classList.remove('busy'); toast('Dépôt interrompu : ' + errText(e), true); });
  }

  function runAnalysis(docId) {
    var d = cache.docs.filter(function (x) { return x.id === docId; })[0];
    var slot = document.getElementById('rv-' + docId);
    if (!d || !slot) return Promise.resolve();
    if (pending[docId]) return Promise.resolve();
    if (!(d.students || []).length) { toast('Ce document n\'est attribué à aucun élève.'); return Promise.resolve(); }
    var ctl = new AbortController(); pending[docId] = ctl;
    slot.innerHTML = '<div class="review"><b id="st-' + docId + '">Préparation…</b><div class="progress-line"><i></i></div><div class="row" style="margin-top:10px"><button class="btn small" data-stop>Arrêter</button></div></div>';
    $('[data-stop]', slot).onclick = function () { ctl.abort(); };
    var step = function (t) { var el = document.getElementById('st-' + docId); if (el) el.textContent = t; };
    /* la page a pu changer pendant l'analyse : on retrouve l'emplacement à jour */
    var here = function () { var el = document.getElementById('rv-' + docId); return el || null; };
    var themes = {};
    (d.students || []).forEach(function (id) { var c = cache.contents[id]; if (c) Object.keys(c.VOCAB || {}).forEach(function (t) { themes[t] = 1; }); });
    return HPB.getBlob(docId).then(function (blob) {
      if (!blob) throw new Error('Fichier introuvable.');
      return HPA.analyse(d, blob, Object.keys(themes), step, ctl.signal);
    }).then(function (res) {
      delete pending[docId];
      var el = here();
      if (el) showReview(el, d, res);
      else { results[docId] = res; toast('Analyse de « ' + d.name + ' » terminée : ouvrez Documents pour la valider.', true); }
    }).catch(function (e) {
      delete pending[docId];
      var el = here();
      if (e && e.code === 'cancelled') { if (el) el.innerHTML = ''; return; }
      if (e && e.code === 'no_sample') { if (el) showManual(el, d, e.extracted); return; }
      var msg = e && (e.code === 'rate_limited' || e.code === 'busy') ? 'Claude est très sollicité en ce moment : réessayez dans quelques minutes.'
        : e && e.code === 'invalid_json' ? 'La réponse de Claude n\'était pas exploitable. Réessayez.'
        : e && e.code === 'spend_limit' ? 'Le budget mensuel de l\'analyse automatique est atteint. Benjamin peut le relever sur platform.claude.com (Settings › Limits), puis relancez l\'analyse.'
        : e && e.code === 'truncated' ? 'Une page de ce document contient trop de vocabulaire pour être analysée, même seule. Réessayez ; si l\'erreur revient, envoyez cette page en image ou en fichier séparé.'
        : e && e.code === 'timeout' ? 'L\'analyse a pris trop de temps. Réessayez, ou découpez le document.'
        : e && e.code === 'too_large' ? 'Les images de ce document sont trop lourdes : réduisez le nombre de pages ou de photos.'
        : e && e.code === 'network' ? 'Connexion internet interrompue pendant l\'analyse. Réessayez.'
        : e && e.code === 'not_teacher' ? 'Votre session a expiré : reconnectez-vous, puis relancez l\'analyse.'
        : e && e.code === 'bad_code' ? 'Le code d\'analyse est incorrect : vérifiez-le dans Réglages.'
        : e && e.code === 'server_error' ? 'L\'analyse a échoué (' + e.message + '). Réessayez dans un instant.'
        : e && (e.code === 'not_granted' || e.code === 'sampling_disabled') ? 'L\'analyse par Claude n\'est pas autorisée pour ce site. Utilisez l\'import manuel (onglet Contenu du site).'
        : (e && e.message) || 'Erreur inconnue.';
      if (el) el.innerHTML = '<div class="review"><div class="err">' + esc(msg) + '</div></div>';
      else toast('Analyse de « ' + d.name + ' » : ' + msg, true);
      d.status = 'error'; d.error = msg;
      return Promise.resolve(HPB.updateDoc(d)).catch(function () {});
    });
  }

  function showManual(slot, d, ex) {
    var prompt = HPA.instructions([], d.name);
    slot.innerHTML = '<div class="review"><b>L\'analyse automatique n\'est pas encore activée sur ce site.</b>' +
      '<p class="small muted">Elle s\'active une fois pour toutes en ajoutant une clé Claude au site (voir le guide). En attendant : envoyez ce document à Claude dans une conversation avec la consigne ci-dessous, puis importez le fichier .json obtenu dans l\'onglet « Contenu du site » de l\'élève.</p>' +
      '<button class="btn small" data-copy="' + esc(prompt) + '">Copier la consigne pour Claude</button>' +
      (ex && ex.text ? '<details style="margin-top:10px"><summary class="small">Texte extrait du document (' + fmt(ex.text.length) + ' caractères)</summary><pre class="code">' + esc(ex.text.slice(0, 4000)) + (ex.text.length > 4000 ? '\n…' : '') + '</pre></details>' : '') + '</div>';
    bindCopy(slot);
  }

  function showReview(slot, d, res, targetIds) {
    var targets = targetIds || (d ? d.students : []) || [];
    HPA.markDuplicates(res, targets.map(function (id) { return cache.contents[id]; }));
    var nWords = res.themes.reduce(function (s, t) { return s + t.words.length; }, 0);
    /* mots déjà présents mais sans voyelles : la ré-analyse peut les compléter */
    var vfix = targets.reduce(function (m, id) {
      var dry = { themes: res.themes.map(function (t) { return { name: t.name, words: t.words.map(function (w) { return Object.assign({}, w, { keep: false }); }) }; }), grammar: [] };
      return Math.max(m, HPA.merge(cache.contents[id], dry, '').vowels || 0);
    }, 0);
    var names = targets.map(function (id) { var s = cache.students.filter(function (x) { return x.id === id; })[0]; return s ? s.first : ''; }).filter(Boolean);
    function render() {
      var keep = res.themes.reduce(function (s, t) { return s + t.words.filter(function (w) { return w.keep; }).length; }, 0) + res.grammar.filter(function (g) { return g.keep; }).length;
      slot.innerHTML = '<div class="review"><b>Résultat de l\'analyse</b>' + (res.summary ? '<p class="small muted" style="margin:4px 0 0">' + esc(res.summary) + '</p>' : '') +
        '<p class="small">' + plural(nWords, 'mot') + ' dans ' + plural(res.themes.length, 'thème') + ', ' + plural(res.grammar.length, 'fiche') + ' de grammaire. Décochez ce que vous ne voulez pas ajouter. Les mots déjà présents sont grisés.</p>' +
        res.themes.map(function (t, ti) {
          return '<h4>' + esc(t.name) + ' <span class="pill grey">' + t.words.length + '</span></h4><table class="rv-words">' + t.words.map(function (w, wi) {
            return '<tr class="' + (w.dup ? 'dup' : '') + '"><td style="width:28px"><input type="checkbox" data-w="' + ti + ':' + wi + '"' + (w.keep ? ' checked' : '') + (w.dup ? ' disabled' : '') + '></td>' +
              '<td class="he">' + esc(w.heVoc || w.he) + '</td><td>' + esc(w.fr) + '</td><td class="small muted">' + ({ v: 'verbe', n: 'nom', a: 'adjectif', d: 'adverbe', o: 'mot-outil', c: 'nombre', x: 'expression' }[w.nature] || '') + (w.dup ? ' · déjà présent' : '') + '</td></tr>';
          }).join('') + '</table>';
        }).join('') +
        (res.grammar.length ? '<h4>Grammaire</h4>' + res.grammar.map(function (g, gi) {
          return '<details class="rv-gram"><summary><input type="checkbox" data-g="' + gi + '"' + (g.keep ? ' checked' : '') + '> ' + esc(g.title) + (g.he ? ' <span class="he-inline">' + esc(g.he) + '</span>' : '') + ' <span class="pill grey">' + esc(g.category) + '</span></summary><div class="body">' + g.body + '</div></details>';
        }).join('') : '') +
        (!nWords && !res.grammar.length ? '<p class="hp-empty">Aucun vocabulaire ni grammaire trouvé dans ce document.</p>' : '') +
        (vfix ? '<p class="small ok" style="margin-top:12px">' + (vfix > 1 ? vfix + ' mots déjà présents recevront leurs voyelles' : '1 mot déjà présent recevra ses voyelles') + ' (nikoud).</p>' : '') +
        '<div class="row" style="margin-top:16px"><button class="btn primary" data-apply' + ((keep || vfix) && names.length ? '' : ' disabled') + '>' +
          (keep ? 'Ajouter ' + keep + ' élément' + (keep > 1 ? 's' : '') : 'Compléter les voyelles') + ' à l\'espace de ' + esc(names.join(', ') || '…') + '</button>' +
        '<button class="btn" data-cancel>Annuler</button></div></div>';
      $$('[data-w]', slot).forEach(function (cb) { cb.onchange = function () { var p = cb.dataset.w.split(':'); res.themes[+p[0]].words[+p[1]].keep = cb.checked; render(); }; });
      $$('[data-g]', slot).forEach(function (cb) { cb.onclick = function (e) { e.stopPropagation(); }; cb.onchange = function () { res.grammar[+cb.dataset.g].keep = cb.checked; render(); }; });
      $('[data-cancel]', slot).onclick = function () { slot.innerHTML = ''; };
      $('[data-apply]', slot).onclick = function () {
        var name = d ? d.name : 'Import JSON', added = { words: 0, grammar: 0 };
        /* élève par élève, en relisant son contenu juste avant d'écrire */
        var work = targets.reduce(function (p, id) {
          return p.then(function () { return HPB.getContent(id); }).then(function (c) {
            var r = HPA.merge(c, res, name);
            added.words = Math.max(added.words, r.words); added.grammar = Math.max(added.grammar, r.grammar); added.vowels = Math.max(added.vowels || 0, r.vowels || 0);
            return HPB.setContent(id, r.content);
          });
        }, Promise.resolve()).then(function () {
          if (d) { d.status = 'done'; d.integratedAt = new Date().toISOString(); d.result = added; d.summary = res.summary || d.summary; delete d.error; delete results[d.id]; return HPB.updateDoc(d); }
        });
        busy(this, work, 'Ajout impossible').then(function () { toast('Espace mis à jour ✓'); return loadAll(); }).then(renderTeacher).catch(function () {});
      };
    }
    render();
  }

  /* ---------- liaisons d'événements ---------- */
  function bind(page, h) {

    });
    $$('th[data-sort]').forEach(function (th) {

    });
    $$('[data-act="preview"]').forEach(function (b) { b.onclick = function () { openStudent(b.dataset.id, true); }; });
    $$('[data-delst]').forEach(function (b) {

    $$('[data-dl]').forEach(function (b) {

    $$('[data-rm]').forEach(function (b) {
      b.onclick = function () {

        b.dataset.armed = 1; b.textContent = 'Confirmer ?'; b.classList.add('danger');
        setTimeout(function () { if (b.isConnected) { delete b.dataset.armed; b.textContent = '🗑'; b.classList.remove('danger'); } }, 3000);

    if (page === 'eleve') {
      var id = h[1], s = cache.students.filter(function (x) { return x.id === id; })[0];
      if (!s) return;
      var ef = $('#edit');
      if (ef) ef.addEventListener('submit', function (e) {
        e.preventDefault();
        var login = slug(ef.login.value);
        if (!login) { $('#edit-msg').innerHTML = '<span class="err">Identifiant en lettres latines, chiffres et points uniquement</span>'; return; }
        var btn = $('button[type=submit]', ef);
        busy(btn, HPB.loginTaken(login, s.id).then(function (taken) {
          if (taken) { $('#edit-msg').innerHTML = '<span class="err">Identifiant déjà utilisé</span>'; return false; }
          var upd = Object.assign({}, s, { first: ef.first.value.trim(), last: ef.last.value.trim(), email: ef.email.value.trim(), phone: ef.phone.value.trim(), login: login });
          return HPB.saveStudent(upd).then(function () { Object.assign(s, upd); return true; });
        }), 'Enregistrement impossible').then(function (done) { if (done) { toast('Enregistré'); renderTeacher(); } }).catch(function () {});
      });
      var pwf = $('#pwf');
      if (pwf) {
        $('[data-gen]', pwf).onclick = function () { pwf.pw.value = HPB.genPassword(); };
        pwf.addEventListener('submit', function (e) {
          e.preventDefault();
          var pw = pwf.pw.value.trim(); if (pw.length < 6) return;
          busy($('button[type=submit]', pwf), HPB.saveStudent(Object.assign({}, s), pw), 'Changement impossible')
            .then(function () { s.pw = pw; toast('Mot de passe changé — pensez à le transmettre'); renderTeacher(); }).catch(function () {});
        });
      }
      var sp = $('[data-act="suspend"]') || $('[data-act="activate"]');
      if (sp) sp.onclick = function () {
        var upd = Object.assign({}, s, { active: s.active === false });
        busy(sp, HPB.saveStudent(upd), 'Modification impossible').then(function () { s.active = upd.active; renderTeacher(); }).catch(function () {});
      };
      var del = $('[data-act="delete"]');
      if (del) del.onclick = function () {
        var m = modal('<h2>Supprimer le compte de ' + esc(fullName(s)) + ' ?</h2>' +
          '<p class="muted">Son accès, ses contenus et toute sa progression seront effacés définitivement.</p>' +
          '<div class="row" style="margin-top:16px"><button class="btn danger" data-yes>Supprimer définitivement</button><button class="btn" data-no>Annuler</button></div>');
        $('[data-no]', m).onclick = function () { m.remove(); };
        $('[data-yes]', m).onclick = function () {
          busy(this, HPB.deleteStudent(s.id), 'Suppression impossible').then(function () { m.remove(); toast('Compte de ' + s.first + ' supprimé'); location.hash = '#/eleves'; return loadAll(); }).then(renderTeacher).catch(function () {});
        };
      };
      $$('[data-rmtheme]').forEach(function (b) {
        b.onclick = function () {
          if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = 'Retirer ?'; b.classList.add('danger'); return; }
          var t = b.dataset.rmtheme;
          busy(b, HPB.getContent(s.id).then(function (c) {
            c = c || HPA.emptyContent();
            delete c.VOCAB[t]; if (c.NATURE) delete c.NATURE[t];
            c.CORE_THEMES = (c.CORE_THEMES || []).filter(function (x) { return x !== t; });
            c.ADVANCED_THEMES = (c.ADVANCED_THEMES || []).filter(function (x) { return x !== t; });
            return HPB.setContent(s.id, c).then(function () { cache.contents[s.id] = c; });
          }), 'Retrait impossible').then(renderTeacher).catch(function () {});
        };
      });
      var imp = $('#imp');
      if (imp) imp.onchange = function () {
        var f = imp.files[0]; if (!f) return;
        f.text().then(function (t) {
          var r; try { r = HPA.normalise(JSON.parse(t)); } catch (e) { $('#rv-import').innerHTML = '<div class="err" style="margin-top:10px">Fichier JSON illisible.</div>'; return; }
          showReview($('#rv-import'), null, r, [s.id]);
        });
      };
    }
    if (page === 'reglages') {
      var tf = $('#tpw');
      tf.addEventListener('submit', function (e) {
        e.preventDefault();
        var login = slug(tf.login.value);
        if (!login) { $('#tpw-msg').innerHTML = '<span class="err">Identifiant en lettres latines, chiffres et points uniquement</span>'; return; }
        var btn = $('button[type=submit]', tf); btn.disabled = true;
        HPB.setTeacherPassword(login, tf.pw.value).then(function () {
          DEMO.teacher = [login, '••••']; cache.teacherLogin = login; if (HPB.me) HPB.me.login = login;
          $('#tpw-msg').innerHTML = '<span class="ok">Identifiant et mot de passe enregistrés</span>'; tf.pw.value = ''; btn.disabled = false;
        }, function (err) { btn.disabled = false; $('#tpw-msg').innerHTML = '<span class="err">' + esc(errText(err)) + '</span>'; });
      });
      $('#site').addEventListener('submit', function (e) {
        e.preventDefault(); cache.settings.siteUrl = e.target.url.value.trim(); cache.settings.analyseCode = e.target.code.value.trim();
        HPA.setCode(cache.settings.analyseCode); busy($('button[type=submit]', e.target), HPB.setSettings(cache.settings), 'Enregistrement impossible').then(function () { toast('Enregistré'); }).catch(function () {});
      });
      var rd = $('[data-act="resetdemo"]');
      if (rd) rd.onclick = function () {
        if (!rd.dataset.armed) { rd.dataset.armed = 1; rd.textContent = 'Confirmer : tout effacer'; return; }
        DEMO.teacher = DEMO_TEACHER.slice();
        HPB.reset().then(seedDemo).then(function () { sess(null); location.hash = '#/connexion'; renderLogin(); });
      };
    }
  }

  /* ================= DONNÉES DE DÉMONSTRATION ================= */
  function seedDemo() {
    return loadDemo().then(function (d) { return seedDemoWith(d.data, d.tenses); });
  }
  function seedDemoWith(DEMO_DATA, TENSES) {
    var full = DEMO_DATA, now = new Date();
    var allThemes = Object.keys(full.VOCAB);
    function subset(themes, gramCats, conj) {
      var c = { VOCAB: {}, NATURE: {}, CONJ: conj ? full.CONJ.slice(0, conj) : [], VERB_PRESENT: full.VERB_PRESENT, GRAMMAR_CATEGORIES: full.GRAMMAR_CATEGORIES.slice(0, gramCats), ADVANCED_THEMES: [], sources: ['Démo — extrait du site de Benjamin'] };
      themes.forEach(function (t) { c.VOCAB[t] = full.VOCAB[t]; c.NATURE[t] = full.NATURE[t] || ''; });
      c.CORE_THEMES = themes.slice();
      return c;
    }
    var benContent = JSON.parse(JSON.stringify(full)); benContent.tensesHtml = TENSES; benContent.sources = ['Démo — contenu actuel du site de Benjamin'];
    var students = [
      { id: 'demo-ben', first: 'Benjamin', last: 'Sarfati', login: 'benjamin', pw: 'ivrit2026', email: '', phone: '', content: benContent },
      { id: 'demo-lea', first: 'Léa', last: '(démo)', login: 'lea', pw: 'lea2026', email: '', phone: '', content: subset(allThemes.slice(0, 9).concat(['Couleurs', 'Chiffres (1-10)']), 3, 30), sim: { days: 45, p0: 0.55, p1: 0.8, act: 0.8, vol: [12, 40], seed: 7, recent: 4 } },
      { id: 'demo-noam', first: 'Noam', last: '(démo)', login: 'noam', pw: 'noam2026', email: '', phone: '', content: subset(['Bases & pronoms', 'Famille', 'Nourriture & repas', 'Couleurs', 'Chiffres (1-10)'], 1, 0), sim: { days: 30, p0: 0.7, p1: 0.55, act: 0.55, vol: [10, 30], seed: 3, stopAt: 9 } }
    ];
    var chain = HPB.setTeacherPassword(DEMO.teacher[0], DEMO.teacher[1]);
    students.forEach(function (st) {
      chain = chain.then(function () {
        var rec = { id: st.id, first: st.first, last: st.last, login: st.login, email: st.email, phone: st.phone, active: true, createdAt: now.toISOString(), demo: true };
        return HPB.saveStudent(rec, st.pw);
      }).then(function () { return HPB.setContent(st.id, st.content); }).then(function () {
        if (!st.sim) return;
        var storage = simulate(st.content, st.sim);
        return HPB.pushProgress(st.id, HP.summarize(storage, storage.progress, st.content.VOCAB), storage);
      });
    });
    return chain.then(seedAgenda);
  }

  /* agenda de démonstration : disponibilités habituelles et quelques cours autour d'aujourd'hui */
  function seedAgenda() {
    var tz; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) {}
    var cfg = HPCal.norm({ open: true, tz: tz || 'Europe/Paris', durations: [60, 90, 120], step: 30, notice: 12, horizon: 6, buffer: 0, cancel: 24,
      message: 'Les cours ont lieu en visio (lien envoyé la veille) ou chez Mayane. Pense à apporter ton cahier !',
      rules: [{ d: 0, from: '10:00', to: '13:00' }, { d: 1, from: '17:00', to: '21:00' }, { d: 2, from: '17:00', to: '21:00' },
        { d: 3, from: '09:00', to: '12:00' }, { d: 3, from: '17:00', to: '21:00' }, { d: 4, from: '17:00', to: '21:00' }] });
    var today = HPCal.dayKey(Date.now(), cfg.tz);
    function next(wd, minDays, h, mi) {
      var k = HPCal.addDaysKey(today, minDays); while (HPCal.weekdayOfKey(k) !== wd) k = HPCal.addDaysKey(k, 1);
      var p = k.split('-'); return HPCal.zoned(+p[0], +p[1], +p[2], h, mi, cfg.tz);
    }
    var list = [
      ['demo-lea', next(2, 2, 18, 0), 90, 'student', 'J\'aimerais revoir le passé des verbes en פעל'],
      ['demo-noam', next(4, 2, 17, 0), 60, 'teacher', ''],
      ['demo-ben', next(0, 2, 10, 30), 120, 'student', ''],
      ['demo-lea', next(2, -12, 18, 0), 90, 'student', ''],
      ['demo-ben', next(3, -10, 9, 0), 120, 'teacher', '']
    ];
    return HPB.getSettings().then(function (s) { s.agenda = cfg; return HPB.setSettings(s); }).then(function () {
      return list.reduce(function (p, b) {
        return p.then(function () { return HPB.addBooking({ studentId: b[0], start: b[1], end: b[1] + b[2] * 60000, by: b[3], note: b[4] }).catch(function () {}); });
      }, Promise.resolve());
    });
  }

  /* activité fictive, pour montrer les graphiques de la démo */
  function simulate(content, o) {
    var seed = o.seed; function r() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
    var words = []; Object.keys(content.VOCAB).forEach(function (t) { content.VOCAB[t].forEach(function (e) { words.push(e[0] + '|' + e[1]); }); });
    var S = { wordStats: {}, flash: {}, conj: {}, excluded: [], preferences: {}, progress: { xp: 0, days: {}, badges: {}, goal: 60, bestCombo: 0, backfilled: HP.dayKey() } };
    var P = S.progress, X = HP.XP, fam = {}, combo = 0;
    for (var i = o.days; i >= 0; i--) {
      if (o.stopAt && i < o.stopAt) break;
      if (r() > o.act && !(o.recent && i <= o.recent)) continue;
      var day = HP.addDays(new Date(), -i), k = HP.dayKey(day), d = P.days[k] = HP.emptyDay();
      var prog = 1 - i / o.days, p = o.p0 + (o.p1 - o.p0) * prog, n = Math.round(o.vol[0] + r() * (o.vol[1] - o.vol[0]));
      for (var j = 0; j < n; j++) {
        var w = words[Math.floor(r() * Math.min(words.length, 40 + prog * words.length))], ok = r() < Math.min(0.9, p + Math.min(fam[w] || 0, 6) * 0.015);
        fam[w] = (fam[w] || 0) + 1;
        if (r() < 0.45) {
          var q = S.wordStats[w] || (S.wordStats[w] = { seen: 0, correct: 0, wrong: 0 });
          q.seen++; if (ok) { q.correct++; d.qOk++; d.xp += X.quizOk; } else { q.wrong++; d.qKo++; d.xp += X.quizKo; }
        } else {
          var f = S.flash[w] || (S.flash[w] = { seen: 0, known: 0, again: 0, soft: 0 });
          f.seen++; if (ok) { f.known++; d.fK++; d.xp += X.flashKnown; } else if (r() < 0.2) { f.soft++; d.fS++; d.xp += X.flashSoft; } else { f.again++; d.fA++; d.xp += X.flashAgain; }
        }
        combo = ok ? combo + 1 : 0; if (combo > P.bestCombo) P.bestCombo = combo;
      }
      if (d.xp >= P.goal) { d.goal = 1; d.xp += X.goal; }
      P.xp += d.xp;
      var ctx = HP.badgeContext(P, HP.totalsFrom(S, content.VOCAB), HP.themeMastery(S, content.VOCAB));
      HP.BADGES.forEach(function (b) { if (!P.badges[b.id] && b.test(ctx)) P.badges[b.id] = k; });
    }
    return S;
  }

  return { boot: boot, logout: logout, closePreview: closePreview };
})();
